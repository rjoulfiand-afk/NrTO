      //    - Foto profil `profile.jpeg` dalam ring pelangi IG
      //    - `jull` · 5 posts · 10,1K followers · 492 following
      //    - `Personal blog`, 🎸🎸, `🔗 github.com/rjoulfiand-afk` (bisa di-highlight!)
      //    - Tombol biru **`Follow`** -> auto-klik -> **`Following ✓`**!
      // =======================================================================
      function drawIGProfileCard(time, alpha, followClickP, isFollowing, githubHighlight, cursorPt, cursorAlpha) {
        if (alpha <= 0.01) return;
        const x = 64, y = 342, w = 952, h = 496;

        ctx.save();
        ctx.globalAlpha *= alpha;

        // Card putih bersih IG (elevated shadow)
        ctx.shadowColor = "rgba(0, 0, 0, 0.68)"; ctx.shadowBlur = 44; ctx.shadowOffsetY = 16;
        roundRect(ctx, x, y, w, h, 26);
        ctx.fillStyle = "#ffffff"; ctx.fill();
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

        ctx.lineWidth = 2.0;
        ctx.strokeStyle = isFollowing ? "#ebb343" : "rgba(255, 255, 255, 0.25)";
        ctx.stroke();

        // 1. Top Nav Bar (`<  julljhaa  ...`)
        const navY = y + 38;
        ctx.strokeStyle = "#111114"; ctx.lineWidth = 3.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x + 42, navY - 12); ctx.lineTo(x + 28, navY); ctx.lineTo(x + 42, navY + 12);
        ctx.stroke();

        ctx.font = "800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#111114"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillText("julljhaa", x + 76, navY + 1);

        // Titik tiga `...` di kanan
        ctx.fillStyle = "#111114";
        for (let i = 0; i < 3; i++) {
          ctx.beginPath(); ctx.arc(x + w - 58 + i * 11, navY, 3.2, 0, Math.PI * 2); ctx.fill();
        }

        // 2. Profile Picture (`profile.jpeg` + Rainbow IG Story Ring!)
        const avX = x + 114, avY = y + 162, avR = 72;
        const ringGrad = ctx.createLinearGradient(avX - avR, avY + avR, avX + avR, avY - avR);
        ringGrad.addColorStop(0.0, "#feda75");
        ringGrad.addColorStop(0.28, "#fa7e1e");
        ringGrad.addColorStop(0.55, "#d62976");
        ringGrad.addColorStop(0.82, "#962fbf");
        ringGrad.addColorStop(1.0, "#4f5bd5");

        ctx.beginPath(); ctx.arc(avX, avY, avR + 9, 0, Math.PI * 2);
        ctx.strokeStyle = ringGrad; ctx.lineWidth = 5.5; ctx.stroke();

        ctx.beginPath(); ctx.arc(avX, avY, avR + 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.fill();

        ctx.save();
        ctx.beginPath(); ctx.arc(avX, avY, avR, 0, Math.PI * 2); ctx.clip();
        if (profilePhotoReady && profilePhoto.naturalWidth > 0) {
          const iw = profilePhoto.naturalWidth, ih = profilePhoto.naturalHeight;
          const sz = Math.min(iw, ih);
          ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
          ctx.drawImage(profilePhoto, (iw - sz) / 2, (ih - sz) * 0.16, sz, sz, avX - avR, avY - avR, avR * 2, avR * 2);
        } else {
          // Fallback keren bergaya warna foto Jull jika file profile.jpeg belum ditaruh
          const fg = ctx.createLinearGradient(avX - avR, avY - avR, avX + avR, avY + avR);
          fg.addColorStop(0, "#23252f"); fg.addColorStop(1, "#3b3530");
          ctx.fillStyle = fg; ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
          ctx.fillStyle = "#c78d63"; ctx.beginPath(); ctx.arc(avX, avY - 12, 24, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#17161b"; ctx.beginPath(); ctx.arc(avX, avY - 26, 25, Math.PI, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#edece5"; ctx.beginPath(); ctx.arc(avX, avY + 56, 44, Math.PI, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        // 3. Name "jull" + 3 Stats (5 posts | 10,1K followers | 492 following)
        const stX = x + 236;
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.font = "800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#111114";
        ctx.fillText("jull", stX, y + 114);

        const stats = [
          { num: "5",     lbl: "posts",     dx: 0   },
          { num: "10,1K", lbl: "followers", dx: 190 },
          { num: "492",   lbl: "following", dx: 416 }
        ];
        for (let i = 0; i < stats.length; i++) {
          const sx = stX + stats[i].dx;
          const bump = (i === 1 && followClickP > 0.35 && followClickP < 1.0)
            ? 1 + Math.sin(((followClickP - 0.35) / 0.65) * Math.PI) * 0.14 : 1.0;
          ctx.save();
          ctx.translate(sx, y + 162);
          ctx.scale(bump, bump);
          ctx.font = "800 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = (i === 1 && isFollowing) ? "#4a5df9" : "#111114";
          ctx.fillText(stats[i].num, 0, 0);
          ctx.font = "500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = "#3a3a42";
          ctx.fillText(stats[i].lbl, 0, 32);
          ctx.restore();
        }

        // 4. Bio ("Personal blog", 🎸🎸, 🔗 github.com/rjoulfiand-afk — TANPA "Followed by"!)
        const bioX = x + 40;
        ctx.font = "500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#73737a";
        ctx.fillText("Personal blog", bioX, y + 278);

        ctx.font = "24px 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif";
        ctx.fillText("🎸🎸", bioX, y + 314);

        // Link GitHub dengan highlight golden glow saat Beat 3 ("Link GitHub juga ada di bio-nya")!
        const linkY = y + 356;
        if (githubHighlight > 0.02) {
          ctx.save();
          ctx.globalAlpha *= githubHighlight;
          roundRect(ctx, bioX - 14, linkY - 24, 470, 48, 12);
          ctx.fillStyle = "rgba(235, 179, 67, 0.22)"; ctx.fill();
          ctx.lineWidth = 2.4; ctx.strokeStyle = "#d99b1e"; ctx.stroke();
          ctx.restore();
        }

        // Ikon Link + URL GitHub
        ctx.save();
        ctx.translate(bioX + 12, linkY);
        ctx.rotate(-Math.PI / 4);
        ctx.strokeStyle = "#1d4ed8"; ctx.lineWidth = 2.6;
        roundRect(ctx, -11, -5, 14, 10, 5); ctx.stroke();
        roundRect(ctx, -3, -5, 14, 10, 5); ctx.stroke();
        ctx.restore();

        ctx.font = "700 23px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#1d4ed8";
        ctx.fillText("github.com/rjoulfiand-afk", bioX + 36, linkY + 1);

        // 5. BUTTONS ROW (`Follow` -> `Following ✓`, `Message`, `[+👤]`)
        const btnY = y + 402, btnH = 68;
        const fX = x + 36, fW = 398;
        const pressSc = (followClickP > 0 && followClickP < 0.7)
          ? 1 - Math.sin((followClickP / 0.7) * Math.PI) * 0.075 : 1.0;

        // Tombol FOLLOW / FOLLOWING
        ctx.save();
        ctx.translate(fX + fW / 2, btnY + btnH / 2);
        ctx.scale(pressSc, pressSc);
        if (!isFollowing) {
          ctx.shadowColor = "rgba(74, 93, 249, 0.35)"; ctx.shadowBlur = 18;
        }
        roundRect(ctx, -fW / 2, -btnH / 2, fW, btnH, 14);
        ctx.fillStyle = isFollowing ? "#eef0f5" : "#4a5df9";
        ctx.fill();
        ctx.shadowBlur = 0;
        if (isFollowing) {
          ctx.lineWidth = 1.6; ctx.strokeStyle = "#cbd2e0"; ctx.stroke();
        }
        ctx.font = "800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = isFollowing ? "#111114" : "#ffffff";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(isFollowing ? "Following ✓" : "Follow", 0, 1);
        ctx.restore();

        // Click Ripple & Confetti Sparkles saat tombol Follow terklik!
        if (followClickP > 0.15 && followClickP < 0.98) {
          const rp = (followClickP - 0.15) / 0.83;
          ctx.save();
          ctx.globalAlpha = (1 - rp) * 0.85;
          ctx.beginPath();
          ctx.arc(fX + fW / 2, btnY + btnH / 2, 24 + easeOutCubic(rp) * 110, 0, Math.PI * 2);
          ctx.strokeStyle = "#4a5df9"; ctx.lineWidth = 3.2; ctx.stroke();

          for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2 + 0.25;
            const d = 30 + easeOutCubic(rp) * 95;
            const px = fX + fW / 2 + Math.cos(ang) * d;
            const py = btnY + btnH / 2 + Math.sin(ang) * d * 0.6;
            ctx.fillStyle = i % 3 === 0 ? "#ebb343" : (i % 3 === 1 ? "#4a5df9" : "#e07a5f");
            roundRect(ctx, px - 5, py - 5, 10, 10, 3); ctx.fill();
          }
          ctx.restore();
        }

        // Tombol Message
        const mX = fX + fW + 14, mW = 390;
        roundRect(ctx, mX, btnY, mW, btnH, 14);
        ctx.fillStyle = "#efefef"; ctx.fill();
        ctx.font = "700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#111114"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("Message", mX + mW / 2, btnY + btnH / 2 + 1);

        // Tombol Add-Friend `[+👤]`
        const aX = mX + mW + 14, aW = 64;
        roundRect(ctx, aX, btnY, aW, btnH, 14);
        ctx.fillStyle = "#efefef"; ctx.fill();
        ctx.strokeStyle = "#111114"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(aX + 35, btnY + 26, 7.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(aX + 35, btnY + 47, 13, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(aX + 14, btnY + 34); ctx.lineTo(aX + 24, btnY + 34);
        ctx.moveTo(aX + 19, btnY + 29); ctx.lineTo(aX + 19, btnY + 39);
        ctx.stroke();

        // Pointer Kursor Halus yang mengklik tombol Follow!
        if (cursorAlpha > 0.02 && cursorPt) {
          ctx.save();
          ctx.globalAlpha *= cursorAlpha;
          ctx.translate(cursorPt.x, cursorPt.y);
          const tapS = 1 - Math.sin(clamp(followClickP / 0.5, 0, 1) * Math.PI) * 0.16;
          ctx.scale(tapS, tapS);
          ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(0, 38); ctx.lineTo(11, 28); ctx.lineTo(20, 44);
          ctx.lineTo(27, 40); ctx.lineTo(18, 24); ctx.lineTo(31, 24); ctx.closePath();
          ctx.fillStyle = "#ffffff"; ctx.fill();
          ctx.strokeStyle = "#111114"; ctx.lineWidth = 2.6; ctx.lineJoin = "round"; ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
      }

      // =======================================================================
      // 7. PREMIUM EXECUTIVE ORBITAL DROPSHIP (ZERO TINY TEXT · ZERO CARTOON OUTLINES!)
      //    Siluet Aerospace Modern-Sleek: Pearl Ceramic Titanium + Deep Carbon Slate +
      //    Brushed Champagne Gold + Blended Delta Wings + Flush Nacelle Boosters +
      //    3-LED Crew Boarding Bar + Panoramic Energy Airlock + Plasma Shock Diamonds!
      // =======================================================================
      function drawOrbitalDropshipBack(rx, ry, time, thrustPower, hatchOpen, joltY, crewBoarded, absorbFlash) {
        const cx = rx, cy = ry + joltY;
        ctx.save();

        // ---------------------------------------------------------------------
        // 1. VOLUMETRIC TRIPLE PLASMA THRUSTERS + MACH SHOCK DIAMONDS + SPARKS
        // ---------------------------------------------------------------------
        if (thrustPower > 0.05) {
          const drawPlasmaJet = (px, py, baseW, baseLen, isMain) => {
            const f1 = Math.sin(time * 66.0 + px * 0.12) * 14;
            const f2 = Math.cos(time * 47.0 - px * 0.08) * 7;
            const len = (baseLen + f1 + f2) * thrustPower;
            const w   = baseW * (0.84 + 0.26 * thrustPower);

            // Soft volumetric exhaust bloom
            const bg = ctx.createRadialGradient(px, py + 16, 4, px, py + len * 0.45, len * 1.25);
            if (isMain) {
              bg.addColorStop(0.0, "rgba(255, 232, 160, 0.56)");
              bg.addColorStop(0.45, "rgba(235, 134, 52, 0.22)");
              bg.addColorStop(1.0, "rgba(0, 0, 0, 0)");
            } else {
              bg.addColorStop(0.0, "rgba(125, 211, 252, 0.52)");
              bg.addColorStop(0.45, "rgba(59, 130, 246, 0.20)");
              bg.addColorStop(1.0, "rgba(0, 0, 0, 0)");
            }
            ctx.fillStyle = bg;
            ctx.fillRect(px - len * 1.3, py - 14, len * 2.6, len * 1.7);

            const drawCone = (cw, cl, col, alpha = 1) => {
              ctx.save();
              ctx.globalAlpha *= alpha;
              ctx.fillStyle = col;
              ctx.beginPath();
              ctx.moveTo(px - cw, py);
              ctx.bezierCurveTo(px - cw * 0.85, py + cl * 0.42, px - cw * 0.28, py + cl * 0.82, px, py + cl);
              ctx.bezierCurveTo(px + cw * 0.28, py + cl * 0.82, px + cw * 0.85, py + cl * 0.42, px + cw, py);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            };

            if (isMain) {
              drawCone(w * 1.12, len * 1.06, "#d9462f", 0.72);
              drawCone(w * 0.82, len * 0.86, "#f58232", 0.92);
              drawCone(w * 0.52, len * 0.62, "#ffd15c", 0.98);
              drawCone(w * 0.27, len * 0.36, "#ffffff", 1.00);
              // Mach shock diamonds
              for (let d = 0; d < 3; d++) {
                const dy = py + 20 + d * 24 + ((time * 130) % 12);
                if (dy < py + len * 0.72) {
                  ctx.fillStyle = `rgba(255, 252, 235, ${(0.78 - d * 0.20).toFixed(2)})`;
                  ctx.beginPath();
                  ctx.ellipse(px, dy, w * (0.28 - d * 0.06), 3.2, 0, 0, Math.PI * 2);
                  ctx.fill();
                }
              }
            } else {
              drawCone(w * 1.06, len * 1.04, "#2563eb", 0.68);
              drawCone(w * 0.74, len * 0.82, "#38bdf8", 0.92);
              drawCone(w * 0.38, len * 0.48, "#f0f9ff", 1.00);
            }

            // Drifting glowing embers/sparks
            for (let s = 0; s < (isMain ? 7 : 3); s++) {
              const sp = ((time * (2.6 + (s % 3) * 0.4) + s * 0.27) % 1);
              const sx = px + Math.sin(s * 5.1 + sp * 7.0) * (w * 0.75 + sp * 18);
              const sy = py + 12 + sp * (len * 1.25);
              ctx.fillStyle = isMain ? (s % 2 === 0 ? "#ffe07d" : "#ff8c42") : "#bae6fd";
              ctx.globalAlpha = (1 - sp) * 0.85;
              const sz = lerp(4.2, 1.4, sp);
              ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
            }
            ctx.globalAlpha = 1;
          };

          drawPlasmaJet(cx - 122, cy + 194, 18, 62, false);
          drawPlasmaJet(cx + 122, cy + 194, 18, 62, false);
          drawPlasmaJet(cx,       cy + 206, 44, 108, true);
        }

        // ---------------------------------------------------------------------
        // 2. BLENDED AERODYNAMIC DELTA WINGS (Smooth Curved Sweep, Zero Flat Outlines!)
        // ---------------------------------------------------------------------
        const drawSleekWing = (dir) => {
          ctx.beginPath();
          ctx.moveTo(cx + dir * 94, cy - 18);
          ctx.bezierCurveTo(cx + dir * 138, cy + 48, cx + dir * 194, cy + 108, cx + dir * 210, cy + 174);
          ctx.quadraticCurveTo(cx + dir * 212, cy + 196, cx + dir * 192, cy + 194);
          ctx.lineTo(cx + dir * 116, cy + 168);
          ctx.lineTo(cx + dir * 92,  cy + 166);
          ctx.closePath();

          const wg = ctx.createLinearGradient(cx + dir * 94, cy - 18, cx + dir * 210, cy + 194);
          if (dir === -1) {
            wg.addColorStop(0.0, "#3b4257");
            wg.addColorStop(0.55, "#232838");
            wg.addColorStop(1.0, "#131620");
          } else {
            wg.addColorStop(0.0, "#262b3b");
            wg.addColorStop(0.55, "#191c28");
            wg.addColorStop(1.0, "#0e1017");
          }
          ctx.fillStyle = wg; ctx.fill();

          // Specular leading-edge brushed gold pinstripe
          ctx.strokeStyle = dir === -1 ? "rgba(235, 179, 67, 0.72)" : "rgba(235, 179, 67, 0.42)";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(cx + dir * 102, cy + 4);
          ctx.bezierCurveTo(cx + dir * 144, cy + 62, cx + dir * 192, cy + 114, cx + dir * 206, cy + 170);
          ctx.stroke();

          // Subtle recessed titanium panel on wing
          ctx.beginPath();
          ctx.moveTo(cx + dir * 136, cy + 88);
          ctx.lineTo(cx + dir * 184, cy + 158);
          ctx.lineTo(cx + dir * 142, cy + 150);
          ctx.closePath();
          ctx.fillStyle = "rgba(255, 255, 255, 0.045)";
          ctx.fill();

          // Wingtip nav strobe LED
          const blink = 0.55 + 0.45 * Math.sin(time * 8.0 + dir * 1.4);
          ctx.save();
          ctx.fillStyle = dir === -1 ? "#ff6b6b" : "#5ce6a0";
          ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14 * blink;
          ctx.beginPath(); ctx.arc(cx + dir * 203, cy + 183, 4.2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        };
        drawSleekWing(-1);
        drawSleekWing(1);

        // ---------------------------------------------------------------------
        // 3. FLUSH-MOUNTED TEARDROP SIDE BOOSTER NACELLES (Tucked Cleanly into Hull!)
        // ---------------------------------------------------------------------
        const drawFlushNacelle = (dir) => {
          const nx = cx + dir * 122;

          // Engine bell
          ctx.beginPath();
          ctx.moveTo(nx - 16, cy + 174); ctx.lineTo(nx + 16, cy + 174);
          ctx.lineTo(nx + 22, cy + 196); ctx.lineTo(nx - 22, cy + 196);
          ctx.closePath();
          const ng = ctx.createLinearGradient(nx - 22, 0, nx + 22, 0);
          ng.addColorStop(0, "#1d212d"); ng.addColorStop(0.38, "#565f78"); ng.addColorStop(1, "#12141c");
          ctx.fillStyle = ng; ctx.fill();

          // Teardrop metallic pod
          const tracePod = () => {
            ctx.beginPath();
            ctx.moveTo(nx, cy - 8);
            ctx.bezierCurveTo(nx + 24, cy + 20, nx + 26, cy + 72, nx + 24, cy + 166);
            ctx.quadraticCurveTo(nx + 24, cy + 180, nx + 14, cy + 180);
            ctx.lineTo(nx - 14, cy + 180);
            ctx.quadraticCurveTo(nx - 24, cy + 180, nx - 24, cy + 166);
            ctx.bezierCurveTo(nx - 26, cy + 72, nx - 24, cy + 20, nx, cy - 8);
            ctx.closePath();
          };
          ctx.save();
          tracePod(); ctx.clip();
          const pg = ctx.createLinearGradient(nx - 25, 0, nx + 25, 0);
          pg.addColorStop(0.0, "#7c869e");
          pg.addColorStop(0.30, "#eef1f8");
          pg.addColorStop(0.68, "#b7c0d4");
          pg.addColorStop(1.0, "#3d4457");
          ctx.fillStyle = pg; ctx.fillRect(nx - 28, cy - 12, 56, 198);

          // Carbon nose tip on pod (curved!)
          ctx.fillStyle = "#1c202c";
          ctx.beginPath(); ctx.arc(nx, cy - 12, 34, 0, Math.PI * 2); ctx.fill();
          // Gold collar ring on pod
          ctx.fillStyle = "#ebb343"; ctx.fillRect(nx - 26, cy + 36, 52, 4);
          // Carbon base collar
          ctx.fillStyle = "#1a1e29"; ctx.fillRect(nx - 26, cy + 150, 52, 34);
          ctx.restore();

          // Subtle luminous cyan intake vent strip
          ctx.save();
          ctx.fillStyle = "#38bdf8";
          ctx.shadowColor = "#38bdf8"; ctx.shadowBlur = 10;
          roundRect(ctx, nx - 3, cy + 58, 6, 36, 3); ctx.fill();
          ctx.restore();

          // Soft specular edge rim (NO harsh black outline!)
          tracePod();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.14)"; ctx.lineWidth = 1.2; ctx.stroke();
        };
        drawFlushNacelle(-1);
        drawFlushNacelle(1);

        // ---------------------------------------------------------------------
        // 4. MAIN VECTOR ENGINE BELL (Sculpted Titanium Bell + Gold Heat Ring)
        // ---------------------------------------------------------------------
        ctx.beginPath();
        ctx.moveTo(cx - 48, cy + 168); ctx.lineTo(cx + 48, cy + 168);
        ctx.lineTo(cx + 66, cy + 208); ctx.lineTo(cx - 66, cy + 208);
        ctx.closePath();
        const bellG = ctx.createLinearGradient(cx - 66, 0, cx + 66, 0);
        bellG.addColorStop(0.0, "#1c202b");
        bellG.addColorStop(0.32, "#626b84");
        bellG.addColorStop(0.55, "#3a4052");
        bellG.addColorStop(1.0, "#11131a");
        ctx.fillStyle = bellG; ctx.fill();
        // Glowing heated engine throat rim
        ctx.strokeStyle = "rgba(255, 198, 92, 0.72)"; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(cx - 62, cy + 204); ctx.lineTo(cx + 62, cy + 204); ctx.stroke();

        // ---------------------------------------------------------------------
        // 5. MAIN FUSELAGE — PEARL CERAMIC TITANIUM + CURVED CARBON NOSE + GOLD TRIM
        //    (ZERO TINY TEXT! ZERO UGLY BLACK CARTOON STROKE!)
        // ---------------------------------------------------------------------
        const traceHull = () => {
          ctx.beginPath();
          ctx.moveTo(cx, cy - 332);
          ctx.bezierCurveTo(cx + 62, cy - 270, cx + 114, cy - 178, cx + 122, cy - 78);
          ctx.lineTo(cx + 122, cy + 114);
          ctx.bezierCurveTo(cx + 122, cy + 158, cx + 98, cy + 178, cx + 68, cy + 180);
          ctx.lineTo(cx - 68, cy + 180);
          ctx.bezierCurveTo(cx - 98, cy + 178, cx - 122, cy + 158, cx - 122, cy + 114);
          ctx.lineTo(cx - 122, cy - 78);
          ctx.bezierCurveTo(cx - 114, cy - 178, cx - 62, cy - 270, cx, cy - 332);
          ctx.closePath();
        };

        ctx.save();
        traceHull();
        ctx.clip();

        // Rich 3D cylindrical pearl-ceramic metallic shading
        const bodyG = ctx.createLinearGradient(cx - 122, 0, cx + 122, 0);
        bodyG.addColorStop(0.00, "#757f96");
        bodyG.addColorStop(0.14, "#d2d8e6");
        bodyG.addColorStop(0.32, "#ffffff");
        bodyG.addColorStop(0.58, "#dfe4f0");
        bodyG.addColorStop(0.84, "#8590a8");
        bodyG.addColorStop(1.00, "#41485c");
        ctx.fillStyle = bodyG;
        ctx.fillRect(cx - 128, cy - 338, 256, 524);

        // Warm bounced flame glow illuminating the lower fuselage!
        const bounceG = ctx.createRadialGradient(cx, cy + 215, 10, cx, cy + 180, 170);
        bounceG.addColorStop(0.0, "rgba(255, 185, 76, 0.34)");
        bounceG.addColorStop(1.0, "rgba(255, 185, 76, 0)");
        ctx.fillStyle = bounceG;
        ctx.fillRect(cx - 128, cy + 20, 256, 170);

        // Curved Carbon-Slate Nose Cowl (aerodynamic curved seam, NOT a flat box cut!)
        ctx.beginPath();
        ctx.moveTo(cx - 130, cy - 340);
        ctx.lineTo(cx + 130, cy - 340);
        ctx.lineTo(cx + 130, cy - 178);
        ctx.quadraticCurveTo(cx, cy - 148, cx - 130, cy - 178);
        ctx.closePath();
        const noseG = ctx.createLinearGradient(cx - 105, 0, cx + 105, 0);
        noseG.addColorStop(0.00, "#1c202d");
        noseG.addColorStop(0.34, "#404861");
        noseG.addColorStop(0.68, "#222736");
        noseG.addColorStop(1.00, "#0f1119");
        ctx.fillStyle = noseG; ctx.fill();

        // Curved Brushed Champagne Gold Chevron Trim along the nose seam!
        ctx.strokeStyle = "#ebb343"; ctx.lineWidth = 5.5;
        ctx.beginPath();
        ctx.moveTo(cx - 126, cy - 178);
        ctx.quadraticCurveTo(cx, cy - 148, cx + 126, cy - 178);
        ctx.stroke();

        // Luminous minimalist diamond emblem on carbon nose (clean geometric, ZERO text!)
        ctx.save();
        ctx.translate(cx, cy - 224);
        ctx.fillStyle = "#ebb343";
        ctx.shadowColor = "rgba(235, 179, 67, 0.55)"; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(0, -14); ctx.lineTo(10, 0); ctx.lineTo(0, 14); ctx.lineTo(-10, 0); ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff5d6";
        ctx.beginPath();
        ctx.moveTo(0, -6); ctx.lineTo(4.5, 0); ctx.lineTo(0, 6); ctx.lineTo(-4.5, 0); ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Subtle curved fuselage seam lines (aerospace micro-craft)
        ctx.strokeStyle = "rgba(28, 32, 46, 0.16)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - 56, cy - 160); ctx.lineTo(cx - 56, cy + 132);
        ctx.moveTo(cx + 56, cy - 160); ctx.lineTo(cx + 56, cy + 132);
        ctx.stroke();

        // Curved Carbon Heatshield Skirt at base + Champagne Gold Rim
        ctx.beginPath();
        ctx.moveTo(cx - 128, cy + 126);
        ctx.quadraticCurveTo(cx, cy + 144, cx + 128, cy + 126);
        ctx.lineTo(cx + 128, cy + 186);
        ctx.lineTo(cx - 128, cy + 186);
        ctx.closePath();
        const skirtG = ctx.createLinearGradient(cx - 120, 0, cx + 120, 0);
        skirtG.addColorStop(0.0, "#151822"); skirtG.addColorStop(0.35, "#2c3244"); skirtG.addColorStop(1.0, "#0c0e14");
        ctx.fillStyle = skirtG; ctx.fill();

        ctx.strokeStyle = "#ebb343"; ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(cx - 126, cy + 126);
        ctx.quadraticCurveTo(cx, cy + 144, cx + 126, cy + 126);
        ctx.stroke();

        // Crisp vertical specular reflection streak
        const specG = ctx.createLinearGradient(cx - 64, 0, cx - 22, 0);
        specG.addColorStop(0, "rgba(255,255,255,0)");
        specG.addColorStop(0.5, "rgba(255,255,255,0.44)");
        specG.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = specG;
        ctx.fillRect(cx - 68, cy - 320, 50, 495);

        ctx.restore();

        // Soft luminous rim edge around fuselage (high-craft, no heavy cartoon ink!)
        traceHull();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.22)"; ctx.lineWidth = 1.6; ctx.stroke();

        // Sleek Telemetry Spire + Pulsing Gold Beacon
        ctx.strokeStyle = "#cfd6e6"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(cx, cy - 330); ctx.lineTo(cx, cy - 352); ctx.stroke();
        const bGlow = 0.55 + 0.45 * Math.sin(time * 9.5);
        ctx.save();
        ctx.fillStyle = "#ffe28a";
        ctx.shadowColor = "#ebb343"; ctx.shadowBlur = 16 * bGlow;
        ctx.beginPath(); ctx.arc(cx, cy - 354, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // ---------------------------------------------------------------------
        // 6. MINIMALIST 3-LED CREW STATUS CAPSULE (Replaces tiny text! Lights up as Trio boards!)
        // ---------------------------------------------------------------------
        const ledY = cy - 128;
        roundRect(ctx, cx - 54, ledY - 11, 108, 22, 11);
        ctx.fillStyle = "#151822"; ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.14)"; ctx.lineWidth = 1.2; ctx.stroke();

        const ledCols = ["#6ea8fe", "#e07a5f", "#ebb343"];
        for (let i = 0; i < 3; i++) {
          const lx = cx - 28 + i * 28;
          const on = crewBoarded[i];
          ctx.save();
          if (on) {
            ctx.fillStyle = ledCols[i];
            ctx.shadowColor = ledCols[i]; ctx.shadowBlur = 12;
          } else {
            ctx.fillStyle = "#2b3040";
          }
          ctx.beginPath(); ctx.arc(lx, ledY, 5.5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // ---------------------------------------------------------------------
        // 7. PANORAMIC ENERGY AIRLOCK BAY (Recessed Interior + Holographic Guidance Beam!)
        // ---------------------------------------------------------------------
        const hx = cx, hy = cy + 8, hr = 96;

        // Soft volumetric golden-cyan guidance light cone & upward drifting motes!
        if (hatchOpen > 0.35 && thrustPower < 1.15) {
          ctx.save();
          const coneG = ctx.createLinearGradient(hx, hy + hr - 12, hx, hy + hr + 360);
          coneG.addColorStop(0.0, `rgba(235, 179, 67, ${(0.17 * hatchOpen).toFixed(3)})`);
          coneG.addColorStop(0.5, `rgba(110, 168, 254, ${(0.07 * hatchOpen).toFixed(3)})`);
          coneG.addColorStop(1.0, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = coneG;
          ctx.beginPath();
          ctx.moveTo(hx - 68, hy + hr - 10);
          ctx.lineTo(hx + 68, hy + hr - 10);
          ctx.lineTo(hx + 205, hy + hr + 360);
          ctx.lineTo(hx - 205, hy + hr + 360);
          ctx.closePath();
          ctx.fill();

          // Floating energy motes rising gently toward the open bay
          for (let m = 0; m < 10; m++) {
            const mp = ((time * 0.75 + m * 0.19) % 1);
            const my = hy + hr + 300 * (1 - mp);
            const spread = lerp(140, 42, mp);
            const mx = hx + Math.sin(m * 3.7 + mp * 4.0) * spread;
            ctx.fillStyle = m % 2 === 0 ? "#ffe07d" : "#93c5fd";
            ctx.globalAlpha = Math.sin(mp * Math.PI) * 0.60 * hatchOpen;
            ctx.beginPath(); ctx.arc(mx, my, 2.8, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }

        // Deeply beveled metallic airlock outer housing
        ctx.beginPath(); ctx.arc(hx, hy, hr + 16, 0, Math.PI * 2);
        const hRimG = ctx.createLinearGradient(hx - hr, hy - hr, hx + hr, hy + hr);
        hRimG.addColorStop(0.0, "#4f5870");
        hRimG.addColorStop(0.45, "#232836");
        hRimG.addColorStop(1.0, "#10121a");
        ctx.fillStyle = hRimG; ctx.fill();

        // Dark recessed cabin interior
        const cabG = ctx.createRadialGradient(hx, hy - 18, 12, hx, hy, hr);
        cabG.addColorStop(0.0, "#372a4f");
        cabG.addColorStop(0.55, "#161322");
        cabG.addColorStop(1.0, "#07070c");
        ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2);
        ctx.fillStyle = cabG; ctx.fill();

        // Cabin interior glow flash when a mascot dives inside!
        if (absorbFlash && absorbFlash.val > 0.02) {
          ctx.save();
          ctx.globalAlpha = absorbFlash.val * 0.65;
          const fg = ctx.createRadialGradient(hx, hy, 8, hx, hy, hr);
          fg.addColorStop(0.0, "#ffffff");
          fg.addColorStop(0.45, absorbFlash.col);
          fg.addColorStop(1.0, "rgba(0,0,0,0)");
          ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2);
          ctx.fillStyle = fg; ctx.fill();
          ctx.restore();
        }

        // Subtle console HUD lights on cabin back wall + Dual Armored Sliding Doors
        ctx.save();
        ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = "rgba(92, 230, 160, 0.28)"; ctx.fillRect(hx - 68, hy - 58, 28, 5);
        ctx.fillStyle = "rgba(235, 179, 67, 0.34)"; ctx.fillRect(hx + 40, hy - 58, 28, 5);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.06)"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(hx - hr, hy - 34); ctx.lineTo(hx + hr, hy - 34); ctx.stroke();

        if (hatchOpen < 0.99) {
          const slide = easeInOutCubic(hatchOpen) * (hr + 8);
          const dL = ctx.createLinearGradient(hx - hr - slide, 0, hx - slide, 0);
          dL.addColorStop(0, "#1d212e"); dL.addColorStop(1, "#3c4459");
          ctx.fillStyle = dL; ctx.fillRect(hx - hr - slide, hy - hr, hr, hr * 2);

          const dR = ctx.createLinearGradient(hx + slide, 0, hx + hr + slide, 0);
          dR.addColorStop(0, "#3c4459"); dR.addColorStop(1, "#1a1e29");
          ctx.fillStyle = dR; ctx.fillRect(hx + slide, hy - hr, hr, hr * 2);

          ctx.strokeStyle = "#ebb343"; ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(hx - slide, hy - hr); ctx.lineTo(hx - slide, hy + hr);
          ctx.moveTo(hx + slide, hy - hr); ctx.lineTo(hx + slide, hy + hr);
          ctx.stroke();
        }
        ctx.restore();

        ctx.restore();
        return { hx, hy, hr };
      }

      // Front Airlock Bezel + Rotating Holographic Portal Ring + Absorption Burst Overlay!
      function drawOrbitalDropshipFrontRim(hx, hy, hr, hatchOpen, time, absorbFlash) {
        ctx.save();
        // Lower armored sill (characters diving inside pass BEHIND this lip!)
        ctx.beginPath();
        ctx.arc(hx, hy, hr + 8, 0.06 * Math.PI, 0.94 * Math.PI);
        ctx.strokeStyle = "#2d3345"; ctx.lineWidth = 17; ctx.lineCap = "round"; ctx.stroke();

        ctx.beginPath();
        ctx.arc(hx, hy, hr + 8, 0.10 * Math.PI, 0.90 * Math.PI);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)"; ctx.lineWidth = 2.0; ctx.stroke();

        // Outer metallic ring
        ctx.beginPath();
        ctx.arc(hx, hy, hr + 16, 0, Math.PI * 2);
        ctx.strokeStyle = hatchOpen > 0.2 ? "rgba(235, 179, 67, 0.85)" : "rgba(255,255,255,0.14)";
        ctx.lineWidth = 2.4; ctx.stroke();

        // Rotating Holographic Boarding Ring when airlock is open!
        if (hatchOpen > 0.25) {
          const ringCol = (absorbFlash && absorbFlash.val > 0.05) ? absorbFlash.col : "#ebb343";
          ctx.save();
          ctx.translate(hx, hy);
          ctx.rotate(time * 1.1);
          ctx.strokeStyle = ringCol;
          ctx.shadowColor = ringCol; ctx.shadowBlur = 12 + (absorbFlash ? absorbFlash.val * 20 : 0);
          ctx.lineWidth = 2.6;
          ctx.setLineDash([28, 22]);
          ctx.globalAlpha = hatchOpen * 0.78;
          ctx.beginPath(); ctx.arc(0, 0, hr + 24, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        // 12 recessed titanium bolts
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          ctx.fillStyle = "#b8c2d8";
          ctx.beginPath();
          ctx.arc(hx + Math.cos(a) * (hr + 8), hy + Math.sin(a) * (hr + 8), 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // =======================================================================
      // 7B. KINETIC BOARDING VFX: GROUND SHOCKWAVE + COMET RIBBON + AIRLOCK WARP BURST!
      // =======================================================================
      function drawGroundLaunchFX(fx, fy, time, launchT, anticStart, colMain, colLight) {
        // 1. Charge-up ring during anticipation crouch
        if (time >= anticStart && time < launchT) {
          const cp = clamp((time - anticStart) / (launchT - anticStart), 0, 1);
          ctx.save();
          ctx.globalAlpha = Math.sin(cp * Math.PI) * 0.85;
          ctx.strokeStyle = colMain; ctx.lineWidth = 3.2;
          ctx.shadowColor = colMain; ctx.shadowBlur = 14;
          const rad = lerp(96, 48, easeOutCubic(cp));
          ctx.beginPath(); ctx.ellipse(fx, fy, rad, rad * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        // 2. Explosive launch shockwave + voxel sparks + vertical speed lines!
        if (time >= launchT && time <= launchT + 0.85) {
          const p = (time - launchT) / 0.85;
          ctx.save();

          // Expanding kinetic floor shockwave
          if (p < 0.65) {
            const rp = p / 0.65;
            ctx.globalAlpha = Math.pow(1 - rp, 1.4) * 0.92;
            ctx.strokeStyle = colMain; ctx.lineWidth = lerp(5.5, 1.2, rp);
            ctx.shadowColor = colMain; ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.ellipse(fx, fy, lerp(44, 185, easeOutQuart(rp)), lerp(12, 46, easeOutQuart(rp)), 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          // 12 radial voxel sparks bursting up & outward
          for (let i = 0; i < 12; i++) {
            const ang = (i / 12) * Math.PI * 2 + 0.15;
            const d = easeOutCubic(p) * (75 + (i % 3) * 35);
            const px = fx + Math.cos(ang) * d;
            const py = fy + Math.sin(ang) * d * 0.28 - easeOutCubic(p) * (70 + (i % 4) * 45);
            const sz = lerp(11, 2.5, p);
            ctx.globalAlpha = (1 - p) * 0.92;
            ctx.fillStyle = i % 2 === 0 ? colMain : colLight;
            roundRect(ctx, px - sz / 2, py - sz / 2, sz, sz, 2.5);
            ctx.fill();
          }

          // 5 vertical launch speed lines
          if (p < 0.55) {
            const lp = p / 0.55;
            ctx.globalAlpha = (1 - lp) * 0.72;
            ctx.strokeStyle = colLight; ctx.lineWidth = 2.6; ctx.lineCap = "round";
            for (let k = -2; k <= 2; k++) {
              const lx = fx + k * 24;
              const ly = fy - 25 - lp * 220 - Math.abs(k) * 18;
              ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 68 * (1 - lp * 0.4)); ctx.stroke();
            }
          }
          ctx.restore();
        }
      }

      // Luminous curved comet ribbon + sparkling trail behind jumping mascot!
      function drawJumpCometTrail(sampleFn, curTime, launchT, enterEndT, colMain, colLight, originX, originY, camDist, fov) {
        if (curTime <= launchT + 0.02 || curTime > enterEndT + 0.28) return;
        const steps = 16;
        const trailSpan = 0.34;
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const st = curTime - (i / steps) * trailSpan;
          if (st < launchT || st > enterEndT) continue;
          const pos = sampleFn(st);
          if (!pos || pos.state === "stand" || pos.state === "gone") continue;
          const pt = project3DPoint(pos.wx, pos.wy + 1.0, pos.wz, originX, originY, camDist, fov);
          pts.push({ x: pt.x, y: pt.y, frac: 1 - i / steps });
        }
        if (pts.length < 2) return;

        ctx.save();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const w = a.frac * 26;
          // Outer colored energy ribbon
          ctx.globalAlpha = a.frac * 0.42;
          ctx.strokeStyle = colMain; ctx.lineWidth = w;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          // Bright inner core ribbon
          ctx.globalAlpha = a.frac * 0.75;
          ctx.strokeStyle = colLight; ctx.lineWidth = w * 0.36;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }

        // Sparkling pixel motes along the trail
        for (let i = 1; i < pts.length; i += 2) {
          const p = pts[i];
          const ox = Math.sin(curTime * 18 + i * 2.1) * (16 * (1 - p.frac) + 6);
          const oy = Math.cos(curTime * 16 + i * 1.7) * 10;
          const sz = 4 + p.frac * 7;
          ctx.globalAlpha = p.frac * 0.90;
          ctx.fillStyle = i % 4 === 1 ? "#ffffff" : colLight;
          roundRect(ctx, p.x + ox - sz / 2, p.y + oy - sz / 2, sz, sz, 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Crisp Energy Absorption Portal Ring + Radial Sparks when a mascot enters the airlock!
      function drawHatchAbsorptionFX(hx, hy, hr, time, hitT, colMain, colLight) {
        if (time < hitT || time > hitT + 0.72) return;
        const p = (time - hitT) / 0.72;
        ctx.save();

        // Dual expanding energy rings around the hatch rim
        ctx.globalAlpha = Math.pow(1 - p, 1.3) * 0.95;
        ctx.strokeStyle = colMain; ctx.lineWidth = lerp(6.0, 1.2, p);
        ctx.shadowColor = colMain; ctx.shadowBlur = 22;
        ctx.beginPath(); ctx.arc(hx, hy, hr + easeOutCubic(p) * 78, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = lerp(3.2, 0.8, p);
        ctx.beginPath(); ctx.arc(hx, hy, hr - 10 + easeOutQuart(p) * 52, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;

        // 14 radial energy star sparks bursting out of the airlock rim
        for (let i = 0; i < 14; i++) {
          const ang = (i / 14) * Math.PI * 2 + 0.12;
          const dist = hr + 6 + easeOutCubic(p) * (65 + (i % 3) * 32);
          const sx = hx + Math.cos(ang) * dist;
          const sy = hy + Math.sin(ang) * dist;
          const sz = lerp(12, 2.5, p);
          ctx.globalAlpha = (1 - p) * 0.95;
          ctx.fillStyle = i % 2 === 0 ? colLight : colMain;
          ctx.save();
          ctx.translate(sx, sy); ctx.rotate(ang + p * 3.0);
          roundRect(ctx, -sz / 2, -sz / 2, sz, sz, 2.5); ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      // Sonic Boom Pressure Ring & Warp Speed Streaks on Blast-Off!
      function drawBlastOffFX(cx, rocketBaseY, time) {
        if (time < 24.85 || time > 26.60) return;
        const p = clamp((time - 24.85) / 1.10, 0, 1);
        ctx.save();
        if (p < 0.85) {
          const rp = p / 0.85;
          ctx.globalAlpha = Math.pow(1 - rp, 1.4) * 0.88;
          ctx.strokeStyle = "#ffe07d"; ctx.lineWidth = lerp(7.0, 1.5, rp);
          ctx.shadowColor = "#ebb343"; ctx.shadowBlur = 24;
          ctx.beginPath();
          ctx.ellipse(cx, 895, lerp(65, 480, easeOutQuart(rp)), lerp(18, 92, easeOutQuart(rp)), 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        // Vertical warp speed streaks rushing downward
        const sp = bellCurve(time, 24.90, 25.25, 25.85, 26.40);
        if (sp > 0.02) {
          ctx.globalAlpha = sp * 0.55;
          ctx.lineCap = "round";
          for (let i = 0; i < 16; i++) {
            const lx = 70 + ((i * 193) % (W - 140));
            const ly = ((time * 1850 + i * 240) % (H + 260)) - 200;
            ctx.strokeStyle = i % 3 === 0 ? "#ffe07d" : (i % 3 === 1 ? "#93c5fd" : "#ffffff");
            ctx.lineWidth = i % 2 === 0 ? 2.6 : 1.6;
            ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 150); ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Shout Callout Banner (Tanpa menabrak roket / maskot!)
      function drawShoutCallout(opts) {
        const { tag, text1, text2, accentHex, yCenter, alpha, typeProg, time, shakeAmp = 0 } = opts;
        if (alpha <= 0.01) return;
        const bw = 920, bh = text2 ? 156 : 114;
        const sx = shakeAmp > 0 ? Math.sin(time * 52.0) * shakeAmp : 0;
        const sy = shakeAmp > 0 ? Math.cos(time * 44.0) * (shakeAmp * 0.5) : 0;
        const bx = (W - bw) / 2 + sx;
        const by = yCenter - bh / 2 + sy;

        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.shadowColor = "rgba(0, 0, 0, 0.72)"; ctx.shadowBlur = 32; ctx.shadowOffsetY = 10;
        roundRect(ctx, bx, by, bw, bh, 16);
        ctx.fillStyle = "#14141a"; ctx.fill();
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = 2.0; ctx.strokeStyle = accentHex; ctx.stroke();

        ctx.font = "800 14.5px ui-monospace, Consolas, monospace";
        const tagW = ctx.measureText(tag).width + 32;
        roundRect(ctx, W / 2 - tagW / 2 + sx, by - 16, tagW, 30, 15);
        ctx.fillStyle = accentHex; ctx.fill();
        ctx.fillStyle = "#0e0e10"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(tag, W / 2 + sx, by - 0.5);

        const full = text2 ? (text1 + "\n" + text2) : text1;
        const shown = full.slice(0, Math.floor(clamp(typeProg, 0, 1) * full.length)).split("\n");
        ctx.font = "900 35px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#f5f4f0"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (text2) {
          ctx.fillText(shown[0] || "", W / 2 + sx, by + 62);
          ctx.fillStyle = accentHex;
          ctx.fillText(shown[1] || "", W / 2 + sx, by + 112);
        } else {
          ctx.fillText(shown[0] || "", W / 2 + sx, by + 64);
        }
        ctx.restore();
      }

      function drawEmotePop(x, y, txt, accent, alpha, time) {
        if (alpha <= 0.02) return;
        const sc = softSpringOut(clamp(alpha * 1.35, 0, 1), 1.0);
        ctx.save();
        ctx.globalAlpha *= clamp(alpha, 0, 1);
        ctx.translate(x, y + Math.sin(time * 9.0) * 5);
        ctx.scale(sc, sc);
        ctx.shadowColor = accent; ctx.shadowBlur = 16;
        roundRect(ctx, -25, -25, 50, 50, 12);
        ctx.fillStyle = "#16161d"; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2; ctx.strokeStyle = accent; ctx.stroke();
        ctx.font = "900 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = accent; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(txt, 0, 2);
        ctx.restore();
      }

      function drawStageFloor(floorY, alpha, rocketHoverGlow = 0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        const glow = ctx.createRadialGradient(W / 2, floorY, 30, W / 2, floorY, 440);
        glow.addColorStop(0, `rgba(235, 179, 67, ${(0.12 + rocketHoverGlow * 0.14).toFixed(3)})`);
        glow.addColorStop(0.55, "rgba(110, 168, 254, 0.06)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(48, floorY - 160, W - 96, 320);

        ctx.beginPath(); ctx.rect(48, floorY - 72, W - 96, 200); ctx.clip();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.048)"; ctx.lineWidth = 1;
        for (let i = -5; i <= 5; i++) {
          ctx.beginPath(); ctx.moveTo(W / 2 + i * 42, floorY - 68); ctx.lineTo(W / 2 + i * 175, floorY + 135); ctx.stroke();
        }
        for (const hy of [floorY - 60, floorY - 26, floorY + 12, floorY + 56, floorY + 104]) {

      function drawFloorShadow(cx, cy, rx, ry, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(cx, cy); ctx.scale(1, ry / rx);
        const g = ctx.createRadialGradient(0, 0, rx * 0.1, 0, 0, rx);
        g.addColorStop(0, `rgba(0, 0, 0, ${(0.72 * alpha).toFixed(3)})`);
        g.addColorStop(0.65, `rgba(0, 0, 0, ${(0.26 * alpha).toFixed(3)})`);
        g.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // =======================================================================
      // 8. KINETIC JUMP TRAJECTORY CALCULATORS (SQUASH-LAUNCH + APEX + TRUE AIRLOCK DIVE!)
      // =======================================================================
      // Standard kinetic side-arc boarding (Merry & Roger)
      function sampleSideBoarding(tVal, anticStart, launchT, diveStart, endT, startWX) {
        if (tVal < anticStart) {
          return { state: "stand", wx: startWX, wy: 0, wz: 0, sc: 1.0, sqX: 1, sqY: 1, spin: 0, alpha: 1.0, clipHatch: false };
        }
        if (tVal < launchT) {
          const ap = (tVal - anticStart) / (launchT - anticStart);
          const s = Math.sin(ap * Math.PI);
          return {
            state: "antic", wx: startWX, wy: -s * 0.72, wz: 0,
            sc: 1.0, sqX: 1 + s * 0.28, sqY: 1 - s * 0.28,
            spin: 0, alpha: 1.0, clipHatch: false
          };
        }
        if (tVal < diveStart) {
          // High-speed snappy launch curve up to apex right in front of open airlock!
          const jp = clamp((tVal - launchT) / (diveStart - launchT), 0, 1);
          const e = easeOutQuart(jp);
          const stretch = Math.sin(clamp(jp * 1.4, 0, 1) * Math.PI);
          const wx = quadBezier(startWX, startWX * 0.72, 0, e);
          const wy = quadBezier(0, 23.5, 27.6, e);
          const wz = Math.sin(jp * Math.PI) * 3.8;
          return {
            state: "air", wx, wy, wz,
            sc: lerp(1.0, 0.56, smoothstep(0.45, 1.0, jp)),
            sqX: 1 - stretch * 0.20, sqY: 1 + stretch * 0.26,
            spin: easeOutCubic(jp) * Math.PI * 2.0 * (startWX < 0 ? 1 : -1),
            alpha: 1.0, clipHatch: false
          };
        }
        if (tVal <= endT) {
          // True dive INTO the open airlock cabin (clipped cleanly inside hatch!)
          const dp = clamp((tVal - diveStart) / (endT - diveStart), 0, 1);
          const e = easeInQuad(dp);
          return {
            state: "enter",
            wx: 0,
            wy: lerp(27.6, 28.9, e),
            wz: lerp(0, -10.5, e),
            sc: lerp(0.56, 0.28, e),
            sqX: lerp(1.0, 0.88, e), sqY: lerp(1.0, 1.12, e),
            spin: Math.PI * 2.0 * (startWX < 0 ? 1 : -1),
            alpha: 1 - smoothstep(0.62, 1.0, dp),
            clipHatch: true
          };
        }
        return { state: "gone", wx: 0, wy: 29.0, wz: -12, sc: 0, sqX: 1, sqY: 1, spin: 0, alpha: 0, clipHatch: true };
      }

      // Arto's Dramatic Slow-Mo Hero Hang-Time + Golden Paint-Zip Boarding!
      function sampleArtoBoarding(tVal) {
        const anticStart = 21.30, launchT = 21.66, hangStart = 22.15, zipStart = 23.02, diveStart = 23.46, endT = 23.82;
        if (tVal < anticStart) {
          return { state: "stand", wx: 0, wy: 0, wz: 0.4, sc: 1.0, sqX: 1, sqY: 1, spin: 0, alpha: 1.0, clipHatch: false, hangAmt: 0 };
        }
        if (tVal < launchT) {
          const ap = (tVal - anticStart) / (launchT - anticStart);
          const s = Math.sin(ap * Math.PI);
          return {
            state: "antic", wx: 0, wy: -s * 0.78, wz: 0.4,
            sc: 1.0, sqX: 1 + s * 0.26, sqY: 1 - s * 0.26,
            spin: 0, alpha: 1.0, clipHatch: false, hangAmt: 0
          };
        }
        if (tVal < hangStart) {
          const jp = (tVal - launchT) / (hangStart - launchT);
          const e = easeOutQuart(jp);
          const stretch = Math.sin(jp * Math.PI);
          return {
            state: "air", wx: 0, wy: lerp(0, 13.5, e), wz: lerp(0.4, 4.2, e),
            sc: lerp(1.0, 1.08, e), sqX: 1 - stretch * 0.18, sqY: 1 + stretch * 0.24,
            spin: 0, alpha: 1.0, clipHatch: false, hangAmt: e
          };
        }
        if (tVal < zipStart) {
          // Dramatic floating spotlight pose for "LOVE U PARA PENONTON, SAMPAI JUMPA!!"
          const hp = (tVal - hangStart) / (zipStart - hangStart);
          return {
            state: "hang", wx: Math.sin(hp * Math.PI * 2) * 0.4, wy: 13.5 + Math.sin(hp * Math.PI) * 1.1, wz: 4.2,
            sc: 1.08, sqX: 1, sqY: 1,
            spin: Math.sin(hp * Math.PI) * 0.18, alpha: 1.0, clipHatch: false, hangAmt: 1.0
          };
        }
        if (tVal < diveStart) {
          // Blazing golden paint-zip straight up to the open airlock!
          const zp = (tVal - zipStart) / (diveStart - zipStart);
          const e = easeInOutCubic(zp);
          const stretch = Math.sin(zp * Math.PI);
          return {
            state: "air", wx: 0, wy: lerp(13.5, 27.6, e), wz: lerp(4.2, 0.5, e),
            sc: lerp(1.08, 0.52, e), sqX: 1 - stretch * 0.22, sqY: 1 + stretch * 0.30,
            spin: e * Math.PI * 2.0, alpha: 1.0, clipHatch: false, hangAmt: 1 - e
          };
        }
        if (tVal <= endT) {
          const dp = (tVal - diveStart) / (endT - diveStart);
          const e = easeInQuad(dp);
          return {
            state: "enter", wx: 0, wy: lerp(27.6, 28.9, e), wz: lerp(0.5, -10.5, e),
            sc: lerp(0.52, 0.26, e), sqX: lerp(1.0, 0.88, e), sqY: lerp(1.0, 1.12, e),
            spin: Math.PI * 2.0, alpha: 1 - smoothstep(0.60, 1.0, dp), clipHatch: true, hangAmt: 0
          };
        }
        return { state: "gone", wx: 0, wy: 29.0, wz: -12, sc: 0, sqX: 1, sqY: 1, spin: 0, alpha: 0, clipHatch: true, hangAmt: 0 };
      }

      // =======================================================================
      // 9. FUNGSI UTAMA: drawFrame(t) — PAGE 5 v2 FINALE (28.00 DETIK · 840 FRAME)
      // =======================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, DURATION);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(SSAA, SSAA);

        // Camera Rumble (Boss teriak 14.15..15.10s & Mega Blast-Off 24.80..26.25s)
        let shX = 0, shY = 0;
        if (time >= 14.15 && time <= 15.10) {
          const a = bellCurve(time, 14.15, 14.30, 14.70, 15.10) * 6.5;
          shX = Math.sin(time * 78) * a; shY = Math.cos(time * 66) * a * 0.6;
        } else if (time >= 24.80 && time <= 26.25) {
          const a = bellCurve(time, 24.80, 25.15, 25.75, 26.25) * 10.5;
          shX = Math.sin(time * 92) * a; shY = Math.cos(time * 98) * a;
        }

        // 1. Latar Warm Obsidian (#0f0f11) + Ambient Lighting
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate(shX, shY);

        const rocketPhase = smootherstep(12.20, 13.00, time);
        const wash = ctx.createRadialGradient(W / 2, 780, 40, W / 2, 780, 820);
        wash.addColorStop(0, "rgba(235, 179, 67, 0.055)");
        wash.addColorStop(0.55, "rgba(110, 168, 254, 0.028)");
        wash.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = wash; ctx.fillRect(0, 0, W, H);

        // Starfield halus saat fase roket
        if (rocketPhase > 0.05) {
          ctx.save();
          for (let i = 0; i < 42; i++) {
            const sx = 54 + ((i * 197) % (W - 108));
            const sy = 144 + ((i * 131) % 920);
            const tw = 0.35 + 0.65 * Math.abs(Math.sin(time * 2.6 + i));
            ctx.fillStyle = i % 3 === 0 ? "#ffe07d" : (i % 3 === 1 ? "#bae6fd" : "#e5e4df");
            ctx.globalAlpha = rocketPhase * tw * 0.55;
            const sz = i % 5 === 0 ? 3 : 2;
            ctx.fillRect(sx, sy, sz, sz);
          }
          ctx.restore();
        }

        // 2. Frame Editorial Hairline (1px)
        ctx.strokeStyle = "#1e1e23"; ctx.lineWidth = 1;
        ctx.strokeRect(24.5, 44.5, W - 49, H - 89);
        ctx.fillStyle = "#1e1e23";
        ctx.fillRect(24, 122, W - 48, 1);
        ctx.fillRect(24, 1792, W - 48, 1);

        ctx.fillStyle = "#ebb343";
        ctx.fillRect(24, 121.5, (W - 48) * (time / DURATION), 1.5);
        drawCrosshair(540, 122, 4, "#36363f");
        drawCrosshair(540, 1792, 4, "#36363f");

        // Masthead
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ebb343"; ctx.fillRect(48, 80, 6, 6);
        ctx.fillStyle = "#7c7b76"; fillTrackedText("JOULFIAND STUDIO  ·  ADU MODEL", 66, 83.5, 1.5, "left");
        ctx.fillStyle = "#969590"; fillTrackedText(time >= 12.6 ? "05 — FINALE  ·  BACK TO BASE" : "05 — OUTRO  ·  FOLLOW @JULLJHAA", W - 48, 83.5, 1.5, "right");

        // =====================================================================
        // PHASE A (0.00s - 12.80s): EDITORIAL HEADLINES + IG PROFILE CARD (NO GELEMBUNG!)
        // =====================================================================
        const igCardAlpha = smootherstep(0.15, 0.85, time) * (1 - smootherstep(12.15, 12.85, time));
        if (igCardAlpha > 0.01) {
          const drawPhaseHeadline = (a, kicker, l1, l2, bigGold = false) => {
            if (a <= 0.01) return;
            ctx.save();
            ctx.globalAlpha = a * igCardAlpha;
            roundRect(ctx, 64, 152, 11, 11, 2.5); ctx.fillStyle = "#ebb343"; ctx.fill();
            ctx.font = "600 17.5px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#8f8d87";
            ctx.textBaseline = "middle";
            fillTrackedText(kicker, 86, 158, 1.6, "left");

            ctx.textAlign = "left"; ctx.textBaseline = "top";
            if (bigGold) {
              ctx.font = "900 66px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
              ctx.fillStyle = "#ebb343"; ctx.fillText(l1, 64, 188);
              ctx.font = "600 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
              ctx.fillStyle = "#b4b3ac"; ctx.fillText(l2, 64, 266);
            } else {
              ctx.font = "900 44px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
              ctx.fillStyle = "#f5f4f0"; ctx.fillText(l1, 64, 188);
              ctx.fillStyle = "#ebb343"; ctx.fillText(l2, 64, 244);
            }
            ctx.restore();
          };

          drawPhaseHeadline(
            bellCurve(time, 0.10, 0.65, 6.25, 6.65),
            "OUTRO  ·  PROJECT SELANJUTNYA",
            "Follow akun ini kalau kamu ingin",
            "tau project video motion selanjutnya."
          );
          drawPhaseHeadline(
            bellCurve(time, 6.60, 7.05, 9.20, 9.60),
            "OPEN SOURCE  ·  CEK BIO",
            "Link GitHub juga ada di bio-nya!",
            "github.com/rjoulfiand-afk"
          );
          drawPhaseHeadline(
            bellCurve(time, 9.55, 10.00, 11.95, 12.40),
            "MERRY · ARTO · ROGER",
            "Terimakasih!",
            "Sudah nonton sampai akhir — kalian luar biasa.",
            true
          );

          const followClickP = (time >= 4.25 && time <= 5.20) ? (time - 4.25) / 0.95 : 0;
          const isFollowing = time >= 4.62;
          const githubHL = bellCurve(time, 6.75, 7.20, 9.25, 9.65);

          let cursorPt = null, cursorA = 0;
          if (time >= 3.40 && time <= 5.25) {
            const mp = easeOutQuart(clamp((time - 3.40) / 0.85, 0, 1));
            cursorPt = { x: lerp(520, 299, mp), y: lerp(890, 782, mp) };
            cursorA = bellCurve(time, 3.40, 3.65, 4.85, 5.25);
          }

          ctx.save();
          const slideOutY = smootherstep(12.15, 12.85, time) * -140;
          ctx.translate(0, slideOutY);
          drawIGProfileCard(time, igCardAlpha, followClickP, isFollowing, githubHL, cursorPt, cursorA);
          ctx.restore();
        }

        // =====================================================================
        // PHASE B (12.60s - 26.60s): EXECUTIVE ORBITAL DROPSHIP + BOSS JULL 3D!
        // =====================================================================
        const M_HIT = 17.92, R_HIT = 20.28, A_HIT = 23.54;
        const crewBoarded = [time >= M_HIT, time >= R_HIT, time >= A_HIT];

        // Determine active hatch absorption flash
        let absorbFlash = null;
        for (const ev of [
          { t: M_HIT, col: "#6ea8fe" },
          { t: R_HIT, col: "#e07a5f" },
          { t: A_HIT, col: "#ebb343" }
        ]) {
          if (time >= ev.t && time <= ev.t + 0.55) {
            absorbFlash = { val: Math.sin(((time - ev.t) / 0.55) * Math.PI), col: ev.col };
          }
        }

        let hatchInfo = null;
        const rocketVisible = time >= 12.55 && time <= 26.65;
        let rocketY = -390;
        let hatchOpen = 0;

        if (rocketVisible) {
          const descP  = easeOutQuart(clamp((time - 12.60) / 1.55, 0, 1));
          const blastP = easeInCubic(clamp((time - 24.95) / 1.45, 0, 1));
          const hoverY = (time >= 14.10 && time < 24.95) ? Math.sin((time - 14.10) * 2.6) * 9 : 0;
          rocketY = lerp(-390, 672, descP) + hoverY - blastP * 1240;

          hatchOpen = smootherstep(13.80, 14.28, time) * (1 - smootherstep(24.30, 24.75, time));
          const thrustPower = time >= 24.80 ? lerp(0.85, 2.45, clamp((time - 24.80) / 0.65, 0, 1)) : 0.72;

          // Damped spring recoil jolt whenever a mascot dives into the airlock!
          let joltY = 0;
          for (const hitT of [M_HIT, R_HIT, A_HIT]) {
            if (time >= hitT && time < hitT + 0.55) {
              const dt = time - hitT;
              joltY += Math.sin(dt * 18.0) * Math.exp(-dt * 6.5) * 16;
            }
          }

          hatchInfo = drawOrbitalDropshipBack(W / 2, rocketY, time, thrustPower, hatchOpen, joltY, crewBoarded, absorbFlash);

          // Render 3D VOXEL BOSS JULL inside the open panoramic airlock!
          if (hatchOpen > 0.12) {
            const bossPop = softSpringOut(clamp((time - 13.92) / 0.55, 0, 1), 0.78)
                          * (1 - smootherstep(24.05, 24.42, time));
            if (bossPop > 0.02) {
              const bossShoutW = bellCurve(time, 14.20, 14.38, 16.25, 16.55);
              const bossNod = absorbFlash ? absorbFlash.val : 0;
              const bossQuads = buildBossJullQuads(time, {
                x: 0, y: lerp(-4.5, -0.5, bossPop), z: 0,
                yaw: Math.sin(time * 2.0) * 0.10,
                pitch: 0.08, roll: 0,
                scale: 0.66 * bossPop,
                shoutAmt: bossShoutW,
                mouthOpen: getLipSyncOpen(time, bossShoutW),
                waveRight: smootherstep(16.60, 17.20, time),
                coolSmirk: smootherstep(23.60, 24.05, time),
                nodBump: bossNod
              });

              ctx.save();
              ctx.beginPath();
              ctx.arc(hatchInfo.hx, hatchInfo.hy, hatchInfo.hr, 0, Math.PI * 2);
              ctx.clip();
              renderSceneQuads(bossQuads, hatchInfo.hx, hatchInfo.hy + 38, 36, 980, bossPop);
              ctx.restore();
            }
          }
        }

        // =====================================================================
        // TRIO MASCOTS 3D + KINETIC JUMP TRAILS + TRUE AIRLOCK CLIPPING!
        // =====================================================================
        const trioOriginX = W / 2;
        const trioOriginY = lerp(1245, 1385, rocketPhase);
        const trioCamDist = 38;
        const trioFov     = 960;
        const floorPt = project3DPoint(0, -6.10, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
        drawStageFloor(floorPt.y, 1 - smootherstep(24.90, 25.60, time), rocketPhase * (1 - smootherstep(24.95, 25.60, time)));

        const bowAmt   = bellCurve(time, 9.75, 10.25, 11.75, 12.25);
        const cheerAmt = bellCurve(time, 4.62, 4.90, 6.20, 6.60);
        const shockAll = bellCurve(time, 14.20, 14.38, 16.30, 16.60);
        const pointUp  = bellCurve(time, 0.90, 1.35, 4.45, 4.70);
        const endFadeAll = 1 - smootherstep(24.20, 24.50, time);

        // Compute kinetic boarding samples
        const sampleMerry = (tv) => sampleSideBoarding(tv, 16.55, 16.90, 17.80, 18.22, -11.4);
        const sampleRoger = (tv) => sampleSideBoarding(tv, 18.90, 19.26, 20.16, 20.58,  11.4);
        const sampleArto  = (tv) => sampleArtoBoarding(tv);

        const mJ = sampleMerry(time);
        const rJ = sampleRoger(time);
        const aJ = sampleArto(time);

        // Ground launch shockwaves & charge rings under each mascot!
        const mFootPt = project3DPoint(-11.4, -4.60, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
        const rFootPt = project3DPoint( 11.4, -4.60, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
        const aFootPt = project3DPoint(  0.0, -6.10, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
        drawGroundLaunchFX(mFootPt.x, floorPt.y, time, 16.90, 16.55, "#6ea8fe", "#bae6fd");
        drawGroundLaunchFX(rFootPt.x, floorPt.y, time, 19.26, 18.90, "#e07a5f", "#ffd0b8");
        drawGroundLaunchFX(aFootPt.x, floorPt.y, time, 21.66, 21.30, "#ebb343", "#fff0b3");

        // Curved luminous comet ribbons trailing behind each jumping mascot!
        drawJumpCometTrail(sampleMerry, time, 16.90, 18.22, "#6ea8fe", "#e0f2fe", trioOriginX, trioOriginY, trioCamDist, trioFov);
        drawJumpCometTrail(sampleRoger, time, 19.26, 20.58, "#e07a5f", "#ffe1cf", trioOriginX, trioOriginY, trioCamDist, trioFov);
        drawJumpCometTrail(sampleArto,  time, 21.66, 23.82, "#ebb343", "#fff6cf", trioOriginX, trioOriginY, trioCamDist, trioFov);

        // Arto's golden paintbrush swirl halo during slow-mo hero hang-time!
        if (aJ.hangAmt > 0.05 && aJ.alpha > 0.05) {
          const aHangPt = project3DPoint(aJ.wx, aJ.wy + 1.2, aJ.wz, trioOriginX, trioOriginY, trioCamDist, trioFov);
          ctx.save();
          ctx.globalAlpha = aJ.hangAmt * 0.72;
          ctx.translate(aHangPt.x, aHangPt.y);
          ctx.rotate(time * 2.8);
          ctx.strokeStyle = "#ebb343"; ctx.lineWidth = 4.0;
          ctx.shadowColor = "#ebb343"; ctx.shadowBlur = 18;
          ctx.setLineDash([48, 28]);
          ctx.beginPath(); ctx.arc(0, 0, 128, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        const baseScale = 0.76;
        const renderMascotWithOptionalHatchClip = (quads, alpha, shouldClip) => {
          if (shouldClip && hatchInfo) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(hatchInfo.hx, hatchInfo.hy, hatchInfo.hr, 0, Math.PI * 2);
            ctx.clip();
            renderSceneQuads(quads, trioOriginX, trioOriginY, trioCamDist, trioFov, alpha);
            ctx.restore();
          } else {
            renderSceneQuads(quads, trioOriginX, trioOriginY, trioCamDist, trioFov, alpha);
          }
        };

        // 1. MERRY (GEMINI · KIRI)
        if (mJ.alpha > 0.01 && endFadeAll > 0.01) {
          const mAlpha = smootherstep(0.25, 0.85, time) * mJ.alpha * endFadeAll;
          const mFloor = project3DPoint(mJ.wx, -4.60, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
          const shF = clamp(1 - mJ.wy / 24, 0, 1);
          drawFloorShadow(mFloor.x, floorPt.y, 82 * shF, 20 * shF, mAlpha * shF);

          const mQuads = buildMerryQuads(time, {
            x: mJ.wx,
            y: mJ.wy + cheerAmt * Math.abs(Math.sin(time * 11)) * 1.1 - bowAmt * 0.4,
            z: mJ.wz,
            yaw: 0.24 + mJ.spin,
            pitch: 0.05 + bowAmt * 0.52 - pointUp * 0.14 - (mJ.state === "air" ? 0.22 : 0),
            roll: mJ.state === "air" ? Math.sin(time * 22) * 0.26 : 0,
            scale: baseScale * 1.04 * mJ.sc,
            squashX: mJ.sqX, squashY: mJ.sqY,
            speakEnergy: Math.max(cheerAmt * 0.7, bellCurve(time, 16.60, 16.80, 18.00, 18.30)),
            wavePhase: Math.max(pointUp * 0.9, cheerAmt, mJ.state !== "stand" ? 1.0 : 0),
            blinkAmount: Math.abs(time - 3.1) < 0.1 ? 1 : 0,
            happyEyes: Math.max(cheerAmt, bowAmt),
            shockMode: shockAll,
            goofyMode: mJ.state !== "stand" ? 1.0 : 0,
            lookRight: pointUp * 0.6,
            excitedHop: cheerAmt * 0.6
          });
          renderMascotWithOptionalHatchClip(mQuads, mAlpha, mJ.clipHatch);
        }

        // 2. ROGER (CLAUDE · KANAN)
        if (rJ.alpha > 0.01 && endFadeAll > 0.01) {
          const rAlpha = smootherstep(0.42, 1.02, time) * rJ.alpha * endFadeAll;
          const rFloor = project3DPoint(rJ.wx, -4.60, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
          const shF = clamp(1 - rJ.wy / 24, 0, 1);
          drawFloorShadow(rFloor.x, floorPt.y, 90 * shF, 22 * shF, rAlpha * shF);

          const rQuads = buildRogerQuads(time, {
            x: rJ.wx,
            y: rJ.wy + cheerAmt * Math.abs(Math.sin(time * 11 + 1)) * 1.1 - bowAmt * 0.4,
            z: rJ.wz,
            yaw: -0.24 + rJ.spin,
            pitch: 0.05 + bowAmt * 0.52 - pointUp * 0.14 - (rJ.state === "air" ? 0.22 : 0),
            roll: rJ.state === "air" ? Math.cos(time * 20) * 0.26 : 0,
            scale: baseScale * 1.04 * rJ.sc,
            squashX: rJ.sqX, squashY: rJ.sqY,
            speakEnergy: Math.max(cheerAmt * 0.7, bellCurve(time, 18.95, 19.15, 20.35, 20.65)),
            waveLeft: Math.max(pointUp * 0.95, cheerAmt, rJ.state !== "stand" ? 1.0 : 0),
            waveRight: Math.max(cheerAmt, rJ.state !== "stand" ? 1.0 : 0),
            blinkAmount: Math.abs(time - 3.6) < 0.1 ? 1 : 0,
            happyAmount: Math.max(cheerAmt, bowAmt),
            excitedAmount: pointUp,
            shockAmount: shockAll,
            goofyAmount: rJ.state !== "stand" ? 1.0 : 0,
            lookX: pointUp > 0.2 ? -0.6 : 0,
            blushAmount: Math.max(cheerAmt * 0.8, bowAmt * 0.9, rJ.state !== "stand" ? 0.88 : 0)
          });
          renderMascotWithOptionalHatchClip(rQuads, rAlpha, rJ.clipHatch);
        }

        // 3. ARTO (PENILAI · TENGAH)
        if (aJ.alpha > 0.01 && endFadeAll > 0.01) {
          const aAlpha = smootherstep(0.32, 0.92, time) * aJ.alpha * endFadeAll;
          const aFloor = project3DPoint(aJ.wx, -6.10, 0, trioOriginX, trioOriginY, trioCamDist, trioFov);
          const shF = clamp(1 - aJ.wy / 24, 0, 1);
          drawFloorShadow(aFloor.x, floorPt.y, 102 * shF, 24 * shF, aAlpha * shF);

          let aExpr = "happy_host";
          if (shockAll > 0.35) aExpr = "panic";
          else if (time >= 21.30) aExpr = "goofy_kiss";
          else if (bowAmt > 0.35) aExpr = "happy_host";
          else if (pointUp > 0.35) aExpr = "amazed";
          else if (time >= 6.60 && time < 9.60) aExpr = "tengil";

          const aTalkW = bellCurve(time, 21.40, 21.65, 23.45, 23.75);
          const aQuads = buildArtoQuads(time, {
            x: aJ.wx,
            y: aJ.wy + cheerAmt * Math.abs(Math.sin(time * 10 + 0.5)) * 1.0 - bowAmt * 0.5,
            z: aJ.wz,
            yaw: aJ.spin + (aJ.state === "stand" ? Math.sin(time * 1.6) * 0.10 : 0),
            pitch: 0.04 + bowAmt * 0.50 - pointUp * 0.14 - (aJ.state === "air" ? 0.18 : 0),
            roll: aJ.state === "hang" ? Math.sin(time * 4.5) * 0.12 : (aJ.state === "air" ? Math.sin(time * 16) * 0.18 : 0),
            scale: baseScale * aJ.sc,
            squashX: aJ.sqX, squashY: aJ.sqY,
            expr: aExpr,
            mouthOpen: getLipSyncOpen(time, Math.max(aTalkW, cheerAmt * 0.5)),
            blinkAmount: Math.abs(time - 2.9) < 0.1 ? 1 : 0,
            monocleOn: true,
            orbitScale: (aJ.state === "air" || aJ.state === "enter") ? 0 : (aJ.state === "hang" ? 0.96 : 0.82),
            shirtTheme: ARTO_SHIRT, camDist: trioCamDist
          });
          renderMascotWithOptionalHatchClip(aQuads, aAlpha, aJ.clipHatch);
        }

        // Front Airlock Rim + Holographic Portal Ring + Absorption Bursts OVERLAY!
        if (rocketVisible && hatchInfo) {
          drawOrbitalDropshipFrontRim(hatchInfo.hx, hatchInfo.hy, hatchInfo.hr, hatchOpen, time, absorbFlash);
          drawHatchAbsorptionFX(hatchInfo.hx, hatchInfo.hy, hatchInfo.hr, time, M_HIT, "#6ea8fe", "#bae6fd");
          drawHatchAbsorptionFX(hatchInfo.hx, hatchInfo.hy, hatchInfo.hr, time, R_HIT, "#e07a5f", "#ffd0b8");
          drawHatchAbsorptionFX(hatchInfo.hx, hatchInfo.hy, hatchInfo.hr, time, A_HIT, "#ebb343", "#fff4c2");
        }

        // Blast-Off Sonic Boom Ring & Warp Streaks!
        drawBlastOffFX(W / 2, rocketY + 206, time);

        // Emote [!] kaget saat Boss Jull berteriak!
        if (shockAll > 0.05) {
          drawEmotePop(250, 1155, "!", "#6ea8fe", shockAll, time);
          drawEmotePop(540, 1125, "!", "#ebb343", shockAll, time + 0.4);
          drawEmotePop(830, 1155, "!", "#e07a5f", shockAll, time + 0.8);
        }

        // Floating Hearts & Gold Stars during Arto's slow-mo hero hang-time!
        const loveHeartsA = bellCurve(time, 21.75, 22.10, 23.35, 23.85);
        if (loveHeartsA > 0.02) {
          ctx.save();
          ctx.font = "36px 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          for (let i = 0; i < 8; i++) {
            const p = clamp((time - 21.75 - i * 0.14) / 1.35, 0, 1);
            if (p <= 0 || p >= 1) continue;
            const hx = 540 + Math.sin(i * 2.1 + p * 3.8) * (120 + (i % 3) * 45);
            const hy = 1120 - easeOutCubic(p) * 320;
            ctx.globalAlpha = loveHeartsA * (1 - p);
            ctx.fillText(i % 2 === 0 ? "❤️" : "✨", hx, hy);
          }
          ctx.restore();
        }

        // =====================================================================
        // SHOUT CALLOUTS (0% TABRAKAN! BOSS DI ATAS y=214, TRIO DI BAWAH y=1660!)
        // =====================================================================
        const bossShoutA = bellCurve(time, 14.15, 14.42, 16.20, 16.55);
        if (bossShoutA > 0.01) {
          drawShoutCallout({
            tag: "THE BOSS (JULL)  ·  DARI ROKET!",
            text1: "WOI KALIAN, CEPET BALIK!!",
            text2: "KITA ADA PROJECT LAGI!!",
            accentHex: "#ebb343",
            yCenter: 214,
            alpha: bossShoutA,
            typeProg: clamp((time - 14.25) / 1.35, 0, 1),
            time,
            shakeAmp: bellCurve(time, 14.20, 14.32, 14.65, 15.00) * 5.0
          });
        }

        const mByeA = bellCurve(time, 16.58, 16.80, 18.45, 18.78);
        if (mByeA > 0.01) {
          drawShoutCallout({
            tag: "MERRY (GEMINI)  ·  LOMPAT!!",
            text1: "EH SIAP BOSS! BYEE GUYSS!!",
            text2: "",
            accentHex: "#6ea8fe",
            yCenter: 1660,
            alpha: mByeA,
            typeProg: clamp((time - 16.66) / 1.00, 0, 1),
            time
          });
        }

        const rByeA = bellCurve(time, 18.92, 19.14, 20.80, 21.12);
        if (rByeA > 0.01) {
          drawShoutCallout({
            tag: "ROGER (CLAUDE)  ·  NYUSUL!!",
            text1: "WAIT TUNGGUIN! DADAH SEMUAA!!",
            text2: "",
            accentHex: "#e07a5f",
            yCenter: 1660,
            alpha: rByeA,
            typeProg: clamp((time - 19.00) / 1.00, 0, 1),
            time
          });
        }

        const aByeA = bellCurve(time, 21.35, 21.60, 23.85, 24.25);
        if (aByeA > 0.01) {
          drawShoutCallout({
            tag: "ARTO (PENILAI)  ·  BYE BYE ❤️",
            text1: "LOVE U PARA PENONTON,",
            text2: "SAMPAI JUMPA!!",
            accentHex: "#ebb343",
            yCenter: 1660,
            alpha: aByeA,
            typeProg: clamp((time - 21.45) / 1.40, 0, 1),
            time
          });
        }

        // =====================================================================
        // BEAT 7 (25.60s - 28.00s): CLEAN STUDIO END-CARD SETELAH ROKET MELESAT!
        // =====================================================================
        const endCardA = smootherstep(25.60, 26.35, time);
        if (endCardA > 0.01) {
          ctx.save();
          ctx.globalAlpha = endCardA;
          const cy = 920 + (1 - easeOutQuart(endCardA)) * 28;

          roundRect(ctx, W / 2 - 14, cy - 118, 28, 28, 6);
          ctx.fillStyle = "#ebb343"; ctx.fill();

          ctx.font = "900 58px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = "#f5f4f0"; ctx.textBaseline = "middle";
          fillTrackedText("JOULFIAND STUDIO", W / 2, cy - 36, 4.0, "center");

          ctx.font = "700 26px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.fillStyle = "#ebb343";
          fillTrackedText("@julljhaa  ·  github.com/rjoulfiand-afk", W / 2, cy + 32, 1.4, "center");

          roundRect(ctx, W / 2 - 220, cy + 84, 440, 50, 25);
          ctx.fillStyle = "rgba(235, 179, 67, 0.12)"; ctx.fill();
          ctx.lineWidth = 1.4; ctx.strokeStyle = "rgba(235, 179, 67, 0.55)"; ctx.stroke();

          ctx.font = "700 16px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#e6e5e0";
          fillTrackedText("SEE YOU IN THE NEXT PROJECT  ·  1 SHOT", W / 2, cy + 110, 1.6, "center");
          ctx.restore();
        }

        // 4. FOOTER EDITORIAL PERSISTEN
        const footY = 1834;
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#6e6d68";
        const mm = String(Math.floor(time)).padStart(2, "0");
        const ff = String(Math.floor((time % 1) * FPS)).padStart(2, "0");
        fillTrackedText(`00:${mm}:${ff}`, 48, footY, 1.2, "left");
        ctx.fillStyle = "#ebb343"; ctx.fillRect(152, footY - 4, 7, 7);
        ctx.fillStyle = "#6e6d68"; fillTrackedText("120 BPM", 172, footY, 1.2, "left");
        fillTrackedText("1080×1920  ·  30FPS", W - 48, footY, 1.2, "right");

        ctx.restore();
      }

      window.drawFrame = drawFrame;
      window.DURATION = DURATION;
      window.TOTAL_FRAMES = TOTAL_FRAMES;

      let currentTime = Number(params.get("t") ?? 0);
      let isPlaying = !isHeadless;
      let startStamp = performance.now();

      const slider = document.getElementById("slider");
      const timeLabel = document.getElementById("timeLabel");
      const btnPlay = document.getElementById("btnPlay");

      function updateView(sec) {
        currentTime = clamp(sec, 0, DURATION);
        drawFrame(currentTime);
        if (slider) slider.value = Math.min(TOTAL_FRAMES - 1, Math.floor(currentTime * FPS));
        if (timeLabel) timeLabel.textContent = `${currentTime.toFixed(2).padStart(5, "0")} / ${DURATION.toFixed(2)} s`;
      }

      if (!isHeadless) {
        const jump = (s) => { isPlaying = false; updateView(s); };
        document.getElementById("b1").onclick = () => jump(3.50);
        document.getElementById("b2").onclick = () => jump(5.20);
        document.getElementById("b3").onclick = () => jump(8.00);
        document.getElementById("b4").onclick = () => jump(10.80);
        document.getElementById("b5").onclick = () => jump(15.00);
        document.getElementById("b6").onclick = () => jump(17.50);
        document.getElementById("b7").onclick = () => jump(19.90);
        document.getElementById("b8").onclick = () => jump(22.60);
        document.getElementById("b9").onclick = () => jump(26.00);

        slider.max = TOTAL_FRAMES - 1;
        slider.oninput = () => { isPlaying = false; updateView(Number(slider.value) / FPS); };

        btnPlay.onclick = () => {
          isPlaying = !isPlaying;
          if (isPlaying) {
            if (currentTime >= DURATION - 0.1) currentTime = 0;
            startStamp = performance.now() - currentTime * 1000;
            requestAnimationFrame(tick);
          }
        };

        function tick(now) {
          if (!isPlaying) return;
          const elapsed = (now - startStamp) / 1000;
          if (elapsed >= DURATION) {
            updateView(DURATION - 0.01);
            isPlaying = false;
            return;
          }
          updateView(elapsed);
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      } else {
        updateView(0);
      }
    })();
  </script>
</body>
</html>
