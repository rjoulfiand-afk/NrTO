<!DOCTYPE html>
<html lang="id">
<head>
  <script src="cues.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>Joulfiand Studio — Final Showcase (70s Script Synced)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #09090b;
      color: #f4f3ef;
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage {
      height: calc(100vh - 64px);
      aspect-ratio: 9 / 16;
      display: block;
      background: #0f0f11;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9);
    }
    #controls {
      height: 58px;
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      background: #141417;
      border-top: 1px solid #242429;
      width: 100%;
      font-size: 11px;
      flex-wrap: wrap;
      z-index: 10;
    }
    button {
      background: #1e1e24;
      color: #e6e5e0;
      border: 1px solid #32323a;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #2b2b33;
      border-color: #4a4a55;
    }
    button.primary {
      background: #ebb343;
      color: #0e0e10;
      border-color: #ebb343;
      font-weight: 700;
    }
    button.primary:hover {
      background: #ffd066;
    }
    input[type="range"] {
      width: 150px;
      cursor: pointer;
      accent-color: #ebb343;
    }
    #timeLabel {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #ebb343;
      font-weight: 700;
      min-width: 115px;
      text-align: right;
    }
    body.headless {
      width: 1080px;
      height: 1920px;
      display: block;
    }
    body.headless #stage {
      width: 1080px !important;
      height: 1920px !important;
      box-shadow: none;
    }
    body.headless #controls {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Kanvas 2x Supersampled (2160x3840 -> 1080x1920) -->
  <canvas id="stage" width="2160" height="3840"></canvas>

    <div id="controls">
    <button id="btnPlay" class="primary">Play / Pause</button>
    <button id="b1">1. Intro (1s)</button>
    <button id="b2">2. Duel (6s)</button>
    <button id="b3">3. Claude Scan (11s)</button>
    <button id="b4">4. Gemini Argon (20s)</button>
    <button id="b5">5. ERD Matrix (28s)</button>
    <button id="b6">6. Showdown (33.5s)</button>
    <button id="b7">7. Soal / Prompt (38.5s)</button>
    <button id="b8">8. Iris Syarat (53s)</button>
    <button id="b9">9. Kirim (62s)</button>
    <button id="b10">10. 1× Kirim (66.5s)</button>
    <button id="b11">11. P2: X-Ray (74s)</button>
    <button id="b12">12. P2: Iris Fakta (77.5s)</button>
    <button id="b13">13. P2: Audit 16W (81.8s)</button>
    <button id="b14">14. P2: LETSGO!! (85.8s)</button>
    <button id="b15">15. P3: Senja (89.5s)</button>
    <button id="b16">16. P3: Liftoff (93.5s)</button>
    <button id="b17">17. P3: Orbit (98s)</button>
    <input id="slider" type="range" min="0" max="2999" value="0" />
    <span id="timeLabel">00.00 / 100.00 s</span>
  </div>

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const isHeadless = params.has("headless") || params.has("render");
      if (isHeadless) {
        document.body.classList.add("headless");
      }

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: false });

      const W = 1080;
      const H = 1920;
      const SSAA = 2;
      const FPS = 30;
      const DURATION = 100.00; // Sinkron 100% dengan Naskah Dialog
      const TOTAL_FRAMES = 3000; // 2100 frame

      const LEFT_COL_X = 48;
      const RIGHT_COL_X = 564;
      const COL_W = 468;
      const LEFT_BOX  = { x: 48,  y: 464, w: 468, h: 832 };
      const RIGHT_BOX = { x: 564, y: 464, w: 468, h: 832 };

      const SHADOW_CODE_CLAUDE = [
        "import { W, H, FPS, T } from './timeline.js';",
        "const fb = new Uint8Array(W * H);",
        "export function drawFrame(t) {",
        "  const f = Math.round(t * FPS);",
        "  const c = cam(f / FPS), sh = shake(t, f);",
        "  for (let y = 0; y < H; y++) {",
        "    const ay = GROUND - y + c;",
        "    for (let x = 0; x < W; x++) {",
        "      fb[y * W + x] = skyIndex(ay, x, ay);",
        "    }",
        "  }",
        "  drawStars(fb, t, f, c);",
        "  drawPlanet(fb, t, LIGHT_VEC);",
        "  if (t >= T.liftoff) drawTrail(fb, t, c, sh);",
        "  drawRocket(fb, rocketPose(t), flameLength(t, f), f, sh);",
        "  drawCountdown(fb, t, f);",
        "  drawMission(fb, t, f);",
        "  return Uint32Array.from(fb, idx => RGBA32[idx]);",
        "}",
        "export function vnoise(x, y, seed = 0) {",
        "  const xi = Math.floor(x), yi = Math.floor(y);",
        "  const u = (x - xi) * (x - xi) * (3 - 2 * (x - xi));",
        "  return lerp(lerp(h00, h10, u), lerp(h01, h11, u), v);",
        "}"
      ];

      const SHADOW_CODE_GEMINI = [
        "const PALETTE_16 = Object.freeze([",
        "  '#0b0c10', '#141b33', '#24345c', '#3b2d54',",
        "  '#7a305c', '#c94a38', '#eb7b34', '#f7b545',",
        "  '#ffee83', '#f4f6f8', '#b8c4d4', '#6f7f94'",
        "]);",
        "function renderTwoStageRocket(ctx, rx, ry, t, sep) {",
        "  const shake = Math.sin(t * 115) * (1 - smoothstep(4.5, 7.2, t));",
        "  if (sep && t < 8.2) {",
        "    const dropY = ry + 26 + Math.pow(t - 6.0, 2) * 95;",
        "    drawBoosterStage1(ctx, rx - (t - 6.0) * 14, dropY);",
        "  }",
        "  drawVacuumPlume(ctx, rx + shake, ry - 22, t);",
        "  drawCapsuleBody(ctx, rx + shake, ry - 52, PALETTE_16);",
        "  if (t > 6.1 && t < 8.1) triggerRCSThrusters(ctx, rx, ry, t);",
        "}",
        "async function synthesizeChiptuneWAV(sampleRate = 44100) {",
        "  const pcm16 = new Int16Array(sampleRate * 12);",
        "  for (let i = 0; i < pcm16.length; i++) {",
        "    pcm16[i] = mixLeadSquare(i) + mixTurbineSweep(i);",
        "  }",
        "  return encodeRIFFHeader(pcm16, sampleRate);",
        "}"
      ];

      const PROMPT_LINES = [
        "Buat video animasi pixel art vertikal berdurasi",
        "12 detik, sepenuhnya dari kode.",
        "",
        "Tema: peluncuran roket kecil dari bumi ke orbit.",
        "",
        "Struktur 3 adegan:",
        "1. (0-4 dtk) Landasan peluncuran saat senja.",
        "Hitung mundur 3-2-1 sebagai teks pixel di layar.",
        "Asap kecil keluar dari dasar roket.",
        "2. (4-8 dtk) Roket lepas landas. Kamera mengikuti",
        "ke atas, langit berubah dari oranye ke biru tua",
        "lalu hitam. Bintang mulai muncul.",
        "3. (8-12 dtk) Roket mencapai orbit. Planet besar",
        "di latar, bintang berkelip, teks pixel \"MISSION",
        "START\" muncul dengan efek ketik.",
        "",
        "Ketentuan teknis:",
        "- Murni HTML Canvas 2D, tanpa library, gambar,",
        "  atau aset eksternal.",
        "- Resolusi internal 270x480, ditampilkan 1080x1920",
        "  dengan nearest-neighbor (piksel tajam, tidak blur).",
        "- 30 fps, 360 frame. Semua animasi digerakkan oleh",
        "  waktu (fungsi drawFrame(t)) supaya hasil render",
        "  konsisten setiap dijalankan.",
        "- Render frame demi frame dengan Playwright headless",
        "  Chromium, lalu gabungkan jadi MP4 dengan ffmpeg.",
        "- Palet warna terbatas (maksimal 16 warna) dan",
        "  konsisten antar adegan.",
        "- Tambahkan musik latar sederhana dan efek suara",
        "  peluncuran yang dibuat dari kode, lalu gabungkan",
        "  ke video.",
        "",
        "Keluaran akhir: file source code siap render dan",
        "petunjuk cara menjalankannya.",
        "Jalankan sendiri, periksa hasilnya, dan perbaiki",
        "jika ada error sebelum menyerahkan."
      ];

      // Perhitungan timestamp pengetikan santai (38.60s - 49.50s)
      const LINE_CHAR_OFFSETS = [];
      const CHAR_REL_WEIGHTS = [];
      let totalPromptChars = 0;

      function pseudoRand(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      for (let i = 0; i < PROMPT_LINES.length; i++) {
        LINE_CHAR_OFFSETS.push(totalPromptChars);
        const line = PROMPT_LINES[i];
        for (let c = 0; c < line.length; c++) {
          const ch = line[c];
          let w = 0.90 + pseudoRand(totalPromptChars + c * 7) * 0.45;
          if (ch === " ") w += 0.85;
          else if (ch === "," || ch === "-" || ch === "(" || ch === ")") w += 2.2;
          else if (ch === ":" || ch === ".") w += 3.8;
          if (i >= 16) w *= 0.78;
          CHAR_REL_WEIGHTS.push(w);
          totalPromptChars++;
        }
        const lineBreakWeight = line.length === 0 ? 5.2 : (line.endsWith(":") || line.endsWith(".") ? 3.8 : 1.4);
        CHAR_REL_WEIGHTS.push(lineBreakWeight);
        totalPromptChars++;
      }

      const PAGE1_TYPING_START = 38.60;
      const PAGE1_TYPING_END   = 49.50;
      const CHAR_TIMESTAMPS = new Float32Array(totalPromptChars);
      let sumWeights = 0;
      for (let i = 0; i < totalPromptChars; i++) sumWeights += CHAR_REL_WEIGHTS[i];
      let accWeight = 0;
      for (let i = 0; i < totalPromptChars; i++) {
        accWeight += CHAR_REL_WEIGHTS[i];
        CHAR_TIMESTAMPS[i] = PAGE1_TYPING_START + (accWeight / sumWeights) * (PAGE1_TYPING_END - PAGE1_TYPING_START);
      }

      function getExactTypedChars(time) {
        if (time <= PAGE1_TYPING_START) return 0;
        if (time >= PAGE1_TYPING_END) return totalPromptChars;
        let lo = 0, hi = totalPromptChars - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (CHAR_TIMESTAMPS[mid] < time) lo = mid + 1;
          else hi = mid;
        }
        const tPrev = lo > 0 ? CHAR_TIMESTAMPS[lo - 1] : PAGE1_TYPING_START;
        const tCurr = CHAR_TIMESTAMPS[lo];
        const frac = Math.max(0, Math.min(1, (time - tPrev) / Math.max(0.0001, tCurr - tPrev)));
        return lo + frac;
      }

      // 5 POIN PENTING IRIS SCANNER SESUAI NASKAH BINTANG USER
      const SCAN_TARGETS = [
        { line: 0,  phrase: "animasi pixel art", tag: "VISUAL",   tLock: 52.80 },
        { line: 1,  phrase: "12 detik",          tag: "DURASI",   tLock: 54.40 },
        { line: 3,  phrase: "bumi ke orbit",     tag: "TEMA",     tLock: 56.00 },
        { line: 17, phrase: "HTML Canvas 2D",    tag: "ENGINE",   tLock: 57.60 },
        { line: 19, phrase: "270x480",           tag: "RESOLUSI", tLock: 59.40 }
      ];

      // --- Matematika & Easing ---
      const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (a, b, x) => {
        const k = clamp((x - a) / (b - a), 0, 1);
        return k * k * (3 - 2 * k);
      };
      const smootherstep = (a, b, x) => {
        const k = clamp((x - a) / (b - a), 0, 1);
        return k * k * k * (k * (k * 6 - 15) + 10);
      };
      const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const easeInOutCubic = (x) => {
        const k = clamp(x, 0, 1);
        return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      };
      function softBounceOut(x, overshoot = 1.15) {
        const k = clamp(x, 0, 1);
        const c1 = overshoot;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
      }

      function roundRect(ctx, x, y, w, h, r) {
        const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.lineTo(x + w - rad, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
        ctx.lineTo(x + w, y + h - rad);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        ctx.lineTo(x + rad, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
        ctx.lineTo(x, y + rad);
        ctx.quadraticCurveTo(x, y, x + rad, y);
        ctx.closePath();
      }

      function drawCrosshair(x, y, size, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x - size, y - 0.5, size * 2 + 1, 1);
        ctx.fillRect(x - 0.5, y - size, 1, size * 2 + 1);
      }

      function fillTrackedText(text, x, y, tracking, align = "left") {
        const chars = String(text).split("");
        let totalW = 0;
        const widths = chars.map((ch) => {
          const w = ctx.measureText(ch).width;
          totalW += w;
          return w;
        });
        totalW += tracking * Math.max(0, chars.length - 1);

        let curX = x;
        if (align === "right") curX = x - totalW;
        else if (align === "center") curX = x - totalW / 2;

        ctx.textAlign = "left";
        for (let i = 0; i < chars.length; i++) {
          ctx.fillText(chars[i], curX, y);
          curX += widths[i] + tracking;
        }
        return totalW;
      }

      function drawClaudeWheelLogo(cx, cy, radius, angleRad, color = "#e07a5f", alpha = 1.0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(cx, cy);
        ctx.rotate(angleRad);

        const numSpokes = 12;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2.5, radius * 0.16);
        ctx.lineCap = "round";

        for (let i = 0; i < numSpokes; i++) {
          const a = (i / numSpokes) * Math.PI * 2;
          const innerR = radius * 0.22;
          const outerR = (i % 2 === 0) ? radius : radius * 0.82;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
          ctx.lineTo(Math.cos(a) * outerR, Math.sin(a) * outerR);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.24, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

      function drawGeminiSparkleLogo(cx, cy, radius, angleRad, alpha = 1.0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(cx, cy);
        ctx.rotate(angleRad);

        const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
        grad.addColorStop(0, "#6ea8fe");
        grad.addColorStop(0.55, "#8b5cf6");
        grad.addColorStop(1, "#38bdf8");

        ctx.beginPath();
        ctx.moveTo(0, -radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.quadraticCurveTo(0, 0, 0, radius);
        ctx.quadraticCurveTo(0, 0, -radius, 0);
        ctx.quadraticCurveTo(0, 0, 0, -radius);
        ctx.closePath();

        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(110, 168, 254, 0.55)";
        ctx.shadowBlur = 22;
        ctx.fill();
        ctx.restore();
      }

      function drawCursorArrow(x, y, scale = 1.0, alpha = 1.0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 5;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 35);
        ctx.lineTo(8.8, 27.2);
        ctx.lineTo(14.8, 40);
        ctx.lineTo(20.5, 37.5);
        ctx.lineTo(14.5, 24.5);
        ctx.lineTo(25.5, 24.5);
        ctx.closePath();

        ctx.fillStyle = "#111215";
        ctx.fill();
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = "#f4f3ef";
        ctx.stroke();
        ctx.restore();
      }

      function drawModelBadge(x, y, w, h, accentHex, brandName, versionText, entranceProg) {
        if (entranceProg === undefined) entranceProg = 1;
        if (entranceProg <= 0.01) return;
        ctx.save();
        const ease = easeOutCubic(entranceProg);
        ctx.globalAlpha *= clamp(entranceProg * 1.6, 0, 1);
        ctx.translate(0, (1 - ease) * -24);

        roundRect(ctx, x, y, w, h, 10);
        ctx.fillStyle = "#151518";
        ctx.fill();

        ctx.lineWidth = 1.25;
        ctx.strokeStyle = "#26262c";
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
        ctx.fillRect(x + 12, y + 1, w - 24, 1);

        const dotSize = 13;
        const dotX = x + 22;
        const dotY = y + (h - dotSize) / 2;
        roundRect(ctx, dotX, dotY, dotSize, dotSize, 3.5);
        ctx.fillStyle = accentHex;
        ctx.fill();

        ctx.font = "800 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = accentHex;
        ctx.textBaseline = "middle";
        const brandX = dotX + dotSize + 13;
        const brandW = fillTrackedText(brandName, brandX, y + h / 2 + 0.5, 1.2, "left");

        ctx.font = "500 19px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#8e8d88";
        ctx.fillText(versionText, brandX + brandW + 14, y + h / 2 + 0.5);
        ctx.restore();
      }

      function drawIrisScannerBox(x, y, w, h, tagText, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= alpha;

        ctx.shadowColor = "rgba(235, 179, 67, 0.28)";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "rgba(235, 179, 67, 0.18)";
        ctx.fillRect(x, y, w, h);
        ctx.shadowColor = "transparent";

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        ctx.strokeStyle = "rgba(255, 246, 205, 0.32)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 10, y + h);
        ctx.lineTo(x + 24, y);
        ctx.stroke();
        ctx.restore();

        ctx.strokeStyle = "#ebb343";
        ctx.lineWidth = 1.6;
        ctx.strokeRect(x, y, w, h);

        const nodeSize = 7;
        const outerCorners = [
          { cx: x - nodeSize, cy: y - nodeSize },
          { cx: x + w,        cy: y - nodeSize },
          { cx: x - nodeSize, cy: y + h },
          { cx: x + w,        cy: y + h }
        ];

        for (let i = 0; i < outerCorners.length; i++) {
          const oc = outerCorners[i];
          ctx.fillStyle = "#141418";
          ctx.fillRect(oc.cx, oc.cy, nodeSize, nodeSize);
          ctx.strokeStyle = "#ffe07d";
          ctx.lineWidth = 1.6;
          ctx.strokeRect(oc.cx, oc.cy, nodeSize, nodeSize);
        }

        if (tagText) {
          ctx.font = "800 13px ui-monospace, 'Cascadia Code', Consolas, monospace";
          const tagW = ctx.measureText(tagText).width + 16;
          const tagH = 21;
          const tagX = x;
          const tagY = y - nodeSize - tagH - 3;

          roundRect(ctx, tagX, tagY, tagW, tagH, 4);
          ctx.fillStyle = "#ebb343";
          ctx.fill();

          ctx.fillStyle = "#0e0e10";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(tagText, tagX + 8, tagY + tagH / 2 + 0.5);
        }

        ctx.restore();
      }

      function drawAICodeBoardSequence(opts) {
        const {
          brand, accentHex, accentDim, codeLines, initModel, targetModel,
          revealProg, scrollProg, dropdownOpenProg, modelSelected,
          sendClickProg, flyToCenterProg, cursorPos, revealMode
        } = opts;

        const baseX = 64;
        const baseY = 540;
        const fullW = W - 128;
        const fullH = 680;

        const flyEase = easeInOutCubic(flyToCenterProg);
        const boxW = lerp(fullW * (revealMode === "wheel" ? revealProg : 1), 320, flyEase);
        const boxH = lerp(fullH * (revealMode === "starburst" ? revealProg : 1), 110, flyEase);
        const boxX = revealMode === "wheel"
          ? lerp(baseX, (W - boxW) / 2, flyEase)
          : (W - boxW) / 2;
        const boxY = lerp(baseY, (H - boxH) / 2, flyEase);

        const boardAlpha = clamp(revealProg * 2.5, 0, 1) * (1 - smoothstep(0.75, 1.0, flyToCenterProg));

        if (boardAlpha > 0.01 && boxW > 20 && boxH > 20) {
          ctx.save();
          ctx.globalAlpha = boardAlpha;

          ctx.shadowColor = accentDim;
          ctx.shadowBlur = 36;
          roundRect(ctx, boxX, boxY, boxW, boxH, 14);
          ctx.fillStyle = "#131317";
          ctx.fill();
          ctx.shadowColor = "transparent";

          ctx.lineWidth = 1.8;
          ctx.strokeStyle = accentHex;
          ctx.stroke();

          ctx.beginPath();
          roundRect(ctx, boxX + 2, boxY + 2, Math.max(1, boxW - 4), Math.max(1, boxH - 4), 12);
          ctx.clip();

          ctx.fillStyle = "#18181e";
          ctx.fillRect(boxX, boxY, boxW, 56);
          ctx.fillStyle = "#262630";

        rect(20, gy - 6, 24, 6, PAL.DARK_SLATE);
        // Pipa saluran bahan bakar menuju landasan
        rect(44, gy - 8, 45, 3, PAL.MID_SLATE);
        rect(44, gy - 8, 45, 1, PAL.LIGHT_STEEL);

        // Tanah utama kompleks
        rect(0, gy, W, H - gy + 150, PAL.CHARCOAL);
        rect(0, gy, W, 3, PAL.DARK_SLATE);
        // Garis hazard kuning-hitam di tepi landasan
        for (let hx = 60; hx < 205; hx += 8) {
          rect(hx, gy + 1, 4, 2, PAL.SOLAR_GOLD);
        }

        // Bunker & Parit Api (Flame Trench)
        rect(68, gy - 14, 134, 14, PAL.DARK_SLATE);
        rect(78, gy - 18, 114, 4, PAL.MID_SLATE);
        rect(108, gy - 12, 54, 12, PAL.VOID_BLACK);

        // Dudukan Pad Peluncuran
        rect(96, gy - 22, 78, 6, PAL.MID_SLATE);
        rect(100, gy - 22, 70, 2, PAL.LIGHT_STEEL);

        // Menara Penangkal Petir di sisi kanan pad
        rect(184, gy - 92, 2, 78, PAL.DARK_SLATE);
        rect(185, gy - 102, 1, 10, PAL.LIGHT_STEEL);
        if (Math.floor(t * 5) % 2 === 0) {
          rect(184, gy - 104, 3, 2, PAL.MARS_RED);
        }

        // Menara Umbilical Utama (Kiri)
        const tx = 72;
        const towerTop = gy - 122;
        rect(tx, towerTop, 4, 108, PAL.MID_SLATE);
        rect(tx + 18, towerTop, 4, 108, PAL.MID_SLATE);
        rect(tx + 1, towerTop, 2, 108, PAL.LIGHT_STEEL);

        for (let ty = towerTop + 4; ty < gy - 20; ty += 12) {
          rect(tx, ty, 22, 2, PAL.DARK_SLATE);
          drawPixelLine(tx + 3, ty + 2, tx + 18, ty + 11, PAL.DARK_SLATE);
          drawPixelLine(tx + 18, ty + 2, tx + 3, ty + 11, PAL.DARK_SLATE);
        }

        // 3 Lengan Penyangga Umbilical (Membuka saat t > 3.0)
        const armRatio = 1.0 - clamp(umbilicalRetract, 0, 1);
        const armLen = Math.floor(42 * armRatio);
        if (armLen > 2) {
          const armHeights = [gy - 94, gy - 72, gy - 48];
          for (let a = 0; a < armHeights.length; a++) {
            const ay = armHeights[a];
            rect(tx + 22, ay, armLen, 3, PAL.MID_SLATE);
            rect(tx + 22, ay, armLen, 1, PAL.LIGHT_STEEL);
          }
        }

        // Percikan bunga api pelepasan klem saat lepas landas (3.1 < t < 3.8)
        if (umbilicalRetract > 0.05 && umbilicalRetract < 0.85) {
          for (let s = 0; s < 10; s++) {
            const ang = hash(s * 11 + Math.floor(t * 30)) * Math.PI * 2;
            const dist = 4 + hash(s * 7 + Math.floor(t * 30)) * 18;
            const sx = 114 + Math.cos(ang) * dist;
            const sy = gy - 70 + Math.sin(ang) * dist;
            rect(sx, sy, 2, 2, (s % 2 === 0) ? PAL.STAR_YELLOW : PAL.SOLAR_GOLD);
          }
        }

        // Lampu suar menara
        rect(tx + 8, towerTop - 5, 6, 5, PAL.DARK_SLATE);
        const blink = Math.floor(t * 4) % 2 === 0;
        rect(tx + 9, towerTop - 8, 4, 3, blink ? PAL.STAR_YELLOW : PAL.MARS_RED);
      }

      // =========================================================================
      // ROKET 2 TINGKAT (MENDUKUNG PEMISAHAN BOOSTER & RCS THRUSTER)
      // =========================================================================
      function drawTwoStageRocket(rx, ry, t, thrustLevel, separated, sepTime, rcsLeft, rcsRight) {
        const x = Math.floor(rx);
        const y = Math.floor(ry); // Posisi dasar stage aktif (atau dasar booster jika belum pisah)

        // Jika sudah terpisah (Stage Separation pada t >= 6.0), gambar Booster Tahap 1 yang jatuh ke bawah
        if (separated && sepTime > 0 && sepTime < 2.2) {
          const dropY = y + 26 + Math.floor(sepTime * sepTime * 95);
          const driftX = x - Math.floor(sepTime * 14);
          if (dropY - 30 < H) {
            // Badan Booster Tahap 1 yang jatuh
            rect(driftX - 11, dropY - 26, 22, 22, PAL.LIGHT_STEEL);
            rect(driftX + 4, dropY - 26, 7, 22, PAL.MID_SLATE);
            rect(driftX - 11, dropY - 26, 22, 4, PAL.CHARCOAL);
            // Sirip Booster
            for (let i = 0; i < 14; i++) {
              const fw = Math.floor((14 - i) * 0.65) + 2;
              rect(driftX - 11 - fw, dropY - 6 - i, fw, 1, PAL.MARS_RED);
              rect(driftX + 11, dropY - 6 - i, fw, 1, PAL.MARS_RED);
            }
            rect(driftX - 6, dropY - 4, 12, 4, PAL.DARK_SLATE);

            // Kepulan asap dingin pelepasan stage
            if (sepTime < 0.7) {
              const ringW = Math.floor(14 + sepTime * 55);
              rect(x - Math.floor(ringW / 2), y - 22, ringW, 3, PAL.PURE_WHITE);
              circle(x - Math.floor(ringW * 0.4), y - 21, 4, PAL.STAR_YELLOW);
              circle(x + Math.floor(ringW * 0.4), y - 21, 4, PAL.STAR_YELLOW);
            }
          }
        }

        // Posisi dasar kapsul atas (Stage 2)
        const stage2BaseY = separated ? (y - 22) : (y - 24);

        // --- A. SEMBURAN API MESIN ---
        if (thrustLevel > 0) {
          const flicker = Math.floor(hash(Math.floor(t * 60)) * 8);
          if (!separated) {
            // Api Booster Tahap 1 (Atmosfer: Besar, Merah-Oranye-Emas)
            const flameLen = Math.floor((22 + flicker) * thrustLevel);
            const flameW = Math.max(4, Math.floor(15 * thrustLevel));
            rect(x - Math.floor(flameW / 2), y, flameW, Math.floor(flameLen * 0.78), PAL.MARS_RED);
            rect(x - Math.floor(flameW / 2) + 2, y + 2, flameW - 4, Math.floor(flameLen * 0.92), PAL.SUNSET_ORANGE);
            rect(x - Math.floor(flameW * 0.35), y, Math.floor(flameW * 0.7), Math.floor(flameLen * 0.65), PAL.SOLAR_GOLD);
            rect(x - 3, y, 6, Math.floor(flameLen * 0.42), PAL.STAR_YELLOW);
            rect(x - 2, y, 4, Math.floor(flameLen * 0.22), PAL.PURE_WHITE);
          } else {
            // Api Mesin Vakum Tahap 2 (Angkasa: Runcing & Bersih, Kuning-Putih-Hijau Toska)
            const vacLen = Math.floor((16 + flicker * 0.6) * thrustLevel);
            const vacW = Math.max(4, Math.floor(10 * thrustLevel));
            rect(x - Math.floor(vacW / 2), stage2BaseY + 3, vacW, Math.floor(vacLen * 0.7), PAL.ORBIT_TEAL);
            rect(x - Math.floor(vacW * 0.35), stage2BaseY + 3, Math.floor(vacW * 0.7), Math.floor(vacLen * 0.85), PAL.SOLAR_GOLD);
            rect(x - 2, stage2BaseY + 3, 4, Math.floor(vacLen * 0.55), PAL.STAR_YELLOW);
            rect(x - 1, stage2BaseY + 3, 2, Math.floor(vacLen * 0.35), PAL.PURE_WHITE);
          }
        }

        // --- B. BOOSTER TAHAP 1 (Jika belum terpisah) ---
        if (!separated) {
          // Nozzle utama
          rect(x - 6, y - 5, 12, 3, PAL.DARK_SLATE);
          rect(x - 8, y - 2, 16, 2, PAL.MID_SLATE);

          // Sirip aerodinamis kiri & kanan
          for (let i = 0; i < 16; i++) {
            const fw = Math.floor((16 - i) * 0.65) + 2;
            rect(x - 11 - fw, y - 6 - i, fw, 1, PAL.MARS_RED);
            rect(x + 11, y - 6 - i, fw, 1, PAL.MARS_RED);
          }
          rect(x - 13, y - 20, 2, 12, PAL.SUNSET_ORANGE);
          rect(x - 2, y - 20, 4, 15, PAL.MARS_RED);

          // Tabung Booster Bawah (y-25 s/d y-5)
          rect(x - 11, y - 25, 22, 20, PAL.PURE_WHITE);
          rect(x + 4, y - 25, 7, 20, PAL.LIGHT_STEEL);
          rect(x + 8, y - 25, 3, 20, PAL.MID_SLATE);

          // Cincin Interstage Checkerboard (y-29 s/d y-25)
          rect(x - 11, y - 29, 22, 4, PAL.CHARCOAL);
          for (let cx = -10; cx < 10; cx += 4) {
            rect(x + cx, y - 29, 2, 2, PAL.PURE_WHITE);
            rect(x + cx + 2, y - 27, 2, 2, PAL.PURE_WHITE);
          }
        } else {
          // Nozzle Mesin Vakum Stage 2
          rect(x - 5, stage2BaseY, 10, 3, PAL.DARK_SLATE);
          rect(x - 6, stage2BaseY + 2, 12, 2, PAL.MID_SLATE);
          // Sirip kecil pengarah orbit Stage 2
          rect(x - 14, stage2BaseY - 8, 3, 7, PAL.MARS_RED);
          rect(x + 11, stage2BaseY - 8, 3, 7, PAL.MARS_RED);
        }

        // --- C. KAPSUL UTAMA TAHAP 2 (y-52 s/d y-29) ---
        const topBodyY = y - 52;
        const bodyH = separated ? 30 : 23;
        rect(x - 11, topBodyY, 22, bodyH, PAL.PURE_WHITE);
        rect(x + 4, topBodyY, 7, bodyH, PAL.LIGHT_STEEL);
        rect(x + 8, topBodyY, 3, bodyH, PAL.MID_SLATE);
        rect(x - 11, topBodyY + 2, 22, 3, PAL.MARS_RED);

        // Jendela Porthole Kosmonot
        circle(x, y - 39, 6, PAL.DARK_SLATE);
        circle(x, y - 39, 4, PAL.TWILIGHT_BLUE);
        rect(x - 2, y - 41, 2, 2, PAL.MISSION_GREEN);
        rect(x - 1, y - 42, 1, 1, PAL.PURE_WHITE);

        // Kerucut Hidung (Nosecone: y-72 s/d y-52)
        for (let i = 0; i < 20; i++) {
          const halfW = Math.max(1, Math.floor(((20 - i) / 20) * 11));
          const rowY = y - 53 - i;
          rect(x - halfW, rowY, halfW * 2, 1, PAL.MARS_RED);
          if (halfW > 3) {
            rect(x - halfW + 1, rowY, 2, 1, PAL.SUNSET_ORANGE);
            rect(x + halfW - 3, rowY, 3, 1, PAL.CRIMSON_DUSK);
          }
        }

        // Antena Sensor Pucuk
        rect(x - 1, y - 78, 2, 6, PAL.LIGHT_STEEL);
        rect(x - 1, y - 79, 2, 2, (Math.floor(t * 6) % 2 === 0) ? PAL.STAR_YELLOW : PAL.MARS_RED);

        // --- D. SEMBURAN GAS RCS (REACTION CONTROL SYSTEM) DI SAMPING ROKET ---
        if (rcsLeft) {
          rect(x - 18, y - 48, 6, 2, PAL.PURE_WHITE);
          rect(x - 22, y - 49, 4, 4, PAL.LIGHT_STEEL);
        }
        if (rcsRight) {
          rect(x + 12, y - 48, 6, 2, PAL.PURE_WHITE);
          rect(x + 18, y - 49, 4, 4, PAL.LIGHT_STEEL);
        }
      }

      // Menggambar efek kerucut menembus batas kecepatan suara (Max-Q Vapor Cone)
      function drawMachCone(rx, ry, alpha) {
        if (alpha <= 0.05) return;
        const x = Math.floor(rx);
        const y = Math.floor(ry - 56);
        for (let i = 0; i < 18; i++) {
          const spread = Math.floor(i * 1.45);
          const py = y + i;
          if ((i + Math.floor(alpha * 10)) % 2 === 0) {
            rect(x - spread - 2, py, 3, 1, PAL.PURE_WHITE);
            rect(x + spread, py, 3, 1, PAL.LIGHT_STEEL);
          }
        }
      }

      // Menggambar kepulan asap
      function drawSmokePuffs(t, rocketX, nozzleY, intensity, isLiftoff) {
        if (intensity <= 0.02) return;
        const numParticles = isLiftoff ? 40 : 26;
        for (let i = 0; i < numParticles; i++) {
          const cycle = isLiftoff ? 1.05 : 1.7;
          const localT = (t * (isLiftoff ? 2.3 : 1.3) + i * (cycle / numParticles)) % cycle;
          const progress = localT / cycle;

          const dir = (i % 2 === 0) ? 1 : -1;
          const randSpread = 0.4 + hash(i * 19 + 7) * 0.9;

          let px, py, radius;
          if (!isLiftoff) {
            px = rocketX + dir * (6 + progress * 52 * randSpread * intensity);
            py = nozzleY + 2 - Math.sin(progress * Math.PI) * 9 - progress * 12 * intensity;
            radius = Math.floor((3 + progress * 7) * intensity);
          } else {
            px = rocketX + dir * (3 + Math.pow(progress, 0.85) * 38 * randSpread);
            py = nozzleY + 8 + progress * 115;
            radius = Math.floor((4 + progress * 10) * intensity);
          }

          let col = PAL.PURE_WHITE;
          if (progress > 0.72) col = PAL.DARK_SLATE;
          else if (progress > 0.45) col = PAL.MID_SLATE;
          else if (progress > 0.20) col = PAL.LIGHT_STEEL;
          else if (isLiftoff && progress < 0.14) col = PAL.SOLAR_GOLD;

          if (progress < 0.92 && radius > 0) {
            circle(px, py, radius, col);
          }
        }
      }

      // Menggambar Planet Besar Bercincin + Bulan + Reticle Target
      function drawOrbitPlanet(cx, cy, r, t, lockProgress) {
        const icx = Math.floor(cx);
        const icy = Math.floor(cy);
        if (icy + r + 35 < 0 || icy - r - 35 > H) return;

        // Cincin bagian belakang
        for (let a = Math.PI; a < Math.PI * 2; a += 0.014) {
          const rx = Math.floor(icx + Math.cos(a) * (r * 1.68) + Math.sin(a) * 10);
          const ry = Math.floor(icy + Math.sin(a) * (r * 0.42) - Math.cos(a) * 18);
          rect(rx, ry, 3, 2, PAL.MID_SLATE);
          const rx2 = Math.floor(icx + Math.cos(a) * (r * 1.46) + Math.sin(a) * 8);
          const ry2 = Math.floor(icy + Math.sin(a) * (r * 0.36) - Math.cos(a) * 15);
          rect(rx2, ry2, 2, 2, PAL.SOLAR_GOLD);
        }

        // Bola Planet
        for (let dy = -r; dy <= r; dy++) {
          const py = icy + dy;
          if (py < 0 || py >= H) continue;
          const halfW = Math.floor(Math.sqrt(r * r - dy * dy));
          for (let dx = -halfW; dx <= halfW; dx++) {
            const px = icx + dx;
            if (px < 0 || px >= W) continue;

            const light = (-dx * 0.65 - dy * 0.45) / r;
            const band = Math.sin((dy + Math.sin((dx + t * 2) * 0.08) * 4) * 0.22);

            let col = PAL.TWILIGHT_BLUE;
            if (light < -0.28) {
              col = PAL.VOID_BLACK;
            } else if (light < -0.05) {
              col = (BAYER4[py & 3][px & 3] < 8) ? PAL.DEEP_NAVY : PAL.VOID_BLACK;
            } else if (light < 0.15) {
              col = PAL.DEEP_NAVY;
            } else {
              if (band > 0.35) col = PAL.ORBIT_TEAL;
              else if (band > -0.15) col = PAL.TWILIGHT_BLUE;
              else col = PAL.DUSK_PURPLE;

              if (light > 0.55 && band > 0.1) {
                col = PAL.MISSION_GREEN;
              }
            }

            if (dx <= -halfW + 2 && light > 0) {
              col = PAL.LIGHT_STEEL;
            }

            ctx.fillStyle = col;
            ctx.fillRect(px, py, 1, 1);
          }
        }

        // Cincin bagian depan
        for (let a = 0; a < Math.PI; a += 0.011) {
          const rx = Math.floor(icx + Math.cos(a) * (r * 1.68) + Math.sin(a) * 10);
          const ry = Math.floor(icy + Math.sin(a) * (r * 0.42) - Math.cos(a) * 18);
          rect(rx, ry, 3, 2, PAL.LIGHT_STEEL);

          const rx2 = Math.floor(icx + Math.cos(a) * (r * 1.46) + Math.sin(a) * 8);
          const ry2 = Math.floor(icy + Math.sin(a) * (r * 0.36) - Math.cos(a) * 15);
          rect(rx2, ry2, 3, 2, PAL.SOLAR_GOLD);

          const rx3 = Math.floor(icx + Math.cos(a) * (r * 1.28) + Math.sin(a) * 7);
          const ry3 = Math.floor(icy + Math.sin(a) * (r * 0.30) - Math.cos(a) * 13);
          rect(rx3, ry3, 2, 1, PAL.SUNSET_ORANGE);
        }

        // Bulan Kecil Berkawah
        const mx = icx - r - 26;
        const my = icy - r + 14 + Math.floor(Math.sin(t * 1.5) * 2);
        circle(mx, my, 12, PAL.MID_SLATE);
        circle(mx - 2, my - 2, 9, PAL.LIGHT_STEEL);
        circle(mx + 3, my + 2, 3, PAL.DARK_SLATE);
        circle(mx - 4, my + 4, 2, PAL.MID_SLATE);

        // Siku Target Pengunci Orbit (Muncul saat t > 7.2)
        if (lockProgress > 0.05) {
          const boxR = Math.floor(r + 14 + (1.0 - lockProgress) * 20);
          const col = (lockProgress >= 0.95 || Math.floor(t * 8) % 2 === 0) ? PAL.MISSION_GREEN : PAL.STAR_YELLOW;
          const len = 10;
          // Kiri-Atas
          rect(icx - boxR, icy - boxR, len, 2, col);
          rect(icx - boxR, icy - boxR, 2, len, col);
          // Kanan-Atas
          rect(icx + boxR - len, icy - boxR, len, 2, col);
          rect(icx + boxR - 2, icy - boxR, 2, len, col);
          // Kiri-Bawah
          rect(icx - boxR, icy + boxR - 2, len, 2, col);
          rect(icx - boxR, icy + boxR - len, 2, len, col);
          // Kanan-Bawah
          rect(icx + boxR - len, icy + boxR - 2, len, 2, col);
          rect(icx + boxR - 2, icy + boxR - len, 2, len, col);

          if (lockProgress >= 0.95) {
            drawPixelText("TARGET:SATURN-IV", icx - 46, icy - boxR - 10, 1, PAL.MISSION_GREEN, PAL.VOID_BLACK);
          }
        }
      }

      // Menggambar Satelit Orbit yang melintas
      function drawSatellite(sx, sy, t) {
        const x = Math.floor(sx);
        const y = Math.floor(sy);
        if (y < -20 || y > H + 20) return;
        // Panel surya kiri & kanan
        rect(x - 18, y - 3, 12, 6, PAL.TWILIGHT_BLUE);
        rect(x - 18, y - 3, 12, 1, PAL.LIGHT_STEEL);
        rect(x + 6, y - 3, 12, 6, PAL.TWILIGHT_BLUE);
        rect(x + 6, y - 3, 12, 1, PAL.LIGHT_STEEL);
        // Badan satelit
        rect(x - 5, y - 4, 10, 8, PAL.LIGHT_STEEL);
        rect(x - 3, y - 2, 6, 4, PAL.SOLAR_GOLD);
        // Antena satelit
        rect(x, y - 9, 1, 5, PAL.PURE_WHITE);
        if (Math.floor(t * 5) % 2 === 0) {
          rect(x - 1, y - 10, 3, 2, PAL.MISSION_GREEN);
        }
      }

      // Menggambar Lengkungan Horizon Bumi di Bawah Layar (Saat Memasuki Orbit)
      function drawEarthLimbHorizon(baseY) {
        const by = Math.floor(baseY);
        if (by >= H + 40) return;
        for (let px = 0; px < W; px++) {
          const dx = (px - W / 2) / (W / 2);
          const curve = Math.floor(dx * dx * 28);
          const yTop = by + curve;
          if (yTop < H) {
            rect(px, yTop, 1, 2, PAL.MISSION_GREEN);
            rect(px, yTop + 2, 1, 4, PAL.ORBIT_TEAL);
            rect(px, yTop + 6, 1, 10, PAL.TWILIGHT_BLUE);
            rect(px, yTop + 16, 1, H - yTop, PAL.DEEP_NAVY);
          }
        }
      }

      // HUD Atas dengan Bar Progress Misi
      function drawTopHUD(sceneLabel, altKm, progressRatio, alertText, t) {
        rect(8, 8, W - 16, 26, PAL.CHARCOAL);
        rect(8, 8, W - 16, 2, PAL.ORBIT_TEAL);
        rect(8, 32, W - 16, 2, PAL.DARK_SLATE);
        rect(8, 8, 2, 26, PAL.ORBIT_TEAL);
        rect(W - 10, 8, 2, 26, PAL.ORBIT_TEAL);

        drawPixelText(sceneLabel, 14, 14, 1, PAL.MISSION_GREEN, null);
        const altStr = "ALT:" + String(Math.floor(altKm)).padStart(3, "0") + "KM";
        drawPixelText(altStr, W - 14 - measurePixelText(altStr, 1), 14, 1, PAL.STAR_YELLOW, null);

        // Bar Progres Trajectory menuju Orbit
        rect(14, 25, W - 28, 4, PAL.VOID_BLACK);
        const fillW = Math.floor((W - 30) * clamp(progressRatio, 0, 1));
        rect(15, 26, fillW, 2, PAL.ORBIT_TEAL);
        rect(15 + Math.max(0, fillW - 3), 25, 3, 4, PAL.STAR_YELLOW);

        // Banner Aba-Aba Peringatan di bawah HUD jika aktif
        if (alertText) {
          const blink = Math.floor(t * 8) % 2 === 0;
          const bgCol = blink ? PAL.MARS_RED : PAL.CHARCOAL;
          const txtCol = blink ? PAL.STAR_YELLOW : PAL.PURE_WHITE;
          rect(35, 38, W - 70, 15, bgCol);
          rect(35, 38, W - 70, 1, PAL.STAR_YELLOW);
          rect(35, 52, W - 70, 1, PAL.STAR_YELLOW);
          drawCenteredText(alertText, 42, 1, txtCol, null);
        }
      }

      // =========================================================================
      // FUNGSI UTAMA: drawFrame(t) — Sepenuhnya Kontinu Tanpa Jump-Cut!
      // =========================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, 12.0);
        ctx.fillStyle = PAL.VOID_BLACK;
        ctx.fillRect(0, 0, W, H);

        // -----------------------------------------------------------------------
        // 1. HITUNG PERGERAKAN KAMERA & LANGIT KONTINU (0.0 s/d 12.0 dtk)
        // -----------------------------------------------------------------------
        let camScroll = 0;
        if (time > 3.5) {
          const ascentT = clamp((time - 3.5) / 4.5, 0.0, 1.0);
          camScroll = smoothstep(0.0, 1.0, ascentT) * 1250;
        }

        const skyStops = [
          { y: -1300, color: PAL.VOID_BLACK },
          { y: -620,  color: PAL.VOID_BLACK },
          { y: -380,  color: PAL.DEEP_NAVY },
          { y: -150,  color: PAL.TWILIGHT_BLUE },
          { y:   50,  color: PAL.DUSK_PURPLE },
          { y:  180,  color: PAL.CRIMSON_DUSK },
          { y:  280,  color: PAL.MARS_RED },
          { y:  360,  color: PAL.SUNSET_ORANGE },
          { y:  435,  color: PAL.SOLAR_GOLD },
          { y:  480,  color: PAL.STAR_YELLOW }
        ];
        drawDitheredSky(skyStops, -camScroll);

        // Visibilitas Bintang (Tampak tipis saat senja, lalu penuh saat langit gelap)
        const starVis = clamp(0.18 + (camScroll / 650) * 0.82, 0.18, 1.0);
        const starScroll = camScroll * 0.35 + (time > 8.0 ? (time - 8.0) * 14 : 0);
        drawStarfield(time, starVis, starScroll);

        // Bintang jatuh (meteor) melintas di angkasa
        if (time > 8.6 && time < 9.5) {
          const sp = (time - 8.6) / 0.9;
          const sx = Math.floor(240 - sp * 190);
          const sy = Math.floor(52 + sp * 70);
          for (let k = 0; k < 10; k++) {
            rect(sx + k * 2, sy - k, 2, 1, k < 3 ? PAL.PURE_WHITE : PAL.STAR_YELLOW);
          }
        }

        // -----------------------------------------------------------------------
        // 2. PLANET BESAR & BULAN (MULAI TURUN DARI ATAS SEJAK DETIK 6.2!)
        //    Memberikan aba-aba visual bahwa roket sedang mendekati tujuan orbit
        // -----------------------------------------------------------------------
        if (time >= 6.0) {

    for (let yy = y0; yy < y1; yy++) fb.fill(c, yy * W + x0, yy * W + Math.max(x0, x1));

  function disc(fb, cx, cy, r, c) {
    const r2 = r * r;
    const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
    for (let y = y0; y <= y1; y++) {
      if (y < 0 || y >= H) continue;
      const dy = y + 0.5 - cy;
      for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - cx;
        if (dx * dx + dy * dy <= r2) px(fb, x, y, c);
      }
    }
  }

  function line(fb, x0, y0, x1, y1, c) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    if (n === 0) { px(fb, x0, y0, c); return; }
    for (let i = 0; i <= n; i++) {
      px(fb, Math.round(lerp(x0, x1, i / n)), Math.round(lerp(y0, y1, i / n)), c);
    }
  }

  // --- Langit Bayer Dither ---
  const SKY = [
    [0, P.ORANGE], [115, P.PINK], [195, P.PURPLE], [310, P.NAVY], [680, P.NIGHT], [1380, P.BLACK]
  ];

  function skyIndex(a, x, ay) {
    if (a <= SKY[0][0]) return SKY[0][1];
    for (let i = 0; i < SKY.length - 1; i++) {
      const [a0, c0] = SKY[i], [a1, c1] = SKY[i + 1];
      if (a < a1) {
        const g = clamp(((a - a0) / (a1 - a0) - 0.45) / 0.55);
        return g > bayer(x, ay) ? c1 : c0;
      }
    }
    return P.BLACK;
  }

  function drawSky(fb, c) {
    for (let y = 0; y < H; y++) {
      const ay = GROUND - y + c;
      const row = y * W;
      for (let x = 0; x < W; x++) fb[row + x] = skyIndex(ay, x, ay);
    }
  }

  // --- Bintang & Galaksi ---
  const STARS = Array.from({ length: 165 }, (_, i) => {
    const r = hash(i, 11);
    return {
      x: Math.floor(hash(i, 12) * W),
      y: hash(i, 13) * H,
      color: r < 0.55 ? P.WHITE : r < 0.8 ? P.GREY : P.ICE,
      big: hash(i, 14) > 0.90,
      reveal: 520 + hash(i, 15) * 880,
      period: 8 + Math.floor(hash(i, 16) * 16),
      phase: Math.floor(hash(i, 17) * 24)
    };
  });

  function drawStars(fb, t, f, c) {
    const off = starOffset(t);
    const streak = clamp(Math.round(starSpeed(t) / 85), 1, 6);
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const sy = Math.floor((((s.y + off) % H) + H) % H);
      if (GROUND - sy + c < s.reveal) continue;
      const bg = fb[sy * W + s.x];
      if (bg !== P.BLACK && bg !== P.NIGHT && bg !== P.NAVY) continue;

      const k = Math.floor((f + s.phase) / s.period);
      const on = hash(i * 31 + k, 9) > 0.28;
      const col = on ? s.color : s.color === P.WHITE ? P.GREY : P.STEEL;
      for (let j = 0; j < streak; j++) px(fb, s.x, sy - j, j === 0 ? col : P.STEEL);
      if (s.big && on && streak === 1) {
        px(fb, s.x - 1, sy, P.ICE);
        px(fb, s.x + 1, sy, P.ICE);
        px(fb, s.x, sy - 1, P.ICE);
        px(fb, s.x, sy + 1, P.ICE);
      }
    }
  }

  // --- Awan Atmosfer Berlapis (Tambahan untuk memperkaya langit senja & saat naik) ---
  const ATMO_CLOUDS = [
    { x: 25,  y: 255, w: 62, h: 10, sp: 2.0, col1: P.PINK, col2: P.PURPLE },
    { x: 175, y: 220, w: 68, h: 12, sp: -1.6, col1: P.PINK, col2: P.PURPLE },
    { x: 80,  y: 145, w: 54, h: 9,  sp: 2.4, col1: P.PURPLE, col2: P.NAVY },
    { x: 15,  y: 35,  w: 72, h: 11, sp: -2.2, col1: P.BLUE, col2: P.NAVY },
    { x: 155, y: -65, w: 64, h: 10, sp: 2.6, col1: P.ICE, col2: P.NAVY }
  ];

  function drawAtmoClouds(fb, t, c, sh) {
    for (let i = 0; i < ATMO_CLOUDS.length; i++) {
      const cl = ATMO_CLOUDS[i];
      const sy = Math.floor(cl.y + c * 0.75 + sh.y);
      if (sy < -20 || sy > GROUND + c - 25 || sy > H + 20) continue;
      const sx = Math.floor(((cl.x + t * cl.sp) % (W + 80)) - 40 + sh.x);
      rect(fb, sx + 6, sy, cl.w - 12, cl.h, cl.col2);
      rect(fb, sx, sy + 3, cl.w, cl.h - 4, cl.col2);
      rect(fb, sx + 10, sy - 3, Math.floor(cl.w * 0.55), 4, cl.col1);
      rect(fb, sx + 6, sy, cl.w - 12, 2, cl.col1);
    }
  }

  // --- Matahari, Perbukitan & Kompleks Landasan (Upgraded) ---
  function drawSun(fb, c, sh) {
    const cx = 56 + sh.x, cy = GROUND - 8 + c + sh.y;
    disc(fb, cx, cy, 29, P.ORANGE);
    disc(fb, cx, cy, 23, P.YELLOW);
    disc(fb, cx, cy, 14, P.WHITE);
    // Garis potong retro synthwave
    for (const [dy, h] of [[-11, 1], [-6, 2], [-1, 2], [4, 3], [10, 3]]) {
      for (let x = cx - 29; x <= cx + 29; x++) {
        for (let k = 0; k < h; k++) {
          const y = Math.floor(cy + dy + k);
          if (y >= 0 && y < H && x >= 0 && x < W) {
            const cur = fb[y * W + Math.floor(x)];
            if (cur === P.YELLOW || cur === P.WHITE) px(fb, x, y, P.ORANGE);
          }
        }
      }
    }
  }

  function drawHills(fb, c, sh) {
    for (let x = 0; x < W; x++) {
      const wx = x - sh.x;
      const far = 24 + 10 * Math.sin(wx * 0.032 + 1.2) + 6 * Math.sin(wx * 0.088 + 0.3);
      const near = 11 + 6 * Math.sin(wx * 0.052 + 2.1) + 3 * Math.sin(wx * 0.13 + 1.0);
      for (let y = Math.floor(GROUND - far); y < GROUND; y++) px(fb, x, y + c + sh.y, P.PURPLE);
      for (let y = Math.floor(GROUND - near); y < GROUND; y++) px(fb, x, y + c + sh.y, P.DIRT);
    }
  }

  function drawGround(fb, c, sh) {
    const top = GROUND + c + sh.y;
    rect(fb, 0, top, W, H - top + 8, P.DIRT);
    rect(fb, 0, top, W, 2, P.STEEL);
    // Garis hazard kuning-hitam di bibir landasan
    for (let hx = 68; hx < 198; hx += 8) {
      rect(fb, hx + sh.x, top + 1, 4, 2, P.YELLOW);
    }
    for (let i = 0; i < 65; i++) {
      const x = Math.floor(hash(i, 21) * W), y = top + 4 + Math.floor(hash(i, 22) * 64);
      px(fb, x + sh.x, y, hash(i, 23) > 0.5 ? P.STEEL : P.PURPLE);
    }
  }

  function drawPad(fb, t, f, c, sh) {
    const ox = sh.x, oy = c + sh.y;

    // 1. Tangki Bahan Bakar Kriogenik Bulat di sisi kiri (x=32)
    const tx = 32 + ox, ty = PAD_TOP - 10 + oy;
    disc(fb, tx, ty, 13, P.STEEL);
    disc(fb, tx - 2, ty - 2, 9, P.GREY);
    disc(fb, tx - 4, ty - 4, 4, P.WHITE);
    rect(fb, tx - 10, PAD_TOP - 2 + oy, 20, 8, P.STEEL);
    // Pipa kriogenik menuju landasan
    rect(fb, tx + 12, PAD_TOP - 3 + oy, 54, 3, P.STEEL);
    rect(fb, tx + 12, PAD_TOP - 3 + oy, 54, 1, P.GREY);

    // 2. Gedung Kendali & Radar Berputar di sisi kanan (x=206)
    const bx = 204 + ox, by = PAD_TOP - 20 + oy;
    rect(fb, bx, by, 42, 26, P.DIRT);
    rect(fb, bx, by, 42, 2, P.TEAL);
    for (let wx = bx + 5; wx < bx + 38; wx += 7) {
      for (let wy = by + 5; wy < by + 20; wy += 6) {
        rect(fb, wx, wy, 4, 3, (wx + wy) % 2 === 0 ? P.YELLOW : P.ICE);
      }
    }
    // Radar berputar di atap gedung
    const rx = bx + 21, ry = by - 5;
    rect(fb, rx - 1, ry, 3, 5, P.STEEL);
    const dishW = Math.max(2, Math.floor(Math.abs(Math.cos(t * 3.8)) * 12));
    rect(fb, rx - Math.floor(dishW / 2), ry - 4, dishW, 3, P.WHITE);
    px(fb, rx, ry - 6, f % 10 < 5 ? P.GREEN : P.TEAL);

    // 3. Fondasi Beton Landasan & Parit Api
    rect(fb, 86 + ox, PAD_TOP + oy, 98, 6, P.STEEL);
    rect(fb, 90 + ox, PAD_TOP + oy, 90, 1, P.GREY);
    rect(fb, 122 + ox, PAD_TOP + 1 + oy, 26, 5, P.BLACK);

    // 4. Menara Penangkal Petir di Kanan Roket
    rect(fb, 168 + ox, 315 + oy, 2, PAD_TOP - 315, P.STEEL);
    rect(fb, 168 + ox, 305 + oy, 1, 10, P.WHITE);
    if (f % 16 < 8) rect(fb, 167 + ox, 303 + oy, 3, 2, P.RED);

    // 5. Menara Gantry Utama di Kiri Roket
    const top = 288;
    for (const x of [92, 106]) rect(fb, x + ox, top + oy, 3, PAD_TOP - top, P.STEEL);
    rect(fb, 92 + ox, top + oy, 1, PAD_TOP - top, P.GREY);
    for (let y = top; y < PAD_TOP - 4; y += 10) {
      rect(fb, 92 + ox, y + oy, 17, 2, P.STEEL);
      line(fb, 94 + ox, y + oy, 106 + ox, y + 10 + oy, P.STEEL);
      line(fb, 106 + ox, y + oy, 94 + ox, y + 10 + oy, P.STEEL);
    }
    rect(fb, 90 + ox, top - 2 + oy, 21, 2, P.GREY);
    // Lampu suar puncak menara
    if (Math.floor(f / (FPS / 2)) % 2 === 0) {
      rect(fb, 99 + ox, top - 6 + oy, 4, 4, P.RED);
      px(fb, 100 + ox, top - 5 + oy, P.YELLOW);
    }

    // 6. Tiga Lengan Umbilical (ditarik saat T.arm)
    const len = Math.round(23 * (1 - easeInOut(progress(t, T.arm[0], T.arm[1]))));
    for (const y of [328, 352, 376]) {
      if (len > 0) {
        rect(fb, 109 + ox, y + oy, len, 2, P.GREY);
        rect(fb, 109 + ox, y + 2 + oy, len, 1, P.STEEL);
      }
    }

    // 7. Percikan Api Pelepasan Klem saat Ignition (3.2 - 3.8 dtk)
    if (t >= 3.1 && t <= 3.85) {
      for (let s = 0; s < 8; s++) {
        const ang = hash(s * 13 + f, 5) * Math.PI * 2;
        const dist = 3 + hash(s * 7 + f, 6) * 14;
        px(fb, 118 + Math.cos(ang) * dist + ox, 355 + Math.sin(ang) * dist + oy, s % 2 ? P.YELLOW : P.ORANGE);
      }
    }
  }

  // --- Sprite Roket 24x56 Prosedural (Pusat di 12, 28) ---
  function rocketPixel(ix, iy, f) {
    if (ix < 0 || ix > 23 || iy < -4 || iy > 55) return -1;

    // Antena Pucuk (iy: -4..-1)
    if (iy < 0) {
      if (ix === 11 || ix === 12) return iy === -4 ? (f % 10 < 5 ? P.YELLOW : P.RED) : P.WHITE;
      return -1;
    }

    const xc = ix + 0.5;
    // Kerucut Hidung (iy: 0..15)
    if (iy <= 15) {
      const hw = 6.2 * Math.sqrt((iy + 1) / 16);
      const l = 12 - hw, r = 12 + hw;
      if (xc < l || xc > r) return -1;
      if (xc > r - 2.0) return P.PURPLE;
      if (xc < l + 1.5) return P.PINK;
      return P.RED;
    }

    // Badan Utama (iy: 16..48, ix: 6..17)
    if (iy <= 48 && ix >= 6 && ix <= 17) {
      // Jendela Porthole Kosmonot (pusat di 12, 24)
      const dx = xc - 12, dy = iy + 0.5 - 24;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d <= 3.8) {
        if (d > 2.7) return P.STEEL;
        if (dx < -0.5 && dy < -0.5) return P.WHITE;
        return dx + dy > 0.9 ? P.BLUE : P.ICE;
      }
      // Garis sabuk & cincin interstage checkerboard (iy: 34..36)
      if (iy === 16 || iy === 48) return P.STEEL;
      if (iy >= 34 && iy <= 36) {
        return ((ix + iy) % 2 === 0) ? P.BLACK : P.WHITE;
      }
      if (iy === 18 || iy === 19) return ix >= 15 ? P.PURPLE : ix === 6 ? P.PINK : P.RED;
      // Shading silinder badan
      if (ix >= 16) return P.STEEL;
      if (ix >= 14) return P.GREY;
      return P.WHITE;
    }

    // Sirip Aerodinamis Kiri & Kanan (iy: 36..52)
    if (iy >= 36 && iy <= 52) {
      const k = Math.min(6, Math.floor(((iy - 36) / 16) * 6) + 1);
      if (ix < 6 && ix >= 6 - k) return ix === 6 - k ? P.PINK : P.RED;
      if (ix > 17 && ix <= 17 + k) return P.PURPLE;
    }

    // Nozel Mesin (iy: 49..55)
    if (iy >= 49 && iy <= 55) {
      const hw = iy < 52 ? 3.5 : 4.5;
      if (xc >= 12 - hw && xc <= 12 + hw) {
        return xc > 12 + hw - 2 ? P.STEEL : iy >= 53 ? P.STEEL : P.GREY;
      }
    }
    return -1;
  }

  function flamePixel(ix, iy, len, f, isVacuum) {
    const d = iy - 56;
    if (len <= 0 || d < 0 || d > len) return -1;
    const q = d / len;
    const hw = (isVacuum ? 3.2 : 4.5) * Math.pow(1 - q, 0.68) + (hash(iy, f * 7 + 1) - 0.5) * 1.3;
    const u = Math.abs(ix + 0.5 - 12);
    if (u > hw) return -1;
    const r = u / Math.max(hw, 0.5);

    if (isVacuum) {
      // Api Plasma Biru-Putih saat di Orbit
      if (q < 0.25 && r < 0.5) return P.WHITE;
      if (q < 0.70 && r < 0.75) return P.ICE;
      return P.BLUE;
    } else {
      // Api Booster Atmosfer
      if (q < 0.18 && r < 0.48) return P.WHITE;
      if (q < 0.62 && r < 0.65) return P.YELLOW;
      if (q < 0.86 && r < 0.90) return P.ORANGE;
      return P.RED;
    }
  }

  function drawRocket(fb, pose, len, t, f, sh) {
    const cx = Math.round(pose.x) + sh.x, cy = Math.round(pose.y) + sh.y;
    const cs = Math.cos(pose.ang), sn = Math.sin(pose.ang);
    const isVacuum = t >= T.meco;
    const R = 32 + Math.ceil(len) + 2;

    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        const lx = cs * (dx + 0.5) + sn * (dy + 0.5);
        const ly = -sn * (dx + 0.5) + cs * (dy + 0.5);
        const ix = Math.floor(lx + 12), iy = Math.floor(ly + 28);
        let c = rocketPixel(ix, iy, f);
        if (c < 0) c = flamePixel(ix, iy, len, f, isVacuum);
        if (c >= 0) px(fb, cx + dx, cy + dy, c);
      }
    }

    // Aba-aba Kerucut Supersonik Max-Q (4.7 - 5.7 dtk)
    if (t >= T.maxQ[0] && t <= T.maxQ[1]) {
      const ny = cy - 14;
      for (let i = 0; i < 16; i++) {
        const sp = Math.floor(i * 1.4);
        if ((i + f) % 2 === 0) {
          rect(fb, cx - sp - 2, ny + i, 2, 1, P.WHITE);
          rect(fb, cx + sp, ny + i, 2, 1, P.ICE);
        }
      }
    }

    // Semburan RCS Thruster saat roket bermanuver miring 90 derajat (6.2 - 8.3 dtk)
    if (t >= T.pitch[0] && t <= T.pitch[1] && f % 3 !== 0) {
      // Titik semburan gas pengarah di dekat hidung roket (tegak lurus sumbu roket)
      const noseX = cx + Math.sin(pose.ang) * 16;
      const noseY = cy - Math.cos(pose.ang) * 16;
      const pDirX = -Math.cos(pose.ang);
      const pDirY = -Math.sin(pose.ang);
      for (let k = 1; k <= 6; k++) {
        px(fb, noseX + pDirX * (6 + k), noseY + pDirY * (6 + k), k < 3 ? P.WHITE : P.ICE);
      }
    }
  }

  // --- Asap & Jejak Peluncuran ---
  function puff(fb, x, y, r) {
    if (r < 1.2) { px(fb, x, y, P.GREY); return; }
    disc(fb, x + r * 0.2, y + r * 0.25, r * 0.95, P.STEEL);
    disc(fb, x, y, r, P.GREY);
    disc(fb, x - r * 0.28, y - r * 0.3, r * 0.6, P.WHITE);
  }

  function drawVent(fb, t, c, sh) {
    const { start, end, step } = T.vent;
    for (let k = 0; ; k++) {
      const tb = start + k * step + hash(k, 31) * 0.05;
      if (tb > end || tb > t) break;
      const intensity = (tb - start) / (end - start);
      if (hash(k, 32) > 0.45 + intensity * 0.55) continue;
      const age = t - tb, life = 0.9 + hash(k, 33) * 0.5;
      if (age >= life) continue;
      const p = age / life;
      const side = k % 2 ? 1 : -1;
      const x = ROCKET_X + side * (5 + (11 + hash(k, 34) * 15) * age);
      const y = PAD_TOP - 3 - (4 + hash(k, 35) * 6) * age;
      puff(fb, x + sh.x, y + c + sh.y, 1 + (2.5 + intensity * 2.2) * Math.pow(p, 0.6));
    }
  }

  function drawCloud(fb, t, c, sh) {
    const { start, end, step } = T.cloud;
    for (let k = 0; ; k++) {
      const tb = start + k * step;
      if (tb > end || tb > t) break;
      const age = t - tb;
      const side = hash(k, 41) > 0.5 ? 1 : -1;
      const v = 25 + hash(k, 42) * 78;
      const x = ROCKET_X + side * (2 + (v * (1 - Math.exp(-1.6 * age))) / 1.6);
      const y = PAD_TOP - 2 - (3 + hash(k, 43) * 9) * age;
      const r = 2 + 9 * (1 - Math.exp(-1.3 * age)) * (0.6 + 0.7 * hash(k, 44));
      const sy = y + c + sh.y;
      if (sy - r > H) continue;
      puff(fb, x + sh.x, sy, r);
    }
  }

  const TRAIL = (() => {
    const out = [];
    const top = lift(T.trail.end);
    for (let a = 20; a < top; a += T.trail.gap) {
      let lo = T.liftoff, hi = T.trail.end;
      for (let i = 0; i < 40; i++) {
        const m = (lo + hi) / 2;
        if (lift(m) < a) lo = m; else hi = m;
      }
      out.push({ a, tb: hi });
    }
    return out;
  })();

  function drawTrail(fb, t, c, sh) {
    for (let k = 0; k < TRAIL.length; k++) {
      const { a, tb } = TRAIL[k];
      if (tb > t) break;
      const age = t - tb;
      const life = 2.4 - Math.min(1.7, a / 1400);
      if (age >= life) continue;
      const drift = (hash(k, 52) - 0.5) * 10 * age;
      const x = ROCKET_X + (hash(k, 51) - 0.5) * 4 + drift;
      const y = PAD_TOP - a + c;
      const r = (2.5 + 6 * (1 - Math.exp(-age * 1.4))) * (1 - Math.pow(age / life, 3));
      if (y + r < 0 || y - r > H) continue;
      puff(fb, x + sh.x, y + sh.y, r);
    }
  }

  // --- Planet Bumi 3D dari Orbit (Upgraded dengan Lampu Kota Malam & Atmosfer Berlapis) ---
  const PLANET_R = 300;
  const LIGHT = (() => {
    const v = [-0.78, -0.45, 0.44];
    const n = Math.hypot(...v);
    return v.map((k) => k / n);
  })();

  function drawPlanet(fb, t, f) {
    const k = easeOut(progress(t, T.planet[0], T.planet[1]));
    if (k <= 0) return;

    // 1. Bulan Berkawah & Satelit di Langit Atas (Turun perlahan saat mendekati orbit)
    const moonY = Math.floor(lerp(-35, 76, k));
    const moonX = 216;
    disc(fb, moonX, moonY, 16, P.STEEL);
    disc(fb, moonX - 2, moonY - 2, 13, P.GREY);
    disc(fb, moonX - 5, moonY - 5, 7, P.WHITE);
    disc(fb, moonX + 4, moonY + 3, 3, P.STEEL);
    disc(fb, moonX - 3, moonY + 5, 2, P.STEEL);

    // Satelit Komunikasi Orbit
    const satX = Math.floor(52 + Math.sin(t * 0.9) * 14);
    const satY = Math.floor(lerp(-25, 162, k));
    rect(fb, satX - 14, satY - 2, 9, 4, P.BLUE);
    rect(fb, satX + 5, satY - 2, 9, 4, P.BLUE);
    rect(fb, satX - 4, satY - 3, 8, 6, P.GREY);
    rect(fb, satX - 2, satY - 1, 4, 2, P.YELLOW);
    if (f % 14 < 7) px(fb, satX, satY - 6, P.GREEN);

    // 2. Bola Bumi 3D di Bawah Layar
    const cx = 148, cy = lerp(805, 635, k);
    const R = PLANET_R;
    const spin = t * 0.006;

    for (let y = Math.max(0, Math.floor(cy - R - 6)); y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > R + 5) continue;

        // Cincin Halo Atmosfer Berlapis
        if (d > R) {
          if (dx < 65) {
            if (d <= R + 1.8) fb[y * W + x] = P.ICE;
            else if (bayer(x, y) < 0.55) fb[y * W + x] = P.BLUE;
          }
          continue;
        }

        const nx = dx / R, ny = dy / R, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        const lam = nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2];
        const lon = Math.atan2(nx, nz) + spin, lat = Math.asin(ny);
        const landVal = vnoise(lon * 2.6 + 3, lat * 3.4, 61) * 0.8 + vnoise(lon * 8, lat * 9, 62) * 0.2;
        const land = landVal > 0.53;
        const cloud = vnoise(lon * 2.2 + 9, lat * 16, 63) * 0.75 + vnoise(lon * 9, lat * 30, 64) * 0.25 > 0.65;
        const th = bayer(x, y) * 0.16;

        let c;
        if (lam + th < 0.05) {
          c = P.NIGHT;
          // Gugusan Lampu Kota (City Lights) di daratan sisi malam Bumi
          if (land && vnoise(lon * 28, lat * 28, 77) > 0.76) {
            c = ((x + y) % 2 === 0) ? P.YELLOW : P.ORANGE;
          }
        } else if (lam + th < 0.14) {
          c = land ? P.ORANGE : P.PINK; // Garis senja terminator
        } else if (cloud) {
          c = lam + th > 0.32 ? P.WHITE : P.GREY;
        } else if (land) {
          c = lam + th > 0.34 ? P.GREEN : P.TEAL;
        } else {
          c = lam + th > 0.46 ? P.ICE : (lam + th > 0.32 ? P.BLUE : P.NAVY);
        }

        if (d > R - 1.8 && lam > 0.15) c = P.ICE;
        fb[y * W + x] = c;
      }
    }
  }

  // --- Teks, HUD Telemetri & Dialog Box ---
  function drawText(fb, str, x, y, scale, c) {
    const up = String(str).toUpperCase();
    for (let i = 0; i < up.length; i++) {
      const g = glyph(up[i]);
      for (let gy = 0; gy < GLYPH_H; gy++) {
        for (let gx = 0; gx < 5; gx++) {
          if (g[gy][gx] === "#") {
            rect(fb, x + (i * ADVANCE + gx) * scale, y + gy * scale, scale, scale, c);
          }
        }
      }
    }
  }

  function drawHUD(fb, t, f, pose) {
    // Bar Telemetri Atas
    rect(fb, 6, 6, W - 12, 22, P.NIGHT);
    rect(fb, 6, 6, W - 12, 1, P.TEAL);
    rect(fb, 6, 27, W - 12, 1, P.STEEL);
    rect(fb, 6, 6, 2, 22, P.ICE);
    rect(fb, W - 8, 6, 2, 22, P.ICE);

    let phase = "T-MINUS";
    if (t >= T.ignition && t < T.liftoff) phase = "IGNITION";
    else if (t >= T.liftoff && t < T.maxQ[0]) phase = "LIFTOFF";
    else if (t >= T.maxQ[0] && t < T.pitch[0]) phase = "MAX-Q";
    else if (t >= T.pitch[0] && t < T.orbit) phase = "PITCH TURN";
    else if (t >= T.orbit) phase = "ORBITAL";

    const altKm = Math.min(420, Math.floor(lift(Math.min(t, T.orbit)) * 0.18));
    const deg = Math.round((pose.ang * 180) / Math.PI);

    drawText(fb, phase, 12, 11, 1, P.GREEN);
    const rightStr = `PITCH:${String(deg).padStart(2, "0")} ALT:${String(altKm).padStart(3, "0")}K`;
    drawText(fb, rightStr, W - 12 - textWidth(rightStr, 1), 11, 1, P.YELLOW);

    // Bar Progres menuju Orbit
    rect(fb, 12, 21, W - 24, 3, P.BLACK);
    const progW = Math.floor((W - 24) * clamp(t / T.orbit, 0, 1));
    rect(fb, 12, 21, progW, 3, P.ICE);

    // Aba-aba Banner Peringatan saat Manuver Pitch-Over (6.0 - 7.8 dtk)
    if (t >= 6.0 && t < 7.8) {
      const blink = Math.floor(f / 4) % 2 === 0;
      rect(fb, 38, 32, W - 76, 13, blink ? P.RED : P.NIGHT);
      rect(fb, 38, 32, W - 76, 1, P.YELLOW);
      const msg = t < 7.0 ? "GRAVITY TURN 90 DEG" : "APPROACHING ORBIT";
      drawText(fb, msg, Math.round(SAFE_CX - textWidth(msg, 1) / 2), 35, 1, P.WHITE);
    }
  }

  function drawCountdown(fb, t, f) {
    if (t >= T.liftoff) return;
    let str = null;
    let isGo = false;

    for (let i = 0; i < T.count.length; i++) {
      const a = T.count[i], b = T.count[i + 1] ?? T.countEnd;
      if (t >= a && t < b) {
        str = String(3 - i);
        break;
      }
    }
    if (!str && t >= T.countEnd && t < T.liftoff) {
      str = "GO!";
      isGo = true;
    }
    if (!str) return;

    // Bingkai Kotak Hitung Mundur
    rect(fb, 76, 62, 118, 92, P.NIGHT);
    rect(fb, 76, 62, 118, 2, P.ORANGE);
    rect(fb, 76, 152, 118, 2, P.RED);
    rect(fb, 76, 62, 2, 92, P.YELLOW);
    rect(fb, 192, 62, 2, 92, P.YELLOW);

    const header = "COUNTDOWN";
    drawText(fb, header, Math.round(SAFE_CX - textWidth(header, 1) / 2), 70, 1, P.ICE);

    const s = isGo ? 5 : 8;
    const w = textWidth(str, s), h = GLYPH_H * s;
    const x = Math.round(SAFE_CX - w / 2), y = Math.round(114 - h / 2);
    drawText(fb, str, x + 3, y + 3, s, P.RED);
    drawText(fb, str, x, y, s, isGo ? P.GREEN : P.YELLOW);
  }

  function drawMission(fb, t, f) {
    if (t < T.orbit) return;
    const slide = easeOut(progress(t, T.orbit, T.orbit + 0.35));
    const boxY = Math.round(lerp(-90, 58, slide));

    // Bingkai Hologram "MISSION START"
    rect(fb, 22, boxY, W - 44, 78, P.NIGHT);
    rect(fb, 22, boxY, W - 44, 2, P.GREEN);
    rect(fb, 22, boxY + 76, W - 44, 2, P.TEAL);
    rect(fb, 22, boxY, 2, 78, P.ICE);
    rect(fb, W - 24, boxY, 2, 78, P.ICE);

    if (t < T.typeStart) return;

    const totalChars = TEXT.lines.join("").length;
    const n = Math.min(Math.floor((t - T.typeStart) / T.typeStep + 1e-6) + 1, totalChars);
    const s = 3, lh = GLYPH_H * s + 7, y0 = boxY + 12;
    let left = n, cur = null;

    TEXT.lines.forEach((lineStr, li) => {
      const shown = lineStr.slice(0, Math.max(0, Math.min(lineStr.length, left)));
      const x = Math.round(SAFE_CX - textWidth(lineStr, s) / 2), y = y0 + li * lh;
      drawText(fb, shown, x + 2, y + 2, s, P.BLUE);
      drawText(fb, shown, x, y, s, P.WHITE);
      if (left > 0 && left <= lineStr.length) {
        cur = { x: x + shown.length * ADVANCE * s, y };
      }
      left -= lineStr.length;
    });

    const done = n >= totalChars;
    if (done) {
      const sub = "ORBIT VEL: 27800 KMH";
      const subCol = Math.floor(f / 10) % 2 === 0 ? P.YELLOW : P.GREEN;
      drawText(fb, sub, Math.round(SAFE_CX - textWidth(sub, 1) / 2), boxY + 64, 1, subCol);
    }

    if (!cur) return;
    const blinkOn = !done || Math.floor((f - Math.round(T.typeStart * FPS)) / (FPS / 2)) % 2 === 0;
    if (blinkOn) rect(fb, cur.x, cur.y, 4 * s, GLYPH_H * s, P.ICE);
  }

  // ==========================================================================
  // 6. DRAW.JS & MAIN.JS — Pipeline Framebuffer -> Canvas Nearest-Neighbor
  // ==========================================================================
  const fb = new Uint8Array(W * H);
  const small = document.createElement("canvas");
  small.width = W;
  small.height = H;
  const sctx = small.getContext("2d");
  sctx.imageSmoothingEnabled = false;

  const img = sctx.createImageData(W, H);
  const u32 = new Uint32Array(img.data.buffer);

  function computeFrameBuffer(t) {
    const f = Math.round(t * FPS);
    t = clamp(f / FPS, 0, DURATION);
    const c = cam(t);
    const sh = shake(t, f);
    const pose = rocketPose(t);

    drawSky(fb, c);
    drawStars(fb, t, f, c);
    drawPlanet(fb, t, f);

    if (c < H + 60) {
      drawSun(fb, c, sh);
      drawAtmoClouds(fb, t, c, sh);
      drawHills(fb, c, sh);
      drawGround(fb, c, sh);
      drawPad(fb, t, f, c, sh);
    }
    if (t >= T.liftoff) drawTrail(fb, t, c, sh);
    drawRocket(fb, pose, flameLength(t, f), t, f, sh);
    if (c < H + 60) {
      drawCloud(fb, t, c, sh);
      drawVent(fb, t, c, sh);
    }

    drawHUD(fb, t, f, pose);
    drawCountdown(fb, t, f);
    drawMission(fb, t, f);
    return fb;
  }

  function paintByTime(t) {
    const idx = computeFrameBuffer(t);
    for (let i = 0; i < idx.length; i++) u32[i] = RGBA32[idx[i]];
    sctx.putImageData(img, 0, 0);
    return small;
  }

  

    return {
      render: function (t) {
        paintByTime(t);
        return small;
      }
    };
  })();

      function drawClaudeWheel(cx, cy, radius, angleRad, color = "#e07a5f") {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angleRad);
        const numSpokes = 12;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2.2, radius * 0.16);
        ctx.lineCap = "round";

        for (let i = 0; i < numSpokes; i++) {
          const a = (i / numSpokes) * Math.PI * 2;
          const innerR = radius * 0.22;
          const outerR = (i % 2 === 0) ? radius : radius * 0.82;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
          ctx.lineTo(Math.cos(a) * outerR, Math.sin(a) * outerR);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.24, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

            const flyEase = softBounceOut(flyRaw, 1.10);
            const fadeOutSplit = 1 - smoothstep(64.50, 64.70, time);

            const fx = lerp(btnCenterX - 18, W / 2, easeOutCubic(flyRaw));
            const fy = lerp(btnCenterY - 24, 895, flyEase);
            const fScale = lerp(0.82, 1.0, easeOutCubic(flyRaw));

            const pillW = 156, pillH = 36;
            ctx.save();
            ctx.globalAlpha = fadeOutSplit;
            ctx.translate(fx, fy);
            ctx.scale(fScale, fScale);
            roundRect(ctx, -pillW / 2, -pillH / 2, pillW, pillH, 8);
            ctx.fillStyle = "#1c1914";
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = "#ebb343";
            ctx.stroke();

            ctx.font = "600 16px ui-monospace, 'Cascadia Code', Consolas, monospace";
            ctx.fillStyle = "#ffe58f";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("↗ prompt.txt", 0, 1);
            ctx.restore();
          }

          if (time >= 62.80 && time <= 65.20) {
            const curAlpha = smoothstep(62.80, 63.10, time) * (1 - smoothstep(64.80, 65.20, time));
            let cx = btnCenterX + 6, cy = btnCenterY + 8, cScale = 1.0;

            if (time < 63.95) {
              const m = softBounceOut(clamp((time - 62.80) / 1.15, 0, 1), 0.95);
              cx = lerp(740, btnCenterX + 6, m);
              cy = lerp(1530, btnCenterY + 8, m);
            } else {
              const dt = time - 63.95;
              if (dt < 0.08) {
                cScale = lerp(1.0, 0.90, easeOutCubic(dt / 0.08));
                cx = btnCenterX + 5; cy = btnCenterY + 10;
              } else {
                const bt = clamp((dt - 0.08) / 0.60, 0, 1);
                cScale = lerp(0.90, 1.0, softBounceOut(bt, 1.30));
                const moveBack = easeInOutCubic(clamp((dt - 0.12) / 0.65, 0, 1));
                cx = lerp(btnCenterX + 6, btnCenterX + 38, moveBack);
                cy = lerp(btnCenterY + 8, btnCenterY + 108, moveBack);
              }
            }

            drawCursorArrow(cx, cy, cScale, curAlpha);
          }

          if (time >= 64.60) {
            const drawSmoothAICard = (targetX, targetY, w, h, title, sub, borderHex, titleHex, startT) => {
              if (time < startT) return;
              const raw = clamp((time - startT) / 0.65, 0, 1);
              const ease = softBounceOut(raw, 1.15);
              const alpha = smoothstep(0, 0.35, raw);

              const curX = lerp(W / 2 - w / 2, targetX, ease);
              const curY = lerp(targetY + 42, targetY, ease);
              const cardScale = lerp(0.92, 1.0, ease);

              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.translate(curX + w / 2, curY + h / 2);
              ctx.scale(cardScale, cardScale);
              roundRect(ctx, -w / 2, -h / 2, w, h, 10);
              ctx.fillStyle = "#141418";
              ctx.fill();
              ctx.lineWidth = 1.6;
              ctx.strokeStyle = borderHex;
              ctx.stroke();

              ctx.font = "800 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
              ctx.fillStyle = titleHex;
              ctx.textAlign = "left";
              ctx.textBaseline = "top";
              ctx.fillText(title, -w / 2 + 32, -h / 2 + 34);
            
              ctx.font = "500 22px ui-monospace, 'Cascadia Code', Consolas, monospace";
              ctx.fillStyle = "#969590";
              ctx.fillText(sub, -w / 2 + 32, -h / 2 + 86);
              ctx.restore();
            };

            drawSmoothAICard(LEFT_COL_X, 820, COL_W, 154, "Gemini Code", "1 prompt masuk", "rgba(110, 168, 254, 0.48)", "#6ea8fe", 64.60);
            drawSmoothAICard(RIGHT_COL_X, 820, COL_W, 154, "Claude Code", "1 prompt masuk", "rgba(224, 122, 95, 0.48)", "#e07a5f", 64.72);
          }

          // STEMPEL GOLD: "1× KIRIM · 0 REVISI" (66.50s - 70.00s)
          if (time >= 66.50) {
            const raw = clamp((time - 66.50) / 0.60, 0, 1);
            const ease = softBounceOut(raw, 1.15);
            const stampScale = lerp(0.90, 1.0, ease);
            const stampAlpha = smoothstep(0, 0.30, raw);

            const stW = 540, stH = 68;
            const stCX = W / 2;
            const stCY = lerp(1116, 1094, ease);

            ctx.save();
            ctx.globalAlpha = stampAlpha;
            ctx.translate(stCX, stCY);
            ctx.rotate(-3.2 * (Math.PI / 180));
            ctx.scale(stampScale, stampScale);

            roundRect(ctx, -stW / 2, -stH / 2, stW, stH, 10);
            ctx.fillStyle = "#161410";
            ctx.fill();
            ctx.lineWidth = 2.4;
            ctx.strokeStyle = "#ebb343";
            ctx.stroke();

            ctx.font = "800 31px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
            ctx.fillStyle = "#f4f3ef";
            ctx.textBaseline = "middle";
            fillTrackedText("1× KIRIM  ·  0 REVISI", 0, 1, 2.2, "center");
            ctx.restore();
          }
        }

        // FOOTER HALAMAN 1
        const footY = 1834;
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#6e6d68";

        const mm = String(Math.floor(time)).padStart(2, "0");
        const ff = String(Math.floor((time % 1) * FPS)).padStart(2, "0");
        fillTrackedText(`00:${mm}:${ff}`, 48, footY, 1.2, "left");

        ctx.fillStyle = "#ebb343";
        ctx.fillRect(152, footY - 4, 7, 7);

        ctx.fillStyle = "#6e6d68";

      // =======================================================================
      // PART 2: FUNGSI RENDER HALAMAN 2 (PROSES EKSEKUSI & AUDIT OBJEKTIF)
      // =======================================================================
      function drawPage2Frame(t2) {
        const time = clamp(Number(t2) || 0, 0, 18.0);

        // 1. Latar Belakang Warm Obsidian (#0f0f11)
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        const topWash = ctx.createRadialGradient(340, 260, 20, 340, 260, 680);
