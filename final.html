        ctx.fillStyle = "#141418";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = borderCol;
        ctx.stroke();

        // Aksen garis tipis di puncak kartu
        ctx.fillStyle = accent;
        roundRect(ctx, bx + 28, by, 72, 3, 1.5);
        ctx.fill();

        // Logo vektor asli + Nama Model
        if (isGemini) drawGeminiSparkleLogo(bx + 44, by + 56, 17, time * 1.1, 1);
        else drawClaudeSunburstLogo(bx + 44, by + 56, 16, time * 1.4, accent, 1);

        ctx.font = "800 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = accent;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(isGemini ? "Gemini Code" : "Claude Code", bx + 74, by + 57);

        // Garis tipis pemisah
        ctx.fillStyle = "#22222b";
        ctx.fillRect(bx + 28, by + 98, w - 56, 1);

        // Status bersih 1 baris + pill kecil di kanan
        ctx.font = "500 20px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#d8d7d2";
        ctx.fillText("1 prompt masuk", bx + 28, by + 136);

        ctx.font = "500 15px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#7c7b76";
        ctx.fillText(isGemini ? "Carbon · High" : "Opus 5.5 · Extra", bx + 28, by + 168);

        ctx.font = "700 14px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#5ce6a0";
        ctx.textAlign = "right";
        ctx.fillText("● READY", bx + w - 28, by + 136);

        ctx.restore();
      }

      // Garis Konektor Hairline Minimalis (Dari Input Bar -> 2 Kartu AI)
      function drawCleanDispatchLines(prog, exitAlpha) {
        if (prog <= 0.01 || exitAlpha <= 0.01) return;
        const alpha = smootherstep(0, 0.55, prog) * exitAlpha;
        ctx.save();
        ctx.globalAlpha *= alpha;

        const startX = W / 2, startY = 1280;
        const leftX = LEFT_COL_X + COL_W / 2, rightX = RIGHT_COL_X + COL_W / 2;
        const endY = 972;

        const drawCurve = (tx, col) => {
          const grad = ctx.createLinearGradient(startX, startY, tx, endY);
          grad.addColorStop(0, "rgba(235, 179, 67, 0.35)");
          grad.addColorStop(1, col);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.bezierCurveTo(startX, 1125, tx, 1125, tx, endY);
          ctx.stroke();
        };

        drawCurve(leftX,  "rgba(110, 168, 254, 0.45)");
        drawCurve(rightX, "rgba(224, 122, 95, 0.45)");
        ctx.restore();
      }

      // =======================================================================
      // 5. FUNGSI UTAMA: drawFrame(t) — CLEAN EDITORIAL PAGE 1 (0.00s - 26.00s)
      //    0.00 -  1.15s : Masuk halus bertahap (Frame -> Badges -> Judul -> Editor)
      //    1.20 - 10.40s : Ketik halus + smooth continuous scroll (9.20s)
      //   10.40 - 11.45s : Scroll santai balik ke atas (1.05s)
      //   11.45 - 18.25s : Iris Kaca Kuning memindai 5 poin inti (1.35s / poin)
      //   18.25 - 20.35s : Scroll balik ke baris 1 + Lipat super mulus ke Bar Input
      //   20.35 - 22.05s : Kursor meluncur & klik Kirim [↑] + kapsul prompt.txt
      //   21.85 - 25.05s : 2 Kartu AI + Stempel Emas "1× KIRIM · 0 REVISI" + Hold nyaman
      //   25.05 - 26.00s : Keluar halus (0.95s smooth exit siap masuk ke Page 2!)
      // =======================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, DURATION);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(SSAA, SSAA);

        // Smooth Exit Factor di 0.95 detik terakhir (25.05s - 26.00s)
        const contentExit = 1 - smootherstep(25.05, 25.95, time);
        const exitShiftY  = smootherstep(25.05, 25.95, time) * -18;

        // 1. Latar Warm Obsidian (#0f0f11) + Cahaya Atmosfer Halus
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        const studioIn = smootherstep(0.0, 0.75, time);
        const dispatchMood = smootherstep(21.30, 22.20, time) * contentExit;

        const goldWash = ctx.createRadialGradient(W / 2, 740, 40, W / 2, 740, 760);
        goldWash.addColorStop(0, `rgba(235, 179, 67, ${(0.048 * studioIn * (1 - dispatchMood * 0.4)).toFixed(4)})`);
        goldWash.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = goldWash;
        ctx.fillRect(0, 0, W, H);

        if (dispatchMood > 0.01) {
          const lG = ctx.createRadialGradient(260, 840, 40, 260, 840, 560);
          lG.addColorStop(0, `rgba(110, 168, 254, ${(dispatchMood * 0.065).toFixed(4)})`);
          lG.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = lG; ctx.fillRect(0, 0, W, H);

          const rG = ctx.createRadialGradient(820, 840, 40, 820, 840, 560);
          rG.addColorStop(0, `rgba(224, 122, 95, ${(dispatchMood * 0.065).toFixed(4)})`);
          rG.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = rG; ctx.fillRect(0, 0, W, H);
        }

        // 2. Grid Editorial Hairline (1px) — Tetap tenang saat keluar untuk handover mulus
        ctx.save();
        ctx.globalAlpha = studioIn;
        ctx.strokeStyle = "#1e1e23";
        ctx.lineWidth = 1;
        ctx.strokeRect(24.5, 44.5, W - 49, H - 89);

        ctx.fillStyle = "#1e1e23";
        ctx.fillRect(24, 122, W - 48, 1);
        ctx.fillRect(24, 1792, W - 48, 1);

        // Garis tengah vertikal hanya di zona header (tidak menabrak kartu editor/bar)
        ctx.fillStyle = "#1d1d22";
        ctx.fillRect(539.5, 44, 1, 212);

        // Garis progress ultra-tipis (1.5px, tanpa kotak-kotak ramai)
        ctx.fillStyle = "#ebb343";
        ctx.fillRect(24, 121.5, (W - 48) * (time / DURATION), 1.5);

        drawCrosshair(540, 122, 4, "#36363f");
        drawCrosshair(540, 1792, 4, "#36363f");

        // 3. Masthead Atas
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ebb343";
        ctx.fillRect(48, 80, 6, 6);
        ctx.fillStyle = "#7c7b76";
        fillTrackedText("JOULFIAND STUDIO  ·  ADU MODEL", 66, 83.5, 1.8, "left");
        ctx.fillStyle = "#969590";
        fillTrackedText("01 — SOAL  ·  1 SHOT", W - 48, 83.5, 1.8, "right");
        ctx.restore();

        // 4. Model Badges (GEMINI Carbon · High | CLAUDE Opus 5.5 · Extra)
        const gemIn = clamp((time - 0.12) / 0.72, 0, 1);
        const claIn = clamp((time - 0.24) / 0.72, 0, 1);
        drawModelBadge(LEFT_COL_X,  162, COL_W, 56, "#6ea8fe", "GEMINI", "Carbon · High",    gemIn, dispatchMood * 0.75);
        drawModelBadge(RIGHT_COL_X, 162, COL_W, 56, "#e07a5f", "CLAUDE", "Opus 5.5 · Extra", claIn, dispatchMood * 0.75);

        // 5. Kicker & Judul Utama (Masuk halus 0.32s-1.08s, Keluar halus 25.05s-25.95s)
        const headIn = clamp((time - 0.32) / 0.76, 0, 1);
        const headAlpha = smootherstep(0, 0.55, headIn) * contentExit;
        if (headAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = headAlpha;
          ctx.translate(0, (1 - easeOutQuart(headIn)) * 22 + exitShiftY);

          roundRect(ctx, LEFT_COL_X, 266, 11, 11, 2.5);
          ctx.fillStyle = "#ebb343";
          ctx.fill();

          ctx.font = "600 19px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.fillStyle = "#8f8d87";
          ctx.textBaseline = "middle";
          fillTrackedText("SOALNYA", LEFT_COL_X + 22, 272, 2.0, "left");

          ctx.font = "900 74px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "top";
          ctx.textAlign = "left";
          ctx.fillStyle = "#f5f4f0";
          ctx.fillText("Satu prompt,", LEFT_COL_X, 302);

          const p1 = "sama ";
          ctx.fillText(p1, LEFT_COL_X, 386);
          ctx.fillStyle = "#ebb343";
          ctx.fillText("persis.", LEFT_COL_X + ctx.measureText(p1).width, 386);
          ctx.restore();
        }

        // 6. Single-Row Minimalist Spec Strip (5 pill rapi di bawah editor)
        const stripIn  = smootherstep(0.65, 1.30, time);
        const stripOut = 1 - smootherstep(18.15, 18.85, time);
        drawMinimalSpecStrip(time, stripIn * stripOut);

        // 7. Garis Konektor Halus ke 2 Kartu AI
        drawCleanDispatchLines(clamp((time - 21.65) / 0.70, 0, 1), contentExit);

        // 8. KARTU PROMPT.TXT -> MELIPAT SUPER HALUS KE BAR INPUT BAWAH
        //    Masuk: 0.48s..1.20s | Persiapan lipat: 18.45s..19.15s | Lipat: 19.00s..20.30s
        const cardInRaw     = clamp((time - 0.48) / 0.72, 0, 1);
        const cardInAlpha   = smootherstep(0, 0.55, cardInRaw) * contentExit;
        const prepFade      = smootherstep(18.45, 19.15, time);
        const slideToBottom = smootherstep(19.00, 20.30, time);

        const cardX = LEFT_COL_X, cardW = 984;
        const cardY = lerp(526, 1280, slideToBottom) + (1 - easeOutQuart(cardInRaw)) * 26 + exitShiftY;
        const cardH = lerp(642, 92, smootherstep(18.85, 20.25, time));

        if (cardInAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = cardInAlpha;

          ctx.shadowColor = "rgba(0, 0, 0, 0.58)";
          ctx.shadowBlur = 30;
          ctx.shadowOffsetY = 10;
          roundRect(ctx, cardX, cardY, cardW, cardH, 12);
          ctx.fillStyle = "#141418";
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          ctx.lineWidth = 1.5;
          ctx.strokeStyle = slideToBottom > 0.5 ? "#30303b" : "#262630";
          ctx.stroke();

          // A. ISI EDITOR PROMPT.TXT
          if (slideToBottom < 0.98) {
            const headerAlpha = 1 - prepFade;
            const headerH = lerp(54, 0, smootherstep(18.85, 19.85, time));

            if (headerAlpha > 0.01) {
              ctx.save();
              ctx.globalAlpha = cardInAlpha * headerAlpha;
              ctx.fillStyle = "#19191f";
              roundRect(ctx, cardX + 1, cardY + 1, cardW - 2, 54, 11);
              ctx.fill();
              ctx.fillStyle = "#24242d";
              ctx.fillRect(cardX, cardY + 54, cardW, 1);

              ctx.font = "600 19.5px ui-monospace, 'Cascadia Code', Consolas, monospace";
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              ctx.fillStyle = "#e6e5e0";
              ctx.fillText("prompt.txt", cardX + 28, cardY + 28);

              ctx.font = "500 16.5px ui-monospace, 'Cascadia Code', Consolas, monospace";
              ctx.textAlign = "right";
              ctx.fillStyle = "#7c7b75";
              ctx.fillText(`${PROMPT_LINES.length} baris  ·  sama untuk keduanya`, cardX + cardW - 28, cardY + 28);
              ctx.restore();
            }

            const bodyTop = cardY + headerH;
            const bodyH = Math.max(10, cardH - headerH);
            ctx.save();
            ctx.beginPath();
            ctx.rect(cardX + 2, bodyTop, cardW - 4, bodyH);
            ctx.clip();

            const lineH = 34;
            const gutterW = lerp(48, 0, slideToBottom);
            const padX = cardX + 28 + gutterW;
            const textStartY = bodyTop + lerp(24, 34, slideToBottom);
            const maxScroll = Math.max(0, PROMPT_LINES.length * lineH - (588 - 44));

            const exactChars = getExactTypedChars(time);
            const fullTypedChars = Math.floor(exactChars);
            const charFrac = exactChars - fullTypedChars;

            let continuousTypedLine = 0;
            for (let i = 0; i < PROMPT_LINES.length; i++) {
              const off = LINE_CHAR_OFFSETS[i];
              const len = Math.max(1, PROMPT_LINES[i].length);
              if (exactChars >= off) continuousTypedLine = i + clamp((exactChars - off) / len, 0, 1);
            }

            // Smooth Continuous Scroll (0% sentakan antar fase!)
            let scrollY = 0;
            if (time < 10.40) {
              const rawDesired = (continuousTypedLine + 1.8) * lineH - (588 - 44);
              // Soft knee masuk ke area scroll agar mulai bergulir secara halus
              const excess = Math.max(0, rawDesired);
              scrollY = clamp(excess, 0, maxScroll);
            } else if (time < 11.40) {
              scrollY = lerp(maxScroll, 0, smootherstep(10.40, 11.35, time));
            } else if (time < 18.20) {
              let sIdx = 0;
              for (let s = 0; s < SCAN_TARGETS.length - 1; s++) if (time >= SCAN_TARGETS[s].tLock) sIdx = s;
              const sNext = Math.min(SCAN_TARGETS.length - 1, sIdx + 1);
              // Mulai meluncur halus setelah hold 0.72s di tiap poin!
              const tStartGlide = SCAN_TARGETS[sIdx].tLock + 0.72;
              const tEndGlide   = SCAN_TARGETS[sNext].tLock;
              const k = sIdx === sNext ? 0 : smootherstep(tStartGlide, tEndGlide, time);
              const smoothLine = lerp(SCAN_TARGETS[sIdx].line, SCAN_TARGETS[sNext].line, k);
              scrollY = clamp((smoothLine - 4.5) * lineH, 0, maxScroll);
            } else {
              const startUp = clamp((SCAN_TARGETS[SCAN_TARGETS.length - 1].line - 4.5) * lineH, 0, maxScroll);
              scrollY = lerp(startUp, 0, smootherstep(18.20, 18.95, time));
            }

            const otherLinesAlpha = (1 - prepFade) * (1 - slideToBottom);

            ctx.font = "400 21px ui-monospace, 'Cascadia Code', Consolas, monospace";
            ctx.textBaseline = "top";
            ctx.textAlign = "left";

            // Highlight lembut pada 5 poin yang sudah dikunci Iris
            if (time >= 11.42 && time <= 19.05) {
              const fadeOutHL = 1 - smootherstep(18.30, 18.95, time);
              for (const st of SCAN_TARGETS) {
                if (time >= st.tLock - 0.10) {
                  const hlAlpha = smootherstep(st.tLock - 0.10, st.tLock + 0.22, time) * fadeOutHL;
                  const lineStr = PROMPT_LINES[st.line];
                  const colIdx = lineStr.indexOf(st.phrase);
                  if (colIdx >= 0) {
                    const preW = ctx.measureText(lineStr.slice(0, colIdx)).width;
                    const phrW = ctx.measureText(st.phrase).width;
                    ctx.save();
                    ctx.globalAlpha = cardInAlpha * hlAlpha;
                    roundRect(ctx, padX + preW - 6, textStartY + st.line * lineH - scrollY - 4, phrW + 12, 30, 4);
                    ctx.fillStyle = "rgba(235, 179, 67, 0.18)"; ctx.fill();
                    ctx.strokeStyle = "rgba(235, 179, 67, 0.44)"; ctx.lineWidth = 1.2; ctx.stroke();
                    ctx.restore();
                  }
                }
              }
            }

            // Render Baris Teks + Nomor Baris Sangat Halus
            let cursorDrawn = false;
            for (let i = 0; i < PROMPT_LINES.length; i++) {
              const lineOffset = LINE_CHAR_OFFSETS[i];
              const fullLine = PROMPT_LINES[i];
              if (exactChars < lineOffset) break;

              const lineAlpha = i === 0 ? (1 - smootherstep(19.35, 19.95, time)) : otherLinesAlpha;
              if (lineAlpha <= 0.01) continue;

              const charsInLine = clamp(fullTypedChars - lineOffset, 0, fullLine.length);
              const visibleStr = fullLine.slice(0, charsInLine);
              const ly = textStartY + i * lineH - scrollY;

              if (ly + lineH >= bodyTop - 15 && ly <= bodyTop + bodyH + 15) {
                ctx.save();

                if (otherLinesAlpha > 0.02) {
                  ctx.globalAlpha = cardInAlpha * otherLinesAlpha;
                  ctx.font = "500 15.5px ui-monospace, Consolas, monospace";
                  ctx.fillStyle = "#3e3e48";
                  ctx.textAlign = "right";
                  ctx.fillText(String(i + 1).padStart(2, "0"), cardX + 54, ly + 4);
                  ctx.textAlign = "left";
                  ctx.font = "400 21px ui-monospace, 'Cascadia Code', Consolas, monospace";
                }

                const isSectionHdr = fullLine === "Struktur 3 adegan:" || fullLine === "Ketentuan teknis:" || fullLine.startsWith("Keluaran akhir:");
                ctx.globalAlpha = cardInAlpha * lineAlpha;
                ctx.fillStyle = isSectionHdr ? "#ebb343" : "#d8d7d2";
                ctx.fillText(visibleStr, padX, ly);

                const isTypingThisLine = fullTypedChars >= lineOffset && fullTypedChars < lineOffset + fullLine.length;
                if (isTypingThisLine && charFrac > 0.02) {
                  const prefixW = ctx.measureText(visibleStr).width;
                  ctx.globalAlpha = cardInAlpha * lineAlpha * charFrac;
                  ctx.fillText(fullLine[charsInLine], padX + prefixW, ly);
                }

                if (time >= 11.42 && time <= 18.98) {
                  const hlFade = 1 - smootherstep(18.30, 18.95, time);
                  for (const st of SCAN_TARGETS) {
                    if (st.line === i && time >= st.tLock - 0.05) {
                      const colIdx = fullLine.indexOf(st.phrase);
                      if (colIdx >= 0) {
                        const preW = ctx.measureText(fullLine.slice(0, colIdx)).width;
                        ctx.globalAlpha = cardInAlpha * lineAlpha * hlFade;
                        ctx.fillStyle = "#ffe896";
                        ctx.fillText(st.phrase, padX + preW, ly);
                      }
                    }
                  }
                }
                ctx.restore();
              }

              if (!cursorDrawn && (fullTypedChars <= lineOffset + fullLine.length || i === PROMPT_LINES.length - 1)) {
                cursorDrawn = true;
                if (time < 10.90) {
                  const blink = time < 10.40 || Math.sin(time * 9) > -0.2;
                  if (blink) {
                    const baseW = ctx.measureText(visibleStr).width;
                    const nextChW = (fullTypedChars < lineOffset + fullLine.length)
                      ? ctx.measureText(fullLine[charsInLine] || "").width * charFrac : 0;
                    ctx.fillStyle = "#ebb343";
                    roundRect(ctx, padX + baseW + nextChW + 3, ly + 2, 10, 22, 2);
                    ctx.fill();
                  }
                }
              }
            }

            // Kotak Iris Kaca Kuning (Glide 0.58s + Hold 0.77s di tiap poin!)
            if (time >= 11.20 && time <= 18.45) {
              const irisAlpha = smootherstep(11.20, 11.55, time) * (1 - smootherstep(17.90, 18.42, time));
              let idxA = 0;
              for (let s = 0; s < SCAN_TARGETS.length - 1; s++) if (time >= SCAN_TARGETS[s].tLock) idxA = s;
              const idxB = Math.min(SCAN_TARGETS.length - 1, idxA + 1);
              const tStartGlide = SCAN_TARGETS[idxA].tLock + 0.72;
              const tEndGlide   = SCAN_TARGETS[idxB].tLock;
              const moveK = idxA === idxB ? 0 : smootherstep(tStartGlide, tEndGlide, time);

              const rectFor = (st) => {
                const lStr = PROMPT_LINES[st.line];
                const cIdx = Math.max(0, lStr.indexOf(st.phrase));
                return {
                  x: padX + ctx.measureText(lStr.slice(0, cIdx)).width - 8,
                  y: textStartY + st.line * lineH - scrollY - 5,
                  w: ctx.measureText(st.phrase).width + 16,
                  h: 32, tag: st.tag
                };
              };
              const rA = rectFor(SCAN_TARGETS[idxA]), rB = rectFor(SCAN_TARGETS[idxB]);
              drawIrisScannerBox(
                lerp(rA.x, rB.x, moveK), lerp(rA.y, rB.y, moveK),
                lerp(rA.w, rB.w, moveK), lerp(rA.h, rB.h, moveK),
                moveK > 0.5 ? rB.tag : rA.tag, irisAlpha
              );
            }

            // Soft Top & Bottom Scroll Fades + Scrollbar Tipis
            if (otherLinesAlpha > 0.05) {
              ctx.save();
              ctx.globalAlpha = cardInAlpha * otherLinesAlpha;
              if (scrollY > 4) {
                const topFade = ctx.createLinearGradient(0, bodyTop, 0, bodyTop + 32);
                topFade.addColorStop(0, "rgba(20, 20, 24, 0.95)");
                topFade.addColorStop(1, "rgba(20, 20, 24, 0)");
                ctx.fillStyle = topFade;
                ctx.fillRect(cardX + 2, bodyTop, cardW - 4, 32);
              }
              const botFade = ctx.createLinearGradient(0, bodyTop + bodyH - 38, 0, bodyTop + bodyH);
              botFade.addColorStop(0, "rgba(20, 20, 24, 0)");
              botFade.addColorStop(1, "rgba(20, 20, 24, 0.95)");
              ctx.fillStyle = botFade;
              ctx.fillRect(cardX + 2, bodyTop + bodyH - 38, cardW - 4, 38);

              const sbTrackH = bodyH - 24;
              const sbThumbH = Math.max(48, (bodyH / (PROMPT_LINES.length * lineH)) * sbTrackH);
              const sbThumbY = bodyTop + 12 + (maxScroll > 0 ? (scrollY / maxScroll) * (sbTrackH - sbThumbH) : 0);
              roundRect(ctx, cardX + cardW - 10, sbThumbY, 4, sbThumbH, 2);
              ctx.fillStyle = "#363642";
              ctx.fill();
              ctx.restore();
            }

            ctx.restore();
          }

          // B. BAR INPUT RINGKAS + TOMBOL KIRIM EMAS [↑]
          if (slideToBottom > 0.35) {
            const barAlpha = smootherstep(0.35, 0.92, slideToBottom);
            ctx.save();
            ctx.globalAlpha = barAlpha;

            ctx.font = "400 23px ui-monospace, 'Cascadia Code', Consolas, monospace";
            ctx.fillStyle = "#e6e5e0";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText("Buat video animasi pixel art vertikal be…", cardX + 32, cardY + cardH / 2 + 1);

            const btnSize = 58;
            const btnX = cardX + cardW - btnSize - 17;
            const btnY = cardY + (cardH - btnSize) / 2;

            let btnScale = smootherstep(19.85, 20.30, time);
            if (time >= 21.25 && time <= 21.85) {
              const dt = time - 21.25;
              btnScale = dt < 0.10
                ? lerp(1.0, 0.92, easeOutCubic(dt / 0.10))
                : lerp(0.92, 1.0, gentleSettleOut(clamp((dt - 0.10) / 0.48, 0, 1), 0.70));
            }

            ctx.save();
            ctx.translate(btnX + btnSize / 2, btnY + btnSize / 2);
            ctx.scale(btnScale, btnScale);
            roundRect(ctx, -btnSize / 2, -btnSize / 2, btnSize, btnSize, 12);
            ctx.fillStyle = "#ebb343"; ctx.fill();
            ctx.strokeStyle = "#111215"; ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(0, 11); ctx.lineTo(0, -11);
            ctx.moveTo(-9, -2); ctx.lineTo(0, -11); ctx.lineTo(9, -2);
            ctx.stroke();
            ctx.restore();

            ctx.restore();
          }

          ctx.restore();
        }

        // 9. KURSOR MELUNCUR HALUS & KLIK TOMBOL KIRIM (20.35s - 22.35s)
        const btnCenterX = LEFT_COL_X + 984 - 17 - 29;
        const btnCenterY = 1280 + 46;

        if (time >= 21.28 && time <= 22.25) {
          const rProg = clamp((time - 21.28) / 0.95, 0, 1);
          const rAlpha = Math.pow(1 - rProg, 1.65) * contentExit;
          ctx.save();
          ctx.beginPath();
          ctx.arc(btnCenterX, btnCenterY, 22 + easeOutCubic(rProg) * 108, 0, Math.PI * 2);

          tx: x, ty: y + bounce * 0.38 + Math.sin(time * 2.8) * 0.08, tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * (1 + bounce * 0.05 - breathe * 0.4),
          sy: scale * (1 - bounce * 0.04 + breathe),
          sz: scale * (1 + bounce * 0.03)
        };
        const baseOpts = { rimRgb: ROGER_RIM, rimDir: ROGER_RIMDIR, dimFactor };

        const legXs = [-3.35, -1.20, 1.20, 3.35];
        for (let i = 0; i < 4; i++) {
          const stepLift = Math.max(0, Math.sin(time * 8.4 + i * 1.55)) * 0.25 * speakEnergy;
          pushBoxQuads(quads, legXs[i], -2.25 + stepLift, 0, 1.38, 2.50, 1.85, ROGER_ORANGE, null, worldTf, { ...baseOpts, layer: 0 });
        }

        const leftArmLayer = yaw < 0 ? 1 : 4;
        const rightArmLayer = yaw < 0 ? 4 : 1;

        let leftArmAng = -0.08 + Math.sin(time * 3.8) * 0.08 * (0.35 + speakEnergy);
        if (waveLeft > 0.01) leftArmAng = lerp(leftArmAng, -0.82 - Math.sin(time * 14.5) * 0.32, waveLeft);
        pushBoxQuads(quads, -0.82, 0, 0, 1.75, 2.05, 1.95, ROGER_ORANGE,
          { tx: -4.8, ty: 1.55, tz: 0, rx: 0, ry: 0, rz: leftArmAng, sx: 1, sy: 1, sz: 1 },
          worldTf, { ...baseOpts, layer: leftArmLayer });

        let rightArmAng = 0.08 - Math.sin(time * 3.8) * 0.08 * (0.35 + speakEnergy);
        if (waveRight > 0.01) rightArmAng = lerp(rightArmAng, 0.85 + Math.sin(time * 14.5) * 0.34, waveRight);
        pushBoxQuads(quads, 0.82, 0, 0, 1.75, 2.05, 1.95, ROGER_ORANGE,
          { tx: 4.8, ty: 1.55, tz: 0, rx: 0, ry: 0, rz: rightArmAng, sx: 1, sy: 1, sz: 1 },
          worldTf, { ...baseOpts, layer: rightArmLayer });

        pushBoxQuads(quads, 0, 1.85, 0, 9.6, 6.2, 4.1, ROGER_ORANGE, null, worldTf, { ...baseOpts, layer: 2 });

        const eyeZ = 2.26, eyeBaseY = 2.55, shiftX = clamp(lookX, -1, 1) * 0.45;
        for (const side of [-1, 1]) {
          const ex = side * 2.55 + shiftX;
          if (happyAmount > 0.55) {
            pushBoxQuads(quads, 0, 0, 0, 0.96, 0.40, 0.45, ROGER_EYE,
              { tx: ex - 0.38, ty: eyeBaseY + 0.14, tz: eyeZ, rx: 0, ry: 0, rz: 0.44, sx: 1, sy: 1, sz: 1 }, worldTf, { ...baseOpts, layer: 3 });
            pushBoxQuads(quads, 0, 0, 0, 0.96, 0.40, 0.45, ROGER_EYE,
              { tx: ex + 0.38, ty: eyeBaseY + 0.14, tz: eyeZ, rx: 0, ry: 0, rz: -0.44, sx: 1, sy: 1, sz: 1 }, worldTf, { ...baseOpts, layer: 3 });
          } else {
            const eyeH = lerp(1.54 * (1 + excitedAmount * 0.14), 0.22, blinkAmount);
            pushBoxQuads(quads, ex, eyeBaseY, eyeZ, 1.52, eyeH, 0.58, ROGER_EYE, null, worldTf, { ...baseOpts, layer: 3 });
            if (blinkAmount < 0.40) {
              const ss = 1 + excitedAmount * 0.22;
              pushBoxQuads(quads, ex - 0.32 + shiftX * 0.24, eyeBaseY + 0.32, eyeZ + 0.31, 0.40 * ss, 0.40 * ss, 0.08, ROGER_SHINE, null, worldTf,
                { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
              pushBoxQuads(quads, ex + 0.28 + shiftX * 0.16, eyeBaseY - 0.26, eyeZ + 0.31, 0.22, 0.22, 0.08, ROGER_SHINE, null, worldTf,
                { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
            }
          }
          const browLift = happyAmount * 0.42 + excitedAmount * 0.48;
          const browTilt = side === -1 ? (happyAmount * 0.16 + excitedAmount * 0.18) : (-happyAmount * 0.16 - excitedAmount * 0.18);
          pushBoxQuads(quads, 0, 0, 0, 1.72, 0.30, 0.34, ROGER_BROW,
            { tx: ex, ty: eyeBaseY + 1.24 + browLift, tz: eyeZ + 0.08, rx: 0, ry: 0, rz: browTilt, sx: 1, sy: 1, sz: 1 },
            worldTf, { ...baseOpts, layer: 3.6 });
        }

        if (blushAmount > 0.08) {
          pushBoxQuads(quads, -3.45 + shiftX * 0.35, 1.22, 2.14, 1.15 * blushAmount, 0.46 * blushAmount, 0.14, ROGER_BLUSH, null, worldTf,
            { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.2, unlit: true, dimFactor });
          pushBoxQuads(quads,  3.45 + shiftX * 0.35, 1.22, 2.14, 1.15 * blushAmount, 0.46 * blushAmount, 0.14, ROGER_BLUSH, null, worldTf,
            { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.2, unlit: true, dimFactor });
        }
        return quads;
      }

      // --- MODEL 3D MERRY (GEMINI AGENT · KIRI) ---
      const MERRY_GRID = [
        ".....KKKKKK.....", "...KKGGYYRRKK...", "..KGGGYYORRRRK..", "..KGGCCCCRRRRK..",
        ".KGGCCCCCCCCRRK.", ".KGBBCCCCCCBBBK.", ".KBBWEBBBBWEBBK.", ".KBBEEBBBBEEBBK.",
        "KBBPPBBMMBBPPBBK", "KBBBBBMTTMBBBBBK", "KBBBBBKKKKBBBBBK", "KBBBBK....KBBBBK",
        "KBBBK......KBBBK", "KBBBK......KBBBK", ".KKK........KKK."
      ];
      const MERRY_COLORS = {
        K: hexToRgb("#0c1328"), B: hexToRgb("#1d63ff"), C: hexToRgb("#38bdf8"),
        G: hexToRgb("#22c55e"), Y: hexToRgb("#facc15"), O: hexToRgb("#fb923c"),
        R: hexToRgb("#ef4444"), E: hexToRgb("#090d1c"), W: hexToRgb("#ffffff"),
        P: hexToRgb("#f472b6"), M: hexToRgb("#0a0e1d"), T: hexToRgb("#fb7185")
      };
      const MERRY_RIM    = hexToRgb("#93c5fd");
      const MERRY_RIMDIR = normalize3([-0.75, 0.38, -0.30]);
      const MERRY_ROWS = MERRY_GRID.length, MERRY_COLS = MERRY_GRID[0].length;
      const MERRY_VOXEL_META = [];
      for (let r = 0; r < MERRY_ROWS; r++) {
        for (let c = 0; c < MERRY_COLS; c++) {
          const ch = MERRY_GRID[r][c];
          if (ch === ".") continue;
          const solid = (rr, cc) => rr >= 0 && rr < MERRY_ROWS && cc >= 0 && cc < MERRY_COLS && MERRY_GRID[rr][cc] !== ".";
          MERRY_VOXEL_META.push({
            r, c, ch,
            faceMask: [1, 1, solid(r, c + 1) ? 0 : 1, solid(r, c - 1) ? 0 : 1, solid(r - 1, c) ? 0 : 1, solid(r + 1, c) ? 0 : 1]
          });
        }
      }
      const MERRY_SPARKLES = [
        { ang: 0.4, rad: 6.0, yOff:  3.4, size: 0.65, col: hexToRgb("#facc15"), isPlus: true  },
        { ang: 1.8, rad: 5.4, yOff:  4.0, size: 0.50, col: hexToRgb("#38bdf8"), isPlus: false },
        { ang: 3.1, rad: 5.8, yOff:  0.8, size: 0.52, col: hexToRgb("#22c55e"), isPlus: false },
        { ang: 4.5, rad: 5.6, yOff: -1.4, size: 0.54, col: hexToRgb("#ef4444"), isPlus: false },
        { ang: 5.6, rad: 5.7, yOff:  2.0, size: 0.48, col: hexToRgb("#f472b6"), isPlus: false }
      ];

      function buildMerryQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale,
          speakEnergy = 0, wavePhase = 0, blinkAmount = 0,
          happyEyes = 0, lookRight = 0, excitedHop = 0, dimFactor = 1
        } = pose;

        const hop = Math.abs(Math.sin(time * 8.2)) * speakEnergy + excitedHop * Math.abs(Math.sin(time * 11.5)) * 0.55;
        const breathe = Math.sin(time * 3.1 + 1.0) * 0.015;
        const worldTf = {
          tx: x, ty: y + hop * 0.44 + Math.sin(time * 3.0 + 0.8) * 0.10, tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * (1 + hop * 0.05 - breathe * 0.4),
          sy: scale * (1 - hop * 0.04 + breathe),
          sz: scale * (1 + hop * 0.03)
        };

        const vSize = 0.62, vDepth = 2.60;
        const mouthOpen = speakEnergy > 0.10 ? (Math.sin(time * 18.0) > -0.22) : (happyEyes > 0.5);
        const eyesClosed = blinkAmount > 0.55;

        for (let i = 0; i < MERRY_VOXEL_META.length; i++) {
          const vm = MERRY_VOXEL_META[i];
          let ch = vm.ch;
          const isL = (vm.r === 6 || vm.r === 7) && (vm.c === 4 || vm.c === 5);
          const isR = (vm.r === 6 || vm.r === 7) && (vm.c === 10 || vm.c === 11);
          if (isL || isR) {
            if (eyesClosed) ch = (vm.r === 7) ? "E" : "B";
            else if (happyEyes > 0.55) {
              if (isL) ch = (vm.r === 6 && vm.c === 5) || (vm.r === 7 && vm.c === 4) ? "E" : "B";
              if (isR) ch = (vm.r === 6 && vm.c === 10) || (vm.r === 7 && vm.c === 11) ? "E" : "B";
            } else if (lookRight > 0.50) {
              ch = (vm.r === 6 && (vm.c === 5 || vm.c === 11)) ? "W" : "E";
            }
          }
          if (!mouthOpen && (ch === "M" || ch === "T")) ch = (vm.r === 8 && (vm.c === 7 || vm.c === 8)) ? "M" : "B";

          const vx = (vm.c - (MERRY_COLS - 1) / 2) * vSize;
          const vy = ((MERRY_ROWS - 1) / 2 - vm.r) * vSize + 1.15;
          pushBoxQuads(quads, vx, vy, 0, vSize, vSize, vDepth, MERRY_COLORS[ch], null, worldTf, {
            faceMask: vm.faceMask, rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: 1, strokeSame: true
          });
        }

        let armAng = 0.10 + Math.sin(time * 3.8) * 0.10;
        if (wavePhase > 0.01) armAng = lerp(armAng, 0.65 + Math.sin(time * 16.5) * 0.40, wavePhase);
        const handTf = { tx: 4.32, ty: 1.25, tz: 0, rx: 0, ry: 0, rz: armAng, sx: 1, sy: 1, sz: 1 };
        const handLayer = yaw > 0.45 ? 0 : 2;
        pushBoxQuads(quads, 0.45, 0.0, 0, 0.70, 0.70, 1.30, MERRY_COLORS.K, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });
        pushBoxQuads(quads, 0.96, 0.54, 0, 0.70, 0.70, 1.30, MERRY_COLORS.W, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });
        pushBoxQuads(quads, 1.36, 1.02, 0, 0.66, 0.66, 1.30, MERRY_COLORS.K, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });

        const orbitSpeed = 0.75 + speakEnergy * 1.15 + excitedHop * 0.90;
        for (let i = 0; i < MERRY_SPARKLES.length; i++) {
          const sp = MERRY_SPARKLES[i];
          const a = sp.ang + time * orbitSpeed;
          const spZ = z + Math.sin(a) * (sp.rad * 0.50) * scale;
          const spLayer = spZ < z ? 0 : 3;
          const spTf = {
            tx: x + Math.cos(a) * sp.rad * scale,
            ty: y + (sp.yOff + Math.sin(time * 4.0 + i * 1.3) * 0.38) * scale + 1.0,
            tz: spZ, rx: time * 1.5 + i, ry: time * 1.9 + i, rz: 0,
            sx: scale, sy: scale, sz: scale
          };
          if (sp.isPlus) {
            pushBoxQuads(quads, 0, 0, 0, sp.size * 2.1, sp.size * 0.66, sp.size * 0.66, sp.col, null, spTf, { dimFactor, layer: spLayer });
            pushBoxQuads(quads, 0, 0, 0, sp.size * 0.66, sp.size * 2.1, sp.size * 0.66, sp.col, null, spTf, { dimFactor, layer: spLayer });
          } else {
            pushBoxQuads(quads, 0, 0, 0, sp.size, sp.size, sp.size, sp.col, null, spTf, { dimFactor, layer: spLayer });
          }
        }
        return quads;
      }

      // =======================================================================
      // 4. KOMPONEN UI EDITORIAL (BADGE, SPEECH CARD, IRIS, X-RAY & FEATURE LAB)
      // =======================================================================
      function drawModelBadge(x, y, w, h, accentHex, brandName, versionText, activeGlow = 0) {
        ctx.save();
        if (activeGlow > 0.02) {
          ctx.shadowColor = accentHex;
          ctx.shadowBlur = 18 * activeGlow;
        }
        roundRect(ctx, x, y, w, h, 10);
        ctx.fillStyle = "#151518";
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.lineWidth = activeGlow > 0.3 ? 1.65 : 1.25;
        ctx.strokeStyle = activeGlow > 0.3 ? accentHex : "#26262c";
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
        ctx.fillRect(x + 12, y + 1, w - 24, 1);

        roundRect(ctx, x + 22, y + (h - 13) / 2, 13, 13, 3.5);
        ctx.fillStyle = accentHex;
        ctx.fill();

        ctx.font = "800 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = accentHex;
        ctx.textBaseline = "middle";
        const brandX = x + 48;
        const brandW = fillTrackedText(brandName, brandX, y + h / 2 + 0.5, 1.2, "left");

        ctx.font = "500 19px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#8e8d88";
        ctx.textAlign = "left";
        ctx.fillText(versionText, brandX + brandW + 14, y + h / 2 + 0.5);
        ctx.restore();
      }

      function drawFloorShadow(cx, cy, rx, ry, alpha, tintRgba) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, rx * 0.10, 0, 0, rx);
        grad.addColorStop(0, `rgba(0, 0, 0, ${(0.72 * alpha).toFixed(3)})`);
        grad.addColorStop(0.58, tintRgba || `rgba(0, 0, 0, ${(0.28 * alpha).toFixed(3)})`);
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawEmoteBadge(x, y, iconType, accentHex, alpha, time) {
        if (alpha <= 0.02) return;
        const bob = Math.sin(time * 5.8) * 5;
        const sc = gentleSettleOut(clamp(alpha * 1.25, 0, 1), 0.9);
        ctx.save();
        ctx.globalAlpha *= clamp(alpha, 0, 1);
        ctx.translate(x, y + bob);
        ctx.scale(sc, sc);
        ctx.shadowColor = accentHex;
        ctx.shadowBlur = 16;
        roundRect(ctx, -24, -24, 48, 48, 12);
        ctx.fillStyle = "#16161d";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = accentHex;
        ctx.stroke();

        if (iconType === "claude") drawClaudeSunburstLogo(0, 0, 14, time * 0.8, accentHex, 1);
        else if (iconType === "gemini") drawGeminiSparkleLogo(0, 0, 14, Math.sin(time * 1.6) * 0.14, 1);
        else {
          ctx.font = "900 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = accentHex;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(iconType, 0, 2);
        }
        ctx.restore();
      }

      // Speech Card Editorial (Lebar penuh 984px sejajar dengan 2 panel atas, y = 1514..1736)
      function drawEditorialSpeechCard(opts) {
        const {
          speakerTag, roleTag, line1, line2, accentHex,
          appearProg, typeProg, time, pointerX, dualMode
        } = opts;
        if (appearProg <= 0.01) return;

        const cardX = LEFT_COL_X;
        const cardW = 984;
        const cardH = 222;
        const cardY = lerp(1542, 1514, easeOutQuart(clamp(appearProg, 0, 1)));

        ctx.save();
        ctx.globalAlpha *= smootherstep(0, 0.55, appearProg);

        // Pointer segitiga menunjuk langsung ke maskot yang sedang bicara!
        if (!dualMode && pointerX !== undefined) {
          const px = clamp(pointerX, cardX + 100, cardX + cardW - 100);
          ctx.beginPath();
          ctx.moveTo(px - 16, cardY + 2);
          ctx.lineTo(px, cardY - 16);
          ctx.lineTo(px + 16, cardY + 2);
          ctx.closePath();
          ctx.fillStyle = "#141419";
          ctx.fill();
          ctx.strokeStyle = accentHex;
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }

        ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
        ctx.shadowBlur = 32;
        ctx.shadowOffsetY = 10;
        roundRect(ctx, cardX, cardY, cardW, cardH, 14);
        ctx.fillStyle = "#141419";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.lineWidth = 1.6;
        ctx.strokeStyle = accentHex;
        ctx.stroke();

        if (!dualMode && pointerX !== undefined) {
          const px = clamp(pointerX, cardX + 100, cardX + cardW - 100);
          ctx.fillStyle = "#141419";
          ctx.fillRect(px - 14, cardY - 1, 28, 4);
        }

        // Top Bar Speech Card
        ctx.fillStyle = "#191921";
        roundRect(ctx, cardX + 2, cardY + 2, cardW - 4, 54, 12);
        ctx.fill();
        ctx.fillStyle = "#262632";
        ctx.fillRect(cardX + 2, cardY + 56, cardW - 4, 1);

        if (dualMode) {
          roundRect(ctx, cardX + 24, cardY + 22, 12, 12, 3); ctx.fillStyle = "#6ea8fe"; ctx.fill();
          roundRect(ctx, cardX + 41, cardY + 22, 12, 12, 3); ctx.fillStyle = "#e07a5f"; ctx.fill();
        } else {
          roundRect(ctx, cardX + 24, cardY + 22, 12, 12, 3); ctx.fillStyle = accentHex; ctx.fill();
        }

        const tagStartX = dualMode ? cardX + 64 : cardX + 46;
        ctx.font = "800 17.5px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = accentHex;
        ctx.textBaseline = "middle";
        const spW = fillTrackedText(speakerTag, tagStartX, cardY + 29, 1.8, "left");
        ctx.font = "500 15.5px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#8e8d88";
        ctx.fillText("  ·  " + roleTag, tagStartX + spW, cardY + 29);

        // Mini audio visualizer bar di kanan header speech card
        const wfRight = cardX + cardW - 24, wfMidY = cardY + 29;
        const talkingNow = typeProg > 0.02 && typeProg < 0.96;
        for (let b = 0; b < 12; b++) {
          const bx = wfRight - (11 - b) * 8;
          const wave = talkingNow
            ? 5 + Math.abs(Math.sin(time * 16 + b * 0.72) * Math.cos(time * 9 - b * 0.38)) * 20
            : 4 + Math.sin(time * 3.5 + b) * 1.4;
          roundRect(ctx, bx - 4, wfMidY - wave / 2, 4, wave, 2);
          ctx.fillStyle = talkingNow ? accentHex : "#3b3b46";
          ctx.fill();
        }

        // Teks dialog dengan highlight kata kunci teknis otomatis!
        const fullText = line2 ? (line1 + "\n" + line2) : line1;
        const shownStr = fullText.slice(0, Math.floor(clamp(typeProg, 0, 1) * fullText.length));
        const parts = shownStr.split("\n"), s1 = parts[0] || "", s2 = parts[1] || "";

        ctx.font = "800 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        const renderHL = (str, yPos) => {
          const kws = [
            { w: "Canvas 2D",      col: "#6ea8fe" },
            { w: "Bayer 4×4",      col: "#ebb343" },
            { w: "Uint8Array",     col: "#e07a5f" },
            { w: "6 modul ES6",    col: "#ebb343" },
            { w: "16 warna",       col: "#5ce6a0" },
            { w: "Saturn-IV",      col: "#6ea8fe" },
            { w: "Gravity Turn",   col: "#e07a5f" },
            { w: "plasma vakum",   col: "#60a5fa" },
            { w: "Bumi 3D",        col: "#ebb343" },
            { w: "paling keren?",  col: "#ebb343" }
          ];
          let best = null;
          for (const kw of kws) {
            const idx = str.indexOf(kw.w);
            if (idx >= 0 && (!best || idx < best.idx)) best = { idx, len: kw.w.length, col: kw.col };
          }
          if (!best) {
            ctx.fillStyle = "#f5f4f0";
            ctx.fillText(str, cardX + 32, yPos);
          } else {
            const p0 = str.slice(0, best.idx);
            const p1 = str.slice(best.idx, best.idx + best.len);
            const p2 = str.slice(best.idx + best.len);
            ctx.fillStyle = "#f5f4f0"; ctx.fillText(p0, cardX + 32, yPos);
            const w0 = ctx.measureText(p0).width;
            ctx.fillStyle = best.col; ctx.fillText(p1, cardX + 32 + w0, yPos);
            const w1 = ctx.measureText(p1).width;
            ctx.fillStyle = "#f5f4f0"; ctx.fillText(p2, cardX + 32 + w0 + w1, yPos);
          }
        };

        renderHL(s1, cardY + 108);
        if (s2.length > 0) renderHL(s2, cardY + 158);

        if (typeProg > 0.02 && (typeProg < 1.0 || Math.sin(time * 8) > 0)) {
          const onL2 = parts.length > 1;
          const activeStr = onL2 ? s2 : s1;
          const curY = onL2 ? cardY + 158 : cardY + 108;
          ctx.fillStyle = accentHex;
          roundRect(ctx, cardX + 32 + ctx.measureText(activeStr).width + 8, curY - 16, 4, 32, 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawIrisScannerBox(x, y, w, h, tagText, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.fillStyle = "rgba(235, 179, 67, 0.12)";
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "#ebb343";
        ctx.lineWidth = 1.7;
        ctx.strokeRect(x, y, w, h);

        const ns = 7;
        for (const [cx, cy] of [[x - ns, y - ns], [x + w, y - ns], [x - ns, y + h], [x + w, y + h]]) {
          ctx.fillStyle = "#141418";
          ctx.fillRect(cx, cy, ns, ns);
          ctx.strokeStyle = "#ffe07d";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(cx, cy, ns, ns);
        }
        if (tagText) {
          ctx.font = "800 12px ui-monospace, Consolas, monospace";
          const tw = ctx.measureText(tagText).width + 14;
          roundRect(ctx, x, y - ns - 22, tw, 20, 4);
          ctx.fillStyle = "#ebb343"; ctx.fill();
          ctx.fillStyle = "#0e0e10"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillText(tagText, x + 7, y - ns - 11.5);
        }
        ctx.restore();
      }

      // Diagram X-Ray Ringkas (muat presisi di y+234..y+430, h = 196px)
      function drawXRayBlueprint(x, y, w, h, isGemini, time) {
        ctx.save();
        roundRect(ctx, x, y, w, h, 8);
        ctx.fillStyle = "#0b0b0e";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#22222b";
        ctx.stroke();

        const accent = isGemini ? "#6ea8fe" : "#e07a5f";
        ctx.font = "700 12px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#787771";
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        fillTrackedText(isGemini ? "X-RAY · OFFSCREEN 2D" : "X-RAY · 6 MODUL + UINT8 FB", x + 14, y + 12, 0.9, "left");

        if (isGemini) {
          const b1X = x + 14, b1Y = y + 38, b1W = 186, b1H = 74;
          roundRect(ctx, b1X, b1Y, b1W, b1H, 7);
          ctx.fillStyle = "rgba(110, 168, 254, 0.09)"; ctx.fill();
          ctx.strokeStyle = accent; ctx.lineWidth = 1.3; ctx.stroke();

          ctx.font = "700 14px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#f4f3ef";
          ctx.fillText("animation.html", b1X + 12, b1Y + 13);
          ctx.font = "400 11.5px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#969590";
          ctx.fillText("bufferCanvas 270×480", b1X + 12, b1Y + 35);
          ctx.fillText("BAYER4 + Two-Stage", b1X + 12, b1Y + 51);

          const b2X = x + 14, b2Y = y + 122, b2W = 186, b2H = 56;
          roundRect(ctx, b2X, b2Y, b2W, b2H, 7);
          ctx.fillStyle = "#13141b"; ctx.fill();
          ctx.strokeStyle = "#323544"; ctx.stroke();
          ctx.font = "700 13.5px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#d8d7d2";
          ctx.fillText("render.js", b2X + 12, b2Y + 11);
          ctx.font = "400 11.5px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#8a8984";
          ctx.fillText("Playwright + WAV Synth", b2X + 12, b2Y + 31);

          const outX = x + 230, outY = y + 52, outW = 188, outH = 112;
          ctx.strokeStyle = "rgba(110, 168, 254, 0.55)"; ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(b1X + b1W, b1Y + b1H / 2); ctx.lineTo(outX, outY + 34);
          ctx.moveTo(b2X + b2W, b2Y + b2H / 2); ctx.lineTo(outX, outY + 82);
          ctx.stroke();

          const u = (time * 0.9) % 1.0;
          ctx.fillStyle = accent;
          ctx.beginPath();
          ctx.arc(lerp(b1X + b1W, outX, u), lerp(b1Y + b1H / 2, outY + 34, u), 3.2, 0, Math.PI * 2);
          ctx.fill();

          roundRect(ctx, outX, outY, outW, outH, 7);
          ctx.fillStyle = "#12141c"; ctx.fill();
          ctx.strokeStyle = accent; ctx.stroke();

          ctx.font = "700 13px ui-monospace, Consolas, monospace"; ctx.fillStyle = accent;
          ctx.fillText("4× NEAREST SCALE", outX + 12, outY + 16);
          ctx.font = "400 12px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#d8d7d2";
          ctx.fillText("16-Color PAL Lock", outX + 12, outY + 42);
          ctx.fillText("0% Anti-Alias Blur", outX + 12, outY + 62);
          ctx.fillStyle = "#5ce6a0";
          ctx.fillText("→ 1080×1920 MP4", outX + 12, outY + 86);
        } else {
          const mods = ["timeline.js", "palette.js", "util.js", "font.js", "scenes.js", "draw.js"];
          const mW = 89, mH = 40, gapX = 8, gapY = 9;
          const startX = x + 14, startY = y + 38;
          for (let i = 0; i < mods.length; i++) {
            const col = i % 2, row = Math.floor(i / 2);
            const mx = startX + col * (mW + gapX), my = startY + row * (mH + gapY);
            const pulse = Math.sin(time * 4.0 - i * 0.75) > 0.45;
            roundRect(ctx, mx, my, mW, mH, 6);
            ctx.fillStyle = pulse ? "rgba(224, 122, 95, 0.14)" : "#151418"; ctx.fill();
            ctx.lineWidth = 1.2; ctx.strokeStyle = pulse ? accent : "#302f38"; ctx.stroke();
            ctx.font = "600 11.5px ui-monospace, Consolas, monospace";
            ctx.fillStyle = pulse ? "#f4f3ef" : "#a09f9a";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(mods[i], mx + mW / 2, my + mH / 2 + 0.5);
          }

          const outX = x + 230, outY = y + 52, outW = 188, outH = 112;
          const busFromX = startX + mW * 2 + gapX;
          ctx.strokeStyle = "rgba(224, 122, 95, 0.55)"; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(busFromX, y + 108); ctx.lineTo(outX, outY + 56); ctx.stroke();

          const u = (time * 0.9 + 0.35) % 1.0;
          ctx.fillStyle = accent;
          ctx.beginPath(); ctx.arc(lerp(busFromX, outX, u), lerp(y + 108, outY + 56, u), 3.2, 0, Math.PI * 2); ctx.fill();

          roundRect(ctx, outX, outY, outW, outH, 7);
          ctx.fillStyle = "#191413"; ctx.fill();
          ctx.strokeStyle = accent; ctx.stroke();

          ctx.textAlign = "left"; ctx.textBaseline = "top";
          ctx.font = "700 13px ui-monospace, Consolas, monospace"; ctx.fillStyle = accent;
          ctx.fillText("INDEXED BUFFER", outX + 12, outY + 16);
          ctx.font = "400 12px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#d8d7d2";
          ctx.fillText("Uint8Array(129600)", outX + 12, outY + 42);
          ctx.fillText("RGBA32[idx] LUT", outX + 12, outY + 62);
          ctx.fillStyle = "#5ce6a0";
          ctx.fillText("→ 1080×1920 MP4", outX + 12, outY + 86);
        }
        ctx.restore();
      }

      // Mode B Inside Panel: Palet 16 Warna Asli + 3 Kartu Fitur Asli + Verified Bar (muat rapi di h = 716!)
      function drawFeatureAndAuditInsidePanel(x, y, w, isGemini, auditProg, activeFeatureIdx) {
        const ix = x + 18, iw = w - 36; // 432px
        const palette = isGemini ? GEMINI_PALETTE_16 : CLAUDE_PALETTE_16;
        const feats   = isGemini ? GEMINI_FEATURES : CLAUDE_FEATURES;
        const accent  = isGemini ? "#6ea8fe" : "#e07a5f";

        ctx.save();

        // 1. Palet 16 Warna Murni (8x2 kotak bersih, y+64..y+196)
        const swY = y + 64;
        roundRect(ctx, ix, swY, iw, 132, 8);
        ctx.fillStyle = "#0b0b0e"; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = "#23232c"; ctx.stroke();

        const checked = Math.min(16, Math.floor(clamp(auditProg * 2.2, 0, 1) * 16));
        ctx.font = "700 13px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#969590"; ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText("PALET 16 WARNA MURNI", ix + 14, swY + 14);
        ctx.textAlign = "right";
        ctx.fillStyle = checked === 16 ? "#5ce6a0" : "#ebb343";
        ctx.fillText(`${String(checked).padStart(2, "0")} / 16 ✓`, ix + iw - 14, swY + 14);

        const cols = 8, gap = 7, swW = (iw - 28 - gap * 7) / 8, swH = 32;
        for (let i = 0; i < 16; i++) {
          const r = Math.floor(i / cols), c = i % cols;
          const sx = ix + 14 + c * (swW + gap), sy = swY + 42 + r * (swH + 8);
          roundRect(ctx, sx, sy, swW, swH, 4);
          ctx.fillStyle = i < checked ? palette[i] : "#16161c";
          ctx.fill();
          ctx.lineWidth = 1; ctx.strokeStyle = i < checked ? "rgba(255,255,255,0.20)" : "#252530";
          ctx.stroke();
        }

        // 2. 3 Kartu Fitur Andalan (y+210..y+610, masing-masing h=124, gap=14)
        for (let i = 0; i < 3; i++) {
          const fy = y + 210 + i * 138;
          const f = feats[i];
          const isLit = activeFeatureIdx === i;

          roundRect(ctx, ix, fy, iw, 124, 9);
          ctx.fillStyle = isLit ? "#15161d" : "#0e0e13";
          ctx.fill();
          ctx.lineWidth = isLit ? 1.6 : 1.1;
          ctx.strokeStyle = isLit ? accent : "#24242e";
          ctx.stroke();

          ctx.fillStyle = isLit ? accent : "#2b2b36";
          ctx.fillRect(ix + 16, fy, 52, 2.5);

          ctx.textAlign = "left"; ctx.textBaseline = "top";
          ctx.font = "700 12.5px ui-monospace, Consolas, monospace";
          ctx.fillStyle = isLit ? accent : "#8e8d88";
          fillTrackedText(`0${i + 1} · ${f.tag}`, ix + 16, fy + 16, 1.0, "left");

          ctx.font = "800 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = "#f4f3ef";
          ctx.fillText(f.title, ix + 16, fy + 44);

          ctx.font = "400 14px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#969590";
          ctx.fillText(f.desc, ix + 16, fy + 84);
        }

        // 3. Verified Footer Strip (y+624..y+684, h=60)
        const vY = y + 624;
        const verified = auditProg >= 0.65;
        roundRect(ctx, ix, vY, iw, 60, 8);
        ctx.fillStyle = verified ? "#121a16" : "#101015";
        ctx.fill();
        ctx.lineWidth = 1.3;
        ctx.strokeStyle = verified ? "rgba(92, 230, 160, 0.45)" : "#23232c";
        ctx.stroke();

        ctx.font = "700 14px ui-monospace, Consolas, monospace";
        ctx.fillStyle = verified ? "#5ce6a0" : "#787771";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(
          verified ? "✓ 16/16 WARNA · 360F · 4× NN · LULUS" : "MEMVERIFIKASI SPEK FFPROBE...",
          ix + iw / 2, vY + 30.5
        );

        ctx.restore();
      }

      // =======================================================================
      // 5. FUNGSI UTAMA: drawFrame(t) — PAGE 2 DENGAN DUO MASKOT 3D (32.00s)
      //    0.00 -  1.35s : Smooth Entrance (Frame, Badges, Judul, Panel, Mascots)
      //    1.35 -  6.35s : Beat 1 — MERRY jelaskan Canvas 2D + Bayer 4×4 Dither
      //    6.40 - 11.40s : Beat 2 — ROGER jelaskan Uint8Array FB + 6 Modul ES6
      //   11.50 - 16.65s : Beat 3 — MERRY pamer Roket 2 Tingkat + Saturn-IV
      //   16.70 - 21.85s : Beat 4 — ROGER balas Gravity Turn 90° + Bumi 3D Lampu Kota
      //   21.95 - 25.95s : Beat 5 — DUET AUDIT LULUS ("Mana hasil yang paling keren?")
      //   26.00 - 32.00s : Beat 6 — Morph Panel -> Frame Page 3 + "LETSGO!!" -> Clean Launch
      // =======================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, DURATION);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(SSAA, SSAA);

        // Bobot 5 Beat Dialog (0% tumpang tindih!) + Transisi ke Page 3
        const b1MerryEngine = bellCurve(time,  1.35,  1.80,  5.95,  6.35);
        const b2RogerEngine = bellCurve(time,  6.40,  6.85, 11.00, 11.40);
        const b3MerryRocket = bellCurve(time, 11.50, 11.95, 16.25, 16.65);
        const b4RogerRocket = bellCurve(time, 16.70, 17.15, 21.45, 21.85);
        const b5DuetAudit   = bellCurve(time, 21.95, 22.40, 25.45, 25.95);

        const toPage3      = smootherstep(26.15, 27.15, time);
        const mascotStageA = smootherstep(0.25, 1.05, time) * (1 - smootherstep(25.75, 26.55, time));
        const modeBSwitch  = smootherstep(11.15, 11.85, time);

        const merryFocus = Math.max(b1MerryEngine, b3MerryRocket, b5DuetAudit * 0.85);
        const rogerFocus = Math.max(b2RogerEngine, b4RogerRocket, b5DuetAudit * 0.85);

        // 1. Latar Warm Obsidian (#0f0f11) + Reactive Studio Lighting
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        const topWash = ctx.createRadialGradient(W / 2, 420, 40, W / 2, 420, 760);
        topWash.addColorStop(0, "rgba(235, 179, 67, 0.045)");
        topWash.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = topWash;
        ctx.fillRect(0, 0, W, H);

        if (merryFocus > 0.01) {
          const gL = ctx.createRadialGradient(282, 1020, 30, 282, 1020, 560);
          gL.addColorStop(0, `rgba(110, 168, 254, ${(merryFocus * 0.075).toFixed(4)})`);
          gL.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = gL; ctx.fillRect(0, 0, W, H);
        }
        if (rogerFocus > 0.01) {
          const gR = ctx.createRadialGradient(798, 1020, 30, 798, 1020, 560);
          gR.addColorStop(0, `rgba(224, 122, 95, ${(rogerFocus * 0.075).toFixed(4)})`);
          gR.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = gR; ctx.fillRect(0, 0, W, H);
        }

        // 2. Grid Editorial Hairline (1px) — Identik Intro, Page 1 & Page 3
        ctx.strokeStyle = "#1e1e23";
        ctx.lineWidth = 1;
        ctx.strokeRect(24.5, 44.5, W - 49, H - 89);

        ctx.fillStyle = "#1e1e23";
        ctx.fillRect(24, 122, W - 48, 1);
        ctx.fillRect(24, 1792, W - 48, 1);

        // Garis progress ultra-tipis (1.5px)
        ctx.fillStyle = "#ebb343";
        ctx.fillRect(24, 121.5, (W - 48) * (time / DURATION), 1.5);

        // Garis vertikal tengah hanya di header & sela 2 panel (tidak menabrak speech card/badge!)
        ctx.fillStyle = "#1d1d22";
        ctx.fillRect(539.5, 44, 1, 212);
        if (toPage3 < 0.1 || time > 31.15) {
          ctx.fillRect(539.5, 448, 1, toPage3 > 0.5 ? 850 : 716);
        }

        drawCrosshair(540, 122, 4, "#36363f");
        drawCrosshair(540, 1792, 4, "#36363f");

        // 3. Masthead Atas & Model Badges (GEMINI Carbon · High | CLAUDE Opus 5.5 · Extra)
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ebb343";
        ctx.fillRect(48, 80, 6, 6);
        ctx.fillStyle = "#7c7b76";
        fillTrackedText("JOULFIAND STUDIO  ·  ADU MODEL", 66, 83.5, 1.8, "left");
        ctx.fillStyle = "#969590";
        fillTrackedText(toPage3 > 0.5 ? "03 — HASIL  ·  1 SHOT" : "02 — PROSES  ·  1 SHOT", W - 48, 83.5, 1.8, "right");

        drawModelBadge(LEFT_COL_X,  162, COL_W, 56, "#6ea8fe", "GEMINI", "Carbon · High",    merryFocus * 0.75);
        drawModelBadge(RIGHT_COL_X, 162, COL_W, 56, "#e07a5f", "CLAUDE", "Opus 5.5 · Extra", rogerFocus * 0.75);

        // 4. Judul Editorial Atas (Morph halus ke "GEMINI VS CLAUDE." saat Beat 6)
        const headIn = clamp((time - 0.12) / 0.78, 0, 1);
        ctx.save();
        ctx.globalAlpha = smootherstep(0, 0.55, headIn);
        ctx.translate(0, (1 - easeOutQuart(headIn)) * 18);

        roundRect(ctx, LEFT_COL_X, 266, 11, 11, 2.5);
        ctx.fillStyle = "#ebb343";
        ctx.fill();

        ctx.font = "600 19px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#8f8d87";
        ctx.textBaseline = "middle";
        fillTrackedText(
          toPage3 > 0.5 ? "HASIL  ·  ONE SHOT" : "BEDAH PROSES  ·  MERRY & ROGER",
          LEFT_COL_X + 22, 272, 2.0, "left"
        );

        if (toPage3 < 0.5) {
          ctx.save();
          ctx.globalAlpha *= (1 - toPage3 * 2);
          ctx.font = "900 66px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "top"; ctx.textAlign = "left";
          ctx.fillStyle = "#f5f4f0";
          ctx.fillText("Satu instruksi, ", LEFT_COL_X, 312);
          const w1 = ctx.measureText("Satu instruksi, ").width;
          ctx.fillStyle = "#ebb343";
          ctx.fillText("dua cara kerja.", LEFT_COL_X + w1, 312);
          ctx.restore();
        } else {
          ctx.save();
          ctx.globalAlpha *= (toPage3 - 0.5) * 2;
          ctx.font = "900 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "top"; ctx.textAlign = "left";
          ctx.fillStyle = "#f5f4f0";
          ctx.fillText("GEMINI ", LEFT_COL_X, 314);
          const w1 = ctx.measureText("GEMINI ").width;
          ctx.fillStyle = "#ebb343";
          ctx.fillText("VS CLAUDE.", LEFT_COL_X + w1, 314);
          ctx.restore();
        }
        ctx.restore();

        // 5. DUA PANEL PROSES & AUDIT
        //    Selama komentar maskot: y = 448, h = 716 (berakhir di y = 1164 — 100% bebas tabrakan!)
        //    Saat Beat 6 (toPage3):  morph mulus ke exact Page 3 (y = 464, h = 832)!
        const panelIn = clamp((time - 0.22) / 0.85, 0, 1);
        const curY = lerp(448, 464, toPage3) + (1 - easeOutQuart(panelIn)) * 22;
        const curH = lerp(716, 832, toPage3);

        const drawPanel = (x, isGemini) => {
          const w = COL_W, y = curY, h = curH;
          const accent = isGemini ? "#6ea8fe" : "#e07a5f";
          const isMyTurn = isGemini ? merryFocus : rogerFocus;
          const dimOther = isGemini
            ? (1 - Math.max(b2RogerEngine, b4RogerRocket) * 0.22)
            : (1 - Math.max(b1MerryEngine, b3MerryRocket) * 0.22);

          ctx.save();
          ctx.globalAlpha = smootherstep(0, 0.55, panelIn) * lerp(dimOther, 1.0, toPage3);

          ctx.shadowColor = isMyTurn > 0.3 && toPage3 < 0.5
            ? (isGemini ? "rgba(110, 168, 254, 0.22)" : "rgba(224, 122, 95, 0.22)")
            : "rgba(0, 0, 0, 0.55)";
          ctx.shadowBlur = isMyTurn > 0.3 && toPage3 < 0.5 ? 28 : 22;
          ctx.shadowOffsetY = 8;

          roundRect(ctx, x, y, w, h, lerp(11, 0, toPage3));
          ctx.fillStyle = toPage3 > 0.5 ? "#050507" : "#131317";
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          ctx.lineWidth = isMyTurn > 0.3 && toPage3 < 0.5 ? 1.8 : 1.4;
          ctx.strokeStyle = toPage3 > 0.5
            ? "#292930"
            : (isMyTurn > 0.3 ? accent : (isGemini ? "rgba(110, 168, 254, 0.35)" : "rgba(224, 122, 95, 0.35)"));
          ctx.stroke();

          if (toPage3 > 0.3) {
            ctx.save();
            ctx.globalAlpha *= toPage3;
            drawCrosshair(x - 1, y - 1, 4, "#4a4a52");
            drawCrosshair(x + w + 1, y - 1, 4, "#4a4a52");
            drawCrosshair(x - 1, y + h + 1, 4, "#4a4a52");
            drawCrosshair(x + w + 1, y + h + 1, 4, "#4a4a52");
            ctx.restore();
          }

          ctx.save();
          ctx.beginPath();
          roundRect(ctx, x + 1, y + 1, w - 2, h - 2, lerp(10, 0, toPage3));
          ctx.clip();

          // ISI PANEL SELAMA KOMENTAR MASKOT (Hilang mulus saat toPage3)
          const contentA = 1 - smootherstep(25.75, 26.45, time);
          if (contentA > 0.01) {
            ctx.save();
            ctx.globalAlpha *= contentA;

            // Header bar panel (h = 50px)
            ctx.fillStyle = "#18181f";
            ctx.fillRect(x, y, w, 50);
            ctx.fillStyle = "#262630";
            ctx.fillRect(x, y + 50, w, 1);

            if (isGemini) drawGeminiSparkleLogo(x + 26, y + 25, 12, time * 1.2, 1);
            else drawClaudeSunburstLogo(x + 26, y + 25, 11.5, time * 1.6, accent, 1);

            ctx.font = "800 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
            ctx.fillStyle = accent;
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillText(isGemini ? "Gemini Code" : "Claude Code", x + 46, y + 26);

            ctx.font = "600 13px ui-monospace, Consolas, monospace";
            ctx.fillStyle = modeBSwitch > 0.5 ? "#5ce6a0" : "#ebb343";
            ctx.textAlign = "right";
            ctx.fillText(modeBSwitch > 0.5 ? "FITUR & AUDIT 16W" : "BUILD & X-RAY", x + w - 18, y + 26);

            // MODE A (0.00s - 11.5s): 5 LOGS + X-RAY + 4 METRIK
            if (modeBSwitch < 0.98) {
              ctx.save();
              ctx.globalAlpha *= (1 - modeBSwitch);

              const logX = x + 18, logY = y + 64, logW = w - 36, logH = 156;
              roundRect(ctx, logX, logY, logW, logH, 8);
              ctx.fillStyle = "#0b0b0e"; ctx.fill();
              ctx.lineWidth = 1; ctx.strokeStyle = "#22222b"; ctx.stroke();

              const logs = isGemini ? GEMINI_LOGS : CLAUDE_LOGS;
              ctx.font = "500 14px ui-monospace, 'Cascadia Code', Consolas, monospace";
              ctx.textAlign = "left"; ctx.textBaseline = "top";
              for (let i = 0; i < logs.length; i++) {
                if (time >= logs[i].t) {
                  ctx.save();
                  ctx.globalAlpha *= smootherstep(logs[i].t, logs[i].t + 0.28, time);
                  ctx.fillStyle = logs[i].col;
                  ctx.fillText(logs[i].txt, logX + 14, logY + 14 + i * 26);
                  ctx.restore();
                }
              }

              drawXRayBlueprint(x + 18, y + 234, w - 36, 196, isGemini, time);

              // 4 Kartu Metrik (2x2, h = 118px -> berakhir di y + 692, sisa 24px margin!)
              const mY = y + 444, mW = (w - 36 - 12) / 2, mH = 118;
              const startCnt = isGemini ? 1.80 : 6.60;
              const fp = easeOutCubic(clamp((time - startCnt) / 3.40, 0, 1));
              const curF = Math.floor(fp * 360);
              const cards = isGemini
                ? [
                    { l: "PIPELINE",   v: "Canvas2D",     s: "Offscreen 270×480", c: accent },
                    { l: "DITHERING",  v: "Bayer 4×4",    s: "10 Sky Color Stops", c: "#ebb343" },
                    { l: "PALET LOCK", v: "16 Warna",     s: "PAL Strict Const",  c: "#f4f3ef" },
                    { l: "FRAME",      v: `${curF}/360`,  s: fp >= 0.99 ? "Lulus 30fps ✓" : "Playwright NN", c: "#5ce6a0" }
                  ]
