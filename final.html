<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>Joulfiand Studio — Master Final: 6-Part Pixel Art Rocket Showdown (198s)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #070709;
      color: #f4f3ef;
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage {
      height: calc(100vh - 68px);
      aspect-ratio: 9 / 16;
      display: block;
      background: #09090b;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.95);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    #controls {
      height: 62px;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      background: #0e0e11;
      border-top: 1px solid #1f1f24;
      width: 100%;
      font-size: 11px;
      flex-wrap: wrap;
      z-index: 10;
    }
    button {
      background: #18181d;
      color: #dcdcd6;
      border: 1px solid #2c2c34;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover {
      background: #24242c;
      border-color: #4a4a58;
      color: #ffffff;
    }
    button.primary {
      background: #ebb343;
      color: #0b0b0e;
      border-color: #ebb343;
      font-weight: 700;
    }
    button.primary:hover {
      background: #ffd066;
    }
    input[type="range"] {
      width: 180px;
      cursor: pointer;
      accent-color: #ebb343;
    }
    #timeLabel {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      color: #ebb343;
      font-weight: 700;
      min-width: 150px;
      text-align: right;
    }
    #chapterBadge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1c1c24;
      color: #8bb2fe;
      border: 1px solid #2a2a38;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    body.headless {
      width: 1080px;
      height: 1920px;
      display: block;
    }
    body.headless #stage {
      width: 1080px !important;
      height: 1920px !important;
      box-shadow: none;
    }
    body.headless #controls {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Master Kanvas 2x Supersampled (2160x3840 -> 1080x1920 Full HD Crisp) -->
  <canvas id="stage" width="2160" height="3840"></canvas>

  <div id="controls">
    <button id="btnPlay" class="primary">▶ Play Master</button>
    <input type="range" id="slider" min="0" max="5939" value="0" />
    <span id="timeLabel">00.00 / 198.00 s</span>
    <span id="chapterBadge">CH 0 · INTRO</span>
    <button id="b0">0. Intro (0s)</button>
    <button id="b1">1. Prompt (46s)</button>
    <button id="b2">2. Proses (72s)</button>
    <button id="b3">3. Hasil (104s)</button>
    <button id="b4">4. Review (116s)</button>
    <button id="b5">5. Outro (170s)</button>
  </div>

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const isHeadless = params.has("headless") || params.has("render");
      if (isHeadless) document.body.classList.add("headless");

      const masterCanvas = document.getElementById("stage");
      const masterCtx = masterCanvas.getContext("2d", { alpha: false });

      // =========================================================================
      // MODUL 1: MASTER INTRO & MASKOT (46.00s · 1380 Frame)
      // =========================================================================
      const Part1_Intro = (function () {
        const canvas = document.createElement("canvas");
        canvas.width = 2160;
        canvas.height = 3840;
        const ctx = canvas.getContext("2d", { alpha: false });
        const isHeadless = true;

        const W = 1080;
      const H = 1920;
      const SSAA = 2;
      const FPS = 30;
      const DURATION = 46.00; // Master Intro Lengkap (46s · 1380 frame @ 30 FPS)
      const TOTAL_FRAMES = Math.round(FPS * DURATION);

      const LEFT_COL_X  = 48;
      const RIGHT_COL_X = 564;
      const COL_W       = 468;

      // =======================================================================
      // 0. LOAD FOTO PROFIL JULL (jull.jpeg di folder yang sama)
      // =======================================================================
      const jullPhoto = new Image();
      let jullPhotoReady = false;
      jullPhoto.onload = () => {
        jullPhotoReady = true;
        if (!isPlaying) drawFrame(currentTime);
      };
      jullPhoto.onerror = () => { jullPhotoReady = false; };
      jullPhoto.src = "jull.jpeg";

      // Kode Siluet Asli Claude & Gemini (Identik dengan final.html)
      const SHADOW_CODE_CLAUDE = [
        "import { W, H, FPS, T } from './timeline.js';",
        "const fb = new Uint8Array(W * H);",
        "export function drawFrame(t) {",
        "  const f = Math.round(t * FPS);",
        "  const c = cam(f / FPS), sh = shake(t, f);",
        "  for (let y = 0; y < H; y++) {",
        "    const ay = GROUND - y + c;",
        "    for (let x = 0; x < W; x++) {",
        "      fb[y * W + x] = skyIndex(ay, x, ay);",
        "    }",
        "  }",
        "  drawStars(fb, t, f, c);",
        "  drawPlanet(fb, t, LIGHT_VEC);",
        "  if (t >= T.liftoff) drawTrail(fb, t, c, sh);",
        "  drawRocket(fb, rocketPose(t), flameLength(t, f), f, sh);",
        "  drawCountdown(fb, t, f);",
        "  drawMission(fb, t, f);",
        "  return Uint32Array.from(fb, idx => RGBA32[idx]);",
        "}",
        "export function vnoise(x, y, seed = 0) {",
        "  const xi = Math.floor(x), yi = Math.floor(y);",
        "  const u = (x - xi) * (x - xi) * (3 - 2 * (x - xi));",
        "  return lerp(lerp(h00, h10, u), lerp(h01, h11, u), v);",
        "}"
      ];

      const SHADOW_CODE_GEMINI = [
        "const PALETTE_16 = Object.freeze([",
        "  '#0b0c10', '#141b33', '#24345c', '#3b2d54',",
        "  '#7a305c', '#c94a38', '#eb7b34', '#f7b545',",
        "  '#ffee83', '#f4f6f8', '#b8c4d4', '#6f7f94'",
        "]);",
        "function renderTwoStageRocket(ctx, rx, ry, t, sep) {",
        "  const shake = Math.sin(t * 115) * (1 - smoothstep(4.5, 7.2, t));",
        "  if (sep && t < 8.2) {",
        "    const dropY = ry + 26 + Math.pow(t - 6.0, 2) * 95;",
        "    drawBoosterStage1(ctx, rx - (t - 6.0) * 14, dropY);",
        "  }",
        "  drawVacuumPlume(ctx, rx + shake, ry - 22, t);",
        "  drawCapsuleBody(ctx, rx + shake, ry - 52, PALETTE_16);",
        "  if (t > 6.1 && t < 8.1) triggerRCSThrusters(ctx, rx, ry, t);",
        "}",
        "async function synthesizeChiptuneWAV(sampleRate = 44100) {",
        "  const pcm16 = new Int16Array(sampleRate * 12);",
        "  for (let i = 0; i < pcm16.length; i++) {",
        "    pcm16[i] = mixLeadSquare(i) + mixTurbineSweep(i);",
        "  }",
        "  return encodeRIFFHeader(pcm16, sampleRate);",
        "}"
      ];

      // =======================================================================
      // 1. MATEMATIKA, EASING & HELPER UI
      // =======================================================================
      const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (a, b, x) => {
        const k = clamp((x - a) / (b - a), 0, 1);
        return k * k * (3 - 2 * k);
      };
      const smootherstep = (a, b, x) => {
        const k = clamp((x - a) / (b - a), 0, 1);
        return k * k * k * (k * (k * 6 - 15) + 10);
      };
      const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const easeOutQuart = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const easeInOutCubic = (x) => {
        const k = clamp(x, 0, 1);
        return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      };
      function softSpringOut(x, overshoot = 0.95) {
        const k = clamp(x, 0, 1);
        const c1 = overshoot;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
      }
      function bellCurve(time, a, peakIn, peakOut, b) {
        return smootherstep(a, peakIn, time) * (1 - smootherstep(peakOut, b, time));
      }

      function roundRect(c, x, y, w, h, r) {
        const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        c.beginPath();
        c.moveTo(x + rad, y);
        c.lineTo(x + w - rad, y);
        c.quadraticCurveTo(x + w, y, x + w, y + rad);
        c.lineTo(x + w, y + h - rad);
        c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        c.lineTo(x + rad, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - rad);
        c.lineTo(x, y + rad);
        c.quadraticCurveTo(x, y, x + rad, y);
        c.closePath();
      }

      function drawCrosshair(x, y, size, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x - size, y - 0.5, size * 2 + 1, 1);
        ctx.fillRect(x - 0.5, y - size, 1, size * 2 + 1);
      }

      function fillTrackedText(text, x, y, tracking, align = "left") {
        const chars = String(text).split("");
        let totalW = 0;
        const widths = chars.map((ch) => {
          const w = ctx.measureText(ch).width;
          totalW += w;
          return w;
        });
        totalW += tracking * Math.max(0, chars.length - 1);

        let curX = x;
        if (align === "right") curX = x - totalW;
        else if (align === "center") curX = x - totalW / 2;

        ctx.textAlign = "left";
        for (let i = 0; i < chars.length; i++) {
          ctx.fillText(chars[i], curX, y);
          curX += widths[i] + tracking;
        }
        return totalW;
      }

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function shadeRgb(rgb, factor, rimRgb, rimWeight) {
        let r = rgb[0] * factor;
        let g = rgb[1] * factor;
        let b = rgb[2] * factor;
        if (rimRgb && rimWeight > 0) {
          r += rimRgb[0] * rimWeight;
          g += rimRgb[1] * rimWeight;
          b += rimRgb[2] * rimWeight;
        }
        return `rgb(${clamp(Math.round(r), 0, 255)},${clamp(Math.round(g), 0, 255)},${clamp(Math.round(b), 0, 255)})`;
      }

      function normalize3(v) {
        const len = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / len, v[1] / len, v[2] / len];
      }
      function cross3(a, b) {
        return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      }
      function dot3(a, b) {
        return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      }

      // =======================================================================
      // 2. LOGO VEKTOR ASLI CLAUDE (SUNBURST 11-SPOKE) & GEMINI (SPARKLE) + KURSOR
      // =======================================================================
      function drawClaudeSunburstLogo(cx, cy, radius, angleRad, color = "#e07a5f", alpha = 1.0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.translate(cx, cy);
        ctx.rotate(angleRad);

        const spokeRatios = [1.00, 0.86, 0.96, 0.80, 0.98, 0.84, 0.94, 0.78, 1.00, 0.88, 0.92];
        const n = spokeRatios.length;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2.4, radius * 0.21);
        ctx.lineCap = "round";

        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 - Math.PI * 0.5;
          const rOut = radius * spokeRatios[i];
          const rIn  = radius * 0.16;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
          ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.29, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

      function drawGeminiSparkleLogo(cx, cy, radius, angleRad, alpha = 1.0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.translate(cx, cy);
        ctx.rotate(angleRad);

        const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
        grad.addColorStop(0, "#6ea8fe");
        grad.addColorStop(0.55, "#8b5cf6");
        grad.addColorStop(1, "#38bdf8");

        ctx.beginPath();
        ctx.moveTo(0, -radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.quadraticCurveTo(0, 0, 0, radius);
        ctx.quadraticCurveTo(0, 0, -radius, 0);
        ctx.quadraticCurveTo(0, 0, 0, -radius);
        ctx.closePath();

        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(110, 168, 254, 0.45)";
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.restore();
      }

      function drawAngryVeinIcon(cx, cy, r, color = "#ff5c5c") {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          ctx.beginPath();
          ctx.moveTo(dx * r * 0.95, dy * r * 0.22);
          ctx.quadraticCurveTo(dx * r * 0.25, dy * r * 0.25, dx * r * 0.22, dy * r * 0.95);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawCursorArrow(x, y, scale = 1.0, alpha = 1.0) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 5;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 35);
        ctx.lineTo(8.8, 27.2);
        ctx.lineTo(14.8, 40);
        ctx.lineTo(20.5, 37.5);
        ctx.lineTo(14.5, 24.5);
        ctx.lineTo(25.5, 24.5);
        ctx.closePath();

        ctx.fillStyle = "#111215";
        ctx.fill();
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = "#f4f3ef";
        ctx.stroke();
        ctx.restore();
      }

      // =======================================================================
      // 3. HIERARCHICAL 3D VOXEL ENGINE (ZERO EYE/LEG CLIPPING)
      // =======================================================================
      const KEY_LIGHT  = normalize3([-0.36, 0.72, 0.60]);
      const FILL_LIGHT = normalize3([ 0.55, 0.25, 0.45]);

      function transformPoint(p, tf) {
        let x = p[0] * tf.sx, y = p[1] * tf.sy, z = p[2] * tf.sz;
        if (tf.rz) {
          const c = Math.cos(tf.rz), s = Math.sin(tf.rz);
          const nx = x * c - y * s, ny = x * s + y * c;
          x = nx; y = ny;
        }
        if (tf.rx) {
          const c = Math.cos(tf.rx), s = Math.sin(tf.rx);
          const ny = y * c - z * s, nz = y * s + z * c;
          y = ny; z = nz;
        }
        if (tf.ry) {
          const c = Math.cos(tf.ry), s = Math.sin(tf.ry);
          const nx = x * c + z * s, nz = -x * s + z * c;
          x = nx; z = nz;
        }
        return [x + tf.tx, y + tf.ty, z + tf.tz];
      }

      function pushBoxQuads(quadList, cx, cy, cz, w, h, d, rgb, localTf, worldTf, opts = {}) {
        const hw = w / 2, hh = h / 2, hd = d / 2;
        const rawVerts = [
          [cx - hw, cy - hh, cz + hd], [cx + hw, cy - hh, cz + hd],
          [cx + hw, cy + hh, cz + hd], [cx - hw, cy + hh, cz + hd],
          [cx - hw, cy - hh, cz - hd], [cx + hw, cy - hh, cz - hd],
          [cx + hw, cy + hh, cz - hd], [cx - hw, cy + hh, cz - hd]
        ];
        const verts = rawVerts.map((v) => transformPoint(localTf ? transformPoint(v, localTf) : v, worldTf));
        const faceDefs = [
          { idx: [0, 1, 2, 3], ao: 1.00 }, { idx: [5, 4, 7, 6], ao: 0.78 },
          { idx: [1, 5, 6, 2], ao: 0.90 }, { idx: [4, 0, 3, 7], ao: 0.94 },
          { idx: [3, 2, 6, 7], ao: 1.06 }, { idx: [4, 5, 1, 0], ao: 0.66 }
        ];
        const mask = opts.faceMask || [1, 1, 1, 1, 1, 1];
        const rimRgb = opts.rimRgb || null;
        const rimDir = opts.rimDir || [0, 0, 0];
        const dimFactor = opts.dimFactor !== undefined ? opts.dimFactor : 1.0;
        const layer = opts.layer !== undefined ? opts.layer : 2;
        const unlit = opts.unlit === true;

        for (let f = 0; f < 6; f++) {
          if (!mask[f]) continue;
          const fd = faceDefs[f];
          const v0 = verts[fd.idx[0]], v1 = verts[fd.idx[1]], v2 = verts[fd.idx[2]], v3 = verts[fd.idx[3]];
          const n = normalize3(cross3(
            [v1[0] - v0[0], v1[1] - v0[1], v1[2] - v0[2]],
            [v2[0] - v0[0], v2[1] - v0[1], v2[2] - v0[2]]
          ));
          const center = [
            (v0[0] + v1[0] + v2[0] + v3[0]) * 0.25,
            (v0[1] + v1[1] + v2[1] + v3[1]) * 0.25,
            (v0[2] + v1[2] + v2[2] + v3[2]) * 0.25
          ];
          quadList.push({
            verts: [v0, v1, v2, v3], normal: n, center, rgb,
            ao: fd.ao, rimRgb, rimDir, dimFactor, layer, unlit,
            strokeSame: opts.strokeSame !== false
          });
        }
      }

      function renderActorQuads(quadList, originX, originY, camDist, fov, actorAlpha = 1.0) {
        if (actorAlpha <= 0.01 || quadList.length === 0) return;
        const camPos = [0, 1.4, camDist];
        const visible = [];

        for (let i = 0; i < quadList.length; i++) {
          const q = quadList[i];
          const dx = camPos[0] - q.center[0];
          const dy = camPos[1] - q.center[1];
          const dz = camPos[2] - q.center[2];
          if (dot3(q.normal, [dx, dy, dz]) <= 0.0005 || dz < 2.0) continue;

          let fill;
          if (q.unlit) {
            fill = shadeRgb(q.rgb, q.dimFactor, null, 0);
          } else {
            const ndl = Math.max(0, dot3(q.normal, KEY_LIGHT));
            const ndf = Math.max(0, dot3(q.normal, FILL_LIGHT));
            const shade = (0.48 + 0.44 * ndl + 0.14 * ndf) * q.ao * q.dimFactor;
            const rimHit = q.rimRgb ? Math.max(0, dot3(q.normal, q.rimDir)) * 0.24 * q.dimFactor : 0;
            fill = shadeRgb(q.rgb, shade, q.rimRgb, rimHit);
          }

          const proj = q.verts.map((v) => {
            const sc = fov / Math.max(1.5, camPos[2] - v[2]);
            return [originX + (v[0] - camPos[0]) * sc, originY - (v[1] - camPos[1]) * sc];
          });

          visible.push({ layer: q.layer, distSq: dx * dx + dy * dy + dz * dz, proj, fill, strokeSame: q.strokeSame });
        }

        visible.sort((a, b) => (a.layer !== b.layer ? a.layer - b.layer : b.distSq - a.distSq));

        ctx.save();
        ctx.globalAlpha *= clamp(actorAlpha, 0, 1);
        for (let i = 0; i < visible.length; i++) {
          const item = visible[i], p = item.proj;
          ctx.beginPath();
          ctx.moveTo(p[0][0], p[0][1]);
          ctx.lineTo(p[1][0], p[1][1]);
          ctx.lineTo(p[2][0], p[2][1]);
          ctx.lineTo(p[3][0], p[3][1]);
          ctx.closePath();
          ctx.fillStyle = item.fill;
          ctx.fill();
          if (item.strokeSame) {
            ctx.strokeStyle = item.fill;
            ctx.lineWidth = 0.75;
            ctx.lineJoin = "round";
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function project3DPoint(wx, wy, wz, originX, originY, camDist, fov) {
        const sc = fov / Math.max(1.5, camDist - wz);
        return { x: originX + wx * sc, y: originY - (wy - 1.4) * sc, sc };
      }

      // =======================================================================
      // 4. MODEL 3D ROGER (CLAUDE CODE) & MERRY (GEMINI AGENT)
      // =======================================================================
      const ROGER_ORANGE_BASE = hexToRgb("#ea7444");
      const ROGER_ORANGE_HOT  = hexToRgb("#ef5d3b");
      const ROGER_EYE    = hexToRgb("#141419");
      const ROGER_BROW   = hexToRgb("#261a16");
      const ROGER_SHINE  = hexToRgb("#ffffff");
      const ROGER_BLUSH  = hexToRgb("#ff8a80");
      const ROGER_RIM    = hexToRgb("#ffb088");
      const ROGER_RIMDIR = normalize3([0.75, 0.35, -0.30]);

      function buildRogerQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale,
          speakEnergy = 0, waveLeft = 0, waveRight = 0, blinkAmount = 0,
          happyAmount = 0, excitedAmount = 0, shockAmount = 0, angryAmount = 0, sulkAmount = 0,
          lookX = 0, blushAmount = 0, dimFactor = 1
        } = pose;

        const bodyRgb = [
          Math.round(lerp(ROGER_ORANGE_BASE[0], ROGER_ORANGE_HOT[0], angryAmount)),
          Math.round(lerp(ROGER_ORANGE_BASE[1], ROGER_ORANGE_HOT[1], angryAmount)),
          Math.round(lerp(ROGER_ORANGE_BASE[2], ROGER_ORANGE_HOT[2], angryAmount))
        ];

        const angryJitterX = angryAmount * Math.sin(time * 42.0) * 0.14;
        const bounce = Math.abs(Math.sin(time * 7.2)) * speakEnergy;
        const angryStomp = Math.abs(Math.sin(time * 13.5)) * angryAmount * 0.45;
        const breathe = Math.sin(time * 2.8) * 0.016;

        const worldTf = {
          tx: x + angryJitterX,
          ty: y + bounce * 0.40 + angryStomp + Math.sin(time * 2.8) * 0.09,
          tz: z, rx: pitch, ry: yaw, rz: roll,
          sx: scale * (1 + bounce * 0.055 + shockAmount * 0.09 - angryAmount * 0.03 - breathe * 0.4),
          sy: scale * (1 - bounce * 0.045 - shockAmount * 0.07 + angryAmount * 0.06 + breathe),
          sz: scale * (1 + bounce * 0.03)
        };
        const baseOpts = { rimRgb: ROGER_RIM, rimDir: ROGER_RIMDIR, dimFactor };

        // LAYER 0: 4 Kaki Balok
        const legXs = [-3.35, -1.20, 1.20, 3.35];
        for (let i = 0; i < 4; i++) {
          const stepLift = Math.max(0, Math.sin(time * 8.4 + i * 1.55)) * 0.28 * speakEnergy
                         + Math.max(0, Math.sin(time * 16.0 + i * 1.6)) * 0.48 * angryAmount
                         + shockAmount * (i < 2 ? 0.55 : 0.15);
          pushBoxQuads(quads, legXs[i], -2.25 + stepLift, 0, 1.38, 2.50, 1.85, bodyRgb, null, worldTf, { ...baseOpts, layer: 0 });
        }

        // LAYER 1 & 4: Tangan Kiri & Kanan
        const leftArmLayer = yaw < 0 ? 1 : 4;
        const rightArmLayer = yaw < 0 ? 4 : 1;

        let leftArmAng = -0.08 + Math.sin(time * 3.8) * 0.08 * (0.35 + speakEnergy);
        if (waveLeft > 0.01) leftArmAng = lerp(leftArmAng, -0.82 - Math.sin(time * 15.0) * 0.36, waveLeft);
        if (shockAmount > 0.05) leftArmAng = lerp(leftArmAng, -1.25 - Math.sin(time * 22.0) * 0.25, shockAmount);
        if (angryAmount > 0.05) leftArmAng = lerp(leftArmAng, -0.95 - Math.sin(time * 18.0) * 0.42, angryAmount);
        if (sulkAmount > 0.05) leftArmAng = lerp(leftArmAng, 0.35, sulkAmount);
        pushBoxQuads(quads, -0.82, 0, 0, 1.75, 2.05, 1.95, bodyRgb,
          { tx: -4.8, ty: 1.55 + shockAmount * 0.45, tz: 0, rx: 0, ry: 0, rz: leftArmAng, sx: 1, sy: 1, sz: 1 },
          worldTf, { ...baseOpts, layer: leftArmLayer });

        let rightArmAng = 0.08 - Math.sin(time * 3.8) * 0.08 * (0.35 + speakEnergy);
        if (waveRight > 0.01) rightArmAng = lerp(rightArmAng, 0.84 + Math.sin(time * 15.5) * 0.38, waveRight);
        if (shockAmount > 0.05) rightArmAng = lerp(rightArmAng, 1.25 + Math.sin(time * 22.0) * 0.25, shockAmount);
        if (angryAmount > 0.05) rightArmAng = lerp(rightArmAng, 0.95 + Math.sin(time * 18.0 + 1.4) * 0.42, angryAmount);
        if (sulkAmount > 0.05) rightArmAng = lerp(rightArmAng, -0.35, sulkAmount);
        pushBoxQuads(quads, 0.82, 0, 0, 1.75, 2.05, 1.95, bodyRgb,
          { tx: 4.8, ty: 1.55 + shockAmount * 0.45, tz: 0, rx: 0, ry: 0, rz: rightArmAng, sx: 1, sy: 1, sz: 1 },
          worldTf, { ...baseOpts, layer: rightArmLayer });

        // LAYER 2: Badan
        pushBoxQuads(quads, 0, 1.85, 0, 9.6, 6.2, 4.1, bodyRgb, null, worldTf, { ...baseOpts, layer: 2 });

        // LAYER 3 & 3.5: Wajah Ekspresif
        const eyeZ = 2.26, eyeBaseY = 2.55, shiftX = clamp(lookX, -1, 1) * 0.48;
        for (const side of [-1, 1]) {
          const ex = side * 2.55 + shiftX;
          if (happyAmount > 0.55) {
            pushBoxQuads(quads, 0, 0, 0, 0.96, 0.40, 0.45, ROGER_EYE,
              { tx: ex - 0.38, ty: eyeBaseY + 0.14, tz: eyeZ, rx: 0, ry: 0, rz: 0.44, sx: 1, sy: 1, sz: 1 }, worldTf, { ...baseOpts, layer: 3 });
            pushBoxQuads(quads, 0, 0, 0, 0.96, 0.40, 0.45, ROGER_EYE,
              { tx: ex + 0.38, ty: eyeBaseY + 0.14, tz: eyeZ, rx: 0, ry: 0, rz: -0.44, sx: 1, sy: 1, sz: 1 }, worldTf, { ...baseOpts, layer: 3 });
          } else if (shockAmount > 0.45) {
            pushBoxQuads(quads, ex, eyeBaseY + 0.12, eyeZ, 1.78, 1.98, 0.62, ROGER_SHINE, null, worldTf, { ...baseOpts, layer: 3 });
            pushBoxQuads(quads, ex + shiftX * 0.25, eyeBaseY + 0.12, eyeZ + 0.33, 0.62, 0.68, 0.10, ROGER_EYE, null, worldTf,
              { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
          } else {
            const glareSquint = clamp(angryAmount * 0.48 + sulkAmount * 0.38, 0, 0.55);
            const eyeH = lerp(1.54 * (1 - glareSquint + excitedAmount * 0.16), 0.22, blinkAmount);
            pushBoxQuads(quads, ex, eyeBaseY - glareSquint * 0.18, eyeZ, 1.52 * (1 + angryAmount * 0.10), eyeH, 0.58, ROGER_EYE, null, worldTf, { ...baseOpts, layer: 3 });
            if (blinkAmount < 0.40) {
              const ss = 1 + excitedAmount * 0.25 - angryAmount * 0.25;
              pushBoxQuads(quads, ex - 0.32 + shiftX * 0.24, eyeBaseY + 0.32 - glareSquint * 0.22, eyeZ + 0.31, 0.40 * ss, 0.40 * ss, 0.08, ROGER_SHINE, null, worldTf,
                { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
              if (angryAmount < 0.45) {
                pushBoxQuads(quads, ex + 0.28 + shiftX * 0.16, eyeBaseY - 0.26, eyeZ + 0.31, 0.22, 0.22, 0.08, ROGER_SHINE, null, worldTf,
                  { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
              }
            }
          }

          const browLift = happyAmount * 0.44 + excitedAmount * 0.50 + shockAmount * 0.78 - angryAmount * 0.36 - sulkAmount * 0.28;
          const browTilt = side === -1
            ? (happyAmount * 0.16 + excitedAmount * 0.18 - angryAmount * 0.46 - sulkAmount * 0.20 + shockAmount * 0.16)
            : (-happyAmount * 0.16 - excitedAmount * 0.18 + angryAmount * 0.46 + sulkAmount * 0.20 - shockAmount * 0.16);
          pushBoxQuads(quads, 0, 0, 0, 1.72, 0.30 + angryAmount * 0.08, 0.34, ROGER_BROW,
            { tx: ex, ty: eyeBaseY + 1.24 + browLift, tz: eyeZ + 0.08, rx: 0, ry: 0, rz: browTilt, sx: 1, sy: 1, sz: 1 },
            worldTf, { ...baseOpts, layer: 3.6 });
        }

        const totalBlush = clamp(blushAmount + angryAmount * 0.75, 0, 1);
        if (totalBlush > 0.08) {
          pushBoxQuads(quads, -3.45 + shiftX * 0.35, 1.22, 2.14, 1.18 * totalBlush, 0.48 * totalBlush, 0.14, ROGER_BLUSH, null, worldTf,
            { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.2, unlit: true, dimFactor });
          pushBoxQuads(quads,  3.45 + shiftX * 0.35, 1.22, 2.14, 1.18 * totalBlush, 0.48 * totalBlush, 0.14, ROGER_BLUSH, null, worldTf,
            { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.2, unlit: true, dimFactor });
        }
        return quads;
      }

      const MERRY_GRID = [
        ".....KKKKKK.....", "...KKGGYYRRKK...", "..KGGGYYORRRRK..", "..KGGCCCCRRRRK..",
        ".KGGCCCCCCCCRRK.", ".KGBBCCCCCCBBBK.", ".KBBWEBBBBWEBBK.", ".KBBEEBBBBEEBBK.",
        "KBBPPBBMMBBPPBBK", "KBBBBBMTTMBBBBBK", "KBBBBBKKKKBBBBBK", "KBBBBK....KBBBBK",
        "KBBBK......KBBBK", "KBBBK......KBBBK", ".KKK........KKK."
      ];
      const MERRY_COLORS = {
        K: hexToRgb("#0c1328"), B: hexToRgb("#1d63ff"), C: hexToRgb("#38bdf8"),
        G: hexToRgb("#22c55e"), Y: hexToRgb("#facc15"), O: hexToRgb("#fb923c"),
        R: hexToRgb("#ef4444"), E: hexToRgb("#090d1c"), W: hexToRgb("#ffffff"),
        P: hexToRgb("#f472b6"), M: hexToRgb("#0a0e1d"), T: hexToRgb("#fb7185")
      };
      const MERRY_RIM    = hexToRgb("#93c5fd");
      const MERRY_RIMDIR = normalize3([-0.75, 0.38, -0.30]);
      const MERRY_ROWS = MERRY_GRID.length, MERRY_COLS = MERRY_GRID[0].length;
      const MERRY_VOXEL_META = [];
      for (let r = 0; r < MERRY_ROWS; r++) {
        for (let c = 0; c < MERRY_COLS; c++) {
          const ch = MERRY_GRID[r][c];
          if (ch === ".") continue;
          const solid = (rr, cc) => rr >= 0 && rr < MERRY_ROWS && cc >= 0 && cc < MERRY_COLS && MERRY_GRID[rr][cc] !== ".";
          MERRY_VOXEL_META.push({
            r, c, ch,
            faceMask: [1, 1, solid(r, c + 1) ? 0 : 1, solid(r, c - 1) ? 0 : 1, solid(r - 1, c) ? 0 : 1, solid(r + 1, c) ? 0 : 1]
          });
        }
      }
      const MERRY_SPARKLES = [
        { ang: 0.4, rad: 6.1, yOff:  3.6, size: 0.68, col: hexToRgb("#facc15"), isPlus: true  },
        { ang: 1.6, rad: 5.5, yOff:  4.4, size: 0.52, col: hexToRgb("#38bdf8"), isPlus: false },
        { ang: 2.8, rad: 5.9, yOff:  0.8, size: 0.54, col: hexToRgb("#22c55e"), isPlus: false },
        { ang: 3.9, rad: 5.7, yOff: -1.4, size: 0.58, col: hexToRgb("#ef4444"), isPlus: false },
        { ang: 5.1, rad: 5.6, yOff:  2.2, size: 0.50, col: hexToRgb("#f472b6"), isPlus: false },
        { ang: 5.9, rad: 6.0, yOff: -2.0, size: 0.48, col: hexToRgb("#facc15"), isPlus: false }
      ];

      function buildMerryQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale,
          speakEnergy = 0, wavePhase = 0, blinkAmount = 0,
          happyEyes = 0, sassyMode = 0, bargeMode = 0, lookRight = 0, excitedHop = 0, squashAntic = 0,
          showSparkles = true, dimFactor = 1
        } = pose;

        const hop = Math.abs(Math.sin(time * 8.4)) * speakEnergy + excitedHop * Math.abs(Math.sin(time * 12.0)) * 0.72;
        const breathe = Math.sin(time * 3.2 + 1.0) * 0.016;
        const worldTf = {
          tx: x, ty: y + hop * 0.48 - squashAntic * 0.38 + Math.sin(time * 3.0 + 0.8) * 0.12, tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * (1 + hop * 0.055 + squashAntic * 0.14 - breathe * 0.4),
          sy: scale * (1 - hop * 0.045 - squashAntic * 0.13 + breathe),
          sz: scale * (1 + hop * 0.03 + squashAntic * 0.06)
        };

        const vSize = 0.62, vDepth = 2.60;
        const mouthOpen = bargeMode > 0.4 ? true : (speakEnergy > 0.10 ? (Math.sin(time * 20.0) > -0.22) : (happyEyes > 0.5));
        const eyesClosed = blinkAmount > 0.55;

        for (let i = 0; i < MERRY_VOXEL_META.length; i++) {
          const vm = MERRY_VOXEL_META[i];
          let ch = vm.ch;
          const isL = (vm.r === 6 || vm.r === 7) && (vm.c === 4 || vm.c === 5);
          const isR = (vm.r === 6 || vm.r === 7) && (vm.c === 10 || vm.c === 11);
          if (isL || isR) {
            if (eyesClosed) ch = (vm.r === 7) ? "E" : "B";
            else if (happyEyes > 0.55) {
              if (isL) ch = (vm.r === 6 && vm.c === 5) || (vm.r === 7 && vm.c === 4) ? "E" : "B";
              if (isR) ch = (vm.r === 6 && vm.c === 10) || (vm.r === 7 && vm.c === 11) ? "E" : "B";
            } else if (sassyMode > 0.50) {
              ch = (vm.r === 6) ? "B" : ((vm.c === 5 || vm.c === 11) ? "E" : "W");
            } else if (bargeMode > 0.50) {
              ch = (vm.r === 6 && (vm.c === 4 || vm.c === 10)) ? "B" : "E";
            } else if (lookRight > 0.50) {
              ch = (vm.r === 6 && (vm.c === 5 || vm.c === 11)) ? "W" : "E";
            }
          }
          if (!mouthOpen && (ch === "M" || ch === "T")) ch = (vm.r === 8 && (vm.c === 7 || vm.c === 8)) ? "M" : "B";

          const vx = (vm.c - (MERRY_COLS - 1) / 2) * vSize;
          const vy = ((MERRY_ROWS - 1) / 2 - vm.r) * vSize + 1.15;
          pushBoxQuads(quads, vx, vy, 0, vSize, vSize, vDepth, MERRY_COLORS[ch], null, worldTf, {
            faceMask: vm.faceMask, rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: 1, strokeSame: true
          });
        }

        let armAng = 0.10 + Math.sin(time * 3.8) * 0.12;
        if (wavePhase > 0.01) armAng = lerp(armAng, 0.65 + Math.sin(time * 18.0) * 0.44, wavePhase);
        if (bargeMode > 0.1)  armAng = lerp(armAng, -0.35 + Math.sin(time * 24.0) * 0.25, bargeMode);
        if (sassyMode > 0.1)  armAng = lerp(armAng, 0.30 + Math.sin(time * 12.0) * 0.35, sassyMode);

        const handTf = { tx: 4.32, ty: 1.25, tz: 0, rx: 0, ry: 0, rz: armAng, sx: 1, sy: 1, sz: 1 };
        const handLayer = yaw > 0.45 ? 0 : 2;
        pushBoxQuads(quads, 0.45, 0.0, 0, 0.70, 0.70, 1.30, MERRY_COLORS.K, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });
        pushBoxQuads(quads, 0.96, 0.54, 0, 0.70, 0.70, 1.30, MERRY_COLORS.W, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });
        pushBoxQuads(quads, 1.36, 1.02, 0, 0.66, 0.66, 1.30, MERRY_COLORS.K, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });

        if (showSparkles) {
          const orbitSpeed = 0.80 + speakEnergy * 1.35 + excitedHop * 1.10 + bargeMode * 1.60;
          for (let i = 0; i < MERRY_SPARKLES.length; i++) {
            const sp = MERRY_SPARKLES[i];
            const a = sp.ang + time * orbitSpeed;
            const spZ = z + Math.sin(a) * (sp.rad * 0.52) * scale;
            const spLayer = spZ < z ? 0 : 3;
            const spTf = {
              tx: x + Math.cos(a) * sp.rad * scale,
              ty: y + (sp.yOff + Math.sin(time * 4.2 + i * 1.3) * 0.42) * scale + 1.0,
              tz: spZ, rx: time * 1.6 + i, ry: time * 2.1 + i, rz: 0,
              sx: scale, sy: scale, sz: scale
            };
            if (sp.isPlus) {
              pushBoxQuads(quads, 0, 0, 0, sp.size * 2.1, sp.size * 0.66, sp.size * 0.66, sp.col, null, spTf, { dimFactor, layer: spLayer });
              pushBoxQuads(quads, 0, 0, 0, sp.size * 0.66, sp.size * 2.1, sp.size * 0.66, sp.col, null, spTf, { dimFactor, layer: spLayer });
            } else {
              pushBoxQuads(quads, 0, 0, 0, sp.size, sp.size, sp.size, sp.col, null, spTf, { dimFactor, layer: spLayer });
            }
          }
        }
        return quads;
      }

      function drawEmoteBadge(x, y, iconType, accentHex, alpha, time) {
        if (alpha <= 0.02) return;
        const bob = Math.sin(time * 6.2) * 7;
        const sc = softSpringOut(clamp(alpha * 1.3, 0, 1), 1.15);
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.translate(x, y + bob);
        ctx.scale(sc, sc);
        ctx.shadowColor = accentHex;
        ctx.shadowBlur = 18;
        roundRect(ctx, -28, -28, 56, 56, 14);
        ctx.fillStyle = "#16161d";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2;
        ctx.strokeStyle = accentHex;
        ctx.stroke();

        if (iconType === "claude") drawClaudeSunburstLogo(0, 0, 17, time * 0.75, accentHex, 1);
        else if (iconType === "gemini") drawGeminiSparkleLogo(0, 0, 17, Math.sin(time * 1.6) * 0.14, 1);
        else if (iconType === "angry") {
          const p = 1 + Math.sin(time * 18.0) * 0.10;
          ctx.scale(p, p);
          drawAngryVeinIcon(0, 0, 14, accentHex);
        } else {
          ctx.font = "900 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = accentHex;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(iconType, 0, 2);
        }
        ctx.restore();
      }

      function drawBumpImpactFX(cx, cy, tSkit) {
        if (tSkit < 6.95 || tSkit > 7.52) return;
        const p = clamp((tSkit - 6.95) / 0.57, 0, 1);
        ctx.save();
        ctx.globalAlpha = Math.pow(1 - p, 1.3);
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, lerp(18, 128, easeOutCubic(p)), 0, Math.PI * 2);
        ctx.strokeStyle = "#ebb343";
        ctx.lineWidth = lerp(4.5, 1.0, p);
        ctx.stroke();
        for (let i = 0; i < 10; i++) {
          const ang = (i / 10) * Math.PI * 2 + 0.18;
          const r0 = lerp(24, 78, easeOutCubic(p)), r1 = lerp(58, 148, easeOutQuart(p));
          ctx.strokeStyle = i % 2 === 0 ? "#ffe07d" : "#6ea8fe";
          ctx.lineWidth = i % 2 === 0 ? 4.2 : 2.8;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
          ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawSkidDustPuffs(floorX, floorY, tSkit) {
        if (tSkit < 6.98 || tSkit > 8.10) return;
        const p = clamp((tSkit - 6.98) / 1.12, 0, 1);
        ctx.save();
        for (let i = 0; i < 7; i++) {
          const lp = clamp((p - i * 0.07) / 0.55, 0, 1);
          if (lp <= 0 || lp >= 1) continue;
          const px = floorX - 24 - i * 16 - easeOutCubic(lp) * 58;
          const py = floorY - easeOutCubic(lp) * (22 + (i % 3) * 14);
          const sz = lerp(15, 4, lp);
          ctx.globalAlpha = (1 - lp) * 0.65;
          ctx.fillStyle = i % 2 === 0 ? "#8e8d88" : "#ebb343";
          roundRect(ctx, px - sz / 2, py - sz / 2, sz, sz, 3);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawJullBossCard(appearProg, time) {
        if (appearProg <= 0.01) return;
        const ease = softSpringOut(clamp(appearProg, 0, 1), 0.72);
        const alpha = smoothstep(0.0, 0.45, appearProg);
        const cardW = 392, cardH = 472;
        const cy = lerp(745, 650, ease) + Math.sin(time * 2.2) * 5;
        const tilt = (-2.6 + Math.sin(time * 1.8) * 0.7) * (Math.PI / 180);

        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.translate(W / 2, cy);
        ctx.rotate(tilt);
        const sc = lerp(0.84, 1.0, ease);
        ctx.scale(sc, sc);

        const halo = ctx.createRadialGradient(0, -10, 40, 0, -10, 295);
        halo.addColorStop(0, "rgba(235, 179, 67, 0.25)");
        halo.addColorStop(0.58, "rgba(110, 168, 254, 0.07)");
        halo.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = halo;
        ctx.fillRect(-310, -310, 620, 620);

        ctx.shadowColor = "rgba(0, 0, 0, 0.80)";
        ctx.shadowBlur = 44;
        ctx.shadowOffsetY = 18;
        roundRect(ctx, -cardW / 2, -cardH / 2, cardW, cardH, 24);
        ctx.fillStyle = "#17171d";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.lineWidth = 1.8;
        ctx.strokeStyle = "#3a3a48";
        ctx.stroke();

        // Garis aksen emas top bezel
        ctx.fillStyle = "#ebb343";
        roundRect(ctx, -84, -cardH / 2, 168, 3.5, 2);
        ctx.fill();

        const pad = 18, photoW = cardW - pad * 2, photoH = 342;
        const photoX = -photoW / 2, photoY = -cardH / 2 + pad;

        ctx.save();
        roundRect(ctx, photoX, photoY, photoW, photoH, 16);
        ctx.clip();
        if (jullPhotoReady && jullPhoto.naturalWidth > 0) {
          const iw = jullPhoto.naturalWidth, ih = jullPhoto.naturalHeight;
          const imgRatio = iw / ih, boxRatio = photoW / photoH;
          let sx = 0, sy = 0, sw = iw, sh = ih;
          if (imgRatio > boxRatio) { sw = ih * boxRatio; sx = (iw - sw) / 2; }
          else { sh = iw / boxRatio; sy = (ih - sh) * 0.25; }
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(jullPhoto, sx, sy, sw, sh, photoX, photoY, photoW, photoH);
          const vig = ctx.createRadialGradient(0, photoY + photoH / 2, photoW * 0.32, 0, photoY + photoH / 2, photoW * 0.72);
          vig.addColorStop(0, "rgba(0, 0, 0, 0)");
          vig.addColorStop(1, "rgba(10, 10, 14, 0.34)");
          ctx.fillStyle = vig;
          ctx.fillRect(photoX, photoY, photoW, photoH);
        } else {

      // Garis Penghubung Emas Melengkung (Bezier) dari Merry & Roger ke Polaroid Jull
      function drawBossConnectionArcs(mFloor, rFloor, prog, time) {
        if (prog <= 0.02) return;
        const alpha = smoothstep(0.0, 0.55, prog);
        ctx.save();
        ctx.globalAlpha *= alpha;

        const arcs = [
          { x0: mFloor.x, y0: mFloor.y - 35, cx: 220, cy: 840, x1: 356, y1: 795, col: "#6ea8fe" },
          { x0: rFloor.x, y0: rFloor.y - 35, cx: 860, cy: 840, x1: 724, y1: 778, col: "#e07a5f" }
        ];

        for (const a of arcs) {
          const grad = ctx.createLinearGradient(a.x0, a.y0, a.x1, a.y1);
          grad.addColorStop(0, a.col);
          grad.addColorStop(1, "#ebb343");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6;
          ctx.setLineDash([6, 6]);
          ctx.lineDashOffset = -time * 28;
          ctx.beginPath();
          ctx.moveTo(a.x0, a.y0);
          ctx.quadraticCurveTo(a.cx, a.cy, a.x1, a.y1);
          ctx.stroke();
          ctx.setLineDash([]);

          // 2 titik cahaya emas mengalir sepanjang kurva menuju kartu Boss
          for (let k = 0; k < 2; k++) {
            const u = (time * 0.75 + k * 0.5) % 1.0;
            const inv = 1 - u;
            const px = inv * inv * a.x0 + 2 * inv * u * a.cx + u * u * a.x1;
            const py = inv * inv * a.y0 + 2 * inv * u * a.cy + u * u * a.y1;
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#ffe07d";
            ctx.fill();
          }
        }
        ctx.restore();
      }

      // Live Dual Compute Oscilloscope Panel (Mengisi 660px Dead Space di Beat 6 ERD!)
      function drawComputeTelemetryPanel(chargeProg, time, alpha) {
        if (alpha <= 0.01) return;
        const x = 48, y = 1172, w = 984, h = 528;

        ctx.save();
        ctx.globalAlpha *= alpha;

        roundRect(ctx, x, y, w, h, 14);

        ctx.strokeStyle = "#262632";
        ctx.stroke();

        // Header panel
        ctx.fillStyle = "#17171f";
        roundRect(ctx, x + 1, y + 1, w - 2, 52, 13);
        ctx.fill();
        ctx.fillStyle = "#252530";
        ctx.fillRect(x + 1, y + 53, w - 2, 1);

        ctx.font = "700 15px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#ebb343";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        fillTrackedText("LIVE COMPUTE TELEMETRY  ·  DUAL WAVEFORM MONITOR", x + 26, y + 27, 1.5, "left");

        // Legend kanan
        ctx.fillStyle = "#6ea8fe"; ctx.fillRect(x + w - 266, y + 22, 10, 10);
        ctx.font = "600 14px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#c8c7c0"; ctx.fillText("GEMINI", x + w - 248, y + 27);
        ctx.fillStyle = "#e07a5f"; ctx.fillRect(x + w - 148, y + 22, 10, 10);
        ctx.fillStyle = "#c8c7c0"; ctx.fillText("CLAUDE", x + w - 130, y + 27);

        // Area Grafik Oscilloscope
        const gx = x + 28, gy = y + 76, gw = w - 56, gh = 264;
        roundRect(ctx, gx, gy, gw, gh, 8);
        ctx.fillStyle = "#0b0b0f";
        ctx.fill();
        ctx.strokeStyle = "#1f1f28";
        ctx.lineWidth = 1;
        ctx.stroke();

        // Grid garis dalam oscilloscope
        ctx.strokeStyle = "rgba(255, 255, 255, 0.045)";
        for (let r = 1; r <= 3; r++) {
          const ly = gy + (gh / 4) * r;
          ctx.beginPath(); ctx.moveTo(gx, ly); ctx.lineTo(gx + gw, ly); ctx.stroke();
        }
        for (let c = 1; c <= 7; c++) {
          const lx = gx + (gw / 8) * c;
          ctx.beginPath(); ctx.moveTo(lx, gy); ctx.lineTo(lx, gy + gh); ctx.stroke();
        }

        // Gambar 2 gelombang aktif bergerak seiring chargeProg
        const activeW = Math.max(8, gw * clamp(chargeProg, 0.02, 1.0));
        const drawWave = (color, fillRgba, freqA, freqB, phaseOff, ampScale) => {
          ctx.save();
          ctx.beginPath();
          const steps = 90;
          let lastX = gx, lastY = gy + gh * 0.72;
          for (let s = 0; s <= steps; s++) {
            const u = s / steps;
            const px = gx + u * activeW;
            const envelope = Math.sin(u * Math.PI * 0.85 + 0.15);
            const trend = lerp(0.76, 0.28, u * chargeProg);
            const osc = (Math.sin(u * freqA - time * 6.5 + phaseOff) * 0.55 + Math.cos(u * freqB + time * 4.2) * 0.45) * ampScale * envelope;
            const py = gy + clamp(trend + osc, 0.10, 0.90) * gh;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
            lastX = px; lastY = py;
          }
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.6;
          ctx.stroke();

          // Soft fill di bawah kurva
          ctx.lineTo(lastX, gy + gh);
          ctx.lineTo(gx, gy + gh);
          ctx.closePath();
          ctx.fillStyle = fillRgba;
          ctx.fill();

          // Titik ujung hidup
          ctx.beginPath();
          ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.restore();
        };

        drawWave("#6ea8fe", "rgba(110, 168, 254, 0.11)", 18, 31, 0.0, 0.13);
        drawWave("#e07a5f", "rgba(224, 122, 95, 0.11)", 22, 27, 1.8, 0.14);

        // Live 3-Row Pipeline Console Checklist di bawah grafik
        const logY = gy + gh + 22;
        const logs = [
          { t: 0.15, k: "01 · ALLOCATE BUFFER",   v: "270×480 Offscreen + Uint8Array(129600)", ok: "LOCKED ✓" },
          { t: 0.48, k: "02 · PALETTE ENFORCER",  v: "Strict 16-Color Hex LUT · 0% Anti-Alias", ok: "VERIFIED ✓" },
          { t: 0.80, k: "03 · RENDER HARNESS",    v: "Playwright 360F @ 30FPS + FFmpeg x264",   ok: "ARMED ✓" }
        ];

        for (let i = 0; i < logs.length; i++) {
          const ly = logY + i * 50;
          const done = chargeProg >= logs[i].t;
          roundRect(ctx, gx, ly, gw, 40, 7);
          ctx.fillStyle = done ? "#141918" : "#0e0e13";
          ctx.fill();
          ctx.strokeStyle = done ? "rgba(92, 230, 160, 0.32)" : "#1f1f28";
          ctx.lineWidth = 1.1;
          ctx.stroke();

          ctx.textBaseline = "middle";
          ctx.font = "700 14px ui-monospace, Consolas, monospace";
          ctx.fillStyle = done ? "#ebb343" : "#5c5b57";
          ctx.textAlign = "left";
          ctx.fillText(logs[i].k, gx + 16, ly + 20);

          ctx.font = "500 14.5px ui-monospace, Consolas, monospace";
          ctx.fillStyle = done ? "#d8d7d2" : "#4a4a52";
          ctx.fillText(logs[i].v, gx + 236, ly + 20);

          ctx.font = "700 14px ui-monospace, Consolas, monospace";
          ctx.fillStyle = done ? "#5ce6a0" : "#4a4a52";
          ctx.textAlign = "right";
          ctx.fillText(done ? logs[i].ok : "PENDING...", gx + gw - 16, ly + 20);
        }

        ctx.restore();
      }

          ctx.strokeStyle = accentHex; ctx.lineWidth = 1.6; ctx.stroke();
        }

        ctx.shadowColor = "rgba(0, 0, 0, 0.65)"; ctx.shadowBlur = 34; ctx.shadowOffsetY = 10;
        roundRect(ctx, cardX, cardY, cardW, cardH, 14);
        ctx.fillStyle = "#141419"; ctx.fill();
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = 1.6; ctx.strokeStyle = accentHex; ctx.stroke();

        if (!dualMode && pointerX !== undefined) {
          const px = clamp(pointerX, cardX + 95, cardX + cardW - 95);
          ctx.fillStyle = "#141419"; ctx.fillRect(px - 16, cardY - 1, 32, 4);
        }

        ctx.fillStyle = "#191921";
        roundRect(ctx, cardX + 2, cardY + 2, cardW - 4, 56, 12); ctx.fill();
        ctx.fillStyle = "#262632"; ctx.fillRect(cardX + 2, cardY + 58, cardW - 4, 1);

        if (dualMode) {
          roundRect(ctx, cardX + 26, cardY + 23, 12, 12, 3); ctx.fillStyle = "#6ea8fe"; ctx.fill();
          roundRect(ctx, cardX + 43, cardY + 23, 12, 12, 3); ctx.fillStyle = "#e07a5f"; ctx.fill();
        } else {
          roundRect(ctx, cardX + 26, cardY + 23, 12, 12, 3); ctx.fillStyle = accentHex; ctx.fill();
        }

        const tagStartX = dualMode ? cardX + 66 : cardX + 48;
        ctx.font = "800 18px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = accentHex; ctx.textBaseline = "middle";
        const spW = fillTrackedText(speakerTag, tagStartX, cardY + 30, 1.8, "left");
        ctx.font = "500 16px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.fillStyle = "#8e8d88"; ctx.fillText("  ·  " + roleTag, tagStartX + spW, cardY + 30);

        const wfRight = cardX + cardW - 26, wfMidY = cardY + 30;
        const talkingNow = typeProg > 0.02 && typeProg < 0.96;
        for (let b = 0; b < 14; b++) {
          const bx = wfRight - (13 - b) * 8;
          const wave = talkingNow
            ? 5 + Math.abs(Math.sin(time * 18 + b * 0.72) * Math.cos(time * 10 - b * 0.38)) * 22
            : 4 + Math.sin(time * 4 + b) * 1.5;
          roundRect(ctx, bx - 4, wfMidY - wave / 2, 4, wave, 2);
          ctx.fillStyle = talkingNow ? accentHex : "#3b3b46"; ctx.fill();
        }

        ctx.save();
        ctx.globalAlpha *= clamp(textAlpha, 0, 1);
        const fullText = line2 ? (line1 + "\n" + line2) : line1;
        const shownStr = fullText.slice(0, Math.floor(clamp(typeProg, 0, 1) * fullText.length));
        const parts = shownStr.split("\n"), s1 = parts[0] || "", s2 = parts[1] || "";

        ctx.font = "800 36px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";

        const renderHL = (str, yPos) => {
          const kws = [
            { w: "Roger!", col: "#e07a5f" }, { w: "Roger", col: "#e07a5f" },
            { w: "Merry!", col: "#6ea8fe" }, { w: "Merry", col: "#6ea8fe" },
            { w: "Jull!",  col: "#ebb343" }, { w: "Jull",  col: "#ebb343" },
            { w: "Woi",    col: "#ff6b6b" }
          ];
          let m = null;
          for (const kw of kws) { const idx = str.indexOf(kw.w); if (idx >= 0) { m = { idx, len: kw.w.length, col: kw.col }; break; } }
          if (!m) { ctx.fillStyle = "#f5f4f0"; ctx.fillText(str, cardX + 34, yPos); }
          else {
            const p0 = str.slice(0, m.idx), p1 = str.slice(m.idx, m.idx + m.len), p2 = str.slice(m.idx + m.len);
            ctx.fillStyle = "#f5f4f0"; ctx.fillText(p0, cardX + 34, yPos);
            const w0 = ctx.measureText(p0).width;
            ctx.fillStyle = m.col; ctx.fillText(p1, cardX + 34 + w0, yPos);
            const w1 = ctx.measureText(p1).width;
            ctx.fillStyle = "#f5f4f0"; ctx.fillText(p2, cardX + 34 + w0 + w1, yPos);
          }
        };

        const yL1 = line2 ? (cardY + 112) : (cardY + 140);
        renderHL(s1, yL1);
        if (s2.length > 0) renderHL(s2, cardY + 166);
        if (typeProg > 0.02 && (typeProg < 1.0 || Math.sin(time * 9) > 0)) {
          const onL2 = parts.length > 1;
          const activeStr = onL2 ? s2 : s1;
          const curY = onL2 ? cardY + 166 : yL1;
          ctx.fillStyle = accentHex;
          roundRect(ctx, cardX + 34 + ctx.measureText(activeStr).width + 8, curY - 18, 4, 36, 2);
          ctx.fill();

        ctx.restore();
        ctx.restore();
      }

      function drawStageFloor(floorY, stageAlpha, rogerGlow, merryGlow, togetherGlow) {
        if (stageAlpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha *= stageAlpha;
        const leftGlow = ctx.createRadialGradient(310, floorY, 10, 310, floorY, 340);
        leftGlow.addColorStop(0, `rgba(110, 168, 254, ${(0.10 + merryGlow * 0.16 + togetherGlow * 0.08).toFixed(3)})`);
        leftGlow.addColorStop(1, "rgba(110, 168, 254, 0)");
        ctx.fillStyle = leftGlow; ctx.fillRect(24, floorY - 200, W - 48, 400);

        const rightGlow = ctx.createRadialGradient(770, floorY, 10, 770, floorY, 340);
        rightGlow.addColorStop(0, `rgba(224, 122, 95, ${(0.10 + rogerGlow * 0.16 + togetherGlow * 0.08).toFixed(3)})`);
        rightGlow.addColorStop(1, "rgba(224, 122, 95, 0)");
        ctx.fillStyle = rightGlow; ctx.fillRect(24, floorY - 200, W - 48, 400);

        ctx.beginPath(); ctx.rect(48, floorY - 85, W - 96, 230); ctx.clip();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.045)"; ctx.lineWidth = 1;
        for (let i = -5; i <= 5; i++) {
          ctx.beginPath(); ctx.moveTo(W / 2 + i * 38, floorY - 80); ctx.lineTo(W / 2 + i * 165, floorY + 150); ctx.stroke();
        }
        for (const hy of [floorY - 72, floorY - 38, floorY + 2, floorY + 48, floorY + 102]) {
          ctx.beginPath(); ctx.moveTo(48, hy); ctx.lineTo(W - 48, hy); ctx.stroke();
        }
        ctx.restore();
      }

      function drawFloorShadow(cx, cy, rx, ry, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, rx * 0.12, 0, 0, rx);
        grad.addColorStop(0, `rgba(0, 0, 0, ${(0.72 * alpha).toFixed(3)})`);
        grad.addColorStop(0.65, `rgba(0, 0, 0, ${(0.28 * alpha).toFixed(3)})`);
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // Syntax Highlighter Mini untuk Kode Siluet Workspace
      function drawSyntaxLine(line, x, y, spotlight, accentHex) {
        if (spotlight <= 0.05) {
          ctx.fillStyle = "#32323d";
          ctx.fillText(line, x, y);
          return;
        }
        const tokenRe = /('[^']*'|\b(?:import|export|from|const|let|function|async|return|if|for|new)\b|\b\d+(?:\.\d+)?\b)/g;
        let curX = x, lastIdx = 0, match;
        ctx.save();
        ctx.shadowColor = accentHex;
        ctx.shadowBlur = spotlight * 10;

        while ((match = tokenRe.exec(line)) !== null) {
          if (match.index > lastIdx) {
            const plain = line.slice(lastIdx, match.index);
            ctx.fillStyle = spotlight > 0.50 ? "#f4f3ef" : "#a8a7a0";
            ctx.fillText(plain, curX, y);
            curX += ctx.measureText(plain).width;
          }
          const tok = match[0];
          if (tok.startsWith("'")) ctx.fillStyle = "#5ce6a0";
          else if (/^\d/.test(tok)) ctx.fillStyle = "#ebb343";
          else ctx.fillStyle = accentHex;
          ctx.fillText(tok, curX, y);
          curX += ctx.measureText(tok).width;
          lastIdx = tokenRe.lastIndex;
        }
        if (lastIdx < line.length) {
          const tail = line.slice(lastIdx);
          ctx.fillStyle = spotlight > 0.50 ? "#f4f3ef" : "#a8a7a0";
          ctx.fillText(tail, curX, y);
        }
        ctx.restore();
      }

      // Upgraded AI Code Workspace Board (+ Syntax Highlighting + Cursor Click Ripples)
      function drawAICodeBoardSequence(opts) {
        const {
          brand, accentHex, accentDim, codeLines, initModel, targetModel,
          revealProg, scrollProg, dropdownOpenProg, modelSelected,
          sendClickProg, flyToCenterProg, cursorPos, clickRipples = [], revealMode
        } = opts;

        const baseX = 64, baseY = 530, fullW = W - 128, fullH = 696;
        const flyEase = easeInOutCubic(flyToCenterProg);
        const boxW = lerp(fullW * (revealMode === "wheel" ? revealProg : 1), 320, flyEase);
        const boxH = lerp(fullH * (revealMode === "starburst" ? revealProg : 1), 110, flyEase);
        const boxX = revealMode === "wheel" ? lerp(baseX, (W - boxW) / 2, flyEase) : (W - boxW) / 2;
        const boxY = lerp(baseY, (H - boxH) / 2, flyEase);
        const boardAlpha = clamp(revealProg * 2.5, 0, 1) * (1 - smoothstep(0.75, 1.0, flyToCenterProg));

        if (boardAlpha > 0.01 && boxW > 20 && boxH > 20) {
          ctx.save();
          ctx.globalAlpha *= boardAlpha;
          ctx.shadowColor = accentDim; ctx.shadowBlur = 36;
          roundRect(ctx, boxX, boxY, boxW, boxH, 14);
          ctx.fillStyle = "#131317"; ctx.fill(); ctx.shadowBlur = 0;
          ctx.lineWidth = 1.8; ctx.strokeStyle = accentHex; ctx.stroke();

          ctx.beginPath();
          roundRect(ctx, boxX + 2, boxY + 2, Math.max(1, boxW - 4), Math.max(1, boxH - 4), 12);
          ctx.clip();

          ctx.fillStyle = "#18181e"; ctx.fillRect(boxX, boxY, boxW, 56);
          ctx.fillStyle = "#262630"; ctx.fillRect(boxX, boxY + 56, boxW, 1);

          if (brand === "CLAUDE") drawClaudeSunburstLogo(boxX + 34, boxY + 28, 12, scrollProg * Math.PI * 2, accentHex, 1);
          else drawGeminiSparkleLogo(boxX + 34, boxY + 28, 14, scrollProg * Math.PI, 1);

          ctx.font = "700 19px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.fillStyle = "#e6e5e0"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillText(brand === "CLAUDE" ? "claude_workspace // rocket_sim.js" : "gemini_studio // orbital_core.js", boxX + 58, boxY + 28);

          ctx.font = "500 15.5px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.fillStyle = accentHex; ctx.textAlign = "right";
          ctx.fillText("SYNTAX CODE INSPECTOR", boxX + boxW - 24, boxY + 28);

          const codeAreaTop = boxY + 60, codeAreaH = boxH - 136, lineH = 32;
          const maxScroll = Math.max(0, codeLines.length * lineH - codeAreaH + 40);
          const scrollPos = scrollProg <= 0.55
            ? easeInOutCubic(scrollProg / 0.55) * maxScroll
            : (1 - easeInOutCubic((scrollProg - 0.55) / 0.45)) * maxScroll;
          const scannerY = codeAreaTop + (scrollProg <= 0.55
            ? (scrollProg / 0.55) * codeAreaH
            : (1 - (scrollProg - 0.55) / 0.45) * codeAreaH);

          ctx.font = "500 20px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.textBaseline = "top"; ctx.textAlign = "left";

          for (let i = 0; i < codeLines.length; i++) {
            const ly = codeAreaTop + 18 + i * lineH - scrollPos;
            if (ly + lineH < codeAreaTop || ly > codeAreaTop + codeAreaH) continue;
            const spot = clamp(1 - Math.abs((ly + lineH / 2) - scannerY) / 165, 0, 1);

            ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillText(codeLines[i], boxX + 71, ly + 3);
            ctx.fillStyle = spot > 0.3 ? accentHex : "#3a3a44";
            ctx.fillText(String(i + 1).padStart(2, "0"), boxX + 24, ly);

            drawSyntaxLine(codeLines[i], boxX + 68, ly, spot, accentHex);
          }

          if (scrollProg > 0.02 && scrollProg < 0.98) {
            const sg = ctx.createLinearGradient(boxX, scannerY - 45, boxX, scannerY + 45);
            sg.addColorStop(0, "rgba(0,0,0,0)"); sg.addColorStop(0.5, accentDim); sg.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = sg; ctx.fillRect(boxX + 4, scannerY - 45, boxW - 8, 90);
            ctx.fillStyle = accentHex; ctx.fillRect(boxX + 12, scannerY, boxW - 24, 1.5);
          }

          const sbTrackH = Math.max(20, codeAreaH - 24), sbThumbH = 64;
          const sbY = codeAreaTop + 12 + (maxScroll > 0 ? (scrollPos / maxScroll) * (sbTrackH - sbThumbH) : 0);
          roundRect(ctx, boxX + boxW - 12, sbY, 5, sbThumbH, 2.5);
          ctx.fillStyle = accentHex; ctx.fill();

          const footTop = boxY + boxH - 76;
          ctx.fillStyle = "#18181f"; ctx.fillRect(boxX, footTop, boxW, 76);
          ctx.fillStyle = "#282833"; ctx.fillRect(boxX, footTop, boxW, 1.5);

          const pillX = boxX + 22, pillY = footTop + 15, pillW = 295, pillH = 46;
          roundRect(ctx, pillX, pillY, pillW, pillH, 9);
          ctx.fillStyle = modelSelected ? "rgba(255, 255, 255, 0.06)" : "#121217"; ctx.fill();
          ctx.lineWidth = 1.5; ctx.strokeStyle = modelSelected ? accentHex : "#343440"; ctx.stroke();

          roundRect(ctx, pillX + 14, pillY + 15, 16, 16, 4);
          ctx.fillStyle = modelSelected ? accentHex : "#6e6d68"; ctx.fill();

          ctx.font = "700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = modelSelected ? "#f4f3ef" : "#969590";
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillText(modelSelected ? targetModel : initModel, pillX + 40, pillY + pillH / 2 + 0.5);

          ctx.fillStyle = "#8a8984"; ctx.font = "600 16px ui-monospace, Consolas, monospace";
          ctx.fillText("▾", pillX + pillW - 26, pillY + pillH / 2 + 1);

          if (dropdownOpenProg > 0.02) {
            ctx.save();
            ctx.globalAlpha = boardAlpha * dropdownOpenProg;
            const menuW = 310, menuH = 108, menuX = pillX, menuY = pillY - menuH - 10;
            roundRect(ctx, menuX, menuY, menuW, menuH, 10);
            ctx.fillStyle = "#1c1c24"; ctx.fill();
            ctx.lineWidth = 1.6; ctx.strokeStyle = accentHex; ctx.stroke();
            ctx.font = "500 18px ui-monospace, Consolas, monospace";
            ctx.fillStyle = "#787670"; ctx.textAlign = "left";
            ctx.fillText(initModel + "  ( Default )", menuX + 18, menuY + 28);
            roundRect(ctx, menuX + 8, menuY + 52, menuW - 16, 46, 7);
            ctx.fillStyle = accentDim; ctx.fill();
            ctx.strokeStyle = accentHex; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.font = "800 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
            ctx.fillStyle = accentHex;
            ctx.fillText("✦ " + targetModel, menuX + 20, menuY + 75);
            ctx.restore();
          }

          const sendW = 142, sendH = 46, sendX = boxX + boxW - sendW - 22, sendY = footTop + 15;
          const btnScale = 1 - 0.09 * Math.sin(sendClickProg * Math.PI);
          ctx.save();
          ctx.translate(sendX + sendW / 2, sendY + sendH / 2);
          ctx.scale(btnScale, btnScale);
          roundRect(ctx, -sendW / 2, -sendH / 2, sendW, sendH, 9);
          ctx.fillStyle = accentHex; ctx.fill();
          ctx.font = "800 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = "#0e0e10"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("KIRIM  ↑", 0, 1);
          ctx.restore();

          ctx.restore();
        }

        // Click Ripples pada setiap aksi klik kursor!
        for (const rp of clickRipples) {
          if (rp.p > 0 && rp.p < 1) {
            ctx.save();
            ctx.globalAlpha = Math.pow(1 - rp.p, 1.4) * 0.85;
            ctx.beginPath();
            ctx.arc(rp.x, rp.y, 10 + easeOutCubic(rp.p) * 44, 0, Math.PI * 2);
            ctx.strokeStyle = "#ebb343";
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.restore();
          }
        }

        if (revealMode === "wheel" && revealProg > 0.01 && revealProg < 0.99) {
          drawClaudeSunburstLogo(boxX + boxW, boxY + boxH / 2, 54, revealProg * Math.PI * 5, accentHex, 1.0);
        }
        if (revealMode === "starburst" && revealProg > 0.01 && revealProg < 0.99) {
          const ss = lerp(1.6, 0.9, revealProg);
          drawGeminiSparkleLogo(W / 2, boxY, 44 * ss, revealProg * Math.PI, 1 - revealProg * 0.5);
          drawGeminiSparkleLogo(W / 2, boxY + boxH, 44 * ss, -revealProg * Math.PI, 1 - revealProg * 0.5);
        }
        if (cursorPos && cursorPos.alpha > 0.01) {
          drawCursorArrow(cursorPos.x, cursorPos.y, cursorPos.scale || 1.0, cursorPos.alpha);
        }

        return boardAlpha;
      }

      // =======================================================================
      // 6. FUNGSI UTAMA: drawFrame(t) — LUXURY MASTER INTRO 46.00 DETIK
      // =======================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, DURATION);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(SSAA, SSAA);

        // Micro camera shake saat senggolan di skit (global time = 10.15s)
        let camShakeX = 0, camShakeY = 0;
        if (time >= 10.15 && time <= 10.57) {
          const sp = (time - 10.15) / 0.42;
          const amp = (1 - sp) * (1 - sp) * 9.5;
          camShakeX = Math.sin(time * 88.0) * amp;
          camShakeY = Math.cos(time * 74.0) * (amp * 0.6);
        }

        // 1. Latar Warm Obsidian (#0f0f11) + REACTIVE STUDIO LIGHTING!
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate(camShakeX, camShakeY);

        const angryFlash  = bellCurve(time, 12.45, 12.80, 14.85, 15.20);
        const claudeMood  = bellCurve(time, 26.80, 27.50, 32.50, 33.20);
        const geminiMood  = bellCurve(time, 33.40, 34.10, 38.90, 39.50);
        const splitMood   = Math.max(bellCurve(time, 24.15, 24.65, 26.70, 27.10), smootherstep(42.75, 43.35, time));

        // Base Gold Wash
        const wash = ctx.createRadialGradient(W / 2, 740, 40, W / 2, 740, 800);
        wash.addColorStop(0, "rgba(235, 179, 67, 0.052)");
        wash.addColorStop(0.6, "rgba(110, 168, 254, 0.018)");
        wash.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, W, H);

        // Reactive Angry Red Pulse saat Roger ngamuk
        if (angryFlash > 0.01) {
          const ag = ctx.createRadialGradient(780, 900, 30, 780, 900, 620);
          ag.addColorStop(0, `rgba(255, 92, 92, ${(angryFlash * 0.11).toFixed(4)})`);
          ag.addColorStop(1, "rgba(255, 92, 92, 0)");
          ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H);
        }

        // Reactive Claude Workspace Warm Coral Wash
        if (claudeMood > 0.01) {
          const cg = ctx.createRadialGradient(W / 2, 780, 40, W / 2, 780, 760);
          cg.addColorStop(0, `rgba(224, 122, 95, ${(claudeMood * 0.085).toFixed(4)})`);
          cg.addColorStop(1, "rgba(224, 122, 95, 0)");
          ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
        }

        // Reactive Gemini Studio Cool Blue Wash
        if (geminiMood > 0.01) {
          const gg = ctx.createRadialGradient(W / 2, 780, 40, W / 2, 780, 760);
          gg.addColorStop(0, `rgba(110, 168, 254, ${(geminiMood * 0.090).toFixed(4)})`);
          gg.addColorStop(1, "rgba(110, 168, 254, 0)");
          ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
        }

        // Reactive Duotone Split Wash saat Duel VS & Showdown
        if (splitMood > 0.01) {
          const dL = ctx.createRadialGradient(220, 680, 30, 220, 680, 640);
          dL.addColorStop(0, `rgba(110, 168, 254, ${(splitMood * 0.095).toFixed(4)})`);
          dL.addColorStop(1, "rgba(110, 168, 254, 0)");
          ctx.fillStyle = dL; ctx.fillRect(0, 0, W, H);

          const dR = ctx.createRadialGradient(860, 1180, 30, 860, 1180, 640);
          dR.addColorStop(0, `rgba(224, 122, 95, ${(splitMood * 0.095).toFixed(4)})`);
          dR.addColorStop(1, "rgba(224, 122, 95, 0)");
          ctx.fillStyle = dR; ctx.fillRect(0, 0, W, H);
        }

        // 2. Frame Editorial Hairline (1px) + Micro Chapter Progress Rail
        ctx.strokeStyle = "#1e1e23";
        ctx.lineWidth = 1;
        ctx.strokeRect(24.5, 44.5, W - 49, H - 89);

        ctx.fillStyle = "#1e1e23";
        ctx.fillRect(24, 122, W - 48, 1);
        ctx.fillRect(24, 1792, W - 48, 1);

        if (time >= 3.20 && time < 24.40) {
          ctx.fillStyle = "#1d1d22";
          ctx.fillRect(539.5, 44, 1, 212);
        }

        drawChapterProgressRail(time);
        drawCrosshair(540, 122, 4, "#36363f");
        drawCrosshair(540, 1792, 4, "#36363f");

        // 3. Masthead Atas Dinamis
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ebb343";
        ctx.fillRect(48, 80, 6, 6);
        ctx.fillStyle = "#7c7b76";
        fillTrackedText("JOULFIAND STUDIO  ·  ADU MODEL", 66, 83.5, 1.8, "left");

        let mastRight = "00 — INTRO  ·  BENCHMARK";
        if (time >= 3.20 && time < 24.20) mastRight = "00 — INTRO  ·  AI AGENTS";
        else if (time >= 24.20 && time < 39.20) mastRight = "00 — ENGINE  ·  SETUP";
        else if (time >= 39.20 && time < 42.80) mastRight = "00 — SCHEMA  ·  COMPUTE";
        else if (time >= 42.80) mastRight = "00 — SHOWDOWN  ·  1 SHOT";
        ctx.fillStyle = "#969590";
        fillTrackedText(mastRight, W - 48, 83.5, 1.8, "right");

        // =====================================================================
        // BEAT 1 (0.00s - 3.25s): KINETIC SLIT-MASK OPENER + METALLIC GOLD GLINT
        // =====================================================================
        if (time < 3.30) {
          const inP  = smootherstep(0.06, 0.85, time);
          const outP = smootherstep(2.55, 3.25, time);
          const alpha = inP * (1 - outP);

          if (alpha > 0.01) {
            ctx.save();
            ctx.globalAlpha = alpha;

            // Corner Viewfinder Brackets yang membuka melebar menjelang Beat 2
            const expand = easeInOutCubic(outP) * 36;
