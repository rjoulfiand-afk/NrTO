          "N":["10001","11001","10101","10011","10001","10001","10001"],
          "O":["01110","10001","10001","10001","10001","10001","01110"],
          "P":["11110","10001","10001","11110","10000","10000","10000"],
          "Q":["01110","10001","10001","10001","10101","10010","01101"],
          "R":["11110","10001","10001","11110","10100","10010","10001"],
          "S":["01111","10000","10000","01110","00001","00001","11110"],
          "T":["11111","00100","00100","00100","00100","00100","00100"],
          "U":["10001","10001","10001","10001","10001","10001","01110"],
          "V":["10001","10001","10001","10001","10001","01010","00100"],
          "W":["10001","10001","10001","10101","10101","11011","10001"],
          "X":["10001","10001","01010","00100","01010","10001","10001"],
          "Y":["10001","10001","01010","00100","00100","00100","00100"],
          "0":["01110","10001","10011","10101","11001","10001","01110"],
          "1":["00100","01100","00100","00100","00100","00100","01110"],
          "2":["01110","10001","00001","00110","01000","10000","11111"],
          "3":["11110","00001","00001","01110","00001","00001","11110"],
          "4":["00010","00110","01010","10010","11111","00010","00010"],
          "5":["11111","10000","10000","11110","00001","00001","11110"],
          "6":["01110","10000","10000","11110","10001","10001","01110"],
          "7":["11111","00001","00010","00100","01000","01000","01000"],
          "8":["01110","10001","10001","01110","10001","10001","01110"],
          "9":["01110","10001","10001","01111","00001","00001","01110"],
          ":":["00000","00100","00100","00000","00100","00100","00000"],
          "-":["00000","00000","00000","11111","00000","00000","00000"],
          "!":["00100","00100","00100","00100","00100","00000","00100"],
          " ":["00000","00000","00000","00000","00000","00000","00000"]
        };

        const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
        const lerp = (a, b, t) => a + (b - a) * t;

        function rect(x, y, w, h, color) {
          const rx = Math.floor(x), ry = Math.floor(y), rw = Math.floor(w), rh = Math.floor(h);
          if (rw <= 0 || rh <= 0 || rx + rw <= 0 || ry + rh <= 0 || rx >= W || ry >= H) return;
          ctx.fillStyle = color;
          ctx.fillRect(rx, ry, rw, rh);
        }

        function circle(cx, cy, r, color) {
          const icx = Math.floor(cx), icy = Math.floor(cy), ir = Math.floor(r);
          if (ir <= 0) return;
          ctx.fillStyle = color;
          for (let dy = -ir; dy <= ir; dy++) {
            const py = icy + dy;
            if (py < 0 || py >= H) continue;
            const dx = Math.floor(Math.sqrt(ir * ir - dy * dy));
            const x1 = Math.max(0, icx - dx), x2 = Math.min(W - 1, icx + dx);
            if (x2 >= x1) ctx.fillRect(x1, py, x2 - x1 + 1, 1);
          }
        }

        function drawPixelText(text, x, y, scale, color, shadowColor) {
          const str = String(text).toUpperCase();
          const s = Math.max(1, Math.floor(scale));
          let curX = Math.floor(x);
          const curY = Math.floor(y);
          for (let i = 0; i < str.length; i++) {
            const glyph = FONT_5X7[str[i]] || FONT_5X7[" "];
            for (let r = 0; r < 7; r++) {
              for (let c = 0; c < 5; c++) {
                if (glyph[r][c] === "1") {
                  if (shadowColor) rect(curX + c * s + s, curY + r * s + s, s, s, shadowColor);
                  rect(curX + c * s, curY + r * s, s, s, color);
                }
              }
            }
            curX += 6 * s;
          }
        }

        function measurePixelText(text, scale) {
          const len = String(text).length;
          return len === 0 ? 0 : (len * 6 - 1) * Math.floor(scale);
        }

        function drawCenteredText(text, y, scale, color, shadowColor) {
          drawPixelText(text, Math.floor((W - measurePixelText(text, scale)) / 2), y, scale, color, shadowColor);
        }

        function drawDitheredSky(stops, yOffset) {
          for (let py = 0; py < H; py++) {
            const wy = py + yOffset;
            let idx = 0;
            while (idx < stops.length - 2 && wy > stops[idx + 1].y) idx++;
            const s0 = stops[idx], s1 = stops[idx + 1];
            const ratio = clamp((wy - s0.y) / Math.max(1, s1.y - s0.y), 0, 1);
            if (ratio <= 0.05) rect(0, py, W, 1, s0.color);
            else if (ratio >= 0.95) rect(0, py, W, 1, s1.color);
            else {
              const bayerRow = BAYER4[py & 3];
              const thresh = Math.floor(ratio * 16);
              rect(0, py, W, 1, s0.color);
              ctx.fillStyle = s1.color;
              for (let px = 0; px < W; px++) if (bayerRow[px & 3] < thresh) ctx.fillRect(px, py, 1, 1);
            }
          }
        }

        const STARS = Array.from({ length: 110 }, (_, i) => ({
          x: Math.floor(hash(i * 3 + 1) * W),
          y: Math.floor(hash(i * 3 + 2) * H),
          speed: 0.25 + hash(i * 3 + 3) * 0.85,
          phase: hash(i * 7 + 5) * 12,
          bright: i % 5 === 0,
          med: i % 3 === 0
        }));

        function drawStarfield(t, visibility, scrollOffset) {
          if (visibility <= 0.02) return;
          if (visibility > 0.65) {
            for (let py = 40; py < 340; py += 2) {
              const bandX = Math.floor(40 + py * 0.45 + Math.sin(py * 0.05) * 18);
              const bandW = 28 + Math.floor(Math.cos(py * 0.04) * 10);
              for (let px = Math.max(0, bandX - bandW); px < Math.min(W, bandX + bandW); px += 2) {
                if (BAYER4[py & 3][px & 3] < 3) rect(px, py, 1, 1, PAL.DEEP_NAVY);
              }
            }
          }
          const maxStars = Math.floor(STARS.length * clamp(visibility, 0, 1));
          for (let i = 0; i < maxStars; i++) {
            const st = STARS[i];
            const sy = ((st.y + Math.floor(scrollOffset * st.speed)) % H + H) % H;
            const sx = st.x;
            const twinkle = Math.sin(t * 5.2 + st.phase);
            if (st.bright && twinkle > 0.5) {
              rect(sx, sy, 1, 1, PAL.PURE_WHITE);
              rect(sx - 1, sy, 3, 1, PAL.STAR_YELLOW);
              rect(sx, sy - 1, 1, 3, PAL.STAR_YELLOW);
            } else if (st.med && twinkle > 0) rect(sx, sy, 1, 1, PAL.PURE_WHITE);
            else if (twinkle > -0.35) rect(sx, sy, 1, 1, PAL.LIGHT_STEEL);
            else rect(sx, sy, 1, 1, PAL.TWILIGHT_BLUE);
          }
        }

        function drawTwoStageRocket(rx, ry, t, thrustLevel, separated, sepTime, rcsLeft, rcsRight) {
          const x = Math.floor(rx), y = Math.floor(ry);
          if (separated && sepTime > 0 && sepTime < 2.2) {
            const dropY = y + 26 + Math.floor(sepTime * sepTime * 95);
            const driftX = x - Math.floor(sepTime * 14);
            if (dropY - 30 < H) {
              rect(driftX - 11, dropY - 26, 22, 22, PAL.LIGHT_STEEL);
              rect(driftX + 4, dropY - 26, 7, 22, PAL.MID_SLATE);
              rect(driftX - 11, dropY - 26, 22, 4, PAL.CHARCOAL);
              for (let i = 0; i < 14; i++) {
                const fw = Math.floor((14 - i) * 0.65) + 2;
                rect(driftX - 11 - fw, dropY - 6 - i, fw, 1, PAL.MARS_RED);
                rect(driftX + 11, dropY - 6 - i, fw, 1, PAL.MARS_RED);
              }
              rect(driftX - 6, dropY - 4, 12, 4, PAL.DARK_SLATE);
              if (sepTime < 0.7) {
                const ringW = Math.floor(14 + sepTime * 55);
                rect(x - Math.floor(ringW / 2), y - 22, ringW, 3, PAL.PURE_WHITE);
                circle(x - Math.floor(ringW * 0.4), y - 21, 4, PAL.STAR_YELLOW);
                circle(x + Math.floor(ringW * 0.4), y - 21, 4, PAL.STAR_YELLOW);
              }
            }
          }
          const stage2BaseY = separated ? (y - 22) : (y - 24);
          if (thrustLevel > 0) {
            const flicker = Math.floor(hash(Math.floor(t * 60)) * 8);
            const vacLen = Math.floor((16 + flicker * 0.6) * thrustLevel);
            const vacW = Math.max(4, Math.floor(10 * thrustLevel));
            rect(x - Math.floor(vacW / 2), stage2BaseY + 3, vacW, Math.floor(vacLen * 0.7), PAL.ORBIT_TEAL);
            rect(x - Math.floor(vacW * 0.35), stage2BaseY + 3, Math.floor(vacW * 0.7), Math.floor(vacLen * 0.85), PAL.SOLAR_GOLD);
            rect(x - 2, stage2BaseY + 3, 4, Math.floor(vacLen * 0.55), PAL.STAR_YELLOW);
            rect(x - 1, stage2BaseY + 3, 2, Math.floor(vacLen * 0.35), PAL.PURE_WHITE);
          }
          rect(x - 5, stage2BaseY, 10, 3, PAL.DARK_SLATE);
          rect(x - 6, stage2BaseY + 2, 12, 2, PAL.MID_SLATE);
          rect(x - 14, stage2BaseY - 8, 3, 7, PAL.MARS_RED);
          rect(x + 11, stage2BaseY - 8, 3, 7, PAL.MARS_RED);

          const topBodyY = y - 52;
          rect(x - 11, topBodyY, 22, 30, PAL.PURE_WHITE);
          rect(x + 4, topBodyY, 7, 30, PAL.LIGHT_STEEL);
          rect(x + 8, topBodyY, 3, 30, PAL.MID_SLATE);
          rect(x - 11, topBodyY + 2, 22, 3, PAL.MARS_RED);
          circle(x, y - 39, 6, PAL.DARK_SLATE);
          circle(x, y - 39, 4, PAL.TWILIGHT_BLUE);
          rect(x - 2, y - 41, 2, 2, PAL.MISSION_GREEN);
          rect(x - 1, y - 42, 1, 1, PAL.PURE_WHITE);
          for (let i = 0; i < 20; i++) {
            const halfW = Math.max(1, Math.floor(((20 - i) / 20) * 11));
            const rowY = y - 53 - i;
            rect(x - halfW, rowY, halfW * 2, 1, PAL.MARS_RED);
            if (halfW > 3) {
              rect(x - halfW + 1, rowY, 2, 1, PAL.SUNSET_ORANGE);
              rect(x + halfW - 3, rowY, 3, 1, PAL.CRIMSON_DUSK);
            }
          }
          rect(x - 1, y - 78, 2, 6, PAL.LIGHT_STEEL);
          rect(x - 1, y - 79, 2, 2, (Math.floor(t * 6) % 2 === 0) ? PAL.STAR_YELLOW : PAL.MARS_RED);
          if (rcsLeft) {
            rect(x - 18, y - 48, 6, 2, PAL.PURE_WHITE);
            rect(x - 22, y - 49, 4, 4, PAL.LIGHT_STEEL);
          }
          if (rcsRight) {
            rect(x + 12, y - 48, 6, 2, PAL.PURE_WHITE);
            rect(x + 18, y - 49, 4, 4, PAL.LIGHT_STEEL);
          }
        }

        function drawOrbitPlanet(cx, cy, r, t, lockProgress) {
          const icx = Math.floor(cx), icy = Math.floor(cy);
          if (icy + r + 35 < 0 || icy - r - 35 > H) return;
          for (let a = Math.PI; a < Math.PI * 2; a += 0.014) {
            rect(icx + Math.cos(a) * (r * 1.68) + Math.sin(a) * 10, icy + Math.sin(a) * (r * 0.42) - Math.cos(a) * 18, 3, 2, PAL.MID_SLATE);
            rect(icx + Math.cos(a) * (r * 1.46) + Math.sin(a) * 8, icy + Math.sin(a) * (r * 0.36) - Math.cos(a) * 15, 2, 2, PAL.SOLAR_GOLD);
          }
          for (let dy = -r; dy <= r; dy++) {
            const py = icy + dy;
            if (py < 0 || py >= H) continue;
            const halfW = Math.floor(Math.sqrt(r * r - dy * dy));
            for (let dx = -halfW; dx <= halfW; dx++) {
              const px = icx + dx;
              if (px < 0 || px >= W) continue;
              const light = (-dx * 0.65 - dy * 0.45) / r;
              const band = Math.sin((dy + Math.sin((dx + t * 2) * 0.08) * 4) * 0.22);
              let col = PAL.TWILIGHT_BLUE;
              if (light < -0.28) col = PAL.VOID_BLACK;
              else if (light < -0.05) col = (BAYER4[py & 3][px & 3] < 8) ? PAL.DEEP_NAVY : PAL.VOID_BLACK;
              else if (light < 0.15) col = PAL.DEEP_NAVY;
              else {
                if (band > 0.35) col = PAL.ORBIT_TEAL;
                else if (band > -0.15) col = PAL.TWILIGHT_BLUE;
                else col = PAL.DUSK_PURPLE;
                if (light > 0.55 && band > 0.1) col = PAL.MISSION_GREEN;
              }
              if (dx <= -halfW + 2 && light > 0) col = PAL.LIGHT_STEEL;
              ctx.fillStyle = col;
              ctx.fillRect(px, py, 1, 1);
            }
          }
          for (let a = 0; a < Math.PI; a += 0.011) {
            rect(icx + Math.cos(a) * (r * 1.68) + Math.sin(a) * 10, icy + Math.sin(a) * (r * 0.42) - Math.cos(a) * 18, 3, 2, PAL.LIGHT_STEEL);
            rect(icx + Math.cos(a) * (r * 1.46) + Math.sin(a) * 8, icy + Math.sin(a) * (r * 0.36) - Math.cos(a) * 15, 3, 2, PAL.SOLAR_GOLD);
            rect(icx + Math.cos(a) * (r * 1.28) + Math.sin(a) * 7, icy + Math.sin(a) * (r * 0.30) - Math.cos(a) * 13, 2, 1, PAL.SUNSET_ORANGE);
          }
          const mx = icx - r - 26, my = icy - r + 14 + Math.floor(Math.sin(t * 1.5) * 2);
          circle(mx, my, 12, PAL.MID_SLATE);
          circle(mx - 2, my - 2, 9, PAL.LIGHT_STEEL);
          circle(mx + 3, my + 2, 3, PAL.DARK_SLATE);
          circle(mx - 4, my + 4, 2, PAL.MID_SLATE);

          if (lockProgress > 0.05) {
            const boxR = Math.floor(r + 14 + (1.0 - lockProgress) * 20);
            const col = (lockProgress >= 0.95 || Math.floor(t * 8) % 2 === 0) ? PAL.MISSION_GREEN : PAL.STAR_YELLOW;
            const len = 10;
            rect(icx - boxR, icy - boxR, len, 2, col); rect(icx - boxR, icy - boxR, 2, len, col);
            rect(icx + boxR - len, icy - boxR, len, 2, col); rect(icx + boxR - 2, icy - boxR, 2, len, col);
            rect(icx - boxR, icy + boxR - 2, len, 2, col); rect(icx - boxR, icy + boxR - len, 2, len, col);
            rect(icx + boxR - len, icy + boxR - 2, len, 2, col); rect(icx + boxR - 2, icy + boxR - len, 2, len, col);
            if (lockProgress >= 0.95) drawPixelText("TARGET:SATURN-IV", icx - 46, icy - boxR - 10, 1, PAL.MISSION_GREEN, PAL.VOID_BLACK);
          }
        }

        function drawSatellite(sx, sy, t) {
          const x = Math.floor(sx), y = Math.floor(sy);
          if (y < -20 || y > H + 20) return;
          rect(x - 18, y - 3, 12, 6, PAL.TWILIGHT_BLUE); rect(x - 18, y - 3, 12, 1, PAL.LIGHT_STEEL);
          rect(x + 6, y - 3, 12, 6, PAL.TWILIGHT_BLUE); rect(x + 6, y - 3, 12, 1, PAL.LIGHT_STEEL);
          rect(x - 5, y - 4, 10, 8, PAL.LIGHT_STEEL); rect(x - 3, y - 2, 6, 4, PAL.SOLAR_GOLD);
          rect(x, y - 9, 1, 5, PAL.PURE_WHITE);
          if (Math.floor(t * 5) % 2 === 0) rect(x - 1, y - 10, 3, 2, PAL.MISSION_GREEN);
        }

        function drawEarthLimbHorizon(baseY) {
          const by = Math.floor(baseY);
          if (by >= H + 40) return;
          for (let px = 0; px < W; px++) {
            const dx = (px - W / 2) / (W / 2);
            const yTop = by + Math.floor(dx * dx * 28);
            if (yTop < H) {
              rect(px, yTop, 1, 2, PAL.MISSION_GREEN);
              rect(px, yTop + 2, 1, 4, PAL.ORBIT_TEAL);
              rect(px, yTop + 6, 1, 10, PAL.TWILIGHT_BLUE);
              rect(px, yTop + 16, 1, H - yTop, PAL.DEEP_NAVY);
            }
          }
        }

        function drawTopHUD(sceneLabel, altKm, progressRatio, alertText, t) {
          rect(8, 8, W - 16, 26, PAL.CHARCOAL);
          rect(8, 8, W - 16, 2, PAL.ORBIT_TEAL);
          rect(8, 32, W - 16, 2, PAL.DARK_SLATE);
          rect(8, 8, 2, 26, PAL.ORBIT_TEAL);
          rect(W - 10, 8, 2, 26, PAL.ORBIT_TEAL);
          drawPixelText(sceneLabel, 14, 14, 1, PAL.MISSION_GREEN, null);
          const altStr = "ALT:" + String(Math.floor(altKm)).padStart(3, "0") + "KM";
          drawPixelText(altStr, W - 14 - measurePixelText(altStr, 1), 14, 1, PAL.STAR_YELLOW, null);
          rect(14, 25, W - 28, 4, PAL.VOID_BLACK);
          const fillW = Math.floor((W - 30) * clamp(progressRatio, 0, 1));
          rect(15, 26, fillW, 2, PAL.ORBIT_TEAL);
          rect(15 + Math.max(0, fillW - 3), 25, 3, 4, PAL.STAR_YELLOW);
          if (alertText) {
            const blink = Math.floor(t * 8) % 2 === 0;
            rect(35, 38, W - 70, 15, blink ? PAL.MARS_RED : PAL.CHARCOAL);
            rect(35, 38, W - 70, 1, PAL.STAR_YELLOW);
            rect(35, 52, W - 70, 1, PAL.STAR_YELLOW);
            drawCenteredText(alertText, 42, 1, blink ? PAL.STAR_YELLOW : PAL.PURE_WHITE, null);
          }
        }

        function drawFrame(t) {
          const time = clamp(Number(t) || 0, 0, 12.0);
          ctx.fillStyle = PAL.VOID_BLACK;
          ctx.fillRect(0, 0, W, H);
          const camScroll = time > 3.5 ? smoothstep(0, 1, clamp((time - 3.5) / 4.5, 0, 1)) * 1250 : 0;

          drawDitheredSky([
            { y: -1300, color: PAL.VOID_BLACK }, { y: -620, color: PAL.VOID_BLACK },
            { y: -380, color: PAL.DEEP_NAVY }, { y: -150, color: PAL.TWILIGHT_BLUE },
            { y: 50, color: PAL.DUSK_PURPLE }, { y: 180, color: PAL.CRIMSON_DUSK },
            { y: 280, color: PAL.MARS_RED }, { y: 360, color: PAL.SUNSET_ORANGE },
            { y: 435, color: PAL.SOLAR_GOLD }, { y: 480, color: PAL.STAR_YELLOW }
          ], -camScroll);

          drawStarfield(time, clamp(0.18 + (camScroll / 650) * 0.82, 0.18, 1.0), camScroll * 0.35 + (time > 8 ? (time - 8) * 14 : 0));

          if (time > 8.6 && time < 9.5) {
            const sp = (time - 8.6) / 0.9;
            const sx = Math.floor(240 - sp * 190), sy = Math.floor(52 + sp * 70);
            for (let k = 0; k < 10; k++) rect(sx + k * 2, sy - k, 2, 1, k < 3 ? PAL.PURE_WHITE : PAL.STAR_YELLOW);
          }
          if (time >= 6.0) drawOrbitPlanet(178, lerp(-95, 168, smoothstep(6.0, 8.3, time)), 58, time, smoothstep(7.4, 8.4, time));
          if (time >= 5.2) drawSatellite(42 + Math.sin(time * 0.8) * 12, lerp(-30, 92, smoothstep(5.2, 8.5, time)) + Math.cos(time * 1.5) * 4, time);
          if (time >= 6.5) drawEarthLimbHorizon(lerp(H + 30, 435, smoothstep(6.5, 8.5, time)));

          const orbitShift = smoothstep(6.0, 8.2, time);
          const baseRocketX = lerp(135, 76, orbitShift);
          const baseRocketY = lerp(373, 285, smoothstep(3.4, 5.0, time)) + smoothstep(6.2, 8.2, time) * 14 + (time > 7.5 ? Math.sin((time - 7.5) * 2.4) * 4 : 0);
          const shakeAmp = (time > 3.2 && time < 7.2) ? (1.0 - smoothstep(4.5, 7.2, time)) * 1.8 : 0;
          const rocketX = Math.floor(baseRocketX + Math.sin(time * 115) * shakeAmp);
          const rocketY = Math.floor(baseRocketY + Math.cos(time * 98) * shakeAmp);

          if (time > 4.2 && time < 6.8) {
            for (let s = 0; s < 4; s++) {
              const lx = Math.floor(hash(s * 13 + 9) * (W - 24)) + 12;
              if (Math.abs(lx - rocketX) > 30) rect(lx, Math.floor((time * 440 + s * 67) % (H + 60)) - 30, 1, 16, PAL.MID_SLATE);
            }
          }

          const isSeparated = time >= 6.0;
          const thrust = lerp(1.05, 0.45, smoothstep(7.5, 8.4, time));
          const rcsRightActive = (time > 6.1 && time < 6.9) && (Math.floor(time * 12) % 2 === 0);
          const rcsLeftActive  = (time > 7.4 && time < 8.1) && (Math.floor(time * 12) % 2 === 0);
          drawTwoStageRocket(rocketX, rocketY, time, thrust, isSeparated, isSeparated ? time - 6.0 : 0, rcsLeftActive, rcsRightActive);

          const altKm = Math.floor(smoothstep(3.5, 8.2, time) * 420);
          let hudTitle = "ORBIT LOCKED", alertBanner = null;
          if (time < 6.9) { hudTitle = "STAGE 2 IGN"; alertBanner = "STAGE SEPARATION!"; }
          else if (time < 8.0) { hudTitle = "ORBIT APPR"; alertBanner = "ORBITAL INSERTION"; }
          drawTopHUD(hudTitle, altKm, clamp(time / 8.2, 0, 1), alertBanner, time);

          if (time >= 7.75) {
            const boxY = Math.floor(lerp(H + 10, 358, smoothstep(7.75, 8.2, time)));
            rect(14, boxY, W - 28, 86, PAL.CHARCOAL);
            rect(14, boxY, W - 28, 3, PAL.MISSION_GREEN);
            rect(14, boxY + 83, W - 28, 3, PAL.ORBIT_TEAL);
            rect(14, boxY, 3, 86, PAL.MISSION_GREEN);
            rect(W - 17, boxY, 3, 86, PAL.MISSION_GREEN);
            rect(20, boxY + 6, W - 40, 11, PAL.DEEP_NAVY);
            drawPixelText("SYS:TELEMETRY LINKED", 24, boxY + 8, 1, PAL.ORBIT_TEAL, null);
            const fullText = "MISSION START";
            const typedCount = clamp(Math.floor((time - 8.30) * 6.8), 0, fullText.length);
            const textX = Math.floor((W - measurePixelText(fullText, 2)) / 2);
            drawPixelText(fullText.slice(0, typedCount), textX, boxY + 26, 2, PAL.MISSION_GREEN, PAL.VOID_BLACK);
            for (let wx = 24; wx < W - 24; wx += 3) {
              const waveH = Math.floor(3 + Math.abs(Math.sin(time * 9 + wx * 0.15)) * 6);
              rect(wx, boxY + 74 - waveH, 2, waveH, PAL.ORBIT_TEAL);
            }
            if (typedCount >= fullText.length) {
              drawCenteredText("ORBIT VEL: 28000 KMH", boxY + 52, 1, Math.floor(time * 3.5) % 2 === 0 ? PAL.STAR_YELLOW : PAL.LIGHT_STEEL, PAL.VOID_BLACK);
            }
          }
        }

        return { render(t) { drawFrame(t); return bufferCanvas; } };
      })();

        const fb = new Uint8Array(W * H);
        const small = document.createElement("canvas");
        small.width = W; small.height = H;
        const sctx = small.getContext("2d");
        sctx.imageSmoothingEnabled = false;
        const img = sctx.createImageData(W, H);
        const u32 = new Uint32Array(img.data.buffer);

        return {
          render(t) {
            const f = Math.round(t * FPS);
            const tt = clamp(f / FPS, 0, DURATION);
            const c = cam(tt), pose = rocketPose(tt);
            drawSky(fb, c);
            drawStars(fb, tt, f, c);
            drawPlanet(fb, tt, f);
            if (tt >= T.liftoff) drawTrail(fb, tt, c);
            drawRocket(fb, pose, flameLength(tt, f), tt, f);
            drawHUD(fb, tt, f, pose);
            drawMission(fb, tt, f);
            for (let i = 0; i < fb.length; i++) u32[i] = RGBA32[fb[i]];
            sctx.putImageData(img, 0, 0);
            return small;
          }
        };
      })();



      // =======================================================================
      // 2. 3D POLYHEDRON ENGINE (BOX + OFFSET TAPERED PRISM)
      // =======================================================================
      const KEY_LIGHT  = normalize3([-0.38, 0.72, 0.58]);
      const FILL_LIGHT = normalize3([ 0.55, 0.25, 0.45]);

      function transformPoint(p, tf) {
        let x = p[0] * tf.sx, y = p[1] * tf.sy, z = p[2] * tf.sz;
        if (tf.rz) {
          const c = Math.cos(tf.rz), s = Math.sin(tf.rz);
          const nx = x * c - y * s, ny = x * s + y * c;
          x = nx; y = ny;
        }
        if (tf.rx) {
          const c = Math.cos(tf.rx), s = Math.sin(tf.rx);
          const ny = y * c - z * s, nz = y * s + z * c;
          y = ny; z = nz;
        }
        if (tf.ry) {
          const c = Math.cos(tf.ry), s = Math.sin(tf.ry);
          const nx = x * c + z * s, nz = -x * s + z * c;
          x = nx; z = nz;
        }
        return [x + tf.tx, y + tf.ty, z + tf.tz];
      }

      function applyChain(p, chain) {
        let cur = p;
        for (let i = 0; i < chain.length; i++) {
          if (chain[i]) cur = transformPoint(cur, chain[i]);
        }
        return cur;
      }

      function pushPolyFace(quadList, verts, rgb, opts = {}) {
        const v0 = verts[0], v1 = verts[1], v2 = verts[2];
        const n = normalize3(cross3(
          [v1[0] - v0[0], v1[1] - v0[1], v1[2] - v0[2]],
          [v2[0] - v0[0], v2[1] - v0[1], v2[2] - v0[2]]
        ));
        let cx = 0, cy = 0, cz = 0;
        for (let i = 0; i < verts.length; i++) {
          cx += verts[i][0]; cy += verts[i][1]; cz += verts[i][2];
        }
        const inv = 1 / verts.length;
        quadList.push({
          verts, normal: n, center: [cx * inv, cy * inv, cz * inv], rgb,
          ao: opts.ao !== undefined ? opts.ao : 1.0,
          rimRgb: opts.rimRgb || null,
          rimDir: opts.rimDir || [0, 0, 0],
          dimFactor: opts.dimFactor !== undefined ? opts.dimFactor : 1.0,
          layer: opts.layer !== undefined ? opts.layer : 2,
          unlit: opts.unlit === true,
          alpha: opts.alpha !== undefined ? opts.alpha : 1.0,
          strokeSame: opts.strokeSame !== false
        });
      }

      function pushBox(quadList, cx, cy, cz, w, h, d, rgb, tfChain, opts = {}) {
        const hw = w / 2, hh = h / 2, hd = d / 2;
        const raw = [
          [cx - hw, cy - hh, cz + hd], [cx + hw, cy - hh, cz + hd],
          [cx + hw, cy + hh, cz + hd], [cx - hw, cy + hh, cz + hd],
          [cx - hw, cy - hh, cz - hd], [cx + hw, cy - hh, cz - hd],
          [cx + hw, cy + hh, cz - hd], [cx - hw, cy + hh, cz - hd]
        ];
        const v = raw.map((p) => applyChain(p, tfChain));
        const defs = [
          { idx: [0, 1, 2, 3], ao: 1.00 }, { idx: [5, 4, 7, 6], ao: 0.80 },
          { idx: [1, 5, 6, 2], ao: 0.90 }, { idx: [4, 0, 3, 7], ao: 0.93 },
          { idx: [3, 2, 6, 7], ao: 1.06 }, { idx: [4, 5, 1, 0], ao: 0.68 }
        ];
        const mask = opts.faceMask || [1, 1, 1, 1, 1, 1];
        for (let f = 0; f < 6; f++) {
          if (!mask[f]) continue;
          const fd = defs[f];
          pushPolyFace(quadList, [v[fd.idx[0]], v[fd.idx[1]], v[fd.idx[2]], v[fd.idx[3]]], rgb, { ...opts, ao: fd.ao });
        }
      }

      function pushTaperedPrism(quadList, cx, cy, cz, rxBot, rzBot, rxTop, rzTop, h, sides, rgb, tfChain, opts = {}) {
        const y0 = cy - h / 2, y1 = cy + h / 2;
        const dxBot = opts.dxBot || 0, dzBot = opts.dzBot || 0;
        const dxTop = opts.dxTop || 0, dzTop = opts.dzTop || 0;
        const botRing = [], topRing = [];
        for (let i = 0; i < sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          const ca = Math.cos(a), sa = -Math.sin(a);
          botRing.push(applyChain([cx + dxBot + ca * rxBot, y0, cz + dzBot + sa * rzBot], tfChain));
          topRing.push(applyChain([cx + dxTop + ca * rxTop, y1, cz + dzTop + sa * rzTop], tfChain));
        }
        for (let i = 0; i < sides; i++) {
          const j = (i + 1) % sides;
          pushPolyFace(quadList, [botRing[i], botRing[j], topRing[j], topRing[i]], rgb, { ...opts, ao: 0.94 });
        }
        if (opts.capTop !== false && rxTop > 0.04) {
          pushPolyFace(quadList, topRing.slice(), rgb, { ...opts, ao: 1.07 });
        }
        if (opts.capBot !== false && rxBot > 0.04) {
          pushPolyFace(quadList, botRing.slice().reverse(), rgb, { ...opts, ao: 0.68 });
        }
      }

      function renderSceneQuads(quadList, originX, originY, camDist, fov, actorAlpha = 1.0) {
        if (actorAlpha <= 0.01 || quadList.length === 0) return;
        const camPos = [0, 1.0, camDist];
        const visible = [];

        for (let i = 0; i < quadList.length; i++) {
          const q = quadList[i];
          const dx = camPos[0] - q.center[0];
          const dy = camPos[1] - q.center[1];
          const dz = camPos[2] - q.center[2];
          if (dot3(q.normal, [dx, dy, dz]) <= 0.0005 || dz < 2.0) continue;

          let fill;
          if (q.unlit) {
            fill = shadeRgb(q.rgb, q.dimFactor, null, 0);
          } else {
            const ndl = Math.max(0, dot3(q.normal, KEY_LIGHT));
            const ndf = Math.max(0, dot3(q.normal, FILL_LIGHT));
            const shade = (0.50 + 0.42 * ndl + 0.14 * ndf) * q.ao * q.dimFactor;
            const rimHit = q.rimRgb ? Math.max(0, dot3(q.normal, q.rimDir)) * 0.24 * q.dimFactor : 0;
            fill = shadeRgb(q.rgb, shade, q.rimRgb, rimHit);
          }

          const proj = q.verts.map((v) => {
            const sc = fov / Math.max(1.5, camPos[2] - v[2]);
            return [originX + (v[0] - camPos[0]) * sc, originY - (v[1] - camPos[1]) * sc];
          });

          visible.push({
            layer: q.layer,
            distSq: dx * dx + dy * dy + dz * dz,
            proj, fill, alpha: q.alpha * actorAlpha, strokeSame: q.strokeSame
          });
        }

        visible.sort((a, b) => (a.layer !== b.layer ? a.layer - b.layer : b.distSq - a.distSq));

        for (let i = 0; i < visible.length; i++) {
          const item = visible[i], p = item.proj;
          ctx.save();
          if (item.alpha < 1) ctx.globalAlpha *= item.alpha;
          ctx.beginPath();
          ctx.moveTo(p[0][0], p[0][1]);
          for (let k = 1; k < p.length; k++) ctx.lineTo(p[k][0], p[k][1]);
          ctx.closePath();
          ctx.fillStyle = item.fill;
          ctx.fill();
          if (item.strokeSame) {
            ctx.strokeStyle = item.fill;
            ctx.lineWidth = 0.75;
            ctx.lineJoin = "round";
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function project3DPoint(wx, wy, wz, originX, originY, camDist, fov) {
        const sc = fov / Math.max(1.5, camDist - wz);
        return { x: originX + wx * sc, y: originY - (wy - 1.0) * sc, sc };
      }

      // =======================================================================
      // 3. SCULPTED 3D ARTIST PAINTBRUSH (SUDAH ACC!)
      // =======================================================================
      const WOOD_RICH    = hexToRgb("#a86234");
      const WOOD_TAIL    = hexToRgb("#6e3a1c");

      const SILVER_CRIMP = hexToRgb("#7f899c");

      function pushSculptedPaintbrush(quadList, brushChain, baseOpts) {
        const sides = 10;
        const pOpts = { ...baseOpts, layer: 2 };
        pushTaperedPrism(quadList, 0, -3.175, 0, 0.08, 0.08, 0.25, 0.25, 2.15, sides, WOOD_TAIL, brushChain, { ...pOpts, capTop: false });
        pushTaperedPrism(quadList, 0, -0.875, 0, 0.25, 0.25, 0.42, 0.42, 2.45, sides, WOOD_RICH, brushChain, { ...pOpts, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  0.95,  0, 0.42, 0.42, 0.36, 0.36, 1.20, sides, WOOD_RICH, brushChain, { ...pOpts, capBot: false, capTop: false });

        pushTaperedPrism(quadList, 0,  1.72,  0, 0.37, 0.37, 0.38, 0.38, 0.34, sides, SILVER_METAL, brushChain, { ...pOpts, capTop: false });
        pushTaperedPrism(quadList, 0,  1.95,  0, 0.41, 0.41, 0.41, 0.41, 0.12, sides, SILVER_CRIMP, brushChain, { ...pOpts, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  2.14,  0, 0.38, 0.38, 0.39, 0.39, 0.26, sides, SILVER_METAL, brushChain, { ...pOpts, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  2.33,  0, 0.42, 0.42, 0.42, 0.42, 0.12, sides, SILVER_CRIMP, brushChain, { ...pOpts, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  2.62,  0, 0.39, 0.39, 0.42, 0.38, 0.46, sides, SILVER_METAL, brushChain, { ...pOpts, capBot: false });

        pushTaperedPrism(quadList, 0,  3.15,  0, 0.40, 0.36, 0.80, 0.66, 0.60, sides, SABLE_HAIR, brushChain, { ...pOpts, dxBot: 0, dxTop: 0.04, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  3.75,  0, 0.80, 0.66, 0.68, 0.56, 0.60, sides, SABLE_MID,  brushChain, { ...pOpts, dxBot: 0.04, dxTop: 0.12, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  4.385, 0, 0.68, 0.56, 0.28, 0.24, 0.67, sides, GOLD_PAINT, brushChain, { ...pOpts, dxBot: 0.12, dxTop: 0.26, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  5.01,  0, 0.28, 0.24, 0.03, 0.03, 0.58, sides, GOLD_WET,   brushChain, { ...pOpts, dxBot: 0.26, dxTop: 0.44, capBot: false, capTop: false, unlit: true });
      }

      // =======================================================================
      // 4. MASKOT 3D "ARTO" — FACEPLANT -> PUSH-UP DUDUK -> KESAKITAN -> SUPER TENGIL + LIP-SYNC!

      const SKIN_WHITE   = hexToRgb("#f5f2ea");

      const SKIN_BLUSH   = hexToRgb("#ff9a94");

      const TONGUE_PINK  = hexToRgb("#ef6c82");
      const TEETH_WHITE  = hexToRgb("#ffffff");
      const SHINE_WHITE  = hexToRgb("#ffffff");
      const GOLD_BRIGHT  = hexToRgb("#ebb343");
      const GOLD_LIGHT   = hexToRgb("#ffe28a");
      const RIM_WARM     = hexToRgb("#ffe8b0");
      const RIM_DIR      = normalize3([0.65, 0.45, -0.35]);

      const ORBIT_RELICS = [
        { type: "star",    ang: 0.3,  rad: 7.4, yOff:  4.8, col: hexToRgb("#ebb343") },
        { type: "frame",   ang: 1.55, rad: 7.2, yOff:  2.0, col: hexToRgb("#ffe07d") },

        { type: "check",   ang: 4.10, rad: 7.1, yOff:  3.5, col: hexToRgb("#5ce6a0") },

      ];


      function buildArtoQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale, squashX = 1, squashY = 1,
          expr,
          sitAmt = 0, pushUpBlend = 0, beretLiftY = 0, beretTiltExtra = 0,
          mouthOpen = 0, blinkAmount = 0, monocleOn = true, orbitScale = 0,
          shirtTheme, camDist = 36
        } = pose;

        const SHIRT_MAIN = hexToRgb(shirtTheme.main);
        const SHIRT_DARK = hexToRgb(shirtTheme.dark);
        const SHIRT_ACC  = hexToRgb(shirtTheme.accent);

        const isPanic     = expr === "panic";
        const isFaceplant = expr === "faceplant";
        const isPushUp    = expr === "pushup";
        const isPain      = expr === "pain";
        const isAlert     = expr === "alert";
        const isTengil    = expr === "tengil";
        const isAmazed    = expr === "amazed";
        const isThink     = expr === "hmm_think";
        const isDilemma   = expr === "dilemma";
        const isHappyHost = expr === "happy_host";

        const jitter = isPain ? Math.sin(time * 26.0) * 0.06
                     : isPushUp ? Math.sin(time * 32.0) * 0.09
                     : 0;
        const breathe = Math.sin(time * 2.6) * 0.014;
        const energyBounce = isAmazed    ? Math.abs(Math.sin(time * 8.2)) * (0.26 + mouthOpen * 0.24)
                           : isHappyHost ? Math.abs(Math.sin(time * 6.8)) * (0.18 + mouthOpen * 0.22)
                           : isTengil    ? Math.abs(Math.sin(time * 6.4)) * (0.14 + mouthOpen * 0.22)
                           : isDilemma   ? Math.abs(Math.sin(time * 4.5)) * 0.10
                           : 0;

        const worldTf = {
          tx: x + jitter,
          ty: y + energyBounce + (isFaceplant ? 0 : Math.sin(time * 2.6) * 0.06),
          tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * squashX * (1 + energyBounce * 0.032 - breathe * 0.35),
          sy: scale * squashY * (1 - energyBounce * 0.024 + breathe),
          sz: scale * (1 + energyBounce * 0.02)
        };
        const baseOpts = { rimRgb: RIM_WARM, rimDir: RIM_DIR, layer: 2 };

        // 1. KAKI & SEPATU
        const legXs = [-1.52, 1.52];
        for (let i = 0; i < 2; i++) {
          let legRx = 0, legRz = 0;
          if (isPanic) {
            legRx = Math.sin(time * 26.0 + i * Math.PI) * 0.85;
            legRz = i === 0 ? -0.18 : 0.18;
          } else if (isFaceplant) {
            const kickWave = Math.sin(time * 13.0 + i * Math.PI) * 0.34;
            legRx = 0.26 + Math.max(0, kickWave);
            legRz = i === 0 ? -0.16 : 0.16;
          } else if (isPushUp) {
            legRx = lerp(0.18, -1.32, sitAmt);
            legRz = i === 0 ? -0.16 : 0.16;

            legRx = sitAmt * -1.32;
            legRz = sitAmt * (i === 0 ? -0.18 : 0.18);
          } else if (isTengil || isHappyHost) {
            legRz = i === 0 ? -0.09 : 0.09;
            legRx = Math.sin(time * 6.4 + i * Math.PI) * 0.08;
          } else if (isAmazed) {
            legRx = Math.sin(time * 8.2 + i * Math.PI) * 0.14;
            legRz = i === 0 ? -0.10 : 0.10;
          }

          const legPivot = { tx: legXs[i], ty: -3.15, tz: 0, rx: legRx, ry: 0, rz: legRz, sx: 1, sy: 1, sz: 1 };
          pushBox(quads, 0, -1.40, 0, 1.95, 2.75, 2.20, LEG_CHARCOAL, [legPivot, worldTf], baseOpts);
          pushBox(quads, 0, -2.63, 0.26, 2.05, 0.62, 2.75, SHOE_SLATE, [legPivot, worldTf], baseOpts);
        }

        // 2. BADAN / BAJU PELUKIS
        pushBox(quads, 0, -1.05, 0, 6.40, 4.55, 3.90, SHIRT_MAIN, [worldTf], baseOpts);
        pushBox(quads, 0,  1.05, 0.08, 6.62, 0.58, 4.12, SHIRT_DARK, [worldTf], baseOpts);
        pushBox(quads, -1.85, -0.05, 2.02, 0.82, 0.42, 0.16, SHIRT_ACC, [worldTf], baseOpts);
        pushBox(quads, 0, -3.15, 0, 6.52, 0.38, 4.02, SHIRT_DARK, [worldTf], baseOpts);

        // 3. TANGAN KIRI (10 Gestur Unik Sesuai Ekspresi!)

          lArmRx = -0.35; lArmRz = -1.22 + Math.sin(time * 9.0) * 0.05;

          lArmRx = -2.28; lArmRz = 0.50 + Math.sin(time * 9.5) * 0.14;

        } else if (isTengil) {

          lArmRx = lerp(-1.42, -1.35 + Math.sin(time * 6.4) * 0.12, pridePhase);

          lArmRz = -0.62 - Math.sin(time * 11.5) * 0.26;

        const leftShoulderTf = { tx: -4.02, ty: 0.45, tz: 0.10, rx: lArmRx, ry: 0, rz: lArmRz, sx: 1, sy: 1, sz: 1 };
        pushBox(quads, 0, -1.10, 0, 1.62, 2.45, 1.85, SHIRT_MAIN, [leftShoulderTf, worldTf], baseOpts);

        pushBox(quads, 0, -2.85, 0, 1.38, 1.05, 1.52, SKIN_WHITE, [leftShoulderTf, worldTf], baseOpts);

        // 4. TANGAN KANAN + KUAS PELUKIS 3D

        } else if (isTengil) {
          rArmRx = -1.24 + Math.sin(time * 5.2) * 0.14; rArmRz = 0.38 + Math.sin(time * 3.4) * 0.18;
          brushTiltX = 1.24; brushTiltZ = -0.28 + Math.sin(time * 6.5) * 0.24; brushSpinY = Math.sin(time * 4.0) * 0.6;
        } else if (isAmazed) {

          rArmRx = -1.52 + Math.sin(time * 8.2) * 0.16; rArmRz = 0.48;
          brushTiltX = 1.38; brushTiltZ = -0.20;
        } else if (isThink) {
          // Kuas mengetuk-ngetuk pelan di samping sambil berpikir kritis!
          rArmRx = -0.78 + Math.sin(time * 7.5) * 0.12; rArmRz = 0.20;
          brushTiltX = 0.96; brushTiltZ = -0.18;
        } else if (isDilemma) {
          // Berlawanan fasa dengan tangan kiri -> gestur timbangan kiri vs kanan!
          rArmRx = -1.12 - Math.sin(time * 3.8) * 0.34; rArmRz = 0.44;
          brushTiltX = 1.16; brushTiltZ = -0.22;
        } else if (isHappyHost) {
          // Mengayun kuas penuh semangat mengajak penonton komen!
          rArmRx = -1.26 + Math.sin(time * 6.0) * 0.16; rArmRz = 0.42 + Math.sin(time * 4.0) * 0.14;
          brushTiltX = 1.22; brushTiltZ = -0.26;
        }

        const rightShoulderTf = { tx: 4.02, ty: 0.45, tz: 0.10, rx: rArmRx, ry: 0, rz: rArmRz, sx: 1, sy: 1, sz: 1 };
        pushBox(quads, 0, -1.10, 0, 1.62, 2.45, 1.85, SHIRT_MAIN, [rightShoulderTf, worldTf], baseOpts);
        pushBox(quads, 0, -2.28, 0, 1.68, 0.32, 1.92, SHIRT_DARK, [rightShoulderTf, worldTf], baseOpts);
        pushBox(quads, 0, -2.85, 0, 1.38, 1.05, 1.52, SKIN_WHITE, [rightShoulderTf, worldTf], baseOpts);

        const brushTf = { tx: 0.18, ty: -2.95, tz: 0.42, rx: brushTiltX, ry: brushSpinY, rz: brushTiltZ, sx: 1, sy: 1, sz: 1 };
        pushSculptedPaintbrush(quads, [brushTf, rightShoulderTf, worldTf], baseOpts);

        // 5. KEPALA KOTAK PUTIH + TOPI BERET MERAH + 10 EKSPRESI WAJAH & LIP-SYNC!
        let headYaw = 0, headPitch = 0, headRoll = 0;
        if (isPanic)          { headPitch = -0.22; headYaw = Math.sin(time * 18.0) * 0.18; }
        else if (isFaceplant) { headPitch = 0.08; }
        else if (isPushUp)    { headPitch = lerp(0.10, -0.18, pushUpBlend); }
        else if (isPain)      { headPitch = 0.16; headRoll = -0.14 + Math.sin(time * 4.5) * 0.04; headYaw = Math.sin(time * 3.8) * 0.07; }
        else if (isTengil)    { headPitch = -0.11 + Math.sin(time * 6.4) * 0.05; headRoll = 0.15 + Math.sin(time * 3.2) * 0.07; headYaw = -0.14 + Math.sin(time * 2.4) * 0.10; }
        else if (isAmazed)    { headPitch = -0.10 + Math.sin(time * 6.0) * 0.04; headRoll = -0.08; headYaw = -0.12 + Math.sin(time * 2.5) * 0.08; }
        else if (isThink)     { headPitch =  0.10; headRoll = 0.14 + Math.sin(time * 1.8) * 0.04; headYaw = -0.10 + Math.sin(time * 1.5) * 0.06; }
        else if (isDilemma)   { headPitch =  0.04; headRoll = Math.sin(time * 3.8) * 0.14; headYaw = Math.sin(time * 3.8) * 0.28; }
        else if (isHappyHost) { headPitch = -0.05 + Math.sin(time * 5.0) * 0.04; headRoll = Math.sin(time * 3.0) * 0.09; headYaw = Math.sin(time * 2.2) * 0.12; }

        const headTf = { tx: 0, ty: 1.30, tz: 0, rx: headPitch, ry: headYaw, rz: headRoll, sx: 1, sy: 1, sz: 1 };
        const headChain = [headTf, worldTf];

        pushBox(quads, 0, 3.00, 0, 7.35, 5.95, 5.95, SKIN_WHITE, headChain, baseOpts);

        const beretTf = { tx: 0.45, ty: 6.18 + beretLiftY, tz: -0.10, rx: 0.10 + beretTiltExtra * 0.5, ry: 0, rz: -0.16 + beretTiltExtra, sx: 1, sy: 1, sz: 1 };
        const beretChain = [beretTf, headTf, worldTf];
        pushTaperedPrism(quads, 0, -0.15, 0, 3.65, 3.35, 4.95, 4.45, 0.65, 12, BERET_DARK, beretChain, baseOpts);
        pushTaperedPrism(quads, 0,  0.58, 0, 4.95, 4.45, 4.45, 3.95, 0.88, 12, BERET_RED,  beretChain, baseOpts);
        pushTaperedPrism(quads, 0,  1.12, 0, 4.45, 3.95, 2.35, 2.05, 0.28, 12, BERET_RED,  beretChain, baseOpts);
        pushBox(quads, 0, 1.54, 0, 0.56, 0.72, 0.56, BERET_DARK, beretChain, baseOpts);

        const frontCenter = applyChain([0, 3.0, 3.0], headChain);
        const frontOuter  = applyChain([0, 3.0, 4.0], headChain);
        const headFrontDir = normalize3([frontOuter[0] - frontCenter[0], frontOuter[1] - frontCenter[1], frontOuter[2] - frontCenter[2]]);
        const camVec = normalize3([-frontCenter[0], 1.0 - frontCenter[1], camDist - frontCenter[2]]);
        const faceFacingCam = dot3(headFrontDir, camVec) > 0.08;

        if (faceFacingCam) {
          const eyeZ = 3.06, eyeY = 3.08;
          const shiftX = isTengil  ? 0.24 + Math.sin(time * 2.4) * 0.10
                       : isDilemma ? Math.sin(time * 3.8) * 0.36
                       : isThink   ? -0.26
                       : isAmazed  ? -0.18
                       : 0;
          const shiftY = isThink ? 0.24 : 0;

          for (const side of [-1, 1]) {
            const ex = side * 1.62;

            if (isPain || isPushUp || isFaceplant) {
              const topBar = { tx: ex, ty: eyeY + 0.22, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: side === -1 ? -0.44 :  0.44, sx: 1, sy: 1, sz: 1 };
              const botBar = { tx: ex, ty: eyeY - 0.22, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: side === -1 ?  0.44 : -0.44, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 1.04, 0.30, 0.22, EYE_DARK, [topBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, 0, 0, 0, 1.04, 0.30, 0.22, EYE_DARK, [botBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
            } else if (isPanic) {
              pushBox(quads, ex, eyeY, eyeZ, 1.56, 1.96, 0.24, SHINE_WHITE, headChain, { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, ex + Math.sin(time * 42 + side) * 0.12, eyeY + Math.cos(time * 38) * 0.10, eyeZ + 0.14, 0.46, 0.52, 0.06, EYE_DARK, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
            } else if (isHappyHost) {
              // Mata senyum ceria hangat (^ ^) mengajak penonton komen!
              const lBar = { tx: ex - 0.30, ty: eyeY + 0.10, tz: eyeZ + 0.05, rx: 0, ry: 0, rz:  0.44, sx: 1, sy: 1, sz: 1 };
              const rBar = { tx: ex + 0.30, ty: eyeY + 0.10, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: -0.44, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.80, 0.34, 0.22, EYE_DARK, [lBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, 0, 0, 0, 0.80, 0.34, 0.22, EYE_DARK, [rBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
            } else if (isAmazed) {
              // Mata berbinar lebar kagum + DOBEL KILAU BINTANG PUTIH!
              const eyeH = lerp(2.04, 0.18, blinkAmount);
              pushBox(quads, ex + shiftX * 0.5, eyeY, eyeZ, 1.28, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
              if (blinkAmount < 0.40) {
                const sp = 0.44 + Math.sin(time * 12) * 0.05;
                pushBox(quads, ex - 0.24 + shiftX * 0.6, eyeY + 0.42, eyeZ + 0.14, sp, sp, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
                pushBox(quads, ex + 0.26 + shiftX * 0.6, eyeY - 0.36, eyeZ + 0.14, 0.26, 0.26, 0.04, GOLD_LIGHT,  headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
              }
            } else if (isTengil && side === -1 && ((time >= 9.15 && time <= 9.80) || (time >= 50.15 && time <= 50.85))) {
              // Wink genit tengil!
              const lBar = { tx: ex - 0.28, ty: eyeY + 0.08, tz: eyeZ + 0.05, rx: 0, ry: 0, rz:  0.40, sx: 1, sy: 1, sz: 1 };
              const rBar = { tx: ex + 0.28, ty: eyeY + 0.08, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: -0.40, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.76, 0.30, 0.22, EYE_DARK, [lBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, 0, 0, 0, 0.76, 0.30, 0.22, EYE_DARK, [rBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
            } else if (isTengil || isThink) {
              // Half-lidded smug (tengil) atau 1-mata menyipit tajam (hmm_think)!
              const eyeH = lerp(isThink && side === -1 ? 1.24 : 1.62, 0.18, blinkAmount);
              pushBox(quads, ex + shiftX * 0.55, eyeY - 0.10 + shiftY * 0.4, eyeZ, 1.16, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
              if (blinkAmount < 0.40) {
                pushBox(quads, ex - 0.20 + shiftX * 0.65, eyeY - 0.04 + shiftY * 0.45, eyeZ + 0.14, 0.30, 0.30, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
                if (isTengil || side === -1) {
                  const lidTilt = isTengil ? (side === -1 ? -0.14 : 0.06) : -0.22;
                  const lidDrop = isTengil ? 0.52 : 0.46;
                  const lidTf = { tx: ex + shiftX * 0.35, ty: eyeY + lidDrop, tz: eyeZ + 0.16, rx: 0, ry: 0, rz: lidTilt, sx: 1, sy: 1, sz: 1 };
                  pushBox(quads, 0, 0, 0, 1.48, 0.72, 0.08, SKIN_LID, [lidTf, headTf, worldTf], { ...baseOpts, layer: 3.55 });
                }
              }
            } else {
              // Alert / Dilemma: mata fokus melirik kiri-kanan!
              const eyeH = lerp(isAlert ? 1.94 : 1.76, 0.18, blinkAmount);
              pushBox(quads, ex + shiftX * 0.60, eyeY, eyeZ, 1.14, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
              if (blinkAmount < 0.40) {
                pushBox(quads, ex - 0.20 + shiftX * 0.70, eyeY + 0.36, eyeZ + 0.14, 0.34, 0.34, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
              }
            }

            // ALIS EKSPRESIF (10 variasi)
            let bLift = 0.18, bTilt = 0;
            if (isPanic)               { bLift =  0.66; bTilt = side === -1 ?  0.24 : -0.24; }
            else if (isPain||isPushUp) { bLift = -0.12; bTilt = side === -1 ?  0.38 : -0.38; }
            else if (isAlert)          { bLift =  0.56; bTilt = side === -1 ?  0.16 : -0.16; }
            else if (isAmazed)         { bLift =  0.58; bTilt = side === -1 ?  0.18 : -0.18; }
            else if (isHappyHost)      { bLift =  0.42; bTilt = side === -1 ?  0.14 : -0.14; }
            else if (isThink)          { bLift = side === -1 ? -0.22 : 0.48; bTilt = side === -1 ? -0.30 : 0.16; }
            else if (isDilemma)        { bLift = side === -1 ? 0.30 + Math.sin(time * 3.8) * 0.22 : 0.30 - Math.sin(time * 3.8) * 0.22; bTilt = side === -1 ? 0.20 : -0.20; }
            else if (isTengil)         { bLift = side === -1 ? 0.02 : 0.62 + Math.sin(time * 4.5) * 0.10; bTilt = side === -1 ? -0.22 : -0.18; }

            const browTf = { tx: ex, ty: eyeY + 1.24 + bLift, tz: eyeZ + 0.12, rx: 0, ry: 0, rz: bTilt, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, 1.46, 0.28, 0.24, BROW_DARK, [browTf, headTf, worldTf], { ...baseOpts, layer: 3.65 });
          }

          // MULUT 3D ANIMATED LIP-SYNC (Buka-Tutup Natural + Gigi Putih + Lidah Pink!)
          const mY = 1.46;
          if (isPanic) {
            const screamH = 1.10 + Math.sin(time * 24.0) * 0.20;
            pushBox(quads, 0, mY, eyeZ + 0.04, 1.08, screamH, 0.16, MOUTH_CAVITY, headChain, { ...baseOpts, layer: 3.2, unlit: true });
            pushBox(quads, 0, mY - screamH * 0.26, eyeZ + 0.13, 0.68, 0.34, 0.04, TONGUE_PINK, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.3, unlit: true });
          } else if (isPain || isPushUp) {
            const mH = lerp(0.24, 0.88, mouthOpen), mW = lerp(1.26, 1.06, mouthOpen * 0.6);
            const mTf = { tx: 0, ty: mY, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: -0.06 + Math.sin(time * 16.0) * 0.05, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.22) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.62, mH * 0.38, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.3, unlit: true });
          } else if (isAlert) {
            pushBox(quads, 0, mY, eyeZ + 0.04, 0.62, 0.68, 0.14, MOUTH_CAVITY, headChain, { ...baseOpts, layer: 3.2, unlit: true });
          } else if (isAmazed || isHappyHost) {
            // Mulut ceria / kagum lebar (gigi putih + lidah pink saat bicara!)
            const mH = lerp(0.32, 1.06, mouthOpen), mW = lerp(1.52, 1.44, mouthOpen * 0.2);
            const mTf = { tx: 0, ty: mY + 0.02, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: 0, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.15) pushBox(quads, 0, mH * 0.30, 0.08, mW * 0.86, Math.min(0.24, mH * 0.30), 0.04, TEETH_WHITE, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.35, unlit: true });
            if (mouthOpen > 0.28) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.62, mH * 0.38, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
          } else if (isThink || isDilemma) {
            // Mulut miring berpikir ("hmm...") yang tetap buka-tutup berbicara!
            const mH = lerp(0.22, 0.78, mouthOpen), mW = lerp(1.12, 1.02, mouthOpen * 0.3);
            const mTf = { tx: isThink ? -0.22 : 0.0, ty: mY, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: isThink ? -0.10 : Math.sin(time * 3.8) * 0.08, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.28) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.56, mH * 0.34, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
          } else {
            // Smirk Tengil + Lip-Sync Gigi & Lidah!
            const mH = lerp(0.26, 0.96, mouthOpen), mW = lerp(1.56, 1.38, mouthOpen * 0.35);
            const mTf = { tx: 0.18, ty: mY + 0.04, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: 0.16, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            const cornerTf = { tx: 0.18 + mW * 0.52, ty: mY + 0.22, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: 0.42, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, 0.44, 0.22, 0.10, MOUTH_CAVITY, [cornerTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.15) pushBox(quads, 0, mH * 0.30, 0.08, mW * 0.84, Math.min(0.24, mH * 0.32), 0.04, TEETH_WHITE, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.35, unlit: true });
            if (mouthOpen > 0.32) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.58, mH * 0.36, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
          }

          // Pipi Merona saat Tengil, Terkesima, atau Happy Host
          if (isTengil || isAmazed || isHappyHost) {
            pushBox(quads, -2.55, 1.78, eyeZ - 0.02, 0.82, 0.36, 0.08, SKIN_BLUSH, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.1, unlit: true });
            pushBox(quads,  2.55, 1.78, eyeZ - 0.02, 0.82, 0.36, 0.08, SKIN_BLUSH, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.1, unlit: true });
          }

          // MONOCLE EMAS KURATOR
          if (monocleOn) {
            const monTilt = (isPain || isPushUp) ? 0.26 : (isPanic ? -0.22 : (isTengil ? -0.05 : 0));
            const monTf = { tx: 1.62, ty: eyeY, tz: eyeZ + 0.24, rx: 0, ry: 0, rz: monTilt, sx: 1, sy: 1, sz: 1 };
            const mChain = [monTf, headTf, worldTf];
            const mw = 1.78, mh = 2.26, th = 0.16;
            const mOpts = { ...baseOpts, layer: 3.8 };
            pushBox(quads, 0,  mh / 2, 0, mw + th, th, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads, 0, -mh / 2, 0, mw + th, th, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads, -mw / 2, 0, 0, th, mh, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads,  mw / 2, 0, 0, th, mh, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads, 0, 0, -0.04, mw - 0.12, mh - 0.12, 0.04, hexToRgb("#a8d4ff"), mChain, { faceMask: [1,0,0,0,0,0], layer: 3.7, unlit: true, alpha: 0.16, strokeSame: false });
            pushBox(quads, mw / 2 + 0.16, -1.35, -0.05, 0.11, 2.25, 0.11, GOLD_BRIGHT, mChain, mOpts);
          }
        }

        // 6. 5 IKON SENI & PENILAIAN 3D MENGORBIT (Radius sedikit lebih lega agar tidak pernah nutup muka!)
        if (orbitScale > 0.02) {
          const orbitSpeed = isAmazed ? 1.05 : (isHappyHost ? 0.85 : 0.65);
          for (let i = 0; i < ORBIT_RELICS.length; i++) {
            const r = ORBIT_RELICS[i];
            const a = r.ang + time * orbitSpeed;
            const rad = (r.rad + 0.6) * orbitScale;
            const ox = x + Math.cos(a) * rad * scale;
            const oz = z + Math.sin(a) * (rad * 0.50) * scale;
            const oy = y + (r.yOff + Math.sin(time * 2.8 + i * 1.4) * 0.42) * scale;
            const relicLayer = oz < z ? 0 : 5;

            const rTf = {
              tx: ox, ty: oy, tz: oz,
              rx: Math.sin(time * 1.3 + i) * 0.35,
              ry: time * 1.45 + i,
              rz: Math.cos(time * 1.1 + i) * 0.20,
              sx: scale * orbitScale * 0.92, sy: scale * orbitScale * 0.92, sz: scale * orbitScale * 0.92
            };
            const rOpts = { rimRgb: RIM_WARM, rimDir: RIM_DIR, layer: relicLayer };

            if (r.type === "star") {
              pushBox(quads, 0, 0, 0, 1.55, 0.44, 0.44, r.col, [rTf], rOpts);
              pushBox(quads, 0, 0, 0, 0.44, 1.55, 0.44, r.col, [rTf], rOpts);
              pushBox(quads, 0, 0, 0, 0.72, 0.72, 0.72, GOLD_LIGHT, [rTf], rOpts);
            } else if (r.type === "frame") {
              const s = 1.25, t = 0.24;
              pushBox(quads, 0,  s / 2, 0, s + t, t, 0.32, r.col, [rTf], rOpts);
              pushBox(quads, 0, -s / 2, 0, s + t, t, 0.32, r.col, [rTf], rOpts);
              pushBox(quads, -s / 2, 0, 0, t, s, 0.32, r.col, [rTf], rOpts);
              pushBox(quads,  s / 2, 0, 0, t, s, 0.32, r.col, [rTf], rOpts);
            } else if (r.type === "palette") {
              pushBox(quads, 0, 0, 0, 1.48, 1.15, 0.32, r.col, [rTf], rOpts);
              pushBox(quads, -0.38,  0.18, 0.20, 0.34, 0.34, 0.14, hexToRgb("#6ea8fe"), [rTf], rOpts);
              pushBox(quads,  0.38,  0.18, 0.20, 0.34, 0.34, 0.14, hexToRgb("#e07a5f"), [rTf], rOpts);
              pushBox(quads,  0.00, -0.24, 0.20, 0.34, 0.34, 0.14, GOLD_BRIGHT,         [rTf], rOpts);
            } else if (r.type === "check") {
              pushBox(quads, 0, 0, 0, 1.24, 1.24, 0.34, hexToRgb("#18221e"), [rTf], rOpts);
              const c1 = { tx: -0.20, ty: -0.06, tz: 0.22, rx: 0, ry: 0, rz: -0.75, sx: 1, sy: 1, sz: 1 };
              const c2 = { tx:  0.16, ty:  0.04, tz: 0.22, rx: 0, ry: 0, rz:  0.75, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.52, 0.22, 0.16, r.col, [c1, rTf], rOpts);
              pushBox(quads, 0, 0, 0, 0.86, 0.22, 0.16, r.col, [c2, rTf], rOpts);
            } else {
              const dTf = { tx: 0, ty: 0, tz: 0, rx: 0.78, ry: 0, rz: 0.78, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.84, 0.84, 0.84, r.col, [dTf, rTf], rOpts);
            }
          }
        }

        return quads;

      function drawCrashImpactFX(cx, cy, time) {
        if (time < 2.08 || time > 3.15) return;
        const p = clamp((time - 2.08) / 1.07, 0, 1);
        ctx.save();
        if (p < 0.55) {
          const rp = p / 0.55;
          ctx.globalAlpha = Math.pow(1 - rp, 1.35) * 0.90;
          ctx.strokeStyle = "#ebb343"; ctx.lineWidth = lerp(4.8, 1.0, rp);
          ctx.beginPath();
          ctx.ellipse(cx, cy, lerp(55, 320, easeOutCubic(rp)), lerp(15, 76, easeOutCubic(rp)), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        // 12 kepulan debu piksel meledak lebar saat tengkurap SPLAT!
        for (let i = 0; i < 12; i++) {
          const dir = i % 2 === 0 ? -1 : 1;
          const idx = Math.floor(i / 2);
          const lp = clamp((p - idx * 0.045) / 0.65, 0, 1);
          if (lp <= 0 || lp >= 1) continue;
          const dist = 60 + idx * 24 + easeOutCubic(lp) * 165;
          const px = cx + dir * dist;
          const py = cy - Math.sin(lp * Math.PI) * (36 + idx * 14) - lp * 18;
          const sz = lerp(20, 4, lp);
          ctx.globalAlpha = (1 - lp) * 0.78;
          ctx.fillStyle = idx % 2 === 0 ? "#a8a69e" : "#ebb343";
          roundRect(ctx, px - sz / 2, py - sz / 2, sz, sz, 4);

        ctx.save();
        ctx.globalAlpha *= clamp(textAlpha, 0, 1);
        const fullText = line2 ? (line1 + "\n" + line2) : line1;
        const shown = fullText.slice(0, Math.floor(clamp(typeProg, 0, 1) * fullText.length)).split("\n");
        const s1 = shown[0] || "", s2 = shown[1] || "";

        let fSize = 31.5;
        ctx.font = `800 ${fSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif`;
        const maxLineW = Math.max(ctx.measureText(line1 || "").width, ctx.measureText(line2 || "").width);
        if (maxLineW > cardW - 88) {
          fSize = Math.max(24, Math.floor(fSize * ((cardW - 88) / maxLineW) * 10) / 10);
          ctx.font = `800 ${fSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif`;
        }
        ctx.textAlign = "left"; ctx.textBaseline = "middle";

        const KEYWORDS = [
          { w: "TIM GEMINI",    col: "#6ea8fe" },
          { w: "TIM CLAUDE",    col: "#e07a5f" },
          { w: "Agent tampan",  col: "#ebb343" },
          { w: "Gravity Turn",  col: "#e07a5f" },
          { w: "Saturn-IV",     col: "#6ea8fe" },
          { w: "9.2 vs 9.3",    col: "#ebb343" },
          { w: "mengoreksi",    col: "#5ce6a0" },
          { w: "si Boss!",      col: "#ebb343" },
          { w: "Bumi 3D",       col: "#ebb343" },
          { w: "Gemini",        col: "#6ea8fe" },
          { w: "Claude",        col: "#e07a5f" },
          { w: "Aduh,",         col: "#ff6b6b" },
          { w: "Arto",          col: "#ebb343" }
        ];

        const renderMultiHL = (str, yPos) => {
          let pos = 0, curX = cardX + 32;
          while (pos < str.length) {
            let best = null;
            for (const kw of KEYWORDS) {
              const idx = str.indexOf(kw.w, pos);
              if (idx >= 0 && (!best || idx < best.idx || (idx === best.idx && kw.w.length > best.len))) {
                best = { idx, len: kw.w.length, col: kw.col };
              }
            }
            if (!best) {
              const tail = str.slice(pos);
              ctx.fillStyle = "#f5f4f0"; ctx.fillText(tail, curX, yPos);
              curX += ctx.measureText(tail).width; break;
            }
            if (best.idx > pos) {
              const plain = str.slice(pos, best.idx);
              ctx.fillStyle = "#f5f4f0"; ctx.fillText(plain, curX, yPos);
              curX += ctx.measureText(plain).width;
            }
            const token = str.slice(best.idx, best.idx + best.len);
            ctx.fillStyle = best.col; ctx.fillText(token, curX, yPos);
            curX += ctx.measureText(token).width;
            pos = best.idx + best.len;
          }
          return curX;
        };

        const y1 = line2 ? cardY + 104 : cardY + 134;
        const endX1 = renderMultiHL(s1, y1);

          roundRect(ctx, curX, curY - 16, 4, 32, 2); ctx.fill();
        }

      function drawSoloIGCommentSheet(lt, time, alpha) {
        const enterRaw = clamp((lt - 3.10) / 0.65, 0, 1);

        // - lt 6.95..7.30s : Tap Bar Pilihan 2 ("kalau aku sih claude") -> INSTANT masuk ke bar komen di lt = 7.12s!
        // - lt 7.95..8.30s : Tap Send [↑] -> Komentar 2 ("username" · "kalau aku sih claude") masuk feed di lt = 8.25s!

          inputText = "kalau aku sih claude";
          inputAccent = "#e07a5f";

        }

        const hasText = inputText.length > 0;

        ctx.save();
        ctx.globalAlpha *= alpha * smootherstep(0, 0.48, enterRaw);

        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = 1.6; ctx.strokeStyle = "#2b2b38"; ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";

        const drawSentRow = (rowIdx, prog, commentText, badgeCol, tagText) => {

          if (tapP > 0.04 && tapP < 0.98) {
            ctx.save();
            ctx.globalAlpha = (1 - tapP) * 0.85;

          ctx.restore();

        const smY = cy + 454;

        ctx.fillText("SKOR ARTO", cx + 28, smY + 20);
        ctx.font = "900 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"; ctx.fillStyle = accent; ctx.textAlign = "right";
        ctx.fillText(scoreLabel, cx + cw - 28, smY + 21);
        roundRect(ctx, cx + 28, smY + 38, cw - 56, 7, 3.5); ctx.fillStyle = "#1d1d26"; ctx.fill();
        roundRect(ctx, cx + 28, smY + 38, Math.max(8, (cw - 56) * scoreFill), 7, 3.5); ctx.fillStyle = accent; ctx.fill();

        const artoOriginX = 823, artoOriginY = 1020, artoCam = 36, artoFov = 950;
        const podFloor = project3DPoint(0, -6.10, 0, artoOriginX, artoOriginY, artoCam, artoFov);

        const typeA = clamp((localT - 0.35) / 3.30, 0, 1);
        const typeB = clamp((localT - 5.20) / 3.35, 0, 1);
        const talkW = isPartB
          ? bellCurve(localT, 5.15, 5.30, 8.35, 8.75)
          : bellCurve(localT, 0.30, 0.45, 3.55, 3.95);
        const mouthOpen = getLipSyncOpen(time, talkW);
        const blinkCycle = time % 3.9;
        const blinkAmt = blinkCycle < 0.13 ? Math.sin((blinkCycle / 0.13) * Math.PI) : 0;

        const artoQuads = buildArtoQuads(time, {
          x: 0, y: 0, z: 0,
          yaw: -0.34 + Math.sin(time * 1.4) * 0.08,
          pitch: isPartB ? 0.08 : -0.06,
          roll: isPartB ? 0.08 : -0.04,
          scale: 0.72,
          expr: isPartB ? "hmm_think" : "amazed",
          mouthOpen, blinkAmount: blinkAmt,
          monocleOn: true, orbitScale: 0.92,
          shirtTheme: ARTO_SHIRT, camDist: artoCam
        });
        renderSceneQuads(artoQuads, artoOriginX, artoOriginY, artoCam, artoFov, stageAlpha);

        let txtA = 1.0;
        if (localT >= 4.75 && localT < 5.00) txtA = 1 - (localT - 4.75) / 0.25;
        else if (localT >= 5.00 && localT < 5.25) txtA = (localT - 5.00) / 0.25;

        drawSpeechCard({
          speakerTag: "ARTO",
          roleTag: isGemini
            ? (isPartB ? "CATATAN KRITIS · GEMINI CARBON" : "TERKESIMA! · GEMINI CARBON")
            : (isPartB ? "CATATAN KRITIS · CLAUDE OPUS 5.5" : "TERKESIMA! · CLAUDE OPUS 5.5"),
          line1: isPartB ? line1B : line1A,
          line2: isPartB ? line2B : line2A,
          accentHex: isPartB ? "#ebb343" : accent,
          appearProg: bellCurve(localT, 0.15, 0.55, 9.45, 9.95),
          textAlpha: txtA,
          typeProg: isPartB ? typeB : typeA,
          time,
          cardYBase: 1246,
          pointerX: artoOriginX
        });

        const bx = 48, by = 1504, bw = 984, bh = 232;
        roundRect(ctx, bx, by, bw, bh, 12);
        ctx.fillStyle = "#121217"; ctx.fill();
        ctx.lineWidth = 1.3; ctx.strokeStyle = "#24242f"; ctx.stroke();

        const tlX = bx + 28, tlW = bw - 56, tlY = by + 48;
        ctx.font = "700 14px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#969590"; ctx.textBaseline = "middle";
        fillTrackedText(isGemini ? "PLAYBACK GEMINI · STAGE SEP & SATURN-IV" : "PLAYBACK CLAUDE · GRAVITY TURN & EARTH 3D", tlX, by + 24, 1.3, "left");
        ctx.fillStyle = accent; ctx.textAlign = "right";
        ctx.fillText(`FRAME ${String(Math.round(rocketTime * 30)).padStart(3, "0")} / 360`, tlX + tlW, by + 24);

        roundRect(ctx, tlX, tlY, tlW, 8, 4); ctx.fillStyle = "#1e1e26"; ctx.fill();
        const rRatio = clamp(rocketTime / 12.0, 0, 1);
        roundRect(ctx, tlX, tlY, Math.max(12, tlW * rRatio), 8, 4); ctx.fillStyle = accent; ctx.fill();
        ctx.fillStyle = "#ebb343"; ctx.fillRect(tlX + tlW * rRatio - 2, tlY - 5, 4, 18);

        ctx.font = "700 13.5px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#8e8d88";
        fillTrackedText("PALET 16 WARNA ASLI", tlX, by + 98, 1.2, "left");
        ctx.fillStyle = "#5ce6a0"; ctx.textAlign = "right";
        ctx.fillText("16 / 16 WARNA MURNI · 4× NN ✓", tlX + tlW, by + 98);

        const swGap = 8, swW = (tlW - swGap * 15) / 16, swH = 82;
        for (let i = 0; i < 16; i++) {
          const sx = tlX + i * (swW + swGap), sy = by + 122;
          roundRect(ctx, sx, sy, swW, swH, 6);
          ctx.fillStyle = palette[i]; ctx.fill();
          ctx.lineWidth = 1.1; ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.stroke();
        }

        ctx.restore();
      }

      // =======================================================================
      // 7. FUNGSI UTAMA: drawFrame(t) — PAGE 4 FINAL (54.00s · 1620 FRAME)
      //    0.00 - 15.50s : BAB 1 — Arto Portal Faceplant -> Push-Up -> Kesakitan -> Tengil!
      //   15.50 - 25.50s : BAB 2 — Koreksi 01: Gemini Carbon (Amazed -> Hmm_Think)
      //   25.50 - 35.50s : BAB 3 — Koreksi 02: Claude Opus 5.5 (Amazed -> Hmm_Think)
      //   35.50 - 41.50s : BAB 4 — Rapor Objektif Head-to-Head (Arto Dilemma)
      //   41.50 - 44.85s : BAB 5A — Unified Box ("Skor tipis 9.2 vs 9.3" + 2 Kotak)
      //   44.25 - 54.00s : BAB 5B — Kotak Skor HILANG -> Arto Geser + Gelembung + SOLO IG Sheet
      //                            dengan 2 Bar Pilihan Cepat (Instant Input -> Send!) -> Page 5
      // =======================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, DURATION);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(SSAA, SSAA);

        let shakeX = 0, shakeY = 0;
        if (time >= 1.95 && time <= 2.42) {
          const sp = (time - 1.95) / 0.47;
          const amp = (1 - sp) * (1 - sp) * 13.0;
          shakeX = Math.sin(time * 82.0) * amp;
          shakeY = Math.cos(time * 96.0) * amp;
        }

        const pageExitAlpha = 1 - smootherstep(53.35, 53.98, time);

        // 1. Latar Warm Obsidian (#0f0f11) + Reactive Studio Lighting
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate(shakeX, shakeY);

        const gemMood   = bellCurve(time, 15.20, 15.85, 25.10, 25.70);
        const claMood   = bellCurve(time, 25.30, 25.95, 35.10, 35.70);
        const splitMood = smootherstep(35.30, 36.10, time) * pageExitAlpha;

        const baseWash = ctx.createRadialGradient(W / 2, 740, 40, W / 2, 740, 780);
        baseWash.addColorStop(0, "rgba(235, 179, 67, 0.050)");
        baseWash.addColorStop(0.6, "rgba(108, 54, 163, 0.025)");
        baseWash.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = baseWash; ctx.fillRect(0, 0, W, H);

        if (gemMood > 0.01) {
          const g = ctx.createRadialGradient(340, 720, 40, 340, 720, 720);
          g.addColorStop(0, `rgba(110, 168, 254, ${(gemMood * 0.085).toFixed(4)})`);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        if (claMood > 0.01) {
          const g = ctx.createRadialGradient(340, 720, 40, 340, 720, 720);
          g.addColorStop(0, `rgba(224, 122, 95, ${(claMood * 0.085).toFixed(4)})`);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        if (splitMood > 0.01) {
          const gL = ctx.createRadialGradient(260, 960, 30, 260, 960, 560);
          gL.addColorStop(0, `rgba(110, 168, 254, ${(splitMood * 0.070).toFixed(4)})`);
          gL.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gL; ctx.fillRect(0, 0, W, H);

          const gR = ctx.createRadialGradient(820, 960, 30, 820, 960, 560);
          gR.addColorStop(0, `rgba(224, 122, 95, ${(splitMood * 0.070).toFixed(4)})`);
          gR.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gR; ctx.fillRect(0, 0, W, H);
        }

        // 2. Frame Editorial Hairline (1px)
        ctx.strokeStyle = "#1e1e23"; ctx.lineWidth = 1;
        ctx.strokeRect(24.5, 44.5, W - 49, H - 89);
        ctx.fillStyle = "#1e1e23";
        ctx.fillRect(24, 122, W - 48, 1);
        ctx.fillRect(24, 1792, W - 48, 1);

        ctx.fillStyle = "#ebb343";
        ctx.fillRect(24, 121.5, (W - 48) * (time / DURATION), 1.5);
        drawCrosshair(540, 122, 4, "#36363f");
        drawCrosshair(540, 1792, 4, "#36363f");

        // 3. Masthead Dinamis
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ebb343"; ctx.fillRect(48, 80, 6, 6);
        ctx.fillStyle = "#7c7b76"; fillTrackedText("JOULFIAND STUDIO  ·  ADU MODEL", 66, 83.5, 1.5, "left");

        let mastRight = "04 — PENILAIAN  ·  ARTO";
        if (time >= 15.50 && time < 25.50) mastRight = "04 — KOREKSI 01  ·  GEMINI";
        else if (time >= 25.50 && time < 35.50) mastRight = "04 — KOREKSI 02  ·  CLAUDE";
        else if (time >= 35.50 && time < 41.50) mastRight = "04 — RAPOR  ·  HEAD TO HEAD";
        else if (time >= 41.50) mastRight = "04 — VOTE  ·  KOLOM KOMENTAR";
        ctx.fillStyle = "#969590"; fillTrackedText(mastRight, W - 48, 83.5, 1.5, "right");

        // =====================================================================
        // BAB 1 (0.00s - 15.65s): ARTO PORTAL FACEPLANT -> PUSH-UP -> TENGIL INTRO
        // =====================================================================
        if (time < 15.70) {
          const bab1Alpha = 1 - smootherstep(15.05, 15.65, time);
          ctx.save();
          ctx.globalAlpha = bab1Alpha;

          const titleAppear = smootherstep(7.30, 8.05, time);
          if (titleAppear > 0.01) {
            ctx.save();
            ctx.globalAlpha = bab1Alpha * titleAppear;
            ctx.translate(0, (1 - easeOutQuart(titleAppear)) * 20);
            roundRect(ctx, 48, 178, 11, 11, 2.5); ctx.fillStyle = "#ebb343"; ctx.fill();
            ctx.font = "600 19px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#8f8d87";
            ctx.textBaseline = "middle";
            fillTrackedText("JURI PENILAIAN  ·  ART CRITIC AGENT", 70, 184, 1.8, "left");
            ctx.font = "900 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
            ctx.textBaseline = "top"; ctx.textAlign = "left";
            ctx.fillStyle = "#f5f4f0"; ctx.fillText("Meet ", 48, 222);
            ctx.fillStyle = "#ebb343"; ctx.fillText("Arto.", 48 + ctx.measureText("Meet ").width, 222);
            ctx.restore();
          }

          const originX = W / 2, originY = 890, camDist = 36, fov = 1340;
          const floorPt = project3DPoint(0, -6.10, 0, originX, originY, camDist, fov);
          drawStageFloor(floorPt.y, titleAppear);

          const portalX = W / 2, portalY = 395;
          const portalOpen = softSpringOut(clamp((time - 0.40) / 0.62, 0, 1), 0.75)
                           * (1 - smootherstep(2.40, 2.90, time));
          drawFloatingHoleBack(portalX, portalY, portalOpen, time);
          drawFallSpeedLines(time + 0.15);

          const painType   = clamp((time - 4.25) / 1.65, 0, 1);
          const intro1Type = clamp((time - 7.60) / 2.65, 0, 1);
          const intro2Type = clamp((time - 11.55) / 2.65, 0, 1);

          let talkW = 0;
          if (time >= 4.20 && time <= 6.05) talkW = bellCurve(time, 4.20, 4.35, 5.85, 6.05);
          else if (time >= 7.55 && time <= 10.45) talkW = bellCurve(time, 7.55, 7.70, 10.15, 10.45);
          else if (time >= 11.50 && time <= 14.35) talkW = bellCurve(time, 11.50, 11.65, 14.05, 14.35);
          const mouthOpen = getLipSyncOpen(time, talkW);

          if (time >= 1.25) {
            let artoY = 0, artoPitch = 0.04, artoRoll = 0, artoYaw = -0.18;
            let squashX = 1.0, squashY = 1.0, sitAmt = 0, pushUpBlend = 0;
            let beretLiftY = 0, beretTiltExtra = 0, expr = "tengil";

            if (time < 1.95) {
              const fp = clamp((time - 1.25) / 0.70, 0, 1);
              artoY = lerp(22.2, -3.10, easeInQuad(fp));
              artoPitch = lerp(-0.25, 1.46, easeInQuad(fp));
              artoRoll = Math.sin(fp * Math.PI * 2.0) * 0.22;
              artoYaw = lerp(-0.15, -0.62, fp);
              squashX = lerp(0.92, 0.86, fp); squashY = lerp(1.08, 1.18, fp);
              beretLiftY = lerp(0.2, 3.0, easeInQuad(fp)); beretTiltExtra = -0.36 * fp;
              expr = "panic";
            } else if (time < 3.15) {
              const dt = time - 1.95;
              const splatSq = dt < 0.32 ? Math.sin((dt / 0.32) * Math.PI) : 0;
              squashX = 1 + splatSq * 0.28; squashY = 1 - splatSq * 0.26;
              artoY = -3.45 + splatSq * 0.15; artoPitch = 1.46; artoYaw = -0.62;
              artoRoll = Math.sin(time * 14.0) * 0.03 * smoothstep(2.30, 2.60, time);
              const bp = clamp(dt / 0.34, 0, 1);
              beretLiftY = bp < 1 ? lerp(3.0, 0, easeInQuad(bp)) : Math.max(0, Math.sin((dt - 0.34) * 18) * 0.35 * Math.exp(-(dt - 0.34) * 6));
              beretTiltExtra = lerp(-0.36, 0.24, smoothstep(0, 1, bp));
              expr = "faceplant";
            } else if (time < 4.10) {
              const pPush = smootherstep(3.15, 3.65, time);
              const pSit  = smootherstep(3.62, 4.10, time);
              pushUpBlend = pPush; sitAmt = pSit;
              artoPitch = lerp(lerp(1.46, 0.62, pPush), -0.10, pSit);
              artoY = lerp(lerp(-3.45, -2.55, pPush), -2.35, pSit);
              artoYaw = lerp(-0.62, -0.12, easeInOutCubic((time - 3.15) / 0.95));
              artoRoll = lerp(0, -0.06, pSit); beretTiltExtra = lerp(0.24, 0.18, pSit);
              expr = "pushup";
            } else if (time < 6.75) {
              artoY = -2.35; sitAmt = 1.0; artoPitch = -0.10;
              artoRoll = -0.06 + Math.sin(time * 3.8) * 0.03; artoYaw = -0.12; beretTiltExtra = 0.18;
              expr = time < 6.52 ? "pain" : "alert";
            } else if (time < 7.50) {
              const upP = clamp((time - 6.75) / 0.70, 0, 1);
              artoY = lerp(-2.35, 0.0, easeOutQuart(upP)) + Math.sin(upP * Math.PI) * 2.5;
              sitAmt = 1 - easeOutCubic(upP); artoPitch = -0.10;
              artoRoll = lerp(-0.06, 0.12, upP); artoYaw = lerp(-0.12, -0.22, upP);
              squashX = 1 - Math.sin(upP * Math.PI) * 0.08; squashY = 1 + Math.sin(upP * Math.PI) * 0.10;
              beretLiftY = Math.sin(upP * Math.PI) * 0.45; beretTiltExtra = lerp(0.18, -0.05, upP);
              expr = upP < 0.55 ? "alert" : "tengil";
            } else if (time < 11.45) {
              artoY = 0; sitAmt = 0;
              artoPitch = -0.12 + Math.sin(time * 3.2) * 0.04;
              artoRoll  =  0.14 + Math.sin(time * 3.2) * 0.09;
              artoYaw   = -0.24 + Math.sin(time * 1.9) * 0.16;
              beretTiltExtra = -0.08; expr = "tengil";
            } else {
              const k = smootherstep(11.45, 12.10, time);
              artoY = 0; sitAmt = 0;
              artoPitch = lerp(-0.12, 0.06, k);
              artoRoll  = lerp( 0.14, 0.06 + Math.sin(time * 2.2) * 0.05, k);
              artoYaw   = lerp(-0.24, Math.sin(time * 1.6) * 0.18, k);
              beretTiltExtra = lerp(-0.08, 0.0, k); expr = "hmm_think";
            }

            const hf = clamp(1 - Math.max(0, artoY) / 22.0, 0.18, 1.0);
            const flatSpread = expr === "faceplant" ? 1.45 : (expr === "pushup" ? lerp(1.45, 1.05, sitAmt) : 1.0);
            drawShadow(floorPt.x, floorPt.y, 168 * hf * flatSpread, 38 * hf * flatSpread, hf * 0.95 * bab1Alpha);
            drawCrashImpactFX(floorPt.x, floorPt.y, time + 0.13);

            let blinkAmt = 0;
            for (const m of [8.25, 10.90, 13.85]) {
              const d = Math.abs(time - m);
              if (d < 0.11) blinkAmt = Math.cos((d / 0.11) * (Math.PI / 2));
            }

            const orbitScale = softSpringOut(clamp((time - 7.35) / 0.72, 0, 1), 0.75);
            const artoQuads = buildArtoQuads(time, {
              x: 0, y: artoY, z: 0, yaw: artoYaw, pitch: artoPitch, roll: artoRoll,
              scale: 0.98, squashX, squashY, expr, sitAmt, pushUpBlend,
              beretLiftY, beretTiltExtra, mouthOpen, blinkAmount: blinkAmt,
              monocleOn: true, orbitScale, shirtTheme: ARTO_SHIRT, camDist
            });

            ctx.save();
            if (time < 2.15 && portalOpen > 0.05) {
              ctx.beginPath();
              ctx.moveTo(0, portalY); ctx.lineTo(portalX - 182 * portalOpen, portalY);
              ctx.ellipse(portalX, portalY, 182 * portalOpen, 48 * portalOpen, 0, Math.PI, Math.PI * 2, false);
              ctx.lineTo(W, portalY); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
              ctx.clip();
            }
            renderSceneQuads(artoQuads, originX, originY, camDist, fov, bab1Alpha);
            ctx.restore();

            drawFloatingHoleFrontLip(portalX, portalY, portalOpen);

            const dizzyA = bellCurve(time, 2.15, 2.55, 6.25, 6.58);
            if (dizzyA > 0.01) {
              const hPt = project3DPoint(expr === "faceplant" ? 2.5 : 0, expr === "faceplant" ? 0.5 : (artoY + 8.6), 0, originX, originY, camDist, fov);
              drawDizzyStars(hPt.x, hPt.y, dizzyA * bab1Alpha, time);
            }
            const alertEmote = bellCurve(time, 6.52, 6.66, 7.02, 7.28);
            if (alertEmote > 0.01) {
              const ePt = project3DPoint(5.2, artoY + 6.8, 0, originX, originY, camDist, fov);
              drawEmoteBadge(ePt.x, ePt.y, "!", "#ebb343", alertEmote * bab1Alpha, time);
            }
            const gl1 = clamp((time - 7.35) / 0.62, 0, 1);
            const gl2 = clamp((time - 9.25) / 0.62, 0, 1);
            if ((gl1 > 0 && gl1 < 1) || (gl2 > 0 && gl2 < 1)) {
              const gPt = project3DPoint(1.8, artoY + 4.4, 3.2, originX, originY, camDist, fov);
              drawSparkleGlint(gPt.x, gPt.y, gl1 > 0 && gl1 < 1 ? gl1 : gl2);
            }
          } else {
            drawFloatingHoleFrontLip(portalX, portalY, portalOpen);
          }

          const painCardA = bellCurve(time, 4.12, 4.45, 6.20, 6.55);
          if (painCardA > 0.01) {
            drawSpeechCard({
              speakerTag: "ARTO", roleTag: "OUCH!! · HABIS TENGKURAP",
              line1: "Aduh, sakit banget sih...", line2: "",
              accentHex: "#ff6b6b", appearProg: painCardA * bab1Alpha,
              typeProg: painType, time, cardYBase: 1352, pointerX: W / 2,
              shakeAmp: bellCurve(time, 4.15, 4.28, 4.55, 4.88) * 3.8
            });
          }

          const introCardA = smootherstep(7.45, 7.90, time);
          if (introCardA > 0.01) {
            const isSecond = time >= 11.45;
            let txtA = 1.0;
            if (time >= 11.20 && time < 11.45) txtA = 1 - (time - 11.20) / 0.25;
            else if (time >= 11.45 && time < 11.70) txtA = (time - 11.45) / 0.25;
            drawSpeechCard({
              speakerTag: "ARTO", roleTag: isSecond ? "ART CRITIC · MODE KOREKSI" : "AGENT TAMPAN · PERKENALAN",
              line1: isSecond ? "yang siap untuk mengoreksi design" : "Ehh, halo guys! Kenalin nih,",
              line2: isSecond ? "dari dua model AI-nya si Boss!" : "gw Arto, si Agent tampan...",
              accentHex: "#ebb343", appearProg: introCardA * bab1Alpha, textAlpha: txtA,
              typeProg: isSecond ? intro2Type : intro1Type, time, cardYBase: 1352, pointerX: W / 2
            });
          }

          ctx.restore();
