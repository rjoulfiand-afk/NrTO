          if (!mask[f]) continue;
          const fd = defs[f];
          pushPolyFace(quadList, [v[fd.idx[0]], v[fd.idx[1]], v[fd.idx[2]], v[fd.idx[3]]], rgb, { ...opts, ao: fd.ao });
        }
      }


      function pushBoxQuads(quadList, cx, cy, cz, w, h, d, rgb, localTf, worldTf, opts = {}) {
        pushBox(quadList, cx, cy, cz, w, h, d, rgb, localTf ? [localTf, worldTf] : [worldTf], opts);
      }

      function pushTaperedPrism(quadList, cx, cy, cz, rxBot, rzBot, rxTop, rzTop, h, sides, rgb, tfChain, opts = {}) {
        const y0 = cy - h / 2, y1 = cy + h / 2;
        const dxBot = opts.dxBot || 0, dzBot = opts.dzBot || 0;
        const dxTop = opts.dxTop || 0, dzTop = opts.dzTop || 0;
        const botRing = [], topRing = [];
        for (let i = 0; i < sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          const ca = Math.cos(a), sa = -Math.sin(a);
          botRing.push(applyChain([cx + dxBot + ca * rxBot, y0, cz + dzBot + sa * rzBot], tfChain));
          topRing.push(applyChain([cx + dxTop + ca * rxTop, y1, cz + dzTop + sa * rzTop], tfChain));
        }
        for (let i = 0; i < sides; i++) {
          const j = (i + 1) % sides;
          pushPolyFace(quadList, [botRing[i], botRing[j], topRing[j], topRing[i]], rgb, { ...opts, ao: 0.94 });
        }
        if (opts.capTop !== false && rxTop > 0.04) {
          pushPolyFace(quadList, topRing.slice(), rgb, { ...opts, ao: 1.07 });
        }
        if (opts.capBot !== false && rxBot > 0.04) {
          pushPolyFace(quadList, botRing.slice().reverse(), rgb, { ...opts, ao: 0.68 });
        }
      }

      function renderSceneQuads(quadList, originX, originY, camDist, fov, actorAlpha = 1.0) {
        if (actorAlpha <= 0.01 || quadList.length === 0) return;
        const camPos = [0, 1.0, camDist];
        const visible = [];

        for (let i = 0; i < quadList.length; i++) {
          const q = quadList[i];
          const dx = camPos[0] - q.center[0];
          const dy = camPos[1] - q.center[1];
          const dz = camPos[2] - q.center[2];
          if (dot3(q.normal, [dx, dy, dz]) <= 0.0005 || dz < 2.0) continue;

          let fill;
          if (q.unlit) {
            fill = shadeRgb(q.rgb, q.dimFactor, null, 0);
          } else {
            const ndl = Math.max(0, dot3(q.normal, KEY_LIGHT));
            const ndf = Math.max(0, dot3(q.normal, FILL_LIGHT));
            const shade = (0.50 + 0.42 * ndl + 0.14 * ndf) * q.ao * q.dimFactor;
            const rimHit = q.rimRgb ? Math.max(0, dot3(q.normal, q.rimDir)) * 0.24 * q.dimFactor : 0;
            fill = shadeRgb(q.rgb, shade, q.rimRgb, rimHit);
          }

          const proj = q.verts.map((v) => {
            const sc = fov / Math.max(1.5, camPos[2] - v[2]);
            return [originX + (v[0] - camPos[0]) * sc, originY - (v[1] - camPos[1]) * sc];
          });

          visible.push({
            layer: q.layer,
            distSq: dx * dx + dy * dy + dz * dz,
            proj, fill, alpha: q.alpha * actorAlpha, strokeSame: q.strokeSame
          });
        }

        visible.sort((a, b) => (a.layer !== b.layer ? a.layer - b.layer : b.distSq - a.distSq));

        for (let i = 0; i < visible.length; i++) {
          const item = visible[i], p = item.proj;
          ctx.save();
          if (item.alpha < 1) ctx.globalAlpha *= item.alpha;
          ctx.beginPath();
          ctx.moveTo(p[0][0], p[0][1]);
          for (let k = 1; k < p.length; k++) ctx.lineTo(p[k][0], p[k][1]);
          ctx.closePath();
          ctx.fillStyle = item.fill;
          ctx.fill();
          if (item.strokeSame) {
            ctx.strokeStyle = item.fill;
            ctx.lineWidth = 0.75;
            ctx.lineJoin = "round";
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function project3DPoint(wx, wy, wz, originX, originY, camDist, fov) {
        const sc = fov / Math.max(1.5, camDist - wz);
        return { x: originX + wx * sc, y: originY - (wy - 1.0) * sc, sc };
      }

      function pushSculptedPaintbrush(quadList, brushChain, baseOpts) {

        pushTaperedPrism(quadList, 0, -0.875, 0, 0.25, 0.25, 0.42, 0.42, 2.45, sides, WOOD_RICH, brushChain, { ...pOpts, capBot: false, capTop: false });

        pushTaperedPrism(quadList, 0,  1.72,  0, 0.37, 0.37, 0.38, 0.38, 0.34, sides, SILVER_METAL, brushChain, { ...pOpts, capTop: false });

        pushTaperedPrism(quadList, 0,  2.33,  0, 0.42, 0.42, 0.42, 0.42, 0.12, sides, SILVER_CRIMP, brushChain, { ...pOpts, capBot: false, capTop: false });

        pushTaperedPrism(quadList, 0,  3.15,  0, 0.40, 0.36, 0.80, 0.66, 0.60, sides, SABLE_HAIR, brushChain, { ...pOpts, dxBot: 0, dxTop: 0.04, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  3.75,  0, 0.80, 0.66, 0.68, 0.56, 0.60, sides, SABLE_MID,  brushChain, { ...pOpts, dxBot: 0.04, dxTop: 0.12, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  4.385, 0, 0.68, 0.56, 0.28, 0.24, 0.67, sides, GOLD_PAINT, brushChain, { ...pOpts, dxBot: 0.12, dxTop: 0.26, capBot: false, capTop: false });
        pushTaperedPrism(quadList, 0,  5.01,  0, 0.28, 0.24, 0.03, 0.03, 0.58, sides, GOLD_WET,   brushChain, { ...pOpts, dxBot: 0.26, dxTop: 0.44, capBot: false, capTop: false, unlit: true });

      function buildArtoQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale, squashX = 1, squashY = 1,

          sitAmt = 0, pushUpBlend = 0, beretLiftY = 0, beretTiltExtra = 0,

        const SHIRT_MAIN = hexToRgb(shirtTheme.main);

        const isPanic     = expr === "panic";
        const isFaceplant = expr === "faceplant";

                           : isDilemma   ? Math.abs(Math.sin(time * 4.5)) * 0.10
                           : 0;

        const worldTf = {
          tx: x + jitter,
          ty: y + energyBounce + (isFaceplant ? 0 : Math.sin(time * 2.6) * 0.06),
          tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * squashX * (1 + energyBounce * 0.032 - breathe * 0.35),
          sy: scale * squashY * (1 - energyBounce * 0.024 + breathe),
          sz: scale * (1 + energyBounce * 0.02)
        };
        const baseOpts = { rimRgb: RIM_WARM, rimDir: RIM_DIR, layer: 2 };

        // 1. KAKI & SEPATU
        const legXs = [-1.52, 1.52];
        for (let i = 0; i < 2; i++) {

            const kickWave = Math.sin(time * 13.0 + i * Math.PI) * 0.34;

            legRx = lerp(0.18, -1.32, sitAmt);
            legRz = i === 0 ? -0.16 : 0.16;

            legRx = sitAmt * -1.32;
            legRz = sitAmt * (i === 0 ? -0.18 : 0.18);

            legRz = i === 0 ? -0.09 : 0.09;

          const legPivot = { tx: legXs[i], ty: -3.15, tz: 0, rx: legRx, ry: 0, rz: legRz, sx: 1, sy: 1, sz: 1 };
          pushBox(quads, 0, -1.40, 0, 1.95, 2.75, 2.20, LEG_CHARCOAL, [legPivot, worldTf], baseOpts);
          pushBox(quads, 0, -2.63, 0.26, 2.05, 0.62, 2.75, SHOE_SLATE, [legPivot, worldTf], baseOpts);
        }

        // 2. BADAN / BAJU PELUKIS
        pushBox(quads, 0, -1.05, 0, 6.40, 4.55, 3.90, SHIRT_MAIN, [worldTf], baseOpts);
        pushBox(quads, 0,  1.05, 0.08, 6.62, 0.58, 4.12, SHIRT_DARK, [worldTf], baseOpts);
        pushBox(quads, -1.85, -0.05, 2.02, 0.82, 0.42, 0.16, SHIRT_ACC, [worldTf], baseOpts);
        pushBox(quads, 0, -3.15, 0, 6.52, 0.38, 4.02, SHIRT_DARK, [worldTf], baseOpts);

        // 3. TANGAN KIRI (10 Gestur Unik Sesuai Ekspresi!)
        let lArmRx = -0.25, lArmRz = -0.14;
        if (isPanic) {
          lArmRx = -1.75 + Math.sin(time * 28.0) * 0.42;
          lArmRz = -0.88 - Math.sin(time * 22.0) * 0.25;
        } else if (isFaceplant) {
          lArmRx = -0.35; lArmRz = -1.22 + Math.sin(time * 9.0) * 0.05;
        } else if (isPushUp) {

        } else if (isPain) {
          lArmRx = -2.28; lArmRz = 0.50 + Math.sin(time * 9.5) * 0.14;

        } else if (isTengil) {

        pushBox(quads, 0, -1.10, 0, 1.62, 2.45, 1.85, SHIRT_MAIN, [leftShoulderTf, worldTf], baseOpts);
        pushBox(quads, 0, -2.28, 0, 1.68, 0.32, 1.92, SHIRT_DARK, [leftShoulderTf, worldTf], baseOpts);
        pushBox(quads, 0, -2.85, 0, 1.38, 1.05, 1.52, SKIN_WHITE, [leftShoulderTf, worldTf], baseOpts);

        // 4. TANGAN KANAN + KUAS PELUKIS 3D
        let rArmRx = -0.88, rArmRz = 0.22;

        } else if (isPain) {

        } else if (isAlert) {
          rArmRx = -1.05; rArmRz = 0.28; brushTiltX = 1.15; brushTiltZ = -0.22;
        } else if (isTengil) {
          rArmRx = -1.24 + Math.sin(time * 5.2) * 0.14; rArmRz = 0.38 + Math.sin(time * 3.4) * 0.18;
          brushTiltX = 1.24; brushTiltZ = -0.28 + Math.sin(time * 6.5) * 0.24; brushSpinY = Math.sin(time * 4.0) * 0.6;
        } else if (isAmazed) {

        const frontCenter = applyChain([0, 3.0, 3.0], headChain);
        const frontOuter  = applyChain([0, 3.0, 4.0], headChain);
        const headFrontDir = normalize3([frontOuter[0] - frontCenter[0], frontOuter[1] - frontCenter[1], frontOuter[2] - frontCenter[2]]);
        const camVec = normalize3([-frontCenter[0], 1.0 - frontCenter[1], camDist - frontCenter[2]]);
        const faceFacingCam = dot3(headFrontDir, camVec) > 0.08;

        if (faceFacingCam) {
          const eyeZ = 3.06, eyeY = 3.08;
          const shiftX = isTengil  ? 0.24 + Math.sin(time * 2.4) * 0.10
                       : isDilemma ? Math.sin(time * 3.8) * 0.36
                       : isThink   ? -0.26
                       : isAmazed  ? -0.18
                       : 0;
          const shiftY = isThink ? 0.24 : 0;

          for (const side of [-1, 1]) {
            const ex = side * 1.62;

            if (isPain || isPushUp || isFaceplant) {
              const topBar = { tx: ex, ty: eyeY + 0.22, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: side === -1 ? -0.44 :  0.44, sx: 1, sy: 1, sz: 1 };
              const botBar = { tx: ex, ty: eyeY - 0.22, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: side === -1 ?  0.44 : -0.44, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 1.04, 0.30, 0.22, EYE_DARK, [topBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, 0, 0, 0, 1.04, 0.30, 0.22, EYE_DARK, [botBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
            } else if (isPanic) {
              pushBox(quads, ex, eyeY, eyeZ, 1.56, 1.96, 0.24, SHINE_WHITE, headChain, { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, ex + Math.sin(time * 42 + side) * 0.12, eyeY + Math.cos(time * 38) * 0.10, eyeZ + 0.14, 0.46, 0.52, 0.06, EYE_DARK, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
            } else if (isHappyHost) {
              // Mata senyum ceria hangat (^ ^) mengajak penonton komen!
              const lBar = { tx: ex - 0.30, ty: eyeY + 0.10, tz: eyeZ + 0.05, rx: 0, ry: 0, rz:  0.44, sx: 1, sy: 1, sz: 1 };
              const rBar = { tx: ex + 0.30, ty: eyeY + 0.10, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: -0.44, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.80, 0.34, 0.22, EYE_DARK, [lBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, 0, 0, 0, 0.80, 0.34, 0.22, EYE_DARK, [rBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
            } else if (isAmazed) {
              // Mata berbinar lebar kagum + DOBEL KILAU BINTANG PUTIH!
              const eyeH = lerp(2.04, 0.18, blinkAmount);
              pushBox(quads, ex + shiftX * 0.5, eyeY, eyeZ, 1.28, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
              if (blinkAmount < 0.40) {
                const sp = 0.44 + Math.sin(time * 12) * 0.05;
                pushBox(quads, ex - 0.24 + shiftX * 0.6, eyeY + 0.42, eyeZ + 0.14, sp, sp, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
                pushBox(quads, ex + 0.26 + shiftX * 0.6, eyeY - 0.36, eyeZ + 0.14, 0.26, 0.26, 0.04, GOLD_LIGHT,  headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
              }
            } else if (isGoofyKiss) {
              if (side === -1) {
                const lBar = { tx: ex - 0.28, ty: eyeY + 0.08, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: 0.42, sx: 1, sy: 1, sz: 1 };
                const rBar = { tx: ex + 0.28, ty: eyeY + 0.08, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: -0.42, sx: 1, sy: 1, sz: 1 };
                pushBox(quads, 0, 0, 0, 0.78, 0.32, 0.22, EYE_DARK, [lBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
                pushBox(quads, 0, 0, 0, 0.78, 0.32, 0.22, EYE_DARK, [rBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              } else {
                pushBox(quads, ex, eyeY, eyeZ, 1.32, 1.98, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
                pushBox(quads, ex - 0.22, eyeY + 0.42, eyeZ + 0.14, 0.44, 0.44, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
                pushBox(quads, ex + 0.24, eyeY - 0.34, eyeZ + 0.14, 0.28, 0.28, 0.04, GOLD_LIGHT,  headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
              }
            } else if (isTengil && side === -1 && Math.sin(time * 2.2) > 0.78) {
              // Wink genit tengil!
              const lBar = { tx: ex - 0.28, ty: eyeY + 0.08, tz: eyeZ + 0.05, rx: 0, ry: 0, rz:  0.40, sx: 1, sy: 1, sz: 1 };
              const rBar = { tx: ex + 0.28, ty: eyeY + 0.08, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: -0.40, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.76, 0.30, 0.22, EYE_DARK, [lBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
              pushBox(quads, 0, 0, 0, 0.76, 0.30, 0.22, EYE_DARK, [rBar, headTf, worldTf], { ...baseOpts, layer: 3, unlit: true });
            } else if (isTengil || isThink) {
              // Half-lidded smug (tengil) atau 1-mata menyipit tajam (hmm_think)!
              const eyeH = lerp(isThink && side === -1 ? 1.24 : 1.62, 0.18, blinkAmount);
              pushBox(quads, ex + shiftX * 0.55, eyeY - 0.10 + shiftY * 0.4, eyeZ, 1.16, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
              if (blinkAmount < 0.40) {
                pushBox(quads, ex - 0.20 + shiftX * 0.65, eyeY - 0.04 + shiftY * 0.45, eyeZ + 0.14, 0.30, 0.30, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
                if (isTengil || side === -1) {
                  const lidTilt = isTengil ? (side === -1 ? -0.14 : 0.06) : -0.22;
                  const lidDrop = isTengil ? 0.52 : 0.46;
                  const lidTf = { tx: ex + shiftX * 0.35, ty: eyeY + lidDrop, tz: eyeZ + 0.16, rx: 0, ry: 0, rz: lidTilt, sx: 1, sy: 1, sz: 1 };
                  pushBox(quads, 0, 0, 0, 1.48, 0.72, 0.08, SKIN_LID, [lidTf, headTf, worldTf], { ...baseOpts, layer: 3.55 });
                }
              }
            } else {
              // Alert / Dilemma: mata fokus melirik kiri-kanan!
              const eyeH = lerp(isAlert ? 1.94 : 1.76, 0.18, blinkAmount);
              pushBox(quads, ex + shiftX * 0.60, eyeY, eyeZ, 1.14, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
              if (blinkAmount < 0.40) {
                pushBox(quads, ex - 0.20 + shiftX * 0.70, eyeY + 0.36, eyeZ + 0.14, 0.34, 0.34, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });
              }
            }

            // ALIS EKSPRESIF (10 variasi)
            let bLift = 0.18, bTilt = 0;
            if (isPanic)               { bLift =  0.66; bTilt = side === -1 ?  0.24 : -0.24; }
            else if (isPain||isPushUp) { bLift = -0.12; bTilt = side === -1 ?  0.38 : -0.38; }
            else if (isAlert)          { bLift =  0.56; bTilt = side === -1 ?  0.16 : -0.16; }
            else if (isAmazed)         { bLift =  0.58; bTilt = side === -1 ?  0.18 : -0.18; }
            else if (isHappyHost || isGoofyKiss) { bLift =  0.48; bTilt = side === -1 ?  0.16 : -0.16; }
            else if (isThink)          { bLift = side === -1 ? -0.22 : 0.48; bTilt = side === -1 ? -0.30 : 0.16; }
            else if (isDilemma)        { bLift = side === -1 ? 0.30 + Math.sin(time * 3.8) * 0.22 : 0.30 - Math.sin(time * 3.8) * 0.22; bTilt = side === -1 ? 0.20 : -0.20; }
            else if (isTengil)         { bLift = side === -1 ? 0.02 : 0.62 + Math.sin(time * 4.5) * 0.10; bTilt = side === -1 ? -0.22 : -0.18; }

            const browTf = { tx: ex, ty: eyeY + 1.24 + bLift, tz: eyeZ + 0.12, rx: 0, ry: 0, rz: bTilt, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, 1.46, 0.28, 0.24, BROW_DARK, [browTf, headTf, worldTf], { ...baseOpts, layer: 3.65 });
          }

          // MULUT 3D ANIMATED LIP-SYNC (Buka-Tutup Natural + Gigi Putih + Lidah Pink!)
          const mY = 1.46;
          if (isPanic) {
            const screamH = 1.10 + Math.sin(time * 24.0) * 0.20;
            pushBox(quads, 0, mY, eyeZ + 0.04, 1.08, screamH, 0.16, MOUTH_CAVITY, headChain, { ...baseOpts, layer: 3.2, unlit: true });
            pushBox(quads, 0, mY - screamH * 0.26, eyeZ + 0.13, 0.68, 0.34, 0.04, TONGUE_PINK, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.3, unlit: true });
          } else if (isPain || isPushUp) {
            const mH = lerp(0.24, 0.88, mouthOpen), mW = lerp(1.26, 1.06, mouthOpen * 0.6);
            const mTf = { tx: 0, ty: mY, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: -0.06 + Math.sin(time * 16.0) * 0.05, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.22) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.62, mH * 0.38, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.3, unlit: true });
          } else if (isAlert) {
            pushBox(quads, 0, mY, eyeZ + 0.04, 0.62, 0.68, 0.14, MOUTH_CAVITY, headChain, { ...baseOpts, layer: 3.2, unlit: true });
          } else if (isAmazed || isHappyHost) {
            // Mulut ceria / kagum lebar (gigi putih + lidah pink saat bicara!)
            const mH = lerp(0.32, 1.06, mouthOpen), mW = lerp(1.52, 1.44, mouthOpen * 0.2);
            const mTf = { tx: 0, ty: mY + 0.02, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: 0, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.15) pushBox(quads, 0, mH * 0.30, 0.08, mW * 0.86, Math.min(0.24, mH * 0.30), 0.04, TEETH_WHITE, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.35, unlit: true });
            if (mouthOpen > 0.28) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.62, mH * 0.38, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
          } else if (isThink || isDilemma) {
            // Mulut miring berpikir ("hmm...") yang tetap buka-tutup berbicara!
            const mH = lerp(0.22, 0.78, mouthOpen), mW = lerp(1.12, 1.02, mouthOpen * 0.3);
            const mTf = { tx: isThink ? -0.22 : 0.0, ty: mY, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: isThink ? -0.10 : Math.sin(time * 3.8) * 0.08, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.28) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.56, mH * 0.34, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
          } else {
            // Smirk Tengil + Lip-Sync Gigi & Lidah!
            const mH = lerp(0.26, 0.96, mouthOpen), mW = lerp(1.56, 1.38, mouthOpen * 0.35);
            const mTf = { tx: 0.18, ty: mY + 0.04, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: 0.16, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, mW, mH, 0.14, MOUTH_CAVITY, [mTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            const cornerTf = { tx: 0.18 + mW * 0.52, ty: mY + 0.22, tz: eyeZ + 0.05, rx: 0, ry: 0, rz: 0.42, sx: 1, sy: 1, sz: 1 };
            pushBox(quads, 0, 0, 0, 0.44, 0.22, 0.10, MOUTH_CAVITY, [cornerTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
            if (mouthOpen > 0.15) pushBox(quads, 0, mH * 0.30, 0.08, mW * 0.84, Math.min(0.24, mH * 0.32), 0.04, TEETH_WHITE, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.35, unlit: true });
            if (mouthOpen > 0.32) pushBox(quads, 0, -mH * 0.24, 0.08, mW * 0.58, mH * 0.36, 0.04, TONGUE_PINK, [mTf, headTf, worldTf], { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
          }

          // Pipi Merona saat Tengil, Terkesima, atau Happy Host
          if (isTengil || isAmazed || isHappyHost || isGoofyKiss) {
            pushBox(quads, -2.55, 1.78, eyeZ - 0.02, 0.82, 0.36, 0.08, SKIN_BLUSH, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.1, unlit: true });
            pushBox(quads,  2.55, 1.78, eyeZ - 0.02, 0.82, 0.36, 0.08, SKIN_BLUSH, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.1, unlit: true });
          }

          // MONOCLE EMAS KURATOR
          if (monocleOn) {
            const monTilt = (isPain || isPushUp) ? 0.26 : (isPanic ? -0.22 : (isTengil ? -0.05 : 0));
            const monTf = { tx: 1.62, ty: eyeY, tz: eyeZ + 0.24, rx: 0, ry: 0, rz: monTilt, sx: 1, sy: 1, sz: 1 };
            const mChain = [monTf, headTf, worldTf];
            const mw = 1.78, mh = 2.26, th = 0.16;
            const mOpts = { ...baseOpts, layer: 3.8 };
            pushBox(quads, 0,  mh / 2, 0, mw + th, th, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads, 0, -mh / 2, 0, mw + th, th, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads, -mw / 2, 0, 0, th, mh, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads,  mw / 2, 0, 0, th, mh, 0.18, GOLD_BRIGHT, mChain, mOpts);
            pushBox(quads, 0, 0, -0.04, mw - 0.12, mh - 0.12, 0.04, hexToRgb("#a8d4ff"), mChain, { faceMask: [1,0,0,0,0,0], layer: 3.7, unlit: true, alpha: 0.16, strokeSame: false });
            pushBox(quads, mw / 2 + 0.16, -1.35, -0.05, 0.11, 2.25, 0.11, GOLD_BRIGHT, mChain, mOpts);
          }
        }

        // 6. 5 IKON SENI & PENILAIAN 3D MENGORBIT (Radius sedikit lebih lega agar tidak pernah nutup muka!)
        if (orbitScale > 0.02) {
          const orbitSpeed = isAmazed ? 1.05 : (isHappyHost ? 0.85 : 0.65);
          for (let i = 0; i < ORBIT_RELICS.length; i++) {
            const r = ORBIT_RELICS[i];
            const a = r.ang + time * orbitSpeed;
            const rad = (r.rad + 0.6) * orbitScale;
            const ox = x + Math.cos(a) * rad * scale;
            const oz = z + Math.sin(a) * (rad * 0.50) * scale;
            const oy = y + (r.yOff + Math.sin(time * 2.8 + i * 1.4) * 0.42) * scale;
            const relicLayer = oz < z ? 0 : 5;

            const rTf = {
              tx: ox, ty: oy, tz: oz,
              rx: Math.sin(time * 1.3 + i) * 0.35,
              ry: time * 1.45 + i,
              rz: Math.cos(time * 1.1 + i) * 0.20,
              sx: scale * orbitScale * 0.92, sy: scale * orbitScale * 0.92, sz: scale * orbitScale * 0.92
            };
            const rOpts = { rimRgb: RIM_WARM, rimDir: RIM_DIR, layer: relicLayer };

            if (r.type === "star") {
              pushBox(quads, 0, 0, 0, 1.55, 0.44, 0.44, r.col, [rTf], rOpts);
              pushBox(quads, 0, 0, 0, 0.44, 1.55, 0.44, r.col, [rTf], rOpts);
              pushBox(quads, 0, 0, 0, 0.72, 0.72, 0.72, GOLD_LIGHT, [rTf], rOpts);
            } else if (r.type === "frame") {
              const s = 1.25, t = 0.24;
              pushBox(quads, 0,  s / 2, 0, s + t, t, 0.32, r.col, [rTf], rOpts);
              pushBox(quads, 0, -s / 2, 0, s + t, t, 0.32, r.col, [rTf], rOpts);
              pushBox(quads, -s / 2, 0, 0, t, s, 0.32, r.col, [rTf], rOpts);
              pushBox(quads,  s / 2, 0, 0, t, s, 0.32, r.col, [rTf], rOpts);
            } else if (r.type === "palette") {
              pushBox(quads, 0, 0, 0, 1.48, 1.15, 0.32, r.col, [rTf], rOpts);
              pushBox(quads, -0.38,  0.18, 0.20, 0.34, 0.34, 0.14, hexToRgb("#6ea8fe"), [rTf], rOpts);
              pushBox(quads,  0.38,  0.18, 0.20, 0.34, 0.34, 0.14, hexToRgb("#e07a5f"), [rTf], rOpts);
              pushBox(quads,  0.00, -0.24, 0.20, 0.34, 0.34, 0.14, GOLD_BRIGHT,         [rTf], rOpts);
            } else if (r.type === "check") {
              pushBox(quads, 0, 0, 0, 1.24, 1.24, 0.34, hexToRgb("#18221e"), [rTf], rOpts);
              const c1 = { tx: -0.20, ty: -0.06, tz: 0.22, rx: 0, ry: 0, rz: -0.75, sx: 1, sy: 1, sz: 1 };
              const c2 = { tx:  0.16, ty:  0.04, tz: 0.22, rx: 0, ry: 0, rz:  0.75, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.52, 0.22, 0.16, r.col, [c1, rTf], rOpts);
              pushBox(quads, 0, 0, 0, 0.86, 0.22, 0.16, r.col, [c2, rTf], rOpts);
            } else {
              const dTf = { tx: 0, ty: 0, tz: 0, rx: 0.78, ry: 0, rz: 0.78, sx: 1, sy: 1, sz: 1 };
              pushBox(quads, 0, 0, 0, 0.84, 0.84, 0.84, r.col, [dTf, rTf], rOpts);
            }
          }
        }

        return quads;
      }



      // --- MODEL 3D ROGER (CLAUDE CODE · KANAN) ---
      const ROGER_ORANGE = hexToRgb("#ea7444");
      const ROGER_EYE    = hexToRgb("#141419");
      const ROGER_BROW   = hexToRgb("#261a16");
      const ROGER_SHINE  = hexToRgb("#ffffff");
      const ROGER_BLUSH  = hexToRgb("#ff8a80");
      const ROGER_RIM    = hexToRgb("#ffb088");
      const ROGER_RIMDIR = normalize3([0.75, 0.35, -0.30]);

      function buildRogerQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale, squashX = 1, squashY = 1,
          speakEnergy = 0, waveLeft = 0, waveRight = 0, blinkAmount = 0,
          happyAmount = 0, excitedAmount = 0, shockAmount = 0, goofyAmount = 0, lookX = 0, blushAmount = 0, dimFactor = 1
        } = pose;

        const bounce = Math.abs(Math.sin(time * 7.2)) * speakEnergy;
        const breathe = Math.sin(time * 2.8) * 0.015;
        const worldTf = {
          tx: x, ty: y + bounce * 0.38 + Math.sin(time * 2.8) * 0.08, tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * squashX * (1 + bounce * 0.05 - breathe * 0.4),
          sy: scale * squashY * (1 - bounce * 0.04 + breathe),
          sz: scale * (1 + bounce * 0.03)
        };
        const baseOpts = { rimRgb: ROGER_RIM, rimDir: ROGER_RIMDIR, dimFactor };

        const legXs = [-3.35, -1.20, 1.20, 3.35];
        for (let i = 0; i < 4; i++) {
          const stepLift = Math.max(0, Math.sin(time * 8.4 + i * 1.55)) * 0.25 * speakEnergy + Math.max(0, Math.sin(time * 22.0 + i * 1.6)) * 0.65 * Math.max(shockAmount, goofyAmount);
          pushBoxQuads(quads, legXs[i], -2.25 + stepLift, 0, 1.38, 2.50, 1.85, ROGER_ORANGE, null, worldTf, { ...baseOpts, layer: 0 });
        }

        const leftArmLayer = yaw < 0 ? 1 : 4;
        const rightArmLayer = yaw < 0 ? 4 : 1;

        let leftArmAng = -0.08 + Math.sin(time * 3.8) * 0.08 * (0.35 + speakEnergy);
        if (waveLeft > 0.01) leftArmAng = lerp(leftArmAng, -0.82 - Math.sin(time * 14.5) * 0.32, waveLeft);
        pushBoxQuads(quads, -0.82, 0, 0, 1.75, 2.05, 1.95, ROGER_ORANGE,
          { tx: -4.8, ty: 1.55, tz: 0, rx: 0, ry: 0, rz: leftArmAng, sx: 1, sy: 1, sz: 1 },
          worldTf, { ...baseOpts, layer: leftArmLayer });

        let rightArmAng = 0.08 - Math.sin(time * 3.8) * 0.08 * (0.35 + speakEnergy);
        if (waveRight > 0.01) rightArmAng = lerp(rightArmAng, 0.85 + Math.sin(time * 14.5) * 0.34, waveRight);
        pushBoxQuads(quads, 0.82, 0, 0, 1.75, 2.05, 1.95, ROGER_ORANGE,
          { tx: 4.8, ty: 1.55, tz: 0, rx: 0, ry: 0, rz: rightArmAng, sx: 1, sy: 1, sz: 1 },
          worldTf, { ...baseOpts, layer: rightArmLayer });

        pushBoxQuads(quads, 0, 1.85, 0, 9.6, 6.2, 4.1, ROGER_ORANGE, null, worldTf, { ...baseOpts, layer: 2 });

        const eyeZ = 2.26, eyeBaseY = 2.55, shiftX = clamp(lookX, -1, 1) * 0.45;
        for (const side of [-1, 1]) {
          const ex = side * 2.55 + shiftX;
          if (goofyAmount > 0.45) {
            // Mata konyol melotot tidak simetris (1 besar, 1 kecil + pupil miring kocak!)
            const gW = side === -1 ? 1.85 : 1.38;
            const gH = side === -1 ? 2.05 : 1.48;
            pushBoxQuads(quads, ex, eyeBaseY + (side === -1 ? 0.18 : -0.10), eyeZ, gW, gH, 0.60, ROGER_SHINE, null, worldTf, { ...baseOpts, layer: 3 });
            const pxOff = side === -1 ? 0.35 : -0.32;
            const pyOff = side === -1 ? -0.22 : 0.25;
            pushBoxQuads(quads, ex + pxOff, eyeBaseY + pyOff, eyeZ + 0.33, 0.58, 0.62, 0.10, ROGER_EYE, null, worldTf, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true, dimFactor });
          } else if (shockAmount > 0.45) {
            pushBoxQuads(quads, ex, eyeBaseY + 0.10, eyeZ, 1.78, 1.95, 0.60, ROGER_SHINE, null, worldTf, { ...baseOpts, layer: 3 });
            pushBoxQuads(quads, ex, eyeBaseY + 0.10, eyeZ + 0.33, 0.58, 0.64, 0.10, ROGER_EYE, null, worldTf, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true, dimFactor });
          } else if (happyAmount > 0.55) {
            pushBoxQuads(quads, 0, 0, 0, 0.96, 0.40, 0.45, ROGER_EYE,
              { tx: ex - 0.38, ty: eyeBaseY + 0.14, tz: eyeZ, rx: 0, ry: 0, rz: 0.44, sx: 1, sy: 1, sz: 1 }, worldTf, { ...baseOpts, layer: 3 });
            pushBoxQuads(quads, 0, 0, 0, 0.96, 0.40, 0.45, ROGER_EYE,
              { tx: ex + 0.38, ty: eyeBaseY + 0.14, tz: eyeZ, rx: 0, ry: 0, rz: -0.44, sx: 1, sy: 1, sz: 1 }, worldTf, { ...baseOpts, layer: 3 });
          } else {
            const eyeH = lerp(1.54 * (1 + excitedAmount * 0.14), 0.22, blinkAmount);
            pushBoxQuads(quads, ex, eyeBaseY, eyeZ, 1.52, eyeH, 0.58, ROGER_EYE, null, worldTf, { ...baseOpts, layer: 3 });
            if (blinkAmount < 0.40) {
              const ss = 1 + excitedAmount * 0.22;
              pushBoxQuads(quads, ex - 0.32 + shiftX * 0.24, eyeBaseY + 0.32, eyeZ + 0.31, 0.40 * ss, 0.40 * ss, 0.08, ROGER_SHINE, null, worldTf,
                { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
              pushBoxQuads(quads, ex + 0.28 + shiftX * 0.16, eyeBaseY - 0.26, eyeZ + 0.31, 0.22, 0.22, 0.08, ROGER_SHINE, null, worldTf,
                { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.5, unlit: true, dimFactor });
            }
          }
          const browLift = happyAmount * 0.42 + excitedAmount * 0.48;
          const browTilt = side === -1 ? (happyAmount * 0.16 + excitedAmount * 0.18) : (-happyAmount * 0.16 - excitedAmount * 0.18);
          pushBoxQuads(quads, 0, 0, 0, 1.72, 0.30, 0.34, ROGER_BROW,
            { tx: ex, ty: eyeBaseY + 1.24 + browLift, tz: eyeZ + 0.08, rx: 0, ry: 0, rz: browTilt, sx: 1, sy: 1, sz: 1 },
            worldTf, { ...baseOpts, layer: 3.6 });
        }

        if (blushAmount > 0.08) {
          pushBoxQuads(quads, -3.45 + shiftX * 0.35, 1.22, 2.14, 1.15 * blushAmount, 0.46 * blushAmount, 0.14, ROGER_BLUSH, null, worldTf,
            { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.2, unlit: true, dimFactor });
          pushBoxQuads(quads,  3.45 + shiftX * 0.35, 1.22, 2.14, 1.15 * blushAmount, 0.46 * blushAmount, 0.14, ROGER_BLUSH, null, worldTf,
            { faceMask: [1, 0, 0, 0, 0, 0], layer: 3.2, unlit: true, dimFactor });
        }
        return quads;
      }

      // --- MODEL 3D MERRY (GEMINI AGENT · KIRI) ---
      const MERRY_GRID = [
        ".....KKKKKK.....", "...KKGGYYRRKK...", "..KGGGYYORRRRK..", "..KGGCCCCRRRRK..",
        ".KGGCCCCCCCCRRK.", ".KGBBCCCCCCBBBK.", ".KBBWEBBBBWEBBK.", ".KBBEEBBBBEEBBK.",
        "KBBPPBBMMBBPPBBK", "KBBBBBMTTMBBBBBK", "KBBBBBKKKKBBBBBK", "KBBBBK....KBBBBK",
        "KBBBK......KBBBK", "KBBBK......KBBBK", ".KKK........KKK."
      ];
      const MERRY_COLORS = {
        K: hexToRgb("#0c1328"), B: hexToRgb("#1d63ff"), C: hexToRgb("#38bdf8"),
        G: hexToRgb("#22c55e"), Y: hexToRgb("#facc15"), O: hexToRgb("#fb923c"),
        R: hexToRgb("#ef4444"), E: hexToRgb("#090d1c"), W: hexToRgb("#ffffff"),
        P: hexToRgb("#f472b6"), M: hexToRgb("#0a0e1d"), T: hexToRgb("#fb7185")
      };
      const MERRY_RIM    = hexToRgb("#93c5fd");
      const MERRY_RIMDIR = normalize3([-0.75, 0.38, -0.30]);
      const MERRY_ROWS = MERRY_GRID.length, MERRY_COLS = MERRY_GRID[0].length;
      const MERRY_VOXEL_META = [];
      for (let r = 0; r < MERRY_ROWS; r++) {
        for (let c = 0; c < MERRY_COLS; c++) {
          const ch = MERRY_GRID[r][c];
          if (ch === ".") continue;
          const solid = (rr, cc) => rr >= 0 && rr < MERRY_ROWS && cc >= 0 && cc < MERRY_COLS && MERRY_GRID[rr][cc] !== ".";
          MERRY_VOXEL_META.push({
            r, c, ch,
            faceMask: [1, 1, solid(r, c + 1) ? 0 : 1, solid(r, c - 1) ? 0 : 1, solid(r - 1, c) ? 0 : 1, solid(r + 1, c) ? 0 : 1]
          });
        }
      }
      const MERRY_SPARKLES = [
        { ang: 0.4, rad: 6.0, yOff:  3.4, size: 0.65, col: hexToRgb("#facc15"), isPlus: true  },
        { ang: 1.8, rad: 5.4, yOff:  4.0, size: 0.50, col: hexToRgb("#38bdf8"), isPlus: false },
        { ang: 3.1, rad: 5.8, yOff:  0.8, size: 0.52, col: hexToRgb("#22c55e"), isPlus: false },
        { ang: 4.5, rad: 5.6, yOff: -1.4, size: 0.54, col: hexToRgb("#ef4444"), isPlus: false },
        { ang: 5.6, rad: 5.7, yOff:  2.0, size: 0.48, col: hexToRgb("#f472b6"), isPlus: false }
      ];

      function buildMerryQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale, squashX = 1, squashY = 1,
          speakEnergy = 0, wavePhase = 0, blinkAmount = 0,
          happyEyes = 0, shockMode = 0, goofyMode = 0, lookRight = 0, excitedHop = 0, dimFactor = 1
        } = pose;

        const hop = Math.abs(Math.sin(time * 8.2)) * speakEnergy + excitedHop * Math.abs(Math.sin(time * 11.5)) * 0.55;
        const breathe = Math.sin(time * 3.1 + 1.0) * 0.015;
        const worldTf = {
          tx: x, ty: y + hop * 0.44 + Math.sin(time * 3.0 + 0.8) * 0.10, tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale * squashX * (1 + hop * 0.05 - breathe * 0.4),
          sy: scale * squashY * (1 - hop * 0.04 + breathe),
          sz: scale * (1 + hop * 0.03)
        };

        const vSize = 0.62, vDepth = 2.60;
        const mouthOpen = (shockMode > 0.4 || goofyMode > 0.4) ? true : (speakEnergy > 0.10 ? (Math.sin(time * 18.0) > -0.22) : (happyEyes > 0.5));
        const eyesClosed = blinkAmount > 0.55;

        for (let i = 0; i < MERRY_VOXEL_META.length; i++) {
          const vm = MERRY_VOXEL_META[i];
          let ch = vm.ch;
          const isL = (vm.r === 6 || vm.r === 7) && (vm.c === 4 || vm.c === 5);
          const isR = (vm.r === 6 || vm.r === 7) && (vm.c === 10 || vm.c === 11);
          if (isL || isR) {
            if (eyesClosed) ch = (vm.r === 7) ? "E" : "B";
            else if (goofyMode > 0.45) {
              // Mata derpy konyol (kiri melirik kanan, kanan melirik kiri = juling lucu!)
              if (isL)  ch = (vm.r === 6 && vm.c === 4) ? "W" : ((vm.r === 7 && vm.c === 5) ? "E" : "W");
              if (isR) ch = (vm.r === 6 && vm.c === 11) ? "W" : ((vm.r === 7 && vm.c === 10) ? "E" : "W");
            } else if (shockMode > 0.45) {
              // Mata melotot kaget (O_O)
              ch = ((vm.r === 6 && (vm.c === 4 || vm.c === 10)) || (vm.r === 7 && (vm.c === 5 || vm.c === 11))) ? "W" : "E";
            } else if (happyEyes > 0.55) {
              if (isL) ch = (vm.r === 6 && vm.c === 5) || (vm.r === 7 && vm.c === 4) ? "E" : "B";
              if (isR) ch = (vm.r === 6 && vm.c === 10) || (vm.r === 7 && vm.c === 11) ? "E" : "B";
            } else if (lookRight > 0.50) {
              ch = (vm.r === 6 && (vm.c === 5 || vm.c === 11)) ? "W" : "E";
            }
          }
          if (!mouthOpen && (ch === "M" || ch === "T")) ch = (vm.r === 8 && (vm.c === 7 || vm.c === 8)) ? "M" : "B";

          const vx = (vm.c - (MERRY_COLS - 1) / 2) * vSize;
          const vy = ((MERRY_ROWS - 1) / 2 - vm.r) * vSize + 1.15;
          pushBoxQuads(quads, vx, vy, 0, vSize, vSize, vDepth, MERRY_COLORS[ch], null, worldTf, {
            faceMask: vm.faceMask, rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: 1, strokeSame: true
          });
        }

        let armAng = 0.10 + Math.sin(time * 3.8) * 0.10;
        if (wavePhase > 0.01) armAng = lerp(armAng, 0.65 + Math.sin(time * 16.5) * 0.40, wavePhase);
        const handTf = { tx: 4.32, ty: 1.25, tz: 0, rx: 0, ry: 0, rz: armAng, sx: 1, sy: 1, sz: 1 };
        const handLayer = yaw > 0.45 ? 0 : 2;
        pushBoxQuads(quads, 0.45, 0.0, 0, 0.70, 0.70, 1.30, MERRY_COLORS.K, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });
        pushBoxQuads(quads, 0.96, 0.54, 0, 0.70, 0.70, 1.30, MERRY_COLORS.W, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });
        pushBoxQuads(quads, 1.36, 1.02, 0, 0.66, 0.66, 1.30, MERRY_COLORS.K, handTf, worldTf, { rimRgb: MERRY_RIM, rimDir: MERRY_RIMDIR, dimFactor, layer: handLayer });

        const orbitSpeed = 0.75 + speakEnergy * 1.15 + excitedHop * 0.90;
        for (let i = 0; i < MERRY_SPARKLES.length; i++) {
          const sp = MERRY_SPARKLES[i];
          const a = sp.ang + time * orbitSpeed;
          const spZ = z + Math.sin(a) * (sp.rad * 0.50) * scale;
          const spLayer = spZ < z ? 0 : 3;
          const spTf = {
            tx: x + Math.cos(a) * sp.rad * scale,
            ty: y + (sp.yOff + Math.sin(time * 4.0 + i * 1.3) * 0.38) * scale + 1.0,
            tz: spZ, rx: time * 1.5 + i, ry: time * 1.9 + i, rz: 0,
            sx: scale, sy: scale, sz: scale
          };
          if (sp.isPlus) {
            pushBoxQuads(quads, 0, 0, 0, sp.size * 2.1, sp.size * 0.66, sp.size * 0.66, sp.col, null, spTf, { dimFactor, layer: spLayer });
            pushBoxQuads(quads, 0, 0, 0, sp.size * 0.66, sp.size * 2.1, sp.size * 0.66, sp.col, null, spTf, { dimFactor, layer: spLayer });
          } else {
            pushBoxQuads(quads, 0, 0, 0, sp.size, sp.size, sp.size, sp.col, null, spTf, { dimFactor, layer: spLayer });
          }
        }
        return quads;
      }


      // =======================================================================
      // 5. MASKOT 3D BARU: "THE BOSS (JULL)" — PIXEL/VOXEL ART MIRIP FOTO ASLI!
      //    - Rambut keriting afro-taper hitam tebal bertekstur (24 cluster curls!)
      //    - Kulit sawo matang hangat (#c78d63) + alis tebal + telinga
      //    - Kaos oversized putih-krim (#edece5) + Kalung Rantai Silver & Liontin Salib/Bintang!
      //    - Tangan kiri pegang HP biru-slate 3 kamera (Easter Egg foto asli!)
      //    - Tangan kanan menunjuk/memanggil dari palka roket ("WOI KALIAN, CEPET BALIK!")
      // =======================================================================
      const BOSS_SKIN       = hexToRgb("#c78d63");
      const BOSS_SKIN_SHAD  = hexToRgb("#a86e47");
      const BOSS_HAIR_DARK  = hexToRgb("#16151b");
      const BOSS_HAIR_CURL  = hexToRgb("#25232e");
      const BOSS_HAIR_HI    = hexToRgb("#322f3d");
      const BOSS_SHIRT      = hexToRgb("#edece5");
      const BOSS_SHIRT_RIB  = hexToRgb("#d6d4ca");
      const BOSS_CHAIN      = hexToRgb("#cfd7e3");
      const BOSS_PENDANT    = hexToRgb("#f7faff");
      const BOSS_PHONE_CASE = hexToRgb("#5b6b84");
      const BOSS_PHONE_CAM  = hexToRgb("#262b36");
      const BOSS_RIM        = hexToRgb("#ffe3b3");
      const BOSS_RIM_DIR    = normalize3([0.60, 0.50, -0.35]);

      // Cluster 3D Voxel Curls untuk membentuk rambut afro-taper khas Jull!
      const BOSS_HAIR_TUFTS = [
        // Barisan depan-atas (volume penuh di atas kening!)
        { x: -2.9, y: 6.1, z:  2.2, s: 1.55, c: 0 },
        { x: -1.5, y: 6.5, z:  2.3, s: 1.70, c: 1 },
        { x:  0.0, y: 6.6, z:  2.4, s: 1.78, c: 0 },
        { x:  1.5, y: 6.5, z:  2.3, s: 1.70, c: 1 },
        { x:  2.9, y: 6.1, z:  2.1, s: 1.55, c: 0 },
        // Puncak tengah tebal bergelombang
        { x: -3.2, y: 6.5, z:  0.5, s: 1.75, c: 1 },
        { x: -1.6, y: 7.0, z:  0.6, s: 1.95, c: 2 },
        { x:  0.1, y: 7.1, z:  0.5, s: 2.00, c: 1 },
        { x:  1.7, y: 6.9, z:  0.6, s: 1.90, c: 0 },
        { x:  3.2, y: 6.4, z:  0.4, s: 1.75, c: 1 },
        // Barisan belakang atas
        { x: -2.8, y: 6.2, z: -1.4, s: 1.70, c: 0 },
        { x: -1.1, y: 6.6, z: -1.6, s: 1.85, c: 1 },
        { x:  0.8, y: 6.6, z: -1.6, s: 1.85, c: 0 },
        { x:  2.6, y: 6.1, z: -1.4, s: 1.70, c: 1 },
        // Samping kiri-kanan atas (tapered curly sides!)
        { x: -3.85, y: 5.0, z:  1.1, s: 1.38, c: 1 },
        { x: -3.95, y: 4.8, z: -0.5, s: 1.45, c: 0 },
        { x: -3.65, y: 3.7, z: -0.8, s: 1.15, c: 1 },
        { x:  3.85, y: 5.0, z:  1.1, s: 1.38, c: 1 },
        { x:  3.95, y: 4.8, z: -0.5, s: 1.45, c: 0 },
        { x:  3.65, y: 3.7, z: -0.8, s: 1.15, c: 1 },
        // Bagian belakang leher / tengkuk
        { x: -1.8, y: 4.2, z: -2.8, s: 1.65, c: 0 },
        { x:  0.0, y: 4.4, z: -2.9, s: 1.75, c: 1 },
        { x:  1.8, y: 4.2, z: -2.8, s: 1.65, c: 0 }
      ];

      function buildBossJullQuads(time, pose) {
        const quads = [];
        const {
          x, y, z, yaw, pitch, roll, scale,
          shoutAmt = 0, mouthOpen = 0, waveRight = 0, coolSmirk = 0, nodBump = 0
        } = pose;

        const shoutShake = shoutAmt * Math.sin(time * 34.0) * 0.08;
        const bob = Math.sin(time * 3.4) * 0.12 + shoutAmt * Math.abs(Math.sin(time * 10.0)) * 0.22 + nodBump * 0.45;

        const worldTf = {
          tx: x + shoutShake, ty: y + bob, tz: z,
          rx: pitch, ry: yaw, rz: roll,
          sx: scale, sy: scale, sz: scale
        };
        const baseOpts = { rimRgb: BOSS_RIM, rimDir: BOSS_RIM_DIR, layer: 2 };

        // 1. BADAN — KAOS OVERSIZED PUTIH-KRIM + KERAH + KALUNG RANTAI SILVER & LIONTIN!
        pushBox(quads, 0, -1.10, 0, 7.20, 4.80, 4.10, BOSS_SHIRT, [worldTf], baseOpts);
        // Kerah crewneck
        pushBox(quads, 0,  1.18, 0.14, 4.20, 0.56, 3.60, BOSS_SHIRT_RIB, [worldTf], baseOpts);
        // Leher sawo matang
        pushBox(quads, 0,  1.58, 0.05, 2.75, 0.90, 2.50, BOSS_SKIN_SHAD, [worldTf], baseOpts);

        // Kalung Rantai Silver (U-shape) + Liontin Salib/Bintang khas foto Jull!
        const chainOpts = { ...baseOpts, layer: 2.5, unlit: true };
        pushBox(quads, -1.25, 0.52, 2.12, 0.18, 1.35, 0.10, BOSS_CHAIN, [{ tx: 0, ty: 0, tz: 0, rx: 0, ry: 0, rz: 0.34, sx: 1, sy: 1, sz: 1 }, worldTf], chainOpts);
        pushBox(quads,  1.25, 0.52, 2.12, 0.18, 1.35, 0.10, BOSS_CHAIN, [{ tx: 0, ty: 0, tz: 0, rx: 0, ry: 0, rz: -0.34, sx: 1, sy: 1, sz: 1 }, worldTf], chainOpts);
        pushBox(quads,  0.00, -0.20, 2.14, 1.65, 0.18, 0.10, BOSS_CHAIN, [worldTf], chainOpts);
        // Liontin silver kecil (cross/star)
        pushBox(quads,  0.00, -0.78, 2.18, 0.24, 0.92, 0.12, BOSS_PENDANT, [worldTf], chainOpts);
        pushBox(quads,  0.00, -0.68, 2.18, 0.66, 0.22, 0.12, BOSS_PENDANT, [worldTf], chainOpts);

        // 2. TANGAN KIRI — Lengan Oversized Putih + Memegang iPhone Biru-Slate 3 Kamera!
        const lArmRx = -0.95 + Math.sin(time * 3.0) * 0.06;
        const lArmRz =  0.22;
        const lSh = { tx: -4.45, ty: 0.45, tz: 0.20, rx: lArmRx, ry: 0, rz: lArmRz, sx: 1, sy: 1, sz: 1 };
        pushBox(quads, 0, -1.05, 0, 2.05, 2.35, 2.10, BOSS_SHIRT, [lSh, worldTf], baseOpts);
        pushBox(quads, 0, -2.65, 0, 1.35, 1.45, 1.35, BOSS_SKIN,  [lSh, worldTf], baseOpts);
        // iPhone Biru-Slate 3 Kamera di tangan kiri!
        const phTf = { tx: 0.25, ty: -3.20, tz: 0.55, rx: 1.05, ry: 0.20, rz: -0.18, sx: 1, sy: 1, sz: 1 };
        pushBox(quads, 0, 0, 0, 1.65, 2.85, 0.28, BOSS_PHONE_CASE, [phTf, lSh, worldTf], { ...baseOpts, layer: 2.6 });
        pushBox(quads, -0.34, 0.85, 0.16, 0.72, 0.78, 0.08, BOSS_PHONE_CAM, [phTf, lSh, worldTf], { ...baseOpts, layer: 2.7 });

        // 3. TANGAN KANAN — Menunjuk/Melambai Memanggil Trio ("WOI CEPET BALIK!")
        const rArmRx = shoutAmt > 0.2
          ? (-1.28 - Math.sin(time * 14.0) * 0.22)
          : lerp(-0.55, -1.35 - Math.sin(time * 11.0) * 0.20, waveRight);
        const rArmRz = shoutAmt > 0.2 ? 0.36 : lerp(0.18, 0.48, waveRight);
        const rSh = { tx: 4.45, ty: 0.45, tz: 0.20, rx: rArmRx, ry: 0, rz: rArmRz, sx: 1, sy: 1, sz: 1 };
        pushBox(quads, 0, -1.05, 0, 2.05, 2.35, 2.10, BOSS_SHIRT, [rSh, worldTf], baseOpts);
        pushBox(quads, 0, -2.65, 0, 1.35, 1.45, 1.35, BOSS_SKIN,  [rSh, worldTf], baseOpts);

        // 4. KEPALA + TELINGA + RAMBUT KERITING AFRO-TAPER + WAJAH BOSS JULL
        const headTf = {
          tx: 0, ty: 1.45, tz: 0,
          rx: shoutAmt * 0.14 - coolSmirk * 0.06,
          ry: Math.sin(time * 2.2) * 0.08,
          rz: shoutAmt * Math.sin(time * 14.0) * 0.05 + coolSmirk * 0.06,
          sx: 1, sy: 1, sz: 1
        };
        const headChain = [headTf, worldTf];

        // Kubus kepala sawo matang
        pushBox(quads, 0, 3.00, 0, 6.90, 5.75, 5.65, BOSS_SKIN, headChain, baseOpts);
        // Telinga kiri & kanan
        pushBox(quads, -3.62, 2.65, -0.10, 0.52, 1.38, 0.92, BOSS_SKIN_SHAD, headChain, baseOpts);
        pushBox(quads,  3.62, 2.65, -0.10, 0.52, 1.38, 0.92, BOSS_SKIN_SHAD, headChain, baseOpts);

        // Basis rambut gelap atas-belakang + 23 Cluster Keriting Afro-Taper 3D!
        pushBox(quads, 0, 5.75, -0.15, 7.10, 1.35, 5.95, BOSS_HAIR_DARK, headChain, baseOpts);
        const hairCols = [BOSS_HAIR_DARK, BOSS_HAIR_CURL, BOSS_HAIR_HI];
        for (let i = 0; i < BOSS_HAIR_TUFTS.length; i++) {
          const t = BOSS_HAIR_TUFTS[i];
          pushBox(quads, t.x, t.y, t.z, t.s, t.s * 0.92, t.s, hairCols[t.c], headChain, baseOpts);
        }

        // WAJAH BOSS JULL (Layer 3+)
        const eyeZ = 2.92, eyeY = 3.02;
        for (const side of [-1, 1]) {
          const ex = side * 1.56;
          // Mata tegas & cool
          const eyeH = shoutAmt > 0.3 ? 1.58 : 1.42;
          pushBox(quads, ex, eyeY, eyeZ, 1.12, eyeH, 0.22, EYE_DARK, headChain, { ...baseOpts, layer: 3, unlit: true });
          pushBox(quads, ex - 0.18, eyeY + 0.30, eyeZ + 0.14, 0.30, 0.30, 0.04, SHINE_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.5, unlit: true });

          // Alis tebal khas foto Jull (menukik tegas saat teriak "WOI!", santai miring saat cool smirk!)
          const bLift = shoutAmt > 0.3 ? -0.10 : (side === 1 ? 0.28 : 0.12);
          const bTilt = shoutAmt > 0.3 ? (side === -1 ? -0.34 : 0.34) : (side === -1 ? -0.08 : -0.12);
          const browTf = { tx: ex, ty: eyeY + 1.12 + bLift, tz: eyeZ + 0.12, rx: 0, ry: 0, rz: bTilt, sx: 1, sy: 1, sz: 1 };
          pushBox(quads, 0, 0, 0, 1.54, 0.34, 0.24, BOSS_HAIR_DARK, [browTf, headTf, worldTf], { ...baseOpts, layer: 3.6 });
        }

        // Hidung mungil berbayang hangat
        pushBox(quads, 0, 2.22, eyeZ + 0.10, 0.62, 0.56, 0.26, BOSS_SKIN_SHAD, headChain, { ...baseOpts, layer: 3.1 });

        // Mulut Lip-Sync (Teriak lebar dengan gigi & lidah saat memanggil Trio -> Smirk cool setelahnya!)
        const mY = 1.30;
        if (shoutAmt > 0.2) {
          const mH = lerp(0.32, 1.24, Math.max(0.35, mouthOpen));
          const mW = lerp(1.52, 1.75, mouthOpen);
          pushBox(quads, 0, mY, eyeZ + 0.04, mW, mH, 0.16, MOUTH_CAVITY, headChain, { ...baseOpts, layer: 3.2, unlit: true });
          pushBox(quads, 0, mY + mH * 0.32, eyeZ + 0.13, mW * 0.86, 0.26, 0.04, TEETH_WHITE, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.35, unlit: true });
          pushBox(quads, 0, mY - mH * 0.26, eyeZ + 0.13, mW * 0.62, mH * 0.36, 0.04, TONGUE_PINK, headChain, { faceMask: [1,0,0,0,0,0], layer: 3.32, unlit: true });
        } else {
          // Cool confident smirk khas Jull
          const smTf = { tx: 0.14, ty: mY + 0.05, tz: eyeZ + 0.04, rx: 0, ry: 0, rz: 0.12, sx: 1, sy: 1, sz: 1 };
          pushBox(quads, 0, 0, 0, 1.38, 0.26, 0.12, BROW_DARK, [smTf, headTf, worldTf], { ...baseOpts, layer: 3.2, unlit: true });
        }

        return quads;
      }

      // =======================================================================
      // 6. INSTAGRAM PROFILE CARD (REFERENSI image_188ffc.jpg · TANPA "Followed by")
      //    - Header `< julljhaa ...`
      //    - Foto profil `profile.jpeg` dalam ring pelangi IG
      //    - `jull` · 5 posts · 10,1K followers · 492 following
      //    - `Personal blog`, 🎸🎸, `🔗 github.com/rjoulfiand-afk` (bisa di-highlight!)
      //    - Tombol biru **`Follow`** -> auto-klik -> **`Following ✓`**!
      // =======================================================================
      function drawIGProfileCard(time, alpha, followClickP, isFollowing, githubHighlight, cursorPt, cursorAlpha) {
        if (alpha <= 0.01) return;
        const x = 64, y = 342, w = 952, h = 496;

        ctx.save();
        ctx.globalAlpha *= alpha;

        // Card putih bersih IG (elevated shadow)
        ctx.shadowColor = "rgba(0, 0, 0, 0.68)"; ctx.shadowBlur = 44; ctx.shadowOffsetY = 16;
        roundRect(ctx, x, y, w, h, 26);
        ctx.fillStyle = "#ffffff"; ctx.fill();
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

        ctx.lineWidth = 2.0;
        ctx.strokeStyle = isFollowing ? "#ebb343" : "rgba(255, 255, 255, 0.25)";
        ctx.stroke();

        // 1. Top Nav Bar (`<  julljhaa  ...`)
        const navY = y + 38;
        ctx.strokeStyle = "#111114"; ctx.lineWidth = 3.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x + 42, navY - 12); ctx.lineTo(x + 28, navY); ctx.lineTo(x + 42, navY + 12);
        ctx.stroke();

        ctx.font = "800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#111114"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillText("julljhaa", x + 76, navY + 1);

        // Titik tiga `...` di kanan
        ctx.fillStyle = "#111114";
        for (let i = 0; i < 3; i++) {
          ctx.beginPath(); ctx.arc(x + w - 58 + i * 11, navY, 3.2, 0, Math.PI * 2); ctx.fill();
        }

        // 2. Profile Picture (`profile.jpeg` + Rainbow IG Story Ring!)
        const avX = x + 114, avY = y + 162, avR = 72;
        const ringGrad = ctx.createLinearGradient(avX - avR, avY + avR, avX + avR, avY - avR);
        ringGrad.addColorStop(0.0, "#feda75");
        ringGrad.addColorStop(0.28, "#fa7e1e");
        ringGrad.addColorStop(0.55, "#d62976");
        ringGrad.addColorStop(0.82, "#962fbf");
        ringGrad.addColorStop(1.0, "#4f5bd5");

        ctx.beginPath(); ctx.arc(avX, avY, avR + 9, 0, Math.PI * 2);
        ctx.strokeStyle = ringGrad; ctx.lineWidth = 5.5; ctx.stroke();

        ctx.beginPath(); ctx.arc(avX, avY, avR + 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.fill();

        ctx.save();
        ctx.beginPath(); ctx.arc(avX, avY, avR, 0, Math.PI * 2); ctx.clip();
        if (profilePhotoReady && profilePhoto.naturalWidth > 0) {
          const iw = profilePhoto.naturalWidth, ih = profilePhoto.naturalHeight;
          const sz = Math.min(iw, ih);
          ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
          ctx.drawImage(profilePhoto, (iw - sz) / 2, (ih - sz) * 0.16, sz, sz, avX - avR, avY - avR, avR * 2, avR * 2);
        } else {
          // Fallback keren bergaya warna foto Jull jika file profile.jpeg belum ditaruh
          const fg = ctx.createLinearGradient(avX - avR, avY - avR, avX + avR, avY + avR);
          fg.addColorStop(0, "#23252f"); fg.addColorStop(1, "#3b3530");
          ctx.fillStyle = fg; ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
          ctx.fillStyle = "#c78d63"; ctx.beginPath(); ctx.arc(avX, avY - 12, 24, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#17161b"; ctx.beginPath(); ctx.arc(avX, avY - 26, 25, Math.PI, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#edece5"; ctx.beginPath(); ctx.arc(avX, avY + 56, 44, Math.PI, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        // 3. Name "jull" + 3 Stats (5 posts | 10,1K followers | 492 following)
        const stX = x + 236;
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.font = "800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#111114";
        ctx.fillText("jull", stX, y + 114);

        const stats = [
          { num: "5",     lbl: "posts",     dx: 0   },
          { num: "10,1K", lbl: "followers", dx: 190 },
          { num: "492",   lbl: "following", dx: 416 }
        ];
        for (let i = 0; i < stats.length; i++) {
          const sx = stX + stats[i].dx;
          const bump = (i === 1 && followClickP > 0.35 && followClickP < 1.0)
            ? 1 + Math.sin(((followClickP - 0.35) / 0.65) * Math.PI) * 0.14 : 1.0;
          ctx.save();
          ctx.translate(sx, y + 162);
          ctx.scale(bump, bump);
          ctx.font = "800 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = (i === 1 && isFollowing) ? "#4a5df9" : "#111114";
          ctx.fillText(stats[i].num, 0, 0);
          ctx.font = "500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = "#3a3a42";
          ctx.fillText(stats[i].lbl, 0, 32);
          ctx.restore();
        }

        // 4. Bio ("Personal blog", 🎸🎸, 🔗 github.com/rjoulfiand-afk — TANPA "Followed by"!)
        const bioX = x + 40;
        ctx.font = "500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#73737a";
        ctx.fillText("Personal blog", bioX, y + 278);

        ctx.font = "24px 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif";
        ctx.fillText("🎸🎸", bioX, y + 314);

        // Link GitHub dengan highlight golden glow saat Beat 3 ("Link GitHub juga ada di bio-nya")!
        const linkY = y + 356;
        if (githubHighlight > 0.02) {
          ctx.save();
          ctx.globalAlpha *= githubHighlight;
          roundRect(ctx, bioX - 14, linkY - 24, 470, 48, 12);
          ctx.fillStyle = "rgba(235, 179, 67, 0.22)"; ctx.fill();
          ctx.lineWidth = 2.4; ctx.strokeStyle = "#d99b1e"; ctx.stroke();
          ctx.restore();
        }

        // Ikon Link + URL GitHub
        ctx.save();
        ctx.translate(bioX + 12, linkY);
        ctx.rotate(-Math.PI / 4);
        ctx.strokeStyle = "#1d4ed8"; ctx.lineWidth = 2.6;
        roundRect(ctx, -11, -5, 14, 10, 5); ctx.stroke();
        roundRect(ctx, -3, -5, 14, 10, 5); ctx.stroke();
        ctx.restore();

        ctx.font = "700 23px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#1d4ed8";
        ctx.fillText("github.com/rjoulfiand-afk", bioX + 36, linkY + 1);

        // 5. BUTTONS ROW (`Follow` -> `Following ✓`, `Message`, `[+👤]`)
        const btnY = y + 402, btnH = 68;
        const fX = x + 36, fW = 398;
        const pressSc = (followClickP > 0 && followClickP < 0.7)
          ? 1 - Math.sin((followClickP / 0.7) * Math.PI) * 0.075 : 1.0;

        // Tombol FOLLOW / FOLLOWING
        ctx.save();
        ctx.translate(fX + fW / 2, btnY + btnH / 2);
        ctx.scale(pressSc, pressSc);
        if (!isFollowing) {
          ctx.shadowColor = "rgba(74, 93, 249, 0.35)"; ctx.shadowBlur = 18;
        }
        roundRect(ctx, -fW / 2, -btnH / 2, fW, btnH, 14);
        ctx.fillStyle = isFollowing ? "#eef0f5" : "#4a5df9";
        ctx.fill();
        ctx.shadowBlur = 0;
        if (isFollowing) {
          ctx.lineWidth = 1.6; ctx.strokeStyle = "#cbd2e0"; ctx.stroke();
        }
        ctx.font = "800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = isFollowing ? "#111114" : "#ffffff";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(isFollowing ? "Following ✓" : "Follow", 0, 1);
        ctx.restore();

        // Click Ripple & Confetti Sparkles saat tombol Follow terklik!
        if (followClickP > 0.15 && followClickP < 0.98) {
          const rp = (followClickP - 0.15) / 0.83;
          ctx.save();
          ctx.globalAlpha = (1 - rp) * 0.85;
          ctx.beginPath();
          ctx.arc(fX + fW / 2, btnY + btnH / 2, 24 + easeOutCubic(rp) * 110, 0, Math.PI * 2);
          ctx.strokeStyle = "#4a5df9"; ctx.lineWidth = 3.2; ctx.stroke();

          for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2 + 0.25;
            const d = 30 + easeOutCubic(rp) * 95;
            const px = fX + fW / 2 + Math.cos(ang) * d;
            const py = btnY + btnH / 2 + Math.sin(ang) * d * 0.6;
            ctx.fillStyle = i % 3 === 0 ? "#ebb343" : (i % 3 === 1 ? "#4a5df9" : "#e07a5f");
            roundRect(ctx, px - 5, py - 5, 10, 10, 3); ctx.fill();
          }
          ctx.restore();
        }

        // Tombol Message
        const mX = fX + fW + 14, mW = 390;
        roundRect(ctx, mX, btnY, mW, btnH, 14);
        ctx.fillStyle = "#efefef"; ctx.fill();
        ctx.font = "700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#111114"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("Message", mX + mW / 2, btnY + btnH / 2 + 1);

        // Tombol Add-Friend `[+👤]`
        const aX = mX + mW + 14, aW = 64;
        roundRect(ctx, aX, btnY, aW, btnH, 14);
        ctx.fillStyle = "#efefef"; ctx.fill();
        ctx.strokeStyle = "#111114"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(aX + 35, btnY + 26, 7.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(aX + 35, btnY + 47, 13, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(aX + 14, btnY + 34); ctx.lineTo(aX + 24, btnY + 34);
        ctx.moveTo(aX + 19, btnY + 29); ctx.lineTo(aX + 19, btnY + 39);
        ctx.stroke();

        // Pointer Kursor Halus yang mengklik tombol Follow!
        if (cursorAlpha > 0.02 && cursorPt) {
          ctx.save();
          ctx.globalAlpha *= cursorAlpha;
          ctx.translate(cursorPt.x, cursorPt.y);
          const tapS = 1 - Math.sin(clamp(followClickP / 0.5, 0, 1) * Math.PI) * 0.16;
          ctx.scale(tapS, tapS);
          ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(0, 38); ctx.lineTo(11, 28); ctx.lineTo(20, 44);
          ctx.lineTo(27, 40); ctx.lineTo(18, 24); ctx.lineTo(31, 24); ctx.closePath();
          ctx.fillStyle = "#ffffff"; ctx.fill();
          ctx.strokeStyle = "#111114"; ctx.lineWidth = 2.6; ctx.lineJoin = "round"; ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
      }

      // =======================================================================
      // 7. PREMIUM EXECUTIVE ORBITAL DROPSHIP (ZERO TINY TEXT · ZERO CARTOON OUTLINES!)
      //    Siluet Aerospace Modern-Sleek: Pearl Ceramic Titanium + Deep Carbon Slate +
      //    Brushed Champagne Gold + Blended Delta Wings + Flush Nacelle Boosters +
      //    3-LED Crew Boarding Bar + Panoramic Energy Airlock + Plasma Shock Diamonds!
      // =======================================================================
      function drawOrbitalDropshipBack(rx, ry, time, thrustPower, hatchOpen, joltY, crewBoarded, absorbFlash) {
        const cx = rx, cy = ry + joltY;
        ctx.save();

        // ---------------------------------------------------------------------
        // 1. VOLUMETRIC TRIPLE PLASMA THRUSTERS + MACH SHOCK DIAMONDS + SPARKS
        // ---------------------------------------------------------------------
        if (thrustPower > 0.05) {
          const drawPlasmaJet = (px, py, baseW, baseLen, isMain) => {
            const f1 = Math.sin(time * 66.0 + px * 0.12) * 14;
            const f2 = Math.cos(time * 47.0 - px * 0.08) * 7;
            const len = (baseLen + f1 + f2) * thrustPower;
            const w   = baseW * (0.84 + 0.26 * thrustPower);

            // Soft volumetric exhaust bloom
            const bg = ctx.createRadialGradient(px, py + 16, 4, px, py + len * 0.45, len * 1.25);
            if (isMain) {
              bg.addColorStop(0.0, "rgba(255, 232, 160, 0.56)");
              bg.addColorStop(0.45, "rgba(235, 134, 52, 0.22)");
              bg.addColorStop(1.0, "rgba(0, 0, 0, 0)");
            } else {
              bg.addColorStop(0.0, "rgba(125, 211, 252, 0.52)");
              bg.addColorStop(0.45, "rgba(59, 130, 246, 0.20)");
              bg.addColorStop(1.0, "rgba(0, 0, 0, 0)");
            }
            ctx.fillStyle = bg;
            ctx.fillRect(px - len * 1.3, py - 14, len * 2.6, len * 1.7);

            const drawCone = (cw, cl, col, alpha = 1) => {
              ctx.save();
              ctx.globalAlpha *= alpha;
              ctx.fillStyle = col;
              ctx.beginPath();
              ctx.moveTo(px - cw, py);
              ctx.bezierCurveTo(px - cw * 0.85, py + cl * 0.42, px - cw * 0.28, py + cl * 0.82, px, py + cl);
              ctx.bezierCurveTo(px + cw * 0.28, py + cl * 0.82, px + cw * 0.85, py + cl * 0.42, px + cw, py);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            };

            if (isMain) {
              drawCone(w * 1.12, len * 1.06, "#d9462f", 0.72);
              drawCone(w * 0.82, len * 0.86, "#f58232", 0.92);
              drawCone(w * 0.52, len * 0.62, "#ffd15c", 0.98);
              drawCone(w * 0.27, len * 0.36, "#ffffff", 1.00);
              // Mach shock diamonds
              for (let d = 0; d < 3; d++) {
                const dy = py + 20 + d * 24 + ((time * 130) % 12);
                if (dy < py + len * 0.72) {
                  ctx.fillStyle = `rgba(255, 252, 235, ${(0.78 - d * 0.20).toFixed(2)})`;
                  ctx.beginPath();
                  ctx.ellipse(px, dy, w * (0.28 - d * 0.06), 3.2, 0, 0, Math.PI * 2);
                  ctx.fill();
                }
              }
            } else {
              drawCone(w * 1.06, len * 1.04, "#2563eb", 0.68);
              drawCone(w * 0.74, len * 0.82, "#38bdf8", 0.92);
              drawCone(w * 0.38, len * 0.48, "#f0f9ff", 1.00);
            }

            // Drifting glowing embers/sparks
            for (let s = 0; s < (isMain ? 7 : 3); s++) {
              const sp = ((time * (2.6 + (s % 3) * 0.4) + s * 0.27) % 1);
              const sx = px + Math.sin(s * 5.1 + sp * 7.0) * (w * 0.75 + sp * 18);
              const sy = py + 12 + sp * (len * 1.25);
              ctx.fillStyle = isMain ? (s % 2 === 0 ? "#ffe07d" : "#ff8c42") : "#bae6fd";
              ctx.globalAlpha = (1 - sp) * 0.85;
              const sz = lerp(4.2, 1.4, sp);
              ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
            }
            ctx.globalAlpha = 1;
          };

          drawPlasmaJet(cx - 122, cy + 194, 18, 62, false);
          drawPlasmaJet(cx + 122, cy + 194, 18, 62, false);
          drawPlasmaJet(cx,       cy + 206, 44, 108, true);
        }

        // ---------------------------------------------------------------------
        // 2. BLENDED AERODYNAMIC DELTA WINGS (Smooth Curved Sweep, Zero Flat Outlines!)
        // ---------------------------------------------------------------------
        const drawSleekWing = (dir) => {
          ctx.beginPath();
          ctx.moveTo(cx + dir * 94, cy - 18);
          ctx.bezierCurveTo(cx + dir * 138, cy + 48, cx + dir * 194, cy + 108, cx + dir * 210, cy + 174);
          ctx.quadraticCurveTo(cx + dir * 212, cy + 196, cx + dir * 192, cy + 194);
          ctx.lineTo(cx + dir * 116, cy + 168);
          ctx.lineTo(cx + dir * 92,  cy + 166);
          ctx.closePath();

          const wg = ctx.createLinearGradient(cx + dir * 94, cy - 18, cx + dir * 210, cy + 194);
          if (dir === -1) {
            wg.addColorStop(0.0, "#3b4257");
            wg.addColorStop(0.55, "#232838");
            wg.addColorStop(1.0, "#131620");
          } else {
            wg.addColorStop(0.0, "#262b3b");
            wg.addColorStop(0.55, "#191c28");
            wg.addColorStop(1.0, "#0e1017");
          }
          ctx.fillStyle = wg; ctx.fill();

          // Specular leading-edge brushed gold pinstripe
          ctx.strokeStyle = dir === -1 ? "rgba(235, 179, 67, 0.72)" : "rgba(235, 179, 67, 0.42)";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(cx + dir * 102, cy + 4);
          ctx.bezierCurveTo(cx + dir * 144, cy + 62, cx + dir * 192, cy + 114, cx + dir * 206, cy + 170);
          ctx.stroke();

          // Subtle recessed titanium panel on wing
          ctx.beginPath();
          ctx.moveTo(cx + dir * 136, cy + 88);
          ctx.lineTo(cx + dir * 184, cy + 158);
          ctx.lineTo(cx + dir * 142, cy + 150);
          ctx.closePath();
          ctx.fillStyle = "rgba(255, 255, 255, 0.045)";
          ctx.fill();

          // Wingtip nav strobe LED
          const blink = 0.55 + 0.45 * Math.sin(time * 8.0 + dir * 1.4);
          ctx.save();
          ctx.fillStyle = dir === -1 ? "#ff6b6b" : "#5ce6a0";
          ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14 * blink;
          ctx.beginPath(); ctx.arc(cx + dir * 203, cy + 183, 4.2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        };
        drawSleekWing(-1);
        drawSleekWing(1);

        // ---------------------------------------------------------------------
        // 3. FLUSH-MOUNTED TEARDROP SIDE BOOSTER NACELLES (Tucked Cleanly into Hull!)
        // ---------------------------------------------------------------------
        const drawFlushNacelle = (dir) => {
          const nx = cx + dir * 122;

          // Engine bell
          ctx.beginPath();
          ctx.moveTo(nx - 16, cy + 174); ctx.lineTo(nx + 16, cy + 174);
          ctx.lineTo(nx + 22, cy + 196); ctx.lineTo(nx - 22, cy + 196);
          ctx.closePath();
          const ng = ctx.createLinearGradient(nx - 22, 0, nx + 22, 0);
          ng.addColorStop(0, "#1d212d"); ng.addColorStop(0.38, "#565f78"); ng.addColorStop(1, "#12141c");
          ctx.fillStyle = ng; ctx.fill();

          // Teardrop metallic pod
          const tracePod = () => {
            ctx.beginPath();
            ctx.moveTo(nx, cy - 8);
            ctx.bezierCurveTo(nx + 24, cy + 20, nx + 26, cy + 72, nx + 24, cy + 166);
            ctx.quadraticCurveTo(nx + 24, cy + 180, nx + 14, cy + 180);
            ctx.lineTo(nx - 14, cy + 180);
            ctx.quadraticCurveTo(nx - 24, cy + 180, nx - 24, cy + 166);
            ctx.bezierCurveTo(nx - 26, cy + 72, nx - 24, cy + 20, nx, cy - 8);
            ctx.closePath();
          };
          ctx.save();
          tracePod(); ctx.clip();
          const pg = ctx.createLinearGradient(nx - 25, 0, nx + 25, 0);
          pg.addColorStop(0.0, "#7c869e");
          pg.addColorStop(0.30, "#eef1f8");
          pg.addColorStop(0.68, "#b7c0d4");

      // Front Airlock Bezel + Rotating Holographic Portal Ring + Absorption Burst Overlay!
      function drawOrbitalDropshipFrontRim(hx, hy, hr, hatchOpen, time, absorbFlash) {

        if (hatchOpen > 0.25) {

          ctx.setLineDash([]);

        for (let i = 0; i < 12; i++) {

      // =======================================================================
      // 7B. KINETIC BOARDING VFX: GROUND SHOCKWAVE + COMET RIBBON + AIRLOCK WARP BURST!
      // =======================================================================
      function drawGroundLaunchFX(fx, fy, time, launchT, anticStart, colMain, colLight) {
        // 1. Charge-up ring during anticipation crouch
        if (time >= anticStart && time < launchT) {
          const cp = clamp((time - anticStart) / (launchT - anticStart), 0, 1);
          ctx.save();
          ctx.globalAlpha = Math.sin(cp * Math.PI) * 0.85;
          ctx.strokeStyle = colMain; ctx.lineWidth = 3.2;
          ctx.shadowColor = colMain; ctx.shadowBlur = 14;
          const rad = lerp(96, 48, easeOutCubic(cp));
          ctx.beginPath(); ctx.ellipse(fx, fy, rad, rad * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        // 2. Explosive launch shockwave + voxel sparks + vertical speed lines!
        if (time >= launchT && time <= launchT + 0.85) {
          const p = (time - launchT) / 0.85;
          ctx.save();

          // Expanding kinetic floor shockwave
          if (p < 0.65) {
            const rp = p / 0.65;
            ctx.globalAlpha = Math.pow(1 - rp, 1.4) * 0.92;
            ctx.strokeStyle = colMain; ctx.lineWidth = lerp(5.5, 1.2, rp);
            ctx.shadowColor = colMain; ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.ellipse(fx, fy, lerp(44, 185, easeOutQuart(rp)), lerp(12, 46, easeOutQuart(rp)), 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          // 12 radial voxel sparks bursting up & outward
          for (let i = 0; i < 12; i++) {
            const ang = (i / 12) * Math.PI * 2 + 0.15;
            const d = easeOutCubic(p) * (75 + (i % 3) * 35);
            const px = fx + Math.cos(ang) * d;
            const py = fy + Math.sin(ang) * d * 0.28 - easeOutCubic(p) * (70 + (i % 4) * 45);
            const sz = lerp(11, 2.5, p);
            ctx.globalAlpha = (1 - p) * 0.92;
            ctx.fillStyle = i % 2 === 0 ? colMain : colLight;
            roundRect(ctx, px - sz / 2, py - sz / 2, sz, sz, 2.5);
            ctx.fill();
          }

          // 5 vertical launch speed lines
          if (p < 0.55) {
            const lp = p / 0.55;
            ctx.globalAlpha = (1 - lp) * 0.72;
            ctx.strokeStyle = colLight; ctx.lineWidth = 2.6; ctx.lineCap = "round";
            for (let k = -2; k <= 2; k++) {
              const lx = fx + k * 24;
              const ly = fy - 25 - lp * 220 - Math.abs(k) * 18;
              ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 68 * (1 - lp * 0.4)); ctx.stroke();
            }
          }
          ctx.restore();
        }
      }

      // Luminous curved comet ribbon + sparkling trail behind jumping mascot!
      function drawJumpCometTrail(sampleFn, curTime, launchT, enterEndT, colMain, colLight, originX, originY, camDist, fov) {
        if (curTime <= launchT + 0.02 || curTime > enterEndT + 0.28) return;
        const steps = 16;
        const trailSpan = 0.34;
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const st = curTime - (i / steps) * trailSpan;
          if (st < launchT || st > enterEndT) continue;
          const pos = sampleFn(st);
          if (!pos || pos.state === "stand" || pos.state === "gone") continue;
          const pt = project3DPoint(pos.wx, pos.wy + 1.0, pos.wz, originX, originY, camDist, fov);
          pts.push({ x: pt.x, y: pt.y, frac: 1 - i / steps });
        }
        if (pts.length < 2) return;

        ctx.save();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const w = a.frac * 26;
          // Outer colored energy ribbon
          ctx.globalAlpha = a.frac * 0.42;
          ctx.strokeStyle = colMain; ctx.lineWidth = w;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          // Bright inner core ribbon
          ctx.globalAlpha = a.frac * 0.75;
          ctx.strokeStyle = colLight; ctx.lineWidth = w * 0.36;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }

        // Sparkling pixel motes along the trail
        for (let i = 1; i < pts.length; i += 2) {
          const p = pts[i];
          const ox = Math.sin(curTime * 18 + i * 2.1) * (16 * (1 - p.frac) + 6);
          const oy = Math.cos(curTime * 16 + i * 1.7) * 10;
          const sz = 4 + p.frac * 7;
          ctx.globalAlpha = p.frac * 0.90;
          ctx.fillStyle = i % 4 === 1 ? "#ffffff" : colLight;
          roundRect(ctx, p.x + ox - sz / 2, p.y + oy - sz / 2, sz, sz, 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Crisp Energy Absorption Portal Ring + Radial Sparks when a mascot enters the airlock!
      function drawHatchAbsorptionFX(hx, hy, hr, time, hitT, colMain, colLight) {
        if (time < hitT || time > hitT + 0.72) return;
        const p = (time - hitT) / 0.72;
        ctx.save();

        // Dual expanding energy rings around the hatch rim
        ctx.globalAlpha = Math.pow(1 - p, 1.3) * 0.95;
        ctx.strokeStyle = colMain; ctx.lineWidth = lerp(6.0, 1.2, p);
        ctx.shadowColor = colMain; ctx.shadowBlur = 22;
        ctx.beginPath(); ctx.arc(hx, hy, hr + easeOutCubic(p) * 78, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = lerp(3.2, 0.8, p);
        ctx.beginPath(); ctx.arc(hx, hy, hr - 10 + easeOutQuart(p) * 52, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;

        // 14 radial energy star sparks bursting out of the airlock rim
        for (let i = 0; i < 14; i++) {
          const ang = (i / 14) * Math.PI * 2 + 0.12;
          const dist = hr + 6 + easeOutCubic(p) * (65 + (i % 3) * 32);
          const sx = hx + Math.cos(ang) * dist;
          const sy = hy + Math.sin(ang) * dist;
          const sz = lerp(12, 2.5, p);
          ctx.globalAlpha = (1 - p) * 0.95;
          ctx.fillStyle = i % 2 === 0 ? colLight : colMain;
          ctx.save();
          ctx.translate(sx, sy); ctx.rotate(ang + p * 3.0);
          roundRect(ctx, -sz / 2, -sz / 2, sz, sz, 2.5); ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      // Sonic Boom Pressure Ring & Warp Speed Streaks on Blast-Off!
      function drawBlastOffFX(cx, rocketBaseY, time) {
        if (time < 24.85 || time > 26.60) return;

        // Vertical warp speed streaks rushing downward
        const sp = bellCurve(time, 24.90, 25.25, 25.85, 26.40);

          ctx.globalAlpha = sp * 0.55;
          ctx.lineCap = "round";

            const lx = 70 + ((i * 193) % (W - 140));

            ctx.strokeStyle = i % 3 === 0 ? "#ffe07d" : (i % 3 === 1 ? "#93c5fd" : "#ffffff");
            ctx.lineWidth = i % 2 === 0 ? 2.6 : 1.6;
            ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 150); ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Shout Callout Banner (Tanpa menabrak roket / maskot!)
      function drawShoutCallout(opts) {
        const { tag, text1, text2, accentHex, yCenter, alpha, typeProg, time, shakeAmp = 0 } = opts;
        if (alpha <= 0.01) return;
        const bw = 920, bh = text2 ? 156 : 114;
        const sx = shakeAmp > 0 ? Math.sin(time * 52.0) * shakeAmp : 0;
        const sy = shakeAmp > 0 ? Math.cos(time * 44.0) * (shakeAmp * 0.5) : 0;
        const bx = (W - bw) / 2 + sx;
        const by = yCenter - bh / 2 + sy;

        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.shadowColor = "rgba(0, 0, 0, 0.72)"; ctx.shadowBlur = 32; ctx.shadowOffsetY = 10;
        roundRect(ctx, bx, by, bw, bh, 16);
        ctx.fillStyle = "#14141a"; ctx.fill();
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = 2.0; ctx.strokeStyle = accentHex; ctx.stroke();

        ctx.font = "800 14.5px ui-monospace, Consolas, monospace";
        const tagW = ctx.measureText(tag).width + 32;
        roundRect(ctx, W / 2 - tagW / 2 + sx, by - 16, tagW, 30, 15);
        ctx.fillStyle = accentHex; ctx.fill();
        ctx.fillStyle = "#0e0e10"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(tag, W / 2 + sx, by - 0.5);

        const full = text2 ? (text1 + "\n" + text2) : text1;
        const shown = full.slice(0, Math.floor(clamp(typeProg, 0, 1) * full.length)).split("\n");
        ctx.font = "900 35px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = "#f5f4f0"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (text2) {
          ctx.fillText(shown[0] || "", W / 2 + sx, by + 62);
          ctx.fillStyle = accentHex;
          ctx.fillText(shown[1] || "", W / 2 + sx, by + 112);
        } else {
          ctx.fillText(shown[0] || "", W / 2 + sx, by + 64);
        }
        ctx.restore();
      }

      function drawEmotePop(x, y, txt, accent, alpha, time) {
        if (alpha <= 0.02) return;
        const sc = softSpringOut(clamp(alpha * 1.35, 0, 1), 1.0);
        ctx.save();
        ctx.globalAlpha *= clamp(alpha, 0, 1);
        ctx.translate(x, y + Math.sin(time * 9.0) * 5);
        ctx.scale(sc, sc);
        ctx.shadowColor = accent; ctx.shadowBlur = 16;
        roundRect(ctx, -25, -25, 50, 50, 12);
        ctx.fillStyle = "#16161d"; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2; ctx.strokeStyle = accent; ctx.stroke();
        ctx.font = "900 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
        ctx.fillStyle = accent; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(txt, 0, 2);
        ctx.restore();
      }

      function drawStageFloor(floorY, alpha, rocketHoverGlow = 0) {
        if (alpha <= 0.01) return;

        ctx.globalAlpha *= alpha;
        const glow = ctx.createRadialGradient(W / 2, floorY, 30, W / 2, floorY, 440);
        glow.addColorStop(0, `rgba(235, 179, 67, ${(0.12 + rocketHoverGlow * 0.14).toFixed(3)})`);
        glow.addColorStop(0.55, "rgba(110, 168, 254, 0.06)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(48, floorY - 160, W - 96, 320);

        ctx.beginPath(); ctx.rect(48, floorY - 72, W - 96, 200); ctx.clip();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.048)"; ctx.lineWidth = 1;
        for (let i = -5; i <= 5; i++) {
          ctx.beginPath(); ctx.moveTo(W / 2 + i * 42, floorY - 68); ctx.lineTo(W / 2 + i * 175, floorY + 135); ctx.stroke();
        }
        for (const hy of [floorY - 60, floorY - 26, floorY + 12, floorY + 56, floorY + 104]) {
          ctx.beginPath(); ctx.moveTo(48, hy); ctx.lineTo(W - 48, hy); ctx.stroke();

      function drawFloorShadow(cx, cy, rx, ry, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(cx, cy); ctx.scale(1, ry / rx);
        const g = ctx.createRadialGradient(0, 0, rx * 0.1, 0, 0, rx);
        g.addColorStop(0, `rgba(0, 0, 0, ${(0.72 * alpha).toFixed(3)})`);
        g.addColorStop(0.65, `rgba(0, 0, 0, ${(0.26 * alpha).toFixed(3)})`);
        g.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
