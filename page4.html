            const p = pills[i];
            if (time >= p.tAppear) {
              const scale = softBounceOut(clamp((time - p.tAppear) / 0.4, 0, 1), 1.15);
              ctx.save();
              ctx.translate(p.x, pillY);
              ctx.scale(scale, scale);

              const pW = 145;
              const pH = 52;
              roundRect(ctx, -pW / 2, -pH / 2, pW, pH, 10);
              ctx.fillStyle = "#14151e";
              ctx.fill();
              ctx.strokeStyle = "#2d2f3d";
              ctx.lineWidth = 1.4;
              ctx.stroke();

              ctx.font = "700 19px ui-monospace, Consolas, monospace";
              ctx.fillStyle = "#c8c7c0";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(p.text, 0, 1);

              ctx.restore();
            }
          }
        }

        // =====================================================================
        // BAB 09 - KODE: "Cek sendiri." (49.50s - 55.50s) [Ref: Gambar 9]
        // =====================================================================
        else if (time >= 49.50 && time < 55.50) {
          drawGlobalHeader(time, "09 — KODE · 1 SHOT", "■ KODE + PROMPT", "Cek ", "sendiri.");

          // Kartu Repo Publik (Mengetik URL dengan efek ketikan)
          const repoCard = { x: 190, y: 350, w: 700, h: 140 };
          roundRect(ctx, repoCard.x, repoCard.y, repoCard.w, repoCard.h, 10);
          ctx.fillStyle = "#121319";
          ctx.fill();
          ctx.strokeStyle = "#2b2c3a";
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.font = "600 16px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#8a8984";
          ctx.textAlign = "left";
          ctx.fillText("repo publik", repoCard.x + 28, repoCard.y + 36);

          // Animasi Mengetik URL
          const fullUrl = "github.com/rjoulfiand-afk/NrTO";
          const typeProg = clamp((time - 49.7) / 2.2, 0, 1);
          const charsToShow = Math.floor(typeProg * fullUrl.length);
          const currentTyped = fullUrl.slice(0, charsToShow);

          ctx.font = "800 24px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#ffffff";
          ctx.fillText(currentTyped, repoCard.x + 28, repoCard.y + 88);

          // Kursor Berkedip
          if (Math.sin(time * 10) > 0) {
            const urlW = ctx.measureText(currentTyped).width;
            ctx.fillStyle = "#ebb343";
            ctx.fillRect(repoCard.x + 32 + urlW, repoCard.y + 66, 3, 28);
          }

          // Dua Kartu Folder Repositori di Bawah URL
          const fY = repoCard.y + repoCard.h + 26;
          const fW = 338;
          const fH = 260;

          // Folder Claude (Kiri)
          const fLeft = { x: 190, y: fY };
          roundRect(ctx, fLeft.x, fLeft.y, fW, fH, 10);
          ctx.fillStyle = "#121319";
          ctx.fill();
          ctx.strokeStyle = "#e07a5f";
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.font = "700 18px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#e07a5f";
          ctx.fillText("📁 roket-orbit-claude/", fLeft.x + 22, fLeft.y + 38);

          ctx.font = "500 16px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#c8c7c0";
          ctx.fillText("src/ · 7 file", fLeft.x + 22, fLeft.y + 84);
          ctx.fillText("tools/ · 7 file", fLeft.x + 22, fLeft.y + 118);
          ctx.fillText("index.html", fLeft.x + 22, fLeft.y + 152);
          ctx.fillText("README.md", fLeft.x + 22, fLeft.y + 186);
          ctx.fillText("TREATMENT.md", fLeft.x + 22, fLeft.y + 220);

          // Folder Gemini (Kanan)
          const fRight = { x: 552, y: fY };
          roundRect(ctx, fRight.x, fRight.y, fW, fH, 10);
          ctx.fillStyle = "#121319";
          ctx.fill();
          ctx.strokeStyle = "#6ea8fe";
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.font = "700 18px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#6ea8fe";
          ctx.fillText("📁 roket-orbit-gemini/", fRight.x + 22, fRight.y + 38);

          ctx.font = "500 16px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#c8c7c0";
          ctx.fillText("src/ · 7 file", fRight.x + 22, fRight.y + 84);
          ctx.fillText("tools/ · 1 file", fRight.x + 22, fRight.y + 118);
          ctx.fillText("render.mjs", fRight.x + 22, fRight.y + 152);
          ctx.fillText("index.html", fRight.x + 22, fRight.y + 186);
          ctx.fillText("README.md", fRight.x + 22, fRight.y + 220);

          // Kartu README.md Bawah dengan Iris Bracket Kuning
          const readCard = { x: 190, y: fY + fH + 26, w: 700, h: 180 };
          roundRect(ctx, readCard.x, readCard.y, readCard.w, readCard.h, 10);
          ctx.fillStyle = "#121319";
          ctx.fill();
          ctx.strokeStyle = "#2b2c3a";
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.font = "600 16px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#ffffff";
          ctx.fillText("README.md", readCard.x + 24, readCard.y + 36);

          ctx.font = "500 15px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#8a8984";
          ctx.textAlign = "right";
          ctx.fillText("di akar repo", readCard.x + readCard.w - 24, readCard.y + 36);

          // Badge Kuning "PROMPT LENGKAP"
          roundRect(ctx, readCard.x + 24, readCard.y + 54, 170, 26, 4);
          ctx.fillStyle = "#ebb343";
          ctx.fill();
          ctx.font = "800 13px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#0c0d12";
          ctx.textAlign = "center";
          ctx.fillText("PROMPT LENGKAP", readCard.x + 109, readCard.y + 71);

          // Iris Focus Bracket Kuning Mengunci Teks Prompt Eksperimen
          const irisBox = { x: readCard.x + 14, y: readCard.y + 90, w: readCard.w - 28, h: 48 };
          ctx.strokeStyle = "#ebb343";
          ctx.lineWidth = 1.8;

          // 4 Sudut L-Bracket
          const arm = 12;
          ctx.beginPath();
          // Top-Left
          ctx.moveTo(irisBox.x, irisBox.y + arm); ctx.lineTo(irisBox.x, irisBox.y); ctx.lineTo(irisBox.x + arm, irisBox.y);
          // Top-Right
          ctx.moveTo(irisBox.x + irisBox.w - arm, irisBox.y); ctx.lineTo(irisBox.x + irisBox.w, irisBox.y); ctx.lineTo(irisBox.x + irisBox.w, irisBox.y + arm);
          // Bottom-Left
          ctx.moveTo(irisBox.x, irisBox.y + irisBox.h - arm); ctx.lineTo(irisBox.x, irisBox.y + irisBox.h); ctx.lineTo(irisBox.x + arm, irisBox.y + irisBox.h);
          // Bottom-Right
          ctx.moveTo(irisBox.x + irisBox.w - arm, irisBox.y + irisBox.h); ctx.lineTo(irisBox.x + irisBox.w, irisBox.y + irisBox.h); ctx.lineTo(irisBox.x + irisBox.w, irisBox.y + irisBox.h - arm);
          ctx.stroke();

          ctx.font = "700 18px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#f4f3ef";
          ctx.textAlign = "left";
          ctx.fillText("## 📄 Prompt Eksperimen / Experiment Prompt", irisBox.x + 18, irisBox.y + 30);

          ctx.font = "500 14px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#8a8984";
          ctx.fillText("Prompt yang sama persis diberikan ke kedua model", readCard.x + 24, readCard.y + 160);
        }

        // =====================================================================
        // BAB 10 - KOMENTAR: "Tulis di komentar." (55.50s - 62.00s) [Ref: Gambar 10]
        // =====================================================================
        else if (time >= 55.50) {
          const headY = 72;
          ctx.font = "700 15px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.fillStyle = "#8a8984";
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";
          fillTrackedText("JOULFIAND STUDIO · ADU MODEL", 56, headY, 1.4, "left");

          ctx.textAlign = "right";
          fillTrackedText("10 — KOMENTAR · 1 SHOT", 1024, headY, 1.4, "right");

          // Garis Pembagi Tengah
          ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(540, 110); ctx.lineTo(540, 1800); ctx.stroke();

          // Kicker
          const kickY = 224;
          roundRect(ctx, 56, kickY - 6, 10, 10, 2.5);
          ctx.fillStyle = "#ebb343";
          ctx.fill();

          ctx.font = "700 16px ui-monospace, 'Cascadia Code', Consolas, monospace";
          ctx.fillStyle = "#ebb343";
          fillTrackedText("■ GILIRAN KAMU", 76, kickY, 1.4, "left");

          // Judul Besar
          const titleY = 280;
          ctx.font = "900 68px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "alphabetic";
          ctx.textAlign = "left";

          ctx.fillStyle = "#ffffff";
          ctx.fillText("Tulis di ", 56, titleY);
          const w1 = ctx.measureText("Tulis di ").width;
          ctx.fillStyle = "#ebb343";
          ctx.fillText("komentar.", 56 + w1, titleY);

          // Dua Model Pill di Tengah
          const pillBoxY = 880;
          const p1X = 145;
          roundRect(ctx, p1X, pillBoxY, 150, 48, 8);
          ctx.fillStyle = "#14151e";
          ctx.fill();
          ctx.strokeStyle = "#383946";
          ctx.lineWidth = 1.2;
          ctx.stroke();

          roundRect(ctx, p1X + 18, pillBoxY + 18, 12, 12, 3);
          ctx.fillStyle = "#e07a5f";
          ctx.fill();
          ctx.font = "700 18px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#c8c7c0";
          ctx.textAlign = "left";
          ctx.fillText("Claude", p1X + 42, pillBoxY + 31);

          const p2X = 335;
          roundRect(ctx, p2X, pillBoxY, 150, 48, 8);
          ctx.fillStyle = "#14151e";
          ctx.fill();
          ctx.strokeStyle = "#383946";
          ctx.lineWidth = 1.2;
          ctx.stroke();

          roundRect(ctx, p2X + 18, pillBoxY + 18, 12, 12, 3);
          ctx.fillStyle = "#6ea8fe";
          ctx.fill();
          ctx.font = "700 18px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#c8c7c0";
          ctx.fillText("Gemini", p2X + 42, pillBoxY + 31);

          // Kolom Input Komentar Putih / Kapsul
          const capW = 810;
          const capH = 92;
          const capX = (W - capW) / 2;
          const capY = 960;

          roundRect(ctx, capX, capY, capW, capH, 20);
          ctx.fillStyle = "#f4f3ef";
          ctx.fill();
          ctx.shadowColor = "rgba(0,0,0,0.5)";
          ctx.shadowBlur = 24;

          // Animasi Pergantian Teks:
          // 55.5s - 57.5s: "aku pilih Gemini" (Gemini berwarna biru)
          // 57.5s - 59.5s: "aku pilih Claude" (Claude berwarna oranye)
          // 59.5s - 62.0s: "mau tes model apa lagi?"
          ctx.font = "700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";

          let typedPart1 = "";
          let typedPart2 = "";
          let colPart2 = "#000000";

          if (time < 57.6) {
            typedPart1 = "aku pilih ";
            typedPart2 = "Gemini";
            colPart2 = "#2563eb"; // Biru
          } else if (time < 59.8) {
            typedPart1 = "aku pilih ";
            typedPart2 = "Claude";
            colPart2 = "#ea580c"; // Oranye
          } else {
            typedPart1 = "mau tes model apa lagi?";
            typedPart2 = "";
            colPart2 = "#000000";
          }

          const tX = capX + 38;
          const tY = capY + capH / 2;
          ctx.fillStyle = "#1e1e24";
          ctx.fillText(typedPart1, tX, tY);

          if (typedPart2) {
            const wPart1 = ctx.measureText(typedPart1).width;
            ctx.fillStyle = colPart2;
            ctx.fillText(typedPart2, tX + wPart1, tY);
          }

          // Kursor Berkedip
          if (Math.sin(time * 8) > 0) {
            const fullW = ctx.measureText(typedPart1 + typedPart2).width;
            ctx.fillStyle = "#2563eb";
            ctx.fillRect(tX + fullW + 4, tY - 18, 3, 36);
          }
        }

        // Footer Global
        drawGlobalFooter(time);

        ctx.restore(); // Tutup supersampling
      }

      window.drawFrame = drawPage4Frame;
      window.DURATION = DURATION;
      window.TOTAL_FRAMES = TOTAL_FRAMES;

      // =======================================================================
      // LOGIKA PEMUTAR INTERAKTIF BROWSER
      // =======================================================================
      let currentTime = Number(params.get("t") ?? 0);
      let isPlaying = !isHeadless;
      let startStamp = performance.now();

      const slider = document.getElementById("slider");
      const timeLabel = document.getElementById("timeLabel");
      const btnPlay = document.getElementById("btnPlay");

      function updateView(sec) {
        currentTime = clamp(sec, 0, DURATION);
        drawPage4Frame(currentTime);
        if (slider) slider.value = Math.min(TOTAL_FRAMES - 1, Math.floor(currentTime * FPS));
        if (timeLabel) timeLabel.textContent = `${currentTime.toFixed(2).padStart(5, "0")} / ${DURATION.toFixed(2)} s`;
      }

      if (!isHeadless) {
        const jump = (s) => { isPlaying = false; updateView(s); };
        document.getElementById("bSample1").onclick = () => jump(2.0);  // Bab 04 Detail
        document.getElementById("bSample2").onclick = () => jump(8.0);  // Bab 04 Warna
        document.getElementById("bSample3").onclick = () => jump(14.0); // Bab 05 Bedah
        document.getElementById("bScore").onclick   = () => jump(32.0); // Bab 06 Data
        document.getElementById("bOutro").onclick   = () => jump(56.0); // Bab 10 Komentar

        if (slider) {
          slider.max = TOTAL_FRAMES - 1;
          slider.oninput = () => {
            isPlaying = false;
            updateView(Number(slider.value) / FPS);
          };
        }

        if (btnPlay) {
          btnPlay.onclick = () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
              if (currentTime >= DURATION - 0.1) currentTime = 0;
              startStamp = performance.now() - currentTime * 1000;
              requestAnimationFrame(tick);
            }
          };
        }

        function tick(now) {
          if (!isPlaying) return;
          const elapsed = (now - startStamp) / 1000;
          if (elapsed >= DURATION) {
            updateView(DURATION - 0.03);
            isPlaying = false;
            return;
          }
          updateView(Math.floor(elapsed * FPS) / FPS);
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      } else {
        updateView(0);
      }
    })();
  </script>
</body>
</html>
