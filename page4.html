        ctx.restore();
      }

      // =======================================================================
      // 7. FUNGSI UTAMA: drawFrame(t) — PAGE 4 FINAL (54.00s · 1620 FRAME)
      //    0.00 - 15.50s : BAB 1 — Arto Portal Faceplant -> Push-Up -> Kesakitan -> Tengil!
      //   15.50 - 25.50s : BAB 2 — Koreksi 01: Gemini Carbon (Amazed -> Hmm_Think)
      //   25.50 - 35.50s : BAB 3 — Koreksi 02: Claude Opus 5.5 (Amazed -> Hmm_Think)
      //   35.50 - 41.50s : BAB 4 — Rapor Objektif Head-to-Head (Arto Dilemma)
      //   41.50 - 44.85s : BAB 5A — Unified Box ("Skor tipis 9.2 vs 9.3" + 2 Kotak)
      //   44.25 - 54.00s : BAB 5B — Kotak Skor HILANG -> Arto Geser + Gelembung + SOLO IG Sheet
      //                            dengan 2 Bar Pilihan Cepat (Instant Input -> Send!) -> Page 5
      // =======================================================================
      function drawFrame(t) {
        const time = clamp(Number(t) || 0, 0, DURATION);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(SSAA, SSAA);

        let shakeX = 0, shakeY = 0;
        if (time >= 1.95 && time <= 2.42) {
          const sp = (time - 1.95) / 0.47;
          const amp = (1 - sp) * (1 - sp) * 13.0;
          shakeX = Math.sin(time * 82.0) * amp;
          shakeY = Math.cos(time * 96.0) * amp;
        }

        const pageExitAlpha = 1 - smootherstep(53.35, 53.98, time);

        // 1. Latar Warm Obsidian (#0f0f11) + Reactive Studio Lighting
        ctx.fillStyle = "#0f0f11";
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate(shakeX, shakeY);

        const gemMood   = bellCurve(time, 15.20, 15.85, 25.10, 25.70);
        const claMood   = bellCurve(time, 25.30, 25.95, 35.10, 35.70);
        const splitMood = smootherstep(35.30, 36.10, time) * pageExitAlpha;

        const baseWash = ctx.createRadialGradient(W / 2, 740, 40, W / 2, 740, 780);
        baseWash.addColorStop(0, "rgba(235, 179, 67, 0.050)");
        baseWash.addColorStop(0.6, "rgba(108, 54, 163, 0.025)");
        baseWash.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = baseWash; ctx.fillRect(0, 0, W, H);

        if (gemMood > 0.01) {
          const g = ctx.createRadialGradient(340, 720, 40, 340, 720, 720);
          g.addColorStop(0, `rgba(110, 168, 254, ${(gemMood * 0.085).toFixed(4)})`);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        if (claMood > 0.01) {
          const g = ctx.createRadialGradient(340, 720, 40, 340, 720, 720);
          g.addColorStop(0, `rgba(224, 122, 95, ${(claMood * 0.085).toFixed(4)})`);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        if (splitMood > 0.01) {
          const gL = ctx.createRadialGradient(260, 960, 30, 260, 960, 560);
          gL.addColorStop(0, `rgba(110, 168, 254, ${(splitMood * 0.070).toFixed(4)})`);
          gL.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gL; ctx.fillRect(0, 0, W, H);

          const gR = ctx.createRadialGradient(820, 960, 30, 820, 960, 560);
          gR.addColorStop(0, `rgba(224, 122, 95, ${(splitMood * 0.070).toFixed(4)})`);
          gR.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gR; ctx.fillRect(0, 0, W, H);
        }

        // 2. Frame Editorial Hairline (1px)
        ctx.strokeStyle = "#1e1e23"; ctx.lineWidth = 1;
        ctx.strokeRect(24.5, 44.5, W - 49, H - 89);
        ctx.fillStyle = "#1e1e23";
        ctx.fillRect(24, 122, W - 48, 1);
        ctx.fillRect(24, 1792, W - 48, 1);

        ctx.fillStyle = "#ebb343";
        ctx.fillRect(24, 121.5, (W - 48) * (time / DURATION), 1.5);
        drawCrosshair(540, 122, 4, "#36363f");
        drawCrosshair(540, 1792, 4, "#36363f");

        // 3. Masthead Dinamis
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ebb343"; ctx.fillRect(48, 80, 6, 6);
        ctx.fillStyle = "#7c7b76"; fillTrackedText("JOULFIAND STUDIO  ·  ADU MODEL", 66, 83.5, 1.5, "left");

        let mastRight = "04 — PENILAIAN  ·  ARTO";
        if (time >= 15.50 && time < 25.50) mastRight = "04 — KOREKSI 01  ·  GEMINI";
        else if (time >= 25.50 && time < 35.50) mastRight = "04 — KOREKSI 02  ·  CLAUDE";
        else if (time >= 35.50 && time < 41.50) mastRight = "04 — RAPOR  ·  HEAD TO HEAD";
        else if (time >= 41.50) mastRight = "04 — VOTE  ·  KOLOM KOMENTAR";
        ctx.fillStyle = "#969590"; fillTrackedText(mastRight, W - 48, 83.5, 1.5, "right");

        // =====================================================================
        // BAB 1 (0.00s - 15.65s): ARTO PORTAL FACEPLANT -> PUSH-UP -> TENGIL INTRO
        // =====================================================================
        if (time < 15.70) {
          const bab1Alpha = 1 - smootherstep(15.05, 15.65, time);
          ctx.save();
          ctx.globalAlpha = bab1Alpha;

          const titleAppear = smootherstep(7.30, 8.05, time);
          if (titleAppear > 0.01) {
            ctx.save();
            ctx.globalAlpha = bab1Alpha * titleAppear;
            ctx.translate(0, (1 - easeOutQuart(titleAppear)) * 20);
            roundRect(ctx, 48, 178, 11, 11, 2.5); ctx.fillStyle = "#ebb343"; ctx.fill();
            ctx.font = "600 19px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#8f8d87";
            ctx.textBaseline = "middle";
            fillTrackedText("JURI PENILAIAN  ·  ART CRITIC AGENT", 70, 184, 1.8, "left");
            ctx.font = "900 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
            ctx.textBaseline = "top"; ctx.textAlign = "left";
            ctx.fillStyle = "#f5f4f0"; ctx.fillText("Meet ", 48, 222);
            ctx.fillStyle = "#ebb343"; ctx.fillText("Arto.", 48 + ctx.measureText("Meet ").width, 222);
            ctx.restore();
          }

          const originX = W / 2, originY = 890, camDist = 36, fov = 1340;
          const floorPt = project3DPoint(0, -6.10, 0, originX, originY, camDist, fov);
          drawStageFloor(floorPt.y, titleAppear);

          const portalX = W / 2, portalY = 395;
          const portalOpen = softSpringOut(clamp((time - 0.40) / 0.62, 0, 1), 0.75)
                           * (1 - smootherstep(2.40, 2.90, time));
          drawFloatingHoleBack(portalX, portalY, portalOpen, time);
          drawFallSpeedLines(time + 0.15);

          const painType   = clamp((time - 4.25) / 1.65, 0, 1);
          const intro1Type = clamp((time - 7.60) / 2.65, 0, 1);
          const intro2Type = clamp((time - 11.55) / 2.65, 0, 1);

          let talkW = 0;
          if (time >= 4.20 && time <= 6.05) talkW = bellCurve(time, 4.20, 4.35, 5.85, 6.05);
          else if (time >= 7.55 && time <= 10.45) talkW = bellCurve(time, 7.55, 7.70, 10.15, 10.45);
          else if (time >= 11.50 && time <= 14.35) talkW = bellCurve(time, 11.50, 11.65, 14.05, 14.35);
          const mouthOpen = getLipSyncOpen(time, talkW);

          if (time >= 1.25) {
            let artoY = 0, artoPitch = 0.04, artoRoll = 0, artoYaw = -0.18;
            let squashX = 1.0, squashY = 1.0, sitAmt = 0, pushUpBlend = 0;
            let beretLiftY = 0, beretTiltExtra = 0, expr = "tengil";

            if (time < 1.95) {
              const fp = clamp((time - 1.25) / 0.70, 0, 1);
              artoY = lerp(22.2, -3.10, easeInQuad(fp));
              artoPitch = lerp(-0.25, 1.46, easeInQuad(fp));
              artoRoll = Math.sin(fp * Math.PI * 2.0) * 0.22;
              artoYaw = lerp(-0.15, -0.62, fp);
              squashX = lerp(0.92, 0.86, fp); squashY = lerp(1.08, 1.18, fp);
              beretLiftY = lerp(0.2, 3.0, easeInQuad(fp)); beretTiltExtra = -0.36 * fp;
              expr = "panic";
            } else if (time < 3.15) {
              const dt = time - 1.95;
              const splatSq = dt < 0.32 ? Math.sin((dt / 0.32) * Math.PI) : 0;
              squashX = 1 + splatSq * 0.28; squashY = 1 - splatSq * 0.26;
              artoY = -3.45 + splatSq * 0.15; artoPitch = 1.46; artoYaw = -0.62;
              artoRoll = Math.sin(time * 14.0) * 0.03 * smoothstep(2.30, 2.60, time);
              const bp = clamp(dt / 0.34, 0, 1);
              beretLiftY = bp < 1 ? lerp(3.0, 0, easeInQuad(bp)) : Math.max(0, Math.sin((dt - 0.34) * 18) * 0.35 * Math.exp(-(dt - 0.34) * 6));
              beretTiltExtra = lerp(-0.36, 0.24, smoothstep(0, 1, bp));
              expr = "faceplant";
            } else if (time < 4.10) {
              const pPush = smootherstep(3.15, 3.65, time);
              const pSit  = smootherstep(3.62, 4.10, time);
              pushUpBlend = pPush; sitAmt = pSit;
              artoPitch = lerp(lerp(1.46, 0.62, pPush), -0.10, pSit);
              artoY = lerp(lerp(-3.45, -2.55, pPush), -2.35, pSit);
              artoYaw = lerp(-0.62, -0.12, easeInOutCubic((time - 3.15) / 0.95));
              artoRoll = lerp(0, -0.06, pSit); beretTiltExtra = lerp(0.24, 0.18, pSit);
              expr = "pushup";
            } else if (time < 6.75) {
              artoY = -2.35; sitAmt = 1.0; artoPitch = -0.10;
              artoRoll = -0.06 + Math.sin(time * 3.8) * 0.03; artoYaw = -0.12; beretTiltExtra = 0.18;
              expr = time < 6.52 ? "pain" : "alert";
            } else if (time < 7.50) {
              const upP = clamp((time - 6.75) / 0.70, 0, 1);
              artoY = lerp(-2.35, 0.0, easeOutQuart(upP)) + Math.sin(upP * Math.PI) * 2.5;
              sitAmt = 1 - easeOutCubic(upP); artoPitch = -0.10;
              artoRoll = lerp(-0.06, 0.12, upP); artoYaw = lerp(-0.12, -0.22, upP);
              squashX = 1 - Math.sin(upP * Math.PI) * 0.08; squashY = 1 + Math.sin(upP * Math.PI) * 0.10;
              beretLiftY = Math.sin(upP * Math.PI) * 0.45; beretTiltExtra = lerp(0.18, -0.05, upP);
              expr = upP < 0.55 ? "alert" : "tengil";
            } else if (time < 11.45) {
              artoY = 0; sitAmt = 0;
              artoPitch = -0.12 + Math.sin(time * 3.2) * 0.04;
              artoRoll  =  0.14 + Math.sin(time * 3.2) * 0.09;
              artoYaw   = -0.24 + Math.sin(time * 1.9) * 0.16;
              beretTiltExtra = -0.08; expr = "tengil";
            } else {
              const k = smootherstep(11.45, 12.10, time);
              artoY = 0; sitAmt = 0;
              artoPitch = lerp(-0.12, 0.06, k);
              artoRoll  = lerp( 0.14, 0.06 + Math.sin(time * 2.2) * 0.05, k);
              artoYaw   = lerp(-0.24, Math.sin(time * 1.6) * 0.18, k);
              beretTiltExtra = lerp(-0.08, 0.0, k); expr = "hmm_think";
            }

            const hf = clamp(1 - Math.max(0, artoY) / 22.0, 0.18, 1.0);
            const flatSpread = expr === "faceplant" ? 1.45 : (expr === "pushup" ? lerp(1.45, 1.05, sitAmt) : 1.0);
            drawShadow(floorPt.x, floorPt.y, 168 * hf * flatSpread, 38 * hf * flatSpread, hf * 0.95 * bab1Alpha);
            drawCrashImpactFX(floorPt.x, floorPt.y, time + 0.13);

            let blinkAmt = 0;
            for (const m of [8.25, 10.90, 13.85]) {
              const d = Math.abs(time - m);
              if (d < 0.11) blinkAmt = Math.cos((d / 0.11) * (Math.PI / 2));
            }

            const orbitScale = softSpringOut(clamp((time - 7.35) / 0.72, 0, 1), 0.75);
            const artoQuads = buildArtoQuads(time, {
              x: 0, y: artoY, z: 0, yaw: artoYaw, pitch: artoPitch, roll: artoRoll,
              scale: 0.98, squashX, squashY, expr, sitAmt, pushUpBlend,
              beretLiftY, beretTiltExtra, mouthOpen, blinkAmount: blinkAmt,
              monocleOn: true, orbitScale, shirtTheme: ARTO_SHIRT, camDist
            });

            ctx.save();
            if (time < 2.15 && portalOpen > 0.05) {
              ctx.beginPath();
              ctx.moveTo(0, portalY); ctx.lineTo(portalX - 182 * portalOpen, portalY);
              ctx.ellipse(portalX, portalY, 182 * portalOpen, 48 * portalOpen, 0, Math.PI, Math.PI * 2, false);
              ctx.lineTo(W, portalY); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
              ctx.clip();
            }
            renderSceneQuads(artoQuads, originX, originY, camDist, fov, bab1Alpha);
            ctx.restore();

            drawFloatingHoleFrontLip(portalX, portalY, portalOpen);

            const dizzyA = bellCurve(time, 2.15, 2.55, 6.25, 6.58);
            if (dizzyA > 0.01) {
              const hPt = project3DPoint(expr === "faceplant" ? 2.5 : 0, expr === "faceplant" ? 0.5 : (artoY + 8.6), 0, originX, originY, camDist, fov);
              drawDizzyStars(hPt.x, hPt.y, dizzyA * bab1Alpha, time);
            }
            const alertEmote = bellCurve(time, 6.52, 6.66, 7.02, 7.28);
            if (alertEmote > 0.01) {
              const ePt = project3DPoint(5.2, artoY + 6.8, 0, originX, originY, camDist, fov);
              drawEmoteBadge(ePt.x, ePt.y, "!", "#ebb343", alertEmote * bab1Alpha, time);
            }
            const gl1 = clamp((time - 7.35) / 0.62, 0, 1);
            const gl2 = clamp((time - 9.25) / 0.62, 0, 1);
            if ((gl1 > 0 && gl1 < 1) || (gl2 > 0 && gl2 < 1)) {
              const gPt = project3DPoint(1.8, artoY + 4.4, 3.2, originX, originY, camDist, fov);
              drawSparkleGlint(gPt.x, gPt.y, gl1 > 0 && gl1 < 1 ? gl1 : gl2);
            }
          } else {
            drawFloatingHoleFrontLip(portalX, portalY, portalOpen);
          }

          const painCardA = bellCurve(time, 4.12, 4.45, 6.20, 6.55);
          if (painCardA > 0.01) {
            drawSpeechCard({
              speakerTag: "ARTO", roleTag: "OUCH!! · HABIS TENGKURAP",
              line1: "Aduh, sakit banget sih...", line2: "",
              accentHex: "#ff6b6b", appearProg: painCardA * bab1Alpha,
              typeProg: painType, time, cardYBase: 1352, pointerX: W / 2,
              shakeAmp: bellCurve(time, 4.15, 4.28, 4.55, 4.88) * 3.8
            });
          }

          const introCardA = smootherstep(7.45, 7.90, time);
          if (introCardA > 0.01) {
            const isSecond = time >= 11.45;
            let txtA = 1.0;
            if (time >= 11.20 && time < 11.45) txtA = 1 - (time - 11.20) / 0.25;
            else if (time >= 11.45 && time < 11.70) txtA = (time - 11.45) / 0.25;
            drawSpeechCard({
              speakerTag: "ARTO", roleTag: isSecond ? "ART CRITIC · MODE KOREKSI" : "AGENT TAMPAN · PERKENALAN",
              line1: isSecond ? "yang siap untuk mengoreksi design" : "Ehh, halo guys! Kenalin nih,",
              line2: isSecond ? "dari dua model AI-nya si Boss!" : "gw Arto, si Agent tampan...",
              accentHex: "#ebb343", appearProg: introCardA * bab1Alpha, textAlpha: txtA,
              typeProg: isSecond ? intro2Type : intro1Type, time, cardYBase: 1352, pointerX: W / 2
            });
          }

          ctx.restore();
        }

        // =====================================================================
        // BAB 2 (15.50s - 25.55s): KOREKSI 01 — GEMINI CARBON · HIGH
        // =====================================================================
        if (time >= 15.40 && time < 25.65) {
          const lt = clamp(time - 15.50, 0, 10.0);
          const a = smootherstep(15.40, 15.95, time) * (1 - smootherstep(25.05, 25.60, time));
          const rocketT = lerp(5.30, 9.80, clamp(lt / 9.80, 0, 1));
          const gSrc = GeminiRocket.render(rocketT);

          drawModelReviewStage({
            time, localT: lt, stageAlpha: a, isGemini: true, rocketTime: rocketT, srcCanvas: gSrc,
            points: [
              { tag: "01 · KEUNGGULAN", title: "Stage Separation (6s)",  d1: "Roket 2 tingkat lepas booster,", d2: "langsung lanjut mesin vakum", tShow: 0.40, isNote: false },
              { tag: "02 · KEUNGGULAN", title: "Saturn-IV & Target",     d1: "Planet cincin 3D + target lock", d2: "hijau & dither Bayer 4×4",   tShow: 2.20, isNote: false },
              { tag: "03 · CATATAN",    title: "Roket Tetap Tegak",      d1: "Geser halus ke kiri saat orbit,", d2: "belum miring pitch 90°",     tShow: 5.10, isNote: true  }
            ],
            scoreNum: 9.2, scoreLabel: "9.2 / 10",
            line1A: "Wah Gemini niat banget! Booster-nya pisah di detik 6,",
            line2A: "plus planet cincin Saturn-IV & target lock-nya cakep!",
            line1B: "Cuma catatan dikit nih: roketnya tetap tegak ke atas,",
            line2B: "belum miring mengikuti jalur orbit kayak aslinya."
          });
        }

        // =====================================================================
        // BAB 3 (25.50s - 35.55s): KOREKSI 02 — CLAUDE OPUS 5.5 · EXTRA
        // =====================================================================
        if (time >= 25.40 && time < 35.65) {
          const lt = clamp(time - 25.50, 0, 10.0);
          const a = smootherstep(25.40, 25.95, time) * (1 - smootherstep(35.05, 35.60, time));
          const rocketT = lerp(5.70, 10.30, clamp(lt / 9.80, 0, 1));
          const cSrc = ClaudeRocket.render(rocketT);

          drawModelReviewStage({
            time, localT: lt, stageAlpha: a, isGemini: false, rocketTime: rocketT, srcCanvas: cSrc,
            points: [
              { tag: "01 · KEUNGGULAN", title: "Gravity Turn 90°",      d1: "Rotasi miring mulus ke orbit",   d2: "dengan RCS & api plasma biru", tShow: 0.40, isNote: false },
              { tag: "02 · KEUNGGULAN", title: "Bumi 3D + City Lights", d1: "Benua value noise, awan &",      d2: "lampu kota menyala di malam",  tShow: 2.20, isNote: false },
              { tag: "03 · CATATAN",    title: "Roket 1 Tingkat",       d1: "Tidak ada aksi lepas booster",   d2: "seperti drama tahap 1 Gemini", tShow: 5.10, isNote: true  }
            ],
            scoreNum: 9.3, scoreLabel: "9.3 / 10",
            line1A: "Gokil! Claude berani bikin Gravity Turn miring 90°,",
            line2A: "pakai api plasma biru + Bumi 3D berlampu kota!",
            line1B: "Tapi catatannya: roketnya 1 tingkat aja, jadi dramanya",
            line2B: "kalah dikit pas momen pelepasan booster."
          });
        }

        // =====================================================================
        // BAB 4 (35.50s - 41.55s): RAPOR HEAD-TO-HEAD OBJEKTIF (ARTO DILEMMA!)
        // =====================================================================
        if (time >= 35.40 && time < 41.65) {
          const lt = clamp(time - 35.50, 0, 6.0);
          const a = smootherstep(35.40, 36.00, time) * (1 - smootherstep(41.00, 41.60, time));

          ctx.save();
          ctx.globalAlpha = a;

          roundRect(ctx, 48, 166, 11, 11, 2.5); ctx.fillStyle = "#ebb343"; ctx.fill();
          ctx.font = "600 19px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#8f8d87";
          ctx.textBaseline = "middle";
          fillTrackedText("REKAP KOREKSI ARTO  ·  HEAD TO HEAD", 70, 172, 1.8, "left");

          ctx.font = "900 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "top"; ctx.textAlign = "left";
          ctx.fillStyle = "#f5f4f0"; ctx.fillText("Rapor ", 48, 210);
          ctx.fillStyle = "#ebb343"; ctx.fillText("Objektif.", 48 + ctx.measureText("Rapor ").width, 210);

          const tx = 48, ty = 338, tw = 984, rowH = 92, hdrH = 62;
          roundRect(ctx, tx, ty, tw, hdrH + rowH * 5, 14);
          ctx.fillStyle = "#131318"; ctx.fill();
          ctx.lineWidth = 1.6; ctx.strokeStyle = "#2b2b36"; ctx.stroke();

          ctx.fillStyle = "#191922";
          roundRect(ctx, tx + 1, ty + 1, tw - 2, hdrH, 13); ctx.fill();
          ctx.fillStyle = "#282834"; ctx.fillRect(tx + 1, ty + hdrH, tw - 2, 1);

          const c1X = tx + 26, c2C = tx + 492, c3C = tx + 812;
          ctx.textBaseline = "middle";
          ctx.font = "700 15px ui-monospace, Consolas, monospace";
          ctx.fillStyle = "#8e8d88";
          fillTrackedText("ASPEK PENILAIAN", c1X, ty + 32, 1.3, "left");
          ctx.font = "800 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.fillStyle = "#6ea8fe"; ctx.textAlign = "center";
          ctx.fillText("GEMINI CARBON", c2C, ty + 32);
          ctx.fillStyle = "#e07a5f";
          ctx.fillText("CLAUDE OPUS 5.5", c3C, ty + 32);

          const rows = [
            { k: "Gaya Visual",     g: "Arcade Sci-Fi",      c: "Simulasi Orbital" },
            { k: "Manuver Roket",   g: "Stage Separation",   c: "Gravity Turn 90°" },
            { k: "Objek Orbit",     g: "Saturn-IV Cincin",   c: "Bumi 3D + Kota"   },
            { k: "Arsitektur",      g: "Canvas 2D · 2 File", c: "Uint8 · 6 Modul"  },
            { k: "Skor Arto",       g: "9.2 / 10 ★",         c: "9.3 / 10 ★", isScore: true }
          ];

          for (let i = 0; i < rows.length; i++) {
            const ry = ty + hdrH + i * rowH;
            const rP = smootherstep(0.25 + i * 0.25, 0.70 + i * 0.25, lt);
            if (i > 0) { ctx.fillStyle = "#21212b"; ctx.fillRect(tx + 18, ry, tw - 36, 1); }
            ctx.save();
            ctx.globalAlpha = a * rP;
            if (rows[i].isScore) { ctx.fillStyle = "rgba(235, 179, 67, 0.08)"; ctx.fillRect(tx + 2, ry + 1, tw - 4, rowH - 3); }
            ctx.textAlign = "left";
            ctx.font = rows[i].isScore ? "800 22px -apple-system, sans-serif" : "600 19px ui-monospace, Consolas, monospace";
            ctx.fillStyle = rows[i].isScore ? "#ebb343" : "#b8b7b0";
            ctx.fillText(rows[i].k, c1X, ry + rowH / 2);

            ctx.textAlign = "center";
            ctx.font = rows[i].isScore ? "900 26px -apple-system, sans-serif" : "700 20px -apple-system, sans-serif";
            ctx.fillStyle = rows[i].isScore ? "#6ea8fe" : "#f4f3ef";
            ctx.fillText(rows[i].g, c2C, ry + rowH / 2);
            ctx.fillStyle = rows[i].isScore ? "#e07a5f" : "#f4f3ef";
            ctx.fillText(rows[i].c, c3C, ry + rowH / 2);
            ctx.restore();
          }

          const b4OriginX = W / 2, b4OriginY = 1135, b4Cam = 36, b4Fov = 960;
          const b4Floor = project3DPoint(0, -6.10, 0, b4OriginX, b4OriginY, b4Cam, b4Fov);
          drawShadow(b4Floor.x, b4Floor.y, 126, 28, a * 0.90);

          const b4Type = clamp((lt - 0.55) / 3.45, 0, 1);
          const b4Talk = bellCurve(lt, 0.50, 0.68, 3.85, 4.20);
          const b4Quads = buildArtoQuads(time, {
            x: 0, y: 0, z: 0, yaw: Math.sin(time * 2.2) * 0.22, pitch: 0.04, roll: Math.sin(time * 3.8) * 0.07,
            scale: 0.72, expr: "dilemma", mouthOpen: getLipSyncOpen(time, b4Talk),
            blinkAmount: 0, monocleOn: true, orbitScale: 0.95, shirtTheme: ARTO_SHIRT, camDist: b4Cam
          });
          renderSceneQuads(b4Quads, b4OriginX, b4OriginY, b4Cam, b4Fov, a);

          drawSpeechCard({
            speakerTag: "ARTO", roleTag: "DILEMA JURI · 9.2 vs 9.3",
            line1: "Jujur tipis banget! Gemini juara di drama 2 tingkat,",
            line2: "Claude juara di fisika orbit 90 derajat!",
            accentHex: "#ebb343", appearProg: bellCurve(lt, 0.30, 0.70, 5.40, 5.95),
            typeProg: b4Type, time, cardYBase: 1352, pointerX: W / 2
          });

          ctx.restore();
        }

        // =====================================================================
        // BAB 5 (41.50s - 54.00s):
        //   5A (0.00..3.35s) : Unified Box ("Skor tipis 9.2 vs 9.3" + 2 Kotak)
        //   5B (2.75..12.50s): Unified Box HILANG -> Arto geser kiri + Gelembung
        //                      + SOLO IG Comment Sheet dengan 2 Bar Pilihan Cepat
        //                        ("aku pilih gemini" & "kalau aku sih claude") -> Instant Input -> Send!
        // =====================================================================
        if (time >= 41.40) {
          const lt = clamp(time - 41.50, 0, 12.50);
          const a = smootherstep(41.40, 42.05, time) * pageExitAlpha;

          ctx.save();
          ctx.globalAlpha = a;

          // 1. Headline Bersih ("Kalo kamu tim mana?")
          roundRect(ctx, 48, 148, 11, 11, 2.5); ctx.fillStyle = "#ebb343"; ctx.fill();
          ctx.font = "600 18.5px ui-monospace, Consolas, monospace"; ctx.fillStyle = "#8f8d87";
          ctx.textBaseline = "middle";
          fillTrackedText("GILIRAN KAMU  ·  TENTUKAN PEMENANGNYA", 70, 154, 1.8, "left");

          ctx.font = "900 66px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif";
          ctx.textBaseline = "top"; ctx.textAlign = "left";
          ctx.fillStyle = "#f5f4f0"; ctx.fillText("Kalo kamu ", 48, 184);
          ctx.fillStyle = "#ebb343"; ctx.fillText("tim mana?", 48 + ctx.measureText("Kalo kamu ").width, 184);

          // 2. Arto 3D (Selalu tetap hadir! Mulai tengah x=540 -> geser kiri x=250 pas lt=2.75s)
          const slideLeftP = smootherstep(2.70, 3.40, lt);
          const artoX = lerp(W / 2, 250, slideLeftP);
          const artoY = 530, artoCam = 36, artoFov = 880;
          const b5Floor = project3DPoint(0, -6.10, 0, artoX, artoY, artoCam, artoFov);
          drawShadow(b5Floor.x, b5Floor.y, 128, 26, a * 0.90);

          let b5Expr = "happy_host";
          if (lt < 2.75) b5Expr = "dilemma";
          else if (lt < 4.55) b5Expr = "happy_host";
          else if (lt < 8.45) b5Expr = "amazed";
          else b5Expr = "tengil";

          const bubbleTalkW = bellCurve(lt, 3.05, 3.25, 4.45, 4.75);
          const b5Yaw = slideLeftP > 0.5
            ? (0.28 + Math.sin(time * 1.8) * 0.08)
            : Math.sin(time * 2.2) * 0.22;

          const b5Quads = buildArtoQuads(time, {
            x: 0, y: 0, z: 0,
            yaw: b5Yaw,
            pitch: (lt >= 4.55 && lt < 8.45) ? 0.14 : -0.05,
            roll: Math.sin(time * 2.6) * 0.07,
            scale: 0.78, expr: b5Expr, mouthOpen: getLipSyncOpen(time, bubbleTalkW),
            blinkAmount: 0, monocleOn: true, orbitScale: 0.92, shirtTheme: ARTO_SHIRT, camDist: artoCam
          });
          renderSceneQuads(b5Quads, artoX, artoY, artoCam, artoFov, a);

          // Monocle glint pas Arto wink setelah kedua komentar masuk! (t = 50.15s)
          const glEnd = clamp((time - 50.15) / 0.65, 0, 1);
          if (glEnd > 0 && glEnd < 1) {
            const gPt = project3DPoint(1.4, 3.3, 3.0, artoX, artoY, artoCam, artoFov);
            drawSparkleGlint(gPt.x, gPt.y, glEnd);
          }

          // 3. GELEMBUNG TEKS ARTO ("Tulis pilihanmu di kolom komentar yaa!", lt >= 2.95s)
          drawArtoFloatingBubble(lt, time, a);

          // 4. PHASE 5A: Unified Box ("Skor tipis 9.2 vs 9.3" + 2 Kotak) — HILANG bersih saat lt >= 2.75s!
          drawUnifiedScorePhaseA(lt, time, a);

          // 5. PHASE 5B: CLEAN SOLO IG COMMENT SHEET (Muncul sendiri dengan 2 Bar Pilihan Cepat!)
          drawSoloIGCommentSheet(lt, time, a);

          ctx.restore();
        }

        // 4. FOOTER EDITORIAL PERSISTEN
        const footY = 1834;
        ctx.font = "600 17px ui-monospace, 'Cascadia Code', Consolas, monospace";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#6e6d68";
        const mm = String(Math.floor(time)).padStart(2, "0");
        const ff = String(Math.floor((time % 1) * FPS)).padStart(2, "0");
        fillTrackedText(`00:${mm}:${ff}`, 48, footY, 1.2, "left");
        ctx.fillStyle = "#ebb343"; ctx.fillRect(152, footY - 4, 7, 7);
        ctx.fillStyle = "#6e6d68"; fillTrackedText("120 BPM", 172, footY, 1.2, "left");
        fillTrackedText("1080×1920  ·  30FPS", W - 48, footY, 1.2, "right");

        ctx.restore();
      }

      window.drawFrame = drawFrame;
      window.DURATION = DURATION;
      window.TOTAL_FRAMES = TOTAL_FRAMES;

      let currentTime = Number(params.get("t") ?? 0);
      let isPlaying = !isHeadless;
      let startStamp = performance.now();

      const slider = document.getElementById("slider");
      const timeLabel = document.getElementById("timeLabel");
      const btnPlay = document.getElementById("btnPlay");

      function updateView(sec) {
        currentTime = clamp(sec, 0, DURATION);
        drawFrame(currentTime);
        if (slider) slider.value = Math.min(TOTAL_FRAMES - 1, Math.floor(currentTime * FPS));
        if (timeLabel) timeLabel.textContent = `${currentTime.toFixed(2).padStart(5, "0")} / ${DURATION.toFixed(2)} s`;
      }

      if (!isHeadless) {
        const jump = (s) => { isPlaying = false; updateView(s); };
        document.getElementById("b1").onclick = () => jump(2.40);
        document.getElementById("b2").onclick = () => jump(18.50);
        document.getElementById("b3").onclick = () => jump(28.50);
        document.getElementById("b4").onclick = () => jump(38.00);
        document.getElementById("b5").onclick = () => jump(43.20);
        document.getElementById("b6").onclick = () => jump(45.20);
        document.getElementById("b7").onclick = () => jump(46.50);
        document.getElementById("b8").onclick = () => jump(48.90);
        document.getElementById("b9").onclick = () => jump(51.00);

        slider.max = TOTAL_FRAMES - 1;
        slider.oninput = () => { isPlaying = false; updateView(Number(slider.value) / FPS); };

        btnPlay.onclick = () => {
          isPlaying = !isPlaying;
          if (isPlaying) {
            if (currentTime >= DURATION - 0.1) currentTime = 0;
            startStamp = performance.now() - currentTime * 1000;
            requestAnimationFrame(tick);
          }
        };

        function tick(now) {
          if (!isPlaying) return;
          const elapsed = (now - startStamp) / 1000;
          if (elapsed >= DURATION) {
            updateView(DURATION - 0.01);
            isPlaying = false;
            return;
          }
          updateView(elapsed);
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      } else {
        updateView(0);
      }
    })();
  </script>
</body>
</html>
